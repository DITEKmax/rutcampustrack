server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the standard MIME table while adding Vite's PDF module worker suffix.
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }

    # Vite chunks, workers, fonts and images must never fall through to SPA HTML.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|mjs|css|png|jpg|jpeg|svg|ico|woff|woff2|eot|ttf|wasm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
        try_files $uri =404;
    }

    # Existing root URLs and deep links resolve to the current, uncacheable shell.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
        try_files $uri $uri/ /index.html;
    }
}
