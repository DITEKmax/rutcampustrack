spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    # M16 G6 hotfix — см. application.yml (Flyway issues #3508/#3961).
    postgresql:
      transactional-lock: false
logging:
  level:
    ru.rutcampustrack: DEBUG
    org.hibernate.SQL: DEBUG
grpc:
  server:
    port: -1

management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false

# M16 G7 hotfix — IT context отключает RedisAutoConfiguration через
# `spring.autoconfigure.exclude` в AbstractAcademicIntegrationTest, поэтому
# StringRedisTemplate bean отсутствует. RedisHeadmanRateLimiter имеет
# `matchIfMissing=true` — без этого override он будет пытаться создаться
# и ломать Spring context при init. Используем InMemoryHeadmanRateLimiter
# fallback в IT.
academic:
  headman-rate-limit:
    redis-enabled: false

rutcampustrack:
  security:
    internal-jwt:
      auth-service-url: http://localhost:9999
      public-key-refresh-minutes: 60
      clock-skew-seconds: 30
      legacy-headers-enabled: true
