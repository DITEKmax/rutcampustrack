name: Security

# Temporary owner-authorized pause for codex/web-vue-redesign.
# Restore automatic triggers before merge after explicit owner GO.
# See docs/plans/web-vue-pr3/CI-DEVELOPMENT-POLICY.md.
on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # for uploading SARIF results to GitHub Security tab

jobs:
  trivy-repo:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Trivy fs scan (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0 — M08 G11 SHA-pin
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
          skip-dirs: 'docs,.planning,.github,frontends/**/node_modules,**/build,**/dist'

      - name: Trivy fs scan (SARIF for GitHub Security)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0 — M08 G11 SHA-pin
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          skip-dirs: 'docs,.planning,.github,frontends/**/node_modules,**/build,**/dist'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-config:
    name: Trivy (config — Dockerfile + compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0 — M08 G11 SHA-pin
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          skip-dirs: 'docs,.planning'
          # M15 — structured ignore keeps the nginx exception path-specific.
          # YAML ignores require an explicit input; plain CVE ignores remain
          # auto-discovered by the filesystem scan.
          trivyignores: .trivyignore.yaml

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # complete event history, without the PR commits API's first-page limit

      - name: Run Gitleaks
        id: gitleaks
        shell: bash
        run: |
          bash scripts/local-release/gitleaks.sh
      - name: Retain redacted Gitleaks SARIF
        if: ${{ always() && steps.gitleaks.outputs.has_report == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-results.sarif
          path: results.sarif
          if-no-files-found: error

  trivy-images:
    name: Trivy (built images)
    runs-on: ubuntu-latest
    # Только на schedule — weekly deep scan GHCR-образов. На push/PR
    # используется Trivy fs (быстрее, не требует pull всех 11 образов).
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        image:
          - auth-service
          - academic-service
          - schedule-service
          - attendance-service
          - document-renderer-service
          - notification-web
          - notification-bot
          - api-gateway
          - pwa-nginx
          - mini-app-nginx
          - web-panel-nginx
          - landing-nginx
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy image scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0 — M08 G11 SHA-pin
        with:
          image-ref: ghcr.io/ditekmax/rutcampustrack/${{ matrix.image }}:latest
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
