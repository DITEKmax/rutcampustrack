services:
  # ============================================================
  # INFRASTRUCTURE
  # ============================================================

  postgres-academic:
    image: postgres:16
    container_name: rct-postgres-academic
    environment:
      POSTGRES_DB: academic_db
      POSTGRES_USER: rct_user
      POSTGRES_PASSWORD: ${POSTGRES_ACADEMIC_PASSWORD}
    expose:
      - "5432"
    volumes:
      - pg-academic-data:/var/lib/postgresql/data
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rct_user -d academic_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-schedule:
    image: postgres:16
    container_name: rct-postgres-schedule
    environment:
      POSTGRES_DB: schedule_db
      POSTGRES_USER: rct_user
      POSTGRES_PASSWORD: ${POSTGRES_SCHEDULE_PASSWORD}
      TZ: Europe/Moscow
    expose:
      - "5432"
    volumes:
      - pg-schedule-data:/var/lib/postgresql/data
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rct_user -d schedule_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo-attendance:
    image: mongo:7
    container_name: rct-mongo-attendance
    environment:
      MONGO_INITDB_DATABASE: admin
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rct-redis
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: rct-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    expose:
      - "5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # BACKEND SERVICES
  # ============================================================

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/auth-service:${IMAGE_TAG:-latest}
    container_name: rct-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # M04 QA2 — distributed tracing OTLP exporter → tempo:4317.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      POSTGRES_ACADEMIC_PASSWORD: ${POSTGRES_ACADEMIC_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_KEY_DIR: /keys
      TMA_BOT_TOKEN: ${TMA_BOT_TOKEN}
    volumes:
      - jwt-keys:/keys
    expose:
      - "9090"
    networks:
      - private_net
    depends_on:
      postgres-academic:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  academic-service:
    build:
      context: .
      dockerfile: services/academic-service/academic-app/Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/academic-service:${IMAGE_TAG:-latest}
    container_name: rct-academic-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # M04 QA2 — distributed tracing OTLP exporter → tempo:4317.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      POSTGRES_ACADEMIC_PASSWORD: ${POSTGRES_ACADEMIC_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GRPC_SECRET: ${GRPC_SECRET}
    expose:
      - "9091"
    networks:
      - private_net
    depends_on:
      postgres-academic:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9091/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  schedule-service:
    build:
      context: .
      dockerfile: services/schedule-service/schedule-app/Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/schedule-service:${IMAGE_TAG:-latest}
    container_name: rct-schedule-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # M04 QA2 — distributed tracing OTLP exporter → tempo:4317.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      POSTGRES_SCHEDULE_PASSWORD: ${POSTGRES_SCHEDULE_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GRPC_SECRET: ${GRPC_SECRET}
      TZ: Europe/Moscow
    expose:
      - "9092"
    networks:
      - private_net
    depends_on:
      postgres-schedule:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9092/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  attendance-service:
    build:
      context: .
      dockerfile: services/attendance-service/attendance-app/Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/attendance-service:${IMAGE_TAG:-latest}
    container_name: rct-attendance-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # M04 QA2 — distributed tracing OTLP exporter → tempo:4317.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo-attendance:27017/attendance_db?authSource=admin
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GRPC_SECRET: ${GRPC_SECRET}
    expose:
      - "9093"
    networks:
      - private_net
    depends_on:
      mongo-attendance:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ============================================================
  # NOTIFICATION SERVICES
  # ============================================================

  notification-web:
    build:
      context: .
      dockerfile: services/notification-service/notification-app/Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/notification-web:${IMAGE_TAG:-latest}
    container_name: rct-notification-web
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # M04 QA2 — distributed tracing OTLP exporter → tempo:4317.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_PUBLIC_KEY_PATH: /keys/public.key
      NOTIFICATION_WS_ALLOWED_ORIGINS: ${NOTIFICATION_WS_ALLOWED_ORIGINS:-https://ruttrack.site}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # M04 Группа 9 — shared secret для Alertmanager webhook в /internal/alert.
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo-attendance:27017/attendance_db?authSource=admin
    volumes:
      - jwt-keys:/keys:ro
    expose:
      - "9094"
    networks:
      - private_net
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-attendance:
        condition: service_healthy
      auth-service:          # <-- FIX: ждём пока auth-service сгенерит /keys/public.key
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9094/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  notification-bot:
    build:
      context: ./services/notification-bot
      dockerfile: Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/notification-bot:${IMAGE_TAG:-latest}
    container_name: rct-notification-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      ACADEMIC_GRPC_HOST: academic-service
      ACADEMIC_GRPC_PORT: "19091"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      HEALTH_PORT: "8081"
      SCHEDULE_GRPC_HOST: schedule-service
      SCHEDULE_GRPC_PORT: "19092"
      GRPC_SECRET: ${GRPC_SECRET}
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: "9090"
      API_GATEWAY_URL: http://api-gateway:8080
      MINI_APP_URL: ${MINI_APP_URL}
      # M04 Группа 7 — distributed tracing OTLP exporter → tempo:4317.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      # M04 Группа 9 — список Telegram ID админов (comma-separated), куда
      # форвардить alert.fired. "0" = disabled.
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-0}
      TZ: Europe/Moscow
    networks:
      - private_net
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/api-gateway:${IMAGE_TAG:-latest}
    container_name: rct-api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # M04 QA2 — distributed tracing OTLP exporter → tempo:4317.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      AUTH_SERVICE_URL: http://auth-service:9090
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      # M03a Group 9: Redis-backed rate-limiter (shared Redis с auth-service)
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # M03a: Gateway → auth-service token-exchange shared secret
      INTERNAL_ISSUER_SECRET: ${INTERNAL_ISSUER_SECRET}
    expose:
      - "8080"
    networks:
      - private_net
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
      attendance-service:
        condition: service_healthy
      notification-web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # MONITORING
  # ============================================================

  node-exporter:
    # M06 P2-9/2: semver-pin (OWNER-ANSWERS 4091). Renovate auto-merge patch.
    image: prom/node-exporter:v1.8.2
    container_name: rct-node-exporter
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    networks:
      - private_net
    restart: unless-stopped

  cadvisor:
    # M06 D2: digest-пин обязателен — privileged: true + mounts /:/rootfs + /sys.
    # Supply-chain compromise = full host access. Bump digest через Renovate (QD6).
    # Version: v0.49.1. Update: `docker buildx imagetools inspect gcr.io/cadvisor/cadvisor:<ver>`
    image: gcr.io/cadvisor/cadvisor:v0.49.1@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388
    container_name: rct-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - private_net
    restart: unless-stopped
    privileged: true

  prometheus:
    # M06 P2-9/2: semver-pin (OWNER-ANSWERS 4091). Renovate auto-merge patch.
    image: prom/prometheus:v2.55.1
    container_name: rct-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # M04 Группа 10 — retention 14d (QA5). 30d было дефолт после
      # первичной инсталляции, но для наших 6 сервисов 14d достаточно
      # (incident analysis + weekly review). NEW-66: review по
      # накоплению disk usage.
      - '--storage.tsdb.retention.time=14d'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # M04 Группа 9 — rule files подключаются через prometheus.yml
      # (rule_files: /etc/prometheus/rules/*.yml).
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks:
      - private_net
    depends_on:
      - node-exporter
      - cadvisor
      - alertmanager
    restart: unless-stopped

  # M04 Группа 9 — Alertmanager. Принимает fired alerts от prometheus
  # (alertmanager:9093), через routing отсылает webhook в
  # notification-web:9094/internal/alert. Silence 22:00-08:00 MSK
  # для warning (critical — всегда).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: rct-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    environment:
      # Токен для Authorization: Bearer в webhook. Alertmanager читает
      # файл по пути credentials_file (см. alertmanager.yml).
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET}
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    # Записываем secret в volume at startup — alertmanager не поддерживает
    # env-vars в yaml напрямую, credentials_file единственный путь.
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/alertmanager && \
        echo -n "$${ALERT_WEBHOOK_SECRET}" > /etc/alertmanager/secret && \
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager
    expose:
      - "9093"
    networks:
      - private_net
    restart: unless-stopped

  # M04 QA2 — Grafana Tempo, distributed tracing storage. Retention 14d (QA5).
  # OTLP gRPC :4317 принимает spans от 6 backend-сервисов (NEW-59).
  # HTTP :3200 — Tempo HTTP API для Grafana datasource.
  tempo:
    image: grafana/tempo:2.3.1
    container_name: rct-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    expose:
      - "3200"  # HTTP — Grafana datasource
      - "4317"  # OTLP gRPC — приёмник spans
      - "4318"  # OTLP HTTP (на будущее)
    networks:
      - private_net
    restart: unless-stopped

  grafana:
    # M06 P2-9/2: semver-pin (OWNER-ANSWERS 4092). Renovate auto-merge patch.
    image: grafana/grafana:11.3.1
    container_name: rct-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_ALERTING_TELEGRAM_BOT_TOKEN: ${BOT_ALERT_TOKEN}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./infra/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    networks:
      - private_net
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

  loki:
    # M06 P2-9/2: semver-pin (OWNER-ANSWERS 4094). Major upgrade — MANUAL
    # через Renovate (см. docs/runbooks/loki-major-upgrade.md, NEW-151).
    image: grafana/loki:3.2.1
    container_name: rct-loki
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    expose:
      - "3100"
    networks:
      - private_net
    restart: unless-stopped

  promtail:
    # M06 D2: digest-пин обязателен — mounts /var/run/docker.sock:ro.
    # Socket compromise = docker daemon control (= root host). Bump через Renovate (QD6).
    # Version: 3.2.1. Update: `docker buildx imagetools inspect grafana/promtail:<ver>`
    image: grafana/promtail:3.2.1@sha256:bf617e9d67e80247a59f717f9c1ad388d7d32dc0a1d29abd5799516d15e0a9b5
    container_name: rct-promtail
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./infra/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - private_net
    depends_on:
      - loki
    restart: unless-stopped

  # ============================================================
  # REVERSE PROXY
  # ============================================================

  nginx:
    image: nginx:1.27-alpine
    container_name: rct-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/dhparam.pem:/etc/nginx/dhparam.pem:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - private_net
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
    # Background loop reloads nginx every 5 minutes as a safety net for cases
    # when deploy.yml's explicit `nginx -s reload` step is skipped or fails.
    # Primary reload path is GitHub Actions deploy.yml after git pull.
    command: "/bin/sh -c 'while :; do sleep 5m; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: rct-certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - private_net
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h; done'"
    restart: unless-stopped

  # ============================================================
  # FRONTEND CONTAINERS
  # ============================================================

  pwa-nginx:
    build:
      context: ./frontends/pwa
      dockerfile: Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/pwa-nginx:${IMAGE_TAG:-latest}
    container_name: rct-pwa-nginx
    expose:
      - "80"
    networks:
      - private_net
    restart: unless-stopped

  mini-app-nginx:
    build:
      context: ./frontends/mini-app
      dockerfile: Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/mini-app-nginx:${IMAGE_TAG:-latest}
    container_name: rct-mini-app-nginx
    expose:
      - "80"
    networks:
      - private_net
    restart: unless-stopped

  web-panel-nginx:
    build:
      context: ./frontends/web-panel
      dockerfile: Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/web-panel-nginx:${IMAGE_TAG:-latest}
    container_name: rct-web-panel-nginx
    expose:
      - "80"
    networks:
      - private_net
    restart: unless-stopped

  landing-nginx:
    build:
      context: ./frontends/landing
      dockerfile: Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/landing-nginx:${IMAGE_TAG:-latest}
    container_name: rct-landing-nginx
    expose:
      - "80"
    networks:
      - private_net
    restart: unless-stopped

networks:
  private_net:
    driver: bridge

volumes:
  pg-academic-data:
  pg-schedule-data:
  mongo-data:
  redis-data:
  rabbitmq-data:
  jwt-keys:
  certbot-conf:
  certbot-www:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  alertmanager-data: