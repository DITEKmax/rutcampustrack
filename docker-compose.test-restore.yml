# Only scripts/test-restore.sh uses this disposable stack. No published ports,
# global container/network names, host DB mounts, or persistent DB volumes.
services:
  postgres-academic:
    image: ${RCT_RECOVERY_PG_IMAGE:?explicit cached PostgreSQL image required}
    labels:
      io.rutcampustrack.recovery: disposable
    environment:
      TZ: Europe/Moscow
      POSTGRES_DB: academic_db
      POSTGRES_USER: rct_user
      POSTGRES_PASSWORD: ${POSTGRES_ACADEMIC_PASSWORD:?required}
    tmpfs:
      - /var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rct_user -d academic_db"]
      interval: 2s
      timeout: 3s
      retries: 40

  postgres-schedule:
    image: ${RCT_RECOVERY_PG_IMAGE:?explicit cached PostgreSQL image required}
    labels:
      io.rutcampustrack.recovery: disposable
    environment:
      TZ: Europe/Moscow
      POSTGRES_DB: schedule_db
      POSTGRES_USER: rct_user
      POSTGRES_PASSWORD: ${POSTGRES_SCHEDULE_PASSWORD:?required}
    tmpfs:
      - /var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rct_user -d schedule_db"]
      interval: 2s
      timeout: 3s
      retries: 40
  mongo-attendance:
    image: ${RCT_RECOVERY_MONGO_IMAGE:?explicit cached official MongoDB 7 image required}
    labels:
      io.rutcampustrack.recovery: disposable
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?required}
    tmpfs:
      - /data/db
      - /data/configdb
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 40

networks:
  default:
    labels:
      io.rutcampustrack.recovery: disposable
