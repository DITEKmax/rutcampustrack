name: Security

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.planning/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.planning/**'
      - '*.md'
  schedule:
    # Weekly Monday 03:00 UTC — свежие CVE могут появиться после build'а.
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write  # for uploading SARIF results to GitHub Security tab

jobs:
  trivy-repo:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy fs scan (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
          skip-dirs: 'docs,.planning,.github,frontends/**/node_modules,**/build,**/dist'

      - name: Trivy fs scan (SARIF for GitHub Security)
        uses: aquasecurity/trivy-action@0.28.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          skip-dirs: 'docs,.planning,.github,frontends/**/node_modules,**/build,**/dist'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-config:
    name: Trivy (config — Dockerfile + compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          skip-dirs: 'docs,.planning'

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for gitleaks protect

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE для org-level scans (не требуется для public repo).

  trivy-images:
    name: Trivy (built images)
    runs-on: ubuntu-latest
    # Только на schedule — weekly deep scan GHCR-образов. На push/PR
    # используется Trivy fs (быстрее, не требует pull всех 11 образов).
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        image:
          - auth-service
          - academic-service
          - schedule-service
          - attendance-service
          - notification-web
          - notification-bot
          - api-gateway
          - pwa-nginx
          - web-panel-nginx
          - mini-app-nginx
          - landing-nginx
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy image scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/ditekmax/rutcampustrack/${{ matrix.image }}:latest
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
