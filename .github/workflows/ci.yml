        working-directory: tests/e2e
        env:
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_SYNTHETIC_SEED: 'true'
          RCT_LESSON_LIFECYCLE_RUN: ${{ runner.temp }}/rct-lesson-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          RCT_E2E_REMAINING5: 'true'
