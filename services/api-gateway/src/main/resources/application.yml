server:
  port: 8080

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 12MB

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:rct_dev_pass}
      timeout: 1s
      connect-timeout: 1s

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "${CORS_ALLOWED_ORIGIN:http://localhost:5173}"
              - "http://localhost:5173"
              - "http://localhost:80"
              - "http://localhost:5174"
              - "http://localhost:3000"
              - "http://localhost:4200"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        # === Rate-limited routes (specific first, wins over generic auth-service) ===

        # M13 G2: real X/min semantics via token bucket.
        # Формула (universal): replenishRate=1 tok/sec, burstCapacity=60 tok (= 1 min запас),
        # requestedTokens = 60/X. Тогда steady-state = 60/60*X = X req/min.
        # При первом запросе bucket полон (60 tok), даёт burst = X запросов залпом.
        # Далее каждые 60/X секунд восполняется 1 слот.
        # UX: после всплеска из X запросов → 60/X сек ожидания до следующего запроса.
        # См. docs/api-rate-limits.md и docs/milestones/M13-pre-deploy-hardening/NOTES.md.

        # /api/auth/otp/request — 1 req/min per IP (жёсткий SMS-cost guard)
        - id: auth-otp-request
          uri: ${AUTH_SERVICE_URL:http://auth-service:9090}
          predicates:
            - Path=/api/auth/otp/request
            - Method=POST
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 60
                key-resolver: "#{@ipKeyResolver}"

        # /api/auth/otp/verify-by-code — 5 req/min per IP
        - id: auth-otp-verify
          uri: ${AUTH_SERVICE_URL:http://auth-service:9090}
          predicates:
            - Path=/api/auth/otp/verify-by-code
            - Method=POST
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 12
                key-resolver: "#{@ipKeyResolver}"

        # /api/auth/login — 5 req/min per IP + 10 req/min per ip+login (композитный)
        # Два последовательных RL-фильтра: IP-уровень останавливает distributed brute,
        # ip+login — target-specific (клиент дубликатом шлёт X-Login header).
        - id: auth-login
          uri: ${AUTH_SERVICE_URL:http://auth-service:9090}
          predicates:
            - Path=/api/auth/login
            - Method=POST
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 12
                key-resolver: "#{@ipKeyResolver}"
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 6
                key-resolver: "#{@ipLoginKeyResolver}"

        # /api/auth/refresh — 30 req/min per user (из X-User-Id после JwtAuthenticationFilter)
        - id: auth-refresh
          uri: ${AUTH_SERVICE_URL:http://auth-service:9090}
          predicates:
            - Path=/api/auth/refresh
            - Method=POST
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 2
                key-resolver: "#{@userIdKeyResolver}"

        # /api/attendance/check-in — 10 req/min per user (предотвращает multi-mark)
        - id: attendance-checkin
          uri: ${ATTENDANCE_SERVICE_URL:http://attendance-service:9093}
          predicates:
            - Path=/api/attendance/check-in
            - Method=POST
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 6
                key-resolver: "#{@userIdKeyResolver}"

        # === Regular routes (unchanged) ===

        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service:9090}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: academic-service
          uri: ${ACADEMIC_SERVICE_URL:http://academic-service:9091}
          predicates:
            - Path=/api/academic/**
          filters:
            - StripPrefix=1
            # Глобальный DDoS-guard: 600 req/min per IP для academic endpoint'ов
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 600
                redis-rate-limiter.burstCapacity: 600
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        - id: schedule-service
          uri: ${SCHEDULE_SERVICE_URL:http://schedule-service:9092}
          predicates:
            - Path=/api/schedule/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 600
                redis-rate-limiter.burstCapacity: 600
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # M07 G12 MED-1: tight RL для multipart-upload excuse tickets.
        # 25 MB body × 600 rpm (generic attendance RL) = 15 GB/мин amplification.
        # Ставим 5 req/min per-user, чтобы честный студент (1-2 excuse/неделю)
        # не чувствовал ограничение, а abuse-сценарий блокировался при 6-й попытке.
        # Должен объявляться ДО generic `/api/attendance/**` — Spring Cloud Gateway
        # matcher выбирает первый совпавший.
        - id: attendance-excuse-upload
          uri: ${ATTENDANCE_SERVICE_URL:http://attendance-service:9093}
          predicates:
            - Path=/api/attendance/excuses/with-file
            - Method=POST
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 12
                key-resolver: "#{@userIdKeyResolver}"

        - id: attendance-service
          uri: ${ATTENDANCE_SERVICE_URL:http://attendance-service:9093}
          predicates:
            - Path=/api/attendance/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 600
                redis-rate-limiter.burstCapacity: 600
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        - id: notification-web
          uri: ${NOTIFICATION_WEB_URL:http://notification-web:9094}
          predicates:
            - Path=/api/ws/**
          filters:
            - StripPrefix=1

        - id: notification-push
          uri: ${NOTIFICATION_WEB_URL:http://notification-web:9094}
          predicates:
            - Path=/api/push/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 600
                redis-rate-limiter.burstCapacity: 600
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # M10 G5 — notification history (list / unread-count / mark-read).
        - id: notification-history
          uri: ${NOTIFICATION_WEB_URL:http://notification-web:9094}
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 600
                redis-rate-limiter.burstCapacity: 600
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # M13 G16 — CSP violation reports от браузеров.
        # Публичный endpoint (no auth); rate-limit агрессивный per-IP
        # (flood защита — malicious сайт с iframe может спамить).
        # 60 req/min per IP = 1 req/sec bucket, burstCapacity 60.
        - id: notification-csp-report
          uri: ${NOTIFICATION_WEB_URL:http://notification-web:9094}
          predicates:
            - Path=/api/csp-report
            - Method=POST
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        - id: auth-service-openapi
          uri: ${AUTH_SERVICE_URL:http://auth-service:9090}
          predicates:
            - Path=/openapi/auth-service
          filters:
            - RewritePath=/openapi/auth-service, /api-docs

        - id: academic-service-openapi
          uri: ${ACADEMIC_SERVICE_URL:http://academic-service:9091}
          predicates:
            - Path=/openapi/academic-service
          filters:
            - RewritePath=/openapi/academic-service, /api-docs

        - id: schedule-service-openapi
          uri: ${SCHEDULE_SERVICE_URL:http://schedule-service:9092}
          predicates:
            - Path=/openapi/schedule-service
          filters:
            - RewritePath=/openapi/schedule-service, /api-docs

        - id: attendance-service-openapi
          uri: ${ATTENDANCE_SERVICE_URL:http://attendance-service:9093}
          predicates:
            - Path=/openapi/attendance-service
          filters:
            - RewritePath=/openapi/attendance-service, /api-docs

springdoc:
  enable-native-support: true
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /openapi/auth-service
        name: Auth Service
      - url: /openapi/academic-service
        name: Academic Service
      - url: /openapi/schedule-service
        name: Schedule Service
      - url: /openapi/attendance-service
        name: Attendance Service

gateway:
  auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:9090}

rutcampustrack:
  security:
    internal-issuer-client:
      # M03a token-exchange — must match auth-service INTERNAL_ISSUER_SECRET
      auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:9090}
      secret: ${INTERNAL_ISSUER_SECRET:dev-internal-issuer-secret-32-bytes-for-local-testing-only}
      cache-ttl-seconds: 240     # Gateway cache < auth-service TTL (300) with safety margin
      cache-max-size: 10000
      timeout-millis: 3000
      # M03a Группа 14: strict-mode toggle. false (dev default) — Gateway прокидывает
      # и X-Internal-Token, и legacy X-User-* (dual-mode). true (prod после UAT) —
      # удаляет X-User-* перед proxy, downstream работает только через Internal JWT.
      strip-legacy-headers: ${GATEWAY_STRIP_LEGACY_HEADERS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # M04 QA6: always — partial degradation видна (downstream services down).
      show-details: always
      probes:
        enabled: true
    prometheus:
      access: unrestricted
  info:
    git:
      enabled: true
      mode: full
    build:
      enabled: true
  # M04 QA2 (NEW-58/59) — distributed tracing OTel → Tempo.
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4317}
  metrics:
    tags:
      application: ${spring.application.name}

# M04 QA1: INFO-default для secure-by-default. DEBUG включается через
# application-dev.yml (SPRING_PROFILES_ACTIVE=dev) или env-override.
logging:
  level:
    org.springframework.cloud.gateway: INFO
    ru.rutcampustrack: INFO
