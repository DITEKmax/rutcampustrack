management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # M04 QA6: prod не переопределяет — default уже always.
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Binding RPCs require an authenticated TLS transport before the directed
# Academic service credential is accepted. Certificate paths are deployment
# inputs; an absent path must fail the prod profile instead of falling back to
# plaintext.
grpc:
  server:
    security:
      enabled: true
      certificate-chain: ${SCHEDULE_GRPC_CERTIFICATE_CHAIN}
      private-key: ${SCHEDULE_GRPC_PRIVATE_KEY}
  client:
    constructor-attendance:
      address: ${CONSTRUCTOR_ATTENDANCE_GRPC_ADDRESS:dns:///attendance-service:19093}
      negotiation-type: TLS
      security:
        authority-override: ${CONSTRUCTOR_ATTENDANCE_GRPC_AUTHORITY:attendance-service}
        trust-cert-collection: ${CONSTRUCTOR_ATTENDANCE_GRPC_CA_PATH}
    constructor-academic:
      address: ${CONSTRUCTOR_ACADEMIC_GRPC_ADDRESS:dns:///academic-service:19091}
      negotiation-type: TLS
      security:
        authority-override: ${CONSTRUCTOR_ACADEMIC_GRPC_AUTHORITY:academic-service}
        trust-cert-collection: ${CONSTRUCTOR_ACADEMIC_GRPC_CA_PATH}
    academic-service:
      negotiation-type: TLS
      security:
        trust-cert-collection: ${ACADEMIC_GRPC_TRUST_CERT_COLLECTION}
        authority-override: ${ACADEMIC_GRPC_TLS_AUTHORITY}
