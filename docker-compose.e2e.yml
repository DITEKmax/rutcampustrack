# M13 G25.3 — e2e test stack для Playwright auth-token-lifecycle CI job.
#
# Standalone (НЕ override prod) — содержит только то, что нужно для
# Playwright @smoke (auth lifecycle): 5 backend Java сервисов +
# 5 infra + 2 notification + 4 frontend nginx + 1 reverse-proxy nginx.
#
# Что НЕ включено (vs prod):
#   - Observability: tempo, alertmanager, prometheus, grafana, loki,
#     promtail, node-exporter, cadvisor, blackbox-exporter
#   - Certbot (SSL termination через self-signed cert, см. ниже)
#   - mem_limit / mem_reservation (CI runner ~7GB, лишние ограничения =
#     OOMKill flap)
#   - Digest-pin'ы образов (Renovate ротейтит — лишний noise в e2e)
#
# TLS:
#   Reverse-proxy nginx терминирует HTTPS через self-signed cert,
#   генерируется через `tests/e2e/infra/scripts/generate-test-certs.sh`
#   до `docker compose up`. Playwright использует ignoreHTTPSErrors=true.
#   Это нужно потому что AuthCookies выставляет `Secure` flag на refresh
#   cookie — на чистом HTTP браузер cookie отбрасывает.
#
# Запуск (локально):
#   cp tests/e2e/.env.ci .env
#   bash tests/e2e/infra/scripts/generate-test-certs.sh
#   docker compose -f docker-compose.e2e.yml up -d --build
#   # ждать ~3-5 мин
#   cd tests/e2e && npx playwright test --project=chromium --grep @smoke

services:
  # ============================================================
  # INFRASTRUCTURE
  # ============================================================

  postgres-academic:
    image: postgres:16
    container_name: rct-postgres-academic
    environment:
      POSTGRES_DB: academic_db
      POSTGRES_USER: rct_user
      POSTGRES_PASSWORD: ${POSTGRES_ACADEMIC_PASSWORD}
    expose:
      - "5432"
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rct_user -d academic_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-schedule:
    image: postgres:16
    container_name: rct-postgres-schedule
    environment:
      POSTGRES_DB: schedule_db
      POSTGRES_USER: rct_user
      POSTGRES_PASSWORD: ${POSTGRES_SCHEDULE_PASSWORD}
      TZ: Europe/Moscow
    expose:
      - "5432"
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rct_user -d schedule_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-attendance:
    # Bitnami declarative replica set (rs0, single-node primary).
    # Легасии namespace bitnamilegacy/ — см. M13 G24-fix-3 в prod compose.
    image: bitnamilegacy/mongodb:7.0
    container_name: rct-mongo-attendance
    environment:
      MONGODB_REPLICA_SET_MODE: primary
      MONGODB_REPLICA_SET_NAME: rs0
      MONGODB_REPLICA_SET_KEY: ${MONGODB_REPLICA_SET_KEY}
      MONGODB_ROOT_USER: ${MONGO_ROOT_USER}
      MONGODB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGODB_EXTRA_USERNAMES: ${MONGO_USER},${MONGO_NOTIFICATION_USER}
      MONGODB_EXTRA_PASSWORDS: ${MONGO_PASSWORD},${MONGO_NOTIFICATION_PASSWORD}
      MONGODB_EXTRA_DATABASES: attendance_db,notification_db
      MONGODB_ADVERTISED_HOSTNAME: mongo-attendance
    expose:
      - "27017"
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: rct-redis
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    expose:
      - "6379"
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rct-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    expose:
      - "5672"
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # BACKEND SERVICES
  # ============================================================

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    image: rct/auth-service:${IMAGE_TAG:-e2e-local}
    container_name: rct-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_ACADEMIC_PASSWORD: ${POSTGRES_ACADEMIC_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_KEY_DIR: /keys
      TMA_BOT_TOKEN: ${TMA_BOT_TOKEN}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC"
    volumes:
      - jwt-keys:/keys
    expose:
      - "9090"
    networks:
      - private_net
    depends_on:
      postgres-academic:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  academic-service:
    build:
      context: .
      dockerfile: services/academic-service/academic-app/Dockerfile
    image: rct/academic-service:${IMAGE_TAG:-e2e-local}
    container_name: rct-academic-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_ACADEMIC_PASSWORD: ${POSTGRES_ACADEMIC_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GRPC_SECRET: ${GRPC_SECRET}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC"
    expose:
      - "9091"
    networks:
      - private_net
    depends_on:
      postgres-academic:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9091/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 75s

  schedule-service:
    build:
      context: .
      dockerfile: services/schedule-service/schedule-app/Dockerfile
    image: rct/schedule-service:${IMAGE_TAG:-e2e-local}
    container_name: rct-schedule-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_SCHEDULE_PASSWORD: ${POSTGRES_SCHEDULE_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GRPC_SECRET: ${GRPC_SECRET}
      TZ: Europe/Moscow
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC"
    expose:
      - "9092"
    networks:
      - private_net
    depends_on:
      postgres-schedule:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9092/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 75s

  attendance-service:
    build:
      context: .
      dockerfile: services/attendance-service/attendance-app/Dockerfile
    image: rct/attendance-service:${IMAGE_TAG:-e2e-local}
    container_name: rct-attendance-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo-attendance:27017/attendance_db?authSource=admin&replicaSet=rs0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GRPC_SECRET: ${GRPC_SECRET}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC"
    expose:
      - "9093"
    networks:
      - private_net
    depends_on:
      mongo-attendance:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 75s

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: rct/api-gateway:${IMAGE_TAG:-e2e-local}
    container_name: rct-api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AUTH_SERVICE_URL: http://auth-service:9090
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      INTERNAL_ISSUER_SECRET: ${INTERNAL_ISSUER_SECRET}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC"
    expose:
      - "8080"
    networks:
      - private_net
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
      attendance-service:
        condition: service_healthy
      notification-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  # ============================================================
  # NOTIFICATION SERVICES
  # ============================================================

  notification-web:
    build:
      context: .
      dockerfile: services/notification-service/notification-app/Dockerfile
    image: rct/notification-web:${IMAGE_TAG:-e2e-local}
    container_name: rct-notification-web
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_PUBLIC_KEY_PATH: /keys/public.key
      NOTIFICATION_WS_ALLOWED_ORIGINS: ${NOTIFICATION_WS_ALLOWED_ORIGINS}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_NOTIFICATION_USER}:${MONGO_NOTIFICATION_PASSWORD}@mongo-attendance:27017/notification_db?authSource=admin&replicaSet=rs0
      NOTIFICATION_HISTORY_TTL_DAYS: "30"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC"
    volumes:
      - jwt-keys:/keys:ro
    expose:
      - "9094"
    networks:
      - private_net
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-attendance:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9094/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 75s

  notification-bot:
    build:
      context: ./services/notification-bot
      dockerfile: Dockerfile
    image: rct/notification-bot:${IMAGE_TAG:-e2e-local}
    container_name: rct-notification-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      ACADEMIC_GRPC_HOST: academic-service
      ACADEMIC_GRPC_PORT: "19091"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      HEALTH_PORT: "8081"
      SCHEDULE_GRPC_HOST: schedule-service
      SCHEDULE_GRPC_PORT: "19092"
      GRPC_SECRET: ${GRPC_SECRET}
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: "9090"
      API_GATEWAY_URL: http://api-gateway:8080
      MINI_APP_URL: ${MINI_APP_URL}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS}
      TZ: Europe/Moscow
    networks:
      - private_net
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # FRONTEND CONTAINERS
  # ============================================================

  pwa-nginx:
    build:
      context: ./frontends/pwa
      dockerfile: Dockerfile
    image: rct/pwa-nginx:${IMAGE_TAG:-e2e-local}
    container_name: rct-pwa-nginx
    expose:
      - "80"
    networks:
      - private_net

  mini-app-nginx:
    build:
      context: ./frontends/mini-app
      dockerfile: Dockerfile
    image: rct/mini-app-nginx:${IMAGE_TAG:-e2e-local}
    container_name: rct-mini-app-nginx
    expose:
      - "80"
    networks:
      - private_net

  web-panel-nginx:
    build:
      context: ./frontends/web-panel
      dockerfile: Dockerfile
    image: rct/web-panel-nginx:${IMAGE_TAG:-e2e-local}
    container_name: rct-web-panel-nginx
    expose:
      - "80"
    networks:
      - private_net

  landing-nginx:
    build:
      context: ./frontends/landing
      dockerfile: Dockerfile
    image: rct/landing-nginx:${IMAGE_TAG:-e2e-local}
    container_name: rct-landing-nginx
    expose:
      - "80"
    networks:
      - private_net

  # ============================================================
  # REVERSE-PROXY (HTTP→HTTPS + self-signed TLS)
  # ============================================================

  nginx:
    image: nginx:1.27-alpine
    container_name: rct-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./tests/e2e/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tests/e2e/infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tests/e2e/infra/certs:/etc/nginx/certs:ro
    networks:
      - private_net
    depends_on:
      api-gateway:
        condition: service_healthy

networks:
  private_net:
    driver: bridge

volumes:
  jwt-keys:
