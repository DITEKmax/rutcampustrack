server:
  port: 9090

spring:
  application:
    name: auth-service

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:rct_dev_pass}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:rct_user}
    password: ${SPRING_RABBITMQ_PASSWORD:rct_dev_pass}

  datasource:
    url: jdbc:postgresql://postgres-academic:5432/academic_db
    username: rct_user
    password: ${POSTGRES_ACADEMIC_PASSWORD:rct_dev_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  flyway:
    enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  key-dir: ${JWT_KEY_DIR:./keys}
  access-token-expiration: 900        # 15 минут
  refresh-token-expiration: 604800    # 7 дней

rutcampustrack:
  security:
    internal-issuer:
      # M03a: token exchange endpoint shared secret (api-gateway ↔ auth-service).
      # Required ≥32 bytes; fail-fast on empty. Rotate simultaneously on both services.
      secret: ${INTERNAL_ISSUER_SECRET:dev-internal-issuer-secret-32-bytes-for-local-testing-only}
      # Internal JWT TTL — Gateway cache is 4 мин, so 300 даёт safe margin.
      token-ttl-seconds: 300

otp:
  code-length: 6
  ttl-seconds: 120
  max-attempts: 3
  attempts-window-seconds: 300
  resend-cooldown-seconds: 60

tma:
  bot-token: ${TMA_BOT_TOKEN}
  auth-date-max-age-seconds: 86400

# M04 QA1: INFO-default для secure-by-default. DEBUG включается через
# application-dev.yml (SPRING_PROFILES_ACTIVE=dev) или env-override.
logging:
  level:
    ru.rutcampustrack: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # M04 QA6: always — partial degradation видна (DB/Rabbit/Redis/Mongo down).
      # /actuator/health не public (REC-03), детали утекают только аутентифицированным.
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  info:
    git:
      enabled: true
      mode: full
    build:
      enabled: true
  # M04 QA2 (NEW-58/59) — distributed tracing OTel → Tempo.
  # Sampling 1.0 для v0.0.0 (малый traffic, ловим всё). Снизить до 0.1
  # когда дойдём до production scale (NEW-66 trigger).
  # Health-check запросы исключены из sampling (спам в Tempo).
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4317}
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/academic_db
  data:
    redis:
      host: localhost
