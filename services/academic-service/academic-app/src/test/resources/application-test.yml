spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
logging:
  level:
    ru.rutcampustrack: DEBUG
    org.hibernate.SQL: DEBUG
grpc:
  server:
    in-process-name: test
    port: -1
  client:
    inProcess:
      address: in-process:test
      negotiationType: plaintext
