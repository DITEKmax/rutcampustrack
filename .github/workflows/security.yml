name: Security

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.planning/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.planning/**'
      - '*.md'
  schedule:
    # Weekly Monday 03:00 UTC — свежие CVE могут появиться после build'а.
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write # for uploading SARIF results to GitHub Security tab

# Owner 2026-10-11: web-panel is deferred from the current release scope.
# Scan the accepted backend, PWA/TMA and bot; web-panel security debt remains
# and must be resolved before returning that client to the release gates.

jobs:
  trivy-repo:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Trivy fs scan (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0 — M08 G11 SHA-pin
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
          skip-dirs: 'docs,.planning,.github,frontends/web-panel,frontends/**/node_modules,**/build,**/dist'

      - name: Trivy fs scan (SARIF for GitHub Security)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0 — M08 G11 SHA-pin
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          skip-dirs: 'docs,.planning,.github,frontends/web-panel,frontends/**/node_modules,**/build,**/dist'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-config:
    name: Trivy (config — Dockerfile + compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0 — M08 G11 SHA-pin
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          skip-dirs: 'docs,.planning,frontends/web-panel'
          # M15 — structured ignore keeps the nginx exception path-specific.
          # YAML ignores require an explicit input; plain CVE ignores remain
          # auto-discovered by the filesystem scan.
          trivyignores: .trivyignore.yaml

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # complete event history, without the PR commits API's first-page limit

      - name: Run Gitleaks
        id: gitleaks
        shell: bash
        run: |
          set -euo pipefail
          test ! -e results.sarif
          umask 077
          metadata_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks-metadata.XXXXXX")"
          export RCT_GITLEAKS_METADATA_CONFIG="$metadata_dir/config.toml"
          log_opts="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          def refuse():
              raise SystemExit("Gitleaks source admission failed")

          def git(*args):
              result = subprocess.run(["git", *args], capture_output=True, text=True)
              if result.returncode:
                  refuse()
              return result.stdout.strip()

          def ref(value):
              if not isinstance(value, str) or re.fullmatch(r"[0-9a-f]{40}", value) is None:
                  refuse()
              if git("rev-parse", "--verify", value + "^{commit}") != value:
                  refuse()
              return value

          def ancestor(before, after):
              git("merge-base", "--is-ancestor", before, after)

          if git("rev-parse", "--is-shallow-repository") != "false":
              refuse()
          current = ref(os.environ["GITHUB_SHA"])
          if git("rev-parse", "HEAD") != current:
              refuse()
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          event_name = os.environ["GITHUB_EVENT_NAME"]
          revision = current
          if event_name == "pull_request":
              base = ref(event["pull_request"]["base"]["sha"])
              head = ref(event["pull_request"]["head"]["sha"])
              ancestor(base, current)
              ancestor(head, current)
              if base != current:
                  revision = base + ".." + current
          elif event_name == "push":
              if ref(event["after"]) != current:
                  refuse()
              before = event["before"]
              if before != "0" * 40:
                  before = ref(before)
                  ancestor(before, current)
                  if before != current:
                      revision = before + ".." + current
          elif event_name not in ("schedule", "workflow_dispatch"):
              refuse()
          if git("rev-list", "--max-count=1", revision) != current:
              refuse()
          def metadata_config(output, revision):
              import ast
              import csv
              import hashlib
              import textwrap
              import tomllib
              from decimal import Decimal

              base = Path(".gitleaks.toml").resolve()
              policy = tomllib.loads(base.read_text())["rct_metadata"]
              if policy["version"] != 1:
                  raise ValueError
              trusted_revision = policy["trusted_revision"]
              if (re.fullmatch(r"[0-9a-f]{40}", trusted_revision) is None
                      or git("rev-parse", "--verify", trusted_revision + "^{commit}") != trusted_revision):
                  raise ValueError
              git("merge-base", "--is-ancestor", trusted_revision, current)
              labels = set(policy["public_labels"])
              roles = set(policy["git_reference_fields"])
              if len(labels) != 14 or len(roles) > 256:
                  raise ValueError
              hex40 = re.compile(r"[a-fA-F0-9]{40}")
              hex64 = re.compile(r"[a-fA-F0-9]{64}")
              credential_key = (
                  r"api[_-]?(?:key|token)|(?:access|refresh|auth|id|session)[_-]?token"
                  r"|sourcegraph(?:[_-]?token)?|token|secret|(?:client|secret|private|access)[_-]?key"
                  r"|client[_-]?secret|password|passwd|passphrase|authorization|credential"
              )
              binding = re.compile(r"(?i)\b(?:" + credential_key + r"\b)[\"']?\s*[:=]")
              unsafe = {"apikey", "token", "accesstoken", "authtoken", "sourcegraphtoken",
                        "sourcegraph", "secret", "password", "authorization", "credential",
                        "credentials", "headers", "cookies", "cookie", "sid", "refreshtoken",
                        "idtoken", "apitoken", "accesskey", "secretkey", "privatekey",
                        "clientsecret", "passwd", "passphrase", "sessiontoken", "bearer"}
              pin_maps = {"source_pins", "sourcePins", "sourcepins", "sourcePinsVerified",
                          "pins", "files", "source_sha256", "current_test_file_sha256",
                          "Root_verified_test_pins", "patch_sha256", "sourceHashes",
                          "source_sha256_at_62c", "root_source_hashes", "final_25_source_pins"}
              note_fields = ['Auth', 'P01owner', 'activeCompileOwner', 'actual658', 'adaptation', 'agent', 'agents', 'baseCodecRef', 'choice', 'evidence', 'independentSourceReview', 'limits', 'nativePlan', 'next_writer', 'owner', 'privacy', 'qualification', 'scope', 'securityControls', 'shape', 'strictJson', 'writer']
              note_arrays = {"agents", "nativePlan", "independentSourceReview"}
              limits = policy["limits"]
              if limits != {"files": 26, "objects": 1024, "source_bytes": 2147483648,
                            "file_bytes": 33554432, "values_per_file": 8192,
                            "config_bytes": 2097152}:
                  raise ValueError
              files = policy["files"]
              if len(files) != limits["files"] or len({s["path"] for s in files}) != len(files):
                  raise ValueError
              pin_sources = {s["path"]: s["source_path"] for s in files if s["kind"] == "ci-pin"}
              if pin_sources != {".github/workflows/ci.yml":
                                 "services/academic-service/academic-app/src/main/java/ru/rutcampustrack/academic/admin/AdminAccessService.java"}:
                  raise ValueError

              def pairs(items):
                  result = {}
                  for key, value in items:
                      if key in result:
                          raise ValueError
                      result[key] = value
                  return result

              def forbidden(keys):
                  for index, key in enumerate(keys):
                      if not isinstance(key, str):
                          continue
                      normalized = re.sub(r"[-_ ]", "", key).lower()
                      if normalized in unsafe:
                          return True
                      if normalized in {"auth", "authentication", "api", "key"}:
                          parent = keys[index - 1] if index else None
                          if parent not in {"checks", "patch_sha256", "reviews"} and "next_reviewed_integrations" not in keys[:index]:
                              return True
                  return False

              def schema(spec, value):
                  if not isinstance(value, dict):
                      return False
                  if spec["kind"] == "journal":
                      markers = {"utc", "time", "timestamp", "ts", "at", "date", "action",
                                 "event", "package", "schema", "checkpoint", "status", "state",
                                 "stage", "phase", "decision", "record", "kind"}
                      dates = {"utc", "time", "timestamp", "ts", "at", "date"}
                      for key in markers:
                          item = value.get(key)
                          if key in dates:
                              if isinstance(item, str) and re.match(r"20[0-9]{2}-[0-9]{2}-[0-9]{2}", item):
                                  return True
                          elif key == "checkpoint" and type(item) is int and 0 <= item <= 1000000:
                              return True
                          elif isinstance(item, str) and 0 < len(item) <= 256 and item.isprintable():
                              return True
                      return False
                  if any(type(value.get(k)).__name__ != t for k, t in spec["required"].items()):
                      return False
                  return "schema" not in spec or value.get("schema") == spec["schema"]

              def canonical_signature(value):
                  digest = hashlib.sha256()

                  def emit(node):
                      if type(node) is dict:
                          digest.update(b"{")
                          for key in sorted(node):
                              emit(key)
                              emit(node[key])
                          digest.update(b"}")
                      elif type(node) is list:
                          digest.update(b"[")
                          for item in node:
                              emit(item)
                          digest.update(b"]")
                      else:
                          tag = {str: b"s", int: b"i", bool: b"b", type(None): b"n", Decimal: b"f"}[type(node)]
                          encoded = str(node) if type(node) is Decimal else node
                          digest.update(tag + json.dumps(encoded, allow_nan=False).encode() + b";")

                  emit(value)
                  return digest.digest()

              def source_ready_heads(document):
                  # Two existing source-ready notes have one exact public head slot each.
                  required = {
                      'utc', 'event', 'base', 'Event', 'Report', 'adoptionFact', 'Native49',
                      'HWartifact', 'HWZipSha256', 'HWSafeSha256', 'HWfacts', 'R2', 'matrix', 'newDocuments'}
                  if (type(document) is not dict or set(document) != required
                          or document['event'] != 'boundedD9v6+durableAdoptionContinuation-GO-HW429fixtureRCA'
                          or not all(type(document[key]) is str and len(document[key]) <= 4096
                                     for key in required - {'HWartifact', 'newDocuments'})
                          or type(document['HWartifact']) is not int or document['HWartifact'] <= 0
                          or type(document['newDocuments']) is not bool
                          or not hex40.fullmatch(document['base'])
                          or not all(hex64.fullmatch(document[key])
                                     for key in ('HWZipSha256', 'HWSafeSha256'))):
                      return {}
                  patterns = {'Event': 'GO7fileexistingv6snapshot\\+typedAttendance/ScheduleACKWARNdiagnostic,\\ NEWpureScheduleEventConsumerTest\\ explicitabsence;\\ assignedWTretainedHEAD([a-f0-9]{40})/Root1fbcontentpins;\\ no\\ clients/retry/business/oracle/timeouts/INITIALtemplatechange', 'Report': 'GOmobile\\-dataset\\.ts\\ exactdurable503existingresume\\ inunchanged60sbudget\\ \\+soleCIv6consumerguard/sourcepins;\\ WT/tmp/rct\\-s19\\-pool\\-budget\\ HEAD([a-f0-9]{40}),\\ twoRoot1fbpreimages55c193ea/01a73bd3;\\ other24WTfilespreserved'}
                  matches = {key: re.fullmatch(pattern, document[key]) for key, pattern in patterns.items()}
                  return ({key: match[1] for key, match in matches.items()}
                          if all(matches.values()) else {})

              def publication_tuple(document):
                  # A label is not a Git witness: parents and trees are checked below.
                  required = {
                      'utc', 'event', 'head', 'parent', 'inventory', 'hooks', 'commitSeconds',
                      'pushSeconds', 'normalPushRemoteVerified', 'foreign25RawNulSha256',
                      'PR2', 'merge', 'sameTree', 'native48', 'runs', 'next', 'matrix'}
                  if (type(document) is not dict or set(document) != required
                          or document['event'] != 'published1fb-normal7filecheckpoint+PRexact-newCI'
                          or document['normalPushRemoteVerified'] is not True
                          or not all(type(document[key]) is str and len(document[key]) <= 4096
                                     for key in required - {'commitSeconds', 'pushSeconds',
                                                           'normalPushRemoteVerified', 'runs'})
                          or not all(type(document[key]) in {int, Decimal} and 0 <= document[key] <= 3600
                                     for key in ('commitSeconds', 'pushSeconds'))
                          or type(document['runs']) is not dict
                          or not all(hex40.fullmatch(document[key]) for key in ('head', 'parent', 'merge'))
                          or not hex64.fullmatch(document['foreign25RawNulSha256'])):
                      return None
                  tree = re.fullmatch('([a-f0-9]{40})\\ metadataverified', document['sameTree'])
                  return ((document['head'], document['parent'], document['merge'], tree[1])
                          if tree else None)

              def postdoc_tuple(document):
                  # Compatibility for the published correction receipt, not new Git field aliases.
                  required = {
                      'utc', 'stage', 'event', 'startingFixHead', 'testedSource', 'PRcheckout',
                      'sameTree', 'runs', 'authorVerified', 'designatedExternalReview',
                      'historicalV3', 'sourceInventory', 'taskdocPublication', 'boundaries'}
                  if (type(document) is not dict or set(document) != required
                          or document['stage'] != 'F01-F09-independent-PR2-corrections'
                          or document['event'] != 'AUTHOR_VERIFIED_ALL9_CURRENT_GATES_SUCCESS_INTERNAL_REVIEW_APPROVE'
                          or not all(type(document[key]) is str and 0 < len(document[key]) <= 4096
                                     and document[key].isprintable() for key in required - {'runs'})
                          or document['authorVerified'] != '9/9'
                          or document['designatedExternalReview'] != 'PENDING0/9'
                          or re.fullmatch(r'20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,6})?\+00:00', document['utc']) is None
                          or type(document['runs']) is not list or len(document['runs']) != 5
                          or not all(type(run) is int and 0 < run < 10 ** 12 for run in document['runs'])
                          or len(set(document['runs'])) != 5
                          or not all(hex40.fullmatch(document[key])
                                     for key in ('startingFixHead', 'testedSource', 'PRcheckout', 'sameTree'))):
                      return None
                  return (document['testedSource'], document['startingFixHead'],
                          document['PRcheckout'], document['sameTree'])

              current_header_ancestry = {}

              def current_header_slots(line, path="docs/validation/cloud-20261011/CURRENT.md"):
                  # Only observed CURRENT/HANDOFF header fields, never arbitrary prose hashes.
                  patterns = [
                      ('Published/executable\\ \\*\\*([a-f0-9]{40})(?![A-Za-z0-9])', ((1, 'HEAD'),)),
                      ('Published/remote/PR\\ HEAD\\ \\*\\*([a-f0-9]{40})(?![A-Za-z0-9])', ((1, 'HEAD'),)),
                      ('Stage19\\ base\\ \\*\\*([a-f0-9]{40})(?![A-Za-z0-9])', ((1, 'STARTING'),)),
                      ('Stage19\\ starting\\ HEAD\\ \\*\\*([a-f0-9]{40})(?![A-Za-z0-9])', ((1, 'STARTING'),)),
                      ('Starting([a-f0-9]{40})(?![A-Za-z0-9])', ((1, 'STARTING'),)),
                      ('Starting/published\\ HEAD\\ \\*\\*([a-f0-9]{40})(?![A-Za-z0-9])', ((1, 'STARTING'), (1, 'HEAD'))),
                      ('Starting\\ \\*\\*([a-f0-9]{40})(?![A-Za-z0-9])', ((1, 'STARTING'),)),
                      ('Ветка\\ `codex/server\\-validation\\-20261011`,\\ \\[draft\\ PR2\\]\\(https://github\\.com/DITEKmax/rutcampustrack/pull/2\\);\\ starting\\ \\*\\*([a-f0-9]{40})\\*\\*,\\ опубликованный\\ HEAD\\ \\*\\*([a-f0-9]{40})(?![A-Za-z0-9])', ((1, 'STARTING'), (2, 'HEAD'))),
                      ('Ветка\\ `codex/server\\-validation\\-20261011`,\\ \\[draft\\ PR2\\]\\(https://github\\.com/DITEKmax/rutcampustrack/pull/2\\)\\.\\ Starting\\ `([a-f0-9]{40})`;\\ published\\ HEAD\\ \\*\\*([a-f0-9]{40})(?![A-Za-z0-9])', ((1, 'STARTING'), (2, 'HEAD'))),
                      ('Ветка\\ `codex/server\\-validation\\-20261011`,\\ \\[draft\\ PR2\\]\\(https://github\\.com/DITEKmax/rutcampustrack/pull/2\\)\\.\\ Starting\\ `([a-f0-9]{40})`;\\ опубликованный\\ HEAD\\ \\*\\*([a-f0-9]{40})(?![A-Za-z0-9])', ((1, 'STARTING'), (2, 'HEAD'))),
                  ]
                  if path == 'docs/validation/cloud-20261011/HANDOFF-20261017.md':
                      patterns = [
                          ('\\-\\ Starting\\ SHA\\ расширенной\\ separate\\-DB\\ стадии:\\ `([a-f0-9]{40})`;\\ текущий\\ опубликованный\\ source\\ HEAD:\\ `([a-f0-9]{40})(?=`)', ((1, 'STARTING'), (2, 'HEAD'))),
                      ]
                  elif path != 'docs/validation/cloud-20261011/CURRENT.md':
                      return []
                  result = []
                  for pattern, roles in patterns:
                      match = re.match(pattern, line)
                      if match:
                          for group, role in roles:
                              result.append((role, match[group], *match.span(group)))
                  return result

              def verified_current_headers(slots, public_commits):
                  slots = list(dict.fromkeys(slots))
                  starting = [slot for slot in slots if slot[0] == 'STARTING']
                  heads = [slot for slot in slots if slot[0] == 'HEAD']
                  if (len(starting) != 1 or len(heads) > 1
                          or any(slot[1] not in public_commits for slot in slots)):
                      return ()
                  pairs = ([(starting[0][1], heads[0][1]), (heads[0][1], current)]
                           if heads else [(starting[0][1], current)])
                  for pair in pairs:
                      if pair not in current_header_ancestry:
                          try:
                              status = subprocess.run(
                                  ['git', 'merge-base', '--is-ancestor', *pair],
                                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=5)
                              current_header_ancestry[pair] = status.returncode == 0
                          except (OSError, subprocess.TimeoutExpired):
                              current_header_ancestry[pair] = False
                      if not current_header_ancestry[pair]:
                          return ()
                  return slots

              def verified_handoff_compares(line, public_commits):
                  patterns = [
                      '\\-\\ \\[Diff\\ этапа\\]\\(https://github\\.com/DITEKmax/rutcampustrack/compare/([a-f0-9]{40})\\.\\.\\.([a-f0-9]{40})\\);\\ \\[последние\\ четыре\\ source/test/workflow\\ файла\\]\\(https://github\\.com/DITEKmax/rutcampustrack/compare/([a-f0-9]{40})\\.\\.\\.([a-f0-9]{40})\\)\\.\\ Полный\\ inventory\\ доступен\\ через\\ `git\\ diff\\ \\-\\-name\\-status\\ 26cbe591\\.\\.d5d7d4c6`\\.',
                      '\\-\\ \\[Diff\\ этапа\\]\\(https://github\\.com/DITEKmax/rutcampustrack/compare/([a-f0-9]{40})\\.\\.\\.([a-f0-9]{40})\\);\\ \\[последний\\ пакет\\ Advice/source\\-test\\ и\\ taskdocs\\]\\(https://github\\.com/DITEKmax/rutcampustrack/compare/([a-f0-9]{40})\\.\\.\\.([a-f0-9]{40})\\)\\.\\ Полный\\ inventory\\ доступен\\ через\\ `git\\ diff\\ \\-\\-name\\-status\\ 26cbe591\\.\\.d5d7d4c6`\\.',
                  ]
                  match = next((match for pattern in patterns
                                if (match := re.fullmatch(pattern, line.rstrip('\r\n')))), None)
                  if match is None:
                      return ()
                  result = []
                  for left, right in ((1, 2), (3, 4)):
                      slots = [('STARTING', match[left], *match.span(left)),
                               ('HEAD', match[right], *match.span(right))]
                      if not verified_current_headers(slots, public_commits):
                          return ()
                      result.extend(slots)
                  return result

              def credential_operand(value, label):
                  for match in binding.finditer(value):
                      # Free-form suffix text does not prove an operand boundary.
                      if label in value[match.end():]:
                          return True
                  return False

              def occurrences(spec, text, public_objects, trusted_records=None, legacy_refs=(),
                              seed_refs=None, ci_hashes=(), legacy_pins=(), instruction_witnesses=None,
                              public_commits=(), publication_witnesses=()):
                  allowed = {}
                  records = set()
                  known_parents = {path for path, _ in trusted_records or () if path is not None}

                  def trusted_line(line):
                      signature = (None, hashlib.sha256(line.encode()).digest())
                      if trusted_records is None:
                          records.add(signature)
                          return True
                      return signature in trusted_records

                  def add(value, start, end):
                      if not value or len(value) > 128:
                          return
                      offset = text.find(value, start, end)
                      while offset >= 0:
                          allowed.setdefault(value, set()).add(offset)
                          offset = text.find(value, offset + len(value), end)

                  def scalar(value, keys, start, end, legacy, public_context, whole_legacy,
                             producer_legacy, direct_labels=False, instruction=False, document_value=None):
                      if not isinstance(value, str) or forbidden(keys):
                          return
                      named = [key for key in keys if isinstance(key, str)]
                      key = named[-1] if named else ""
                      ancestors = named[:-1]
                      bound = binding.search(value)
                      if not bound and key in roles and len(value) <= 4096:
                          if seed_refs is not None and legacy and hex40.fullmatch(value):
                              seed_refs.add(value)
                          for match in re.finditer(r"(?<![a-fA-F0-9])[a-fA-F0-9]{40}(?![a-fA-F0-9])", value):
                              token = match.group()
                              pack = key in {"pack", "packId", "capacity"} and "pack" in value.lower()
                              public = value == token and token.lower() in public_objects and public_context
                              if public or legacy and (value == token or token.lower() in public_objects or pack
                                                       or whole_legacy and token in legacy_refs):
                                  add(token, start, end)
                      journal = spec["kind"] == "journal"
                      if (journal and spec['path'] == 'docs/validation/cloud-20261011/attempts.ndjson'
                              and public_context and not bound and len(keys) == 1):
                          heads = source_ready_heads(document_value)
                          token = heads.get(key)
                          if token and token in legacy_refs and token in public_commits:
                              add(token, start, end)
                          publication = publication_tuple(document_value)
                          if publication in publication_witnesses:
                              if key == 'merge' and value == publication[2]:
                                  add(value, start, end)
                              elif key == 'sameTree' and value.startswith(publication[3]):
                                  add(publication[3], start, end)
                          postdoc = postdoc_tuple(document_value)
                          if (True, postdoc) in publication_witnesses:
                              slots = {'testedSource': 0, 'startingFixHead': 1, 'PRcheckout': 2, 'sameTree': 3}
                              if key in slots and value == postdoc[slots[key]]:
                                  add(value, start, end)
                      remote_main = journal and keys == ("evidence", "remote_main_sha")
                      readback_ref = spec["path"] == "docs/validation/cloud-20261011/receipts/current-4065-real-push-readback.safe.json" and keys in {
