global:
  scrape_interval: 15s
  evaluation_interval: 15s

# M04 Группа 9 — Alertmanager routing. Prometheus отсылает fired
# алерты в alertmanager:9093, тот через routing tree выбирает webhook
# → notification-web:9094/internal/alert → RabbitMQ → Telegram-бот
# админу. Silence 22:00-08:00 MSK через mute_time_intervals в
# alertmanager.yml (D3).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:9090']

  - job_name: 'academic-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['academic-service:9091']

  - job_name: 'schedule-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['schedule-service:9092']

  - job_name: 'attendance-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['attendance-service:9093']

  - job_name: 'notification-web'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['notification-web:9094']

  # M13 G19 — RabbitMQ Prometheus plugin (rabbitmq_prometheus, port 15692).
  # Включается через image rabbitmq:3.13-management-alpine. Покрывает
  # alert'ы DLQBacklog / RabbitMQQueueBacklog / RabbitMQConnectionLost.
  - job_name: 'rabbitmq'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rabbitmq:15692']

  # M13 G20 — blackbox-exporter probe'ит публичный HTTPS endpoint
  # ruttrack.site. Экспортирует probe_ssl_earliest_cert_expiry для alert'а
  # SslCertExpiresSoon. Relabel-pattern из официальной blackbox docs:
  # __param_target = target из static_configs, instance label =
  # original target (для grouping в alerts), __address__ → blackbox-exporter
  # service.
  - job_name: 'blackbox-https'
    metrics_path: /probe
    params:
      module: [http_2xx]
    scrape_interval: 60s
    static_configs:
      - targets:
          - https://ruttrack.site
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
