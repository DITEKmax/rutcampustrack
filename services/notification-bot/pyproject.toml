[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "bot/grpc_client/*_pb2.py",
    "bot/grpc_client/*_pb2_grpc.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"bot/grpc_client/*_pb2.py" = ["E501", "F401", "E402", "F811", "I001"]
"bot/grpc_client/*_pb2_grpc.py" = ["E501", "F401", "E402", "F811", "F541", "I001"]

# Coverage diagnostics exclude generated gRPC stubs and bootstrap wiring.
[tool.coverage.run]
source = ["bot"]
omit = [
    "bot/grpc_client/*_pb2.py",
    "bot/grpc_client/*_pb2_grpc.py",
    "bot/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
