server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;
    charset utf-8;
    charset_types text/plain text/markdown text/css application/javascript application/json application/xml;
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }

    etag on;
    gzip_static on;
    gzip_vary on;
    # The TLS proxy uses HTTP/1.0 for its connection to this server.
    gzip_http_version 1.0;
    gzip_proxied any;

    # Every HTML entry point references the current build's asset hashes.
    location ~ (?:/|\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri ${uri}index.html =404;
    }

    location ~ "^/assets/[^/]+-[a-zA-Z0-9_-]{8}\.(m?js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ \.md$ {
        types { text/markdown md; }
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        types { application/xml xml; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ ^/(robots|llms)\.txt$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ \.gz$ {
        return 404;
    }

    location / {
        add_header Cache-Control "public, max-age=300";
        try_files $uri @landing_directory;
    }

    # Canonicalize existing directories with HTML pages, and keep missing URLs as 404.
    location @landing_directory {
        if (-f $document_root$uri/index.html) {
            return 301 $uri/$is_args$args;
        }
        return 404;
    }
}
