name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '.planning/**'
      - '*.md'
      - 'SECURITY.md'
      - 'renovate.json'
      - '.pre-commit-config.yaml'
  pull_request:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '.planning/**'
      - '*.md'
      - 'SECURITY.md'
      - 'renovate.json'
      - '.pre-commit-config.yaml'

jobs:
  java-unit-test:
    name: Java unit — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            path: ':services:api-gateway'
          - name: auth-service
            path: ':services:auth-service:auth-app'
          - name: academic-service
            path: ':services:academic-service:academic-app'
          - name: schedule-service
            path: ':services:schedule-service:schedule-app'
          - name: attendance-service
            path: ':services:attendance-service:attendance-app'
          - name: notification-service
            path: ':services:notification-service:notification-app'
          - name: mobile-bff
            path: ':services:mobile-bff:mobile-bff-app'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # M08 Группа 1 (P2-8/1) — только unit (*Test), БЕЗ *IT.
      # Быстрая jobs, блокирующая PR при базовых регрессиях.
      - name: Warm Gradle wrapper
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then
              exit 0
            fi
            echo "Gradle wrapper download failed, retrying in $((attempt * 10))s ($attempt/3)"
            sleep $((attempt * 10))
          done
          ./gradlew --version --no-daemon

      - name: Unit tests ${{ matrix.service.name }}
        id: java-tests
        run: ./gradlew ${{ matrix.service.path }}:test --no-daemon

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ matrix.service.name }}
          path: |
            services/**/build/reports/tests/test/
            services/**/build/test-results/test/
          retention-days: 7

      - name: Collect safe unit outcomes
        if: always()
        env:
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RCT_CI_EVENT_NAME: ${{ github.event_name }}
          RCT_CI_RUN_ID: ${{ github.run_id }}
          RCT_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          RCT_CI_JOB_ID: ${{ github.job }}
          RCT_CI_TEST_OUTCOME: ${{ steps.java-tests.outcome }}
        run: python3 scripts/collect-ci-test-outcomes.py --service '${{ matrix.service.name }}' --task test

      - name: Upload safe unit outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-unit-outcomes-${{ matrix.service.name }}-${{ github.run_attempt }}
          path: build/ci-test-outcomes/${{ matrix.service.name }}/test/safe-outcomes.json
          if-no-files-found: error
          retention-days: 7

  java-integration-test:
    name: Java IT — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    # Integration tests независимы от unit job'ов (separate pipelines,
    # fail-fast на уровне jobs). Параллельный запуск ускоряет wall-time.
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            path: ':services:api-gateway'
          - name: auth-service
            path: ':services:auth-service:auth-app'
          - name: academic-service
            path: ':services:academic-service:academic-app'
          - name: schedule-service
            path: ':services:schedule-service:schedule-app'
          - name: attendance-service
            path: ':services:attendance-service:attendance-app'
          - name: notification-service
            path: ':services:notification-service:notification-app'
          - name: mobile-bff
            path: ':services:mobile-bff:mobile-bff-app'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # M08 Группа 1 (P2-8/1) — только *IT (Spring context + Testcontainers).
      # Gradle filter в root build.gradle.kts.
      - name: Warm Gradle wrapper
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then
              exit 0
            fi
            echo "Gradle wrapper download failed, retrying in $((attempt * 10))s ($attempt/3)"
            sleep $((attempt * 10))
          done
          ./gradlew --version --no-daemon

      - name: Setup Python for Academic credential bridge
        if: matrix.service.name == 'academic-service'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            services/notification-bot/requirements.txt
            services/notification-bot/requirements-test.txt

      - name: Install isolated Academic credential bridge dependencies
        if: matrix.service.name == 'academic-service'
        run: |
          python -m venv "$RUNNER_TEMP/np01-python"
          "$RUNNER_TEMP/np01-python/bin/python" -m pip install -r services/notification-bot/requirements.txt -r services/notification-bot/requirements-test.txt
          echo "NP01_PYTHON_EXECUTABLE=$RUNNER_TEMP/np01-python/bin/python" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"

      - name: Verify one-off replacement regression rejects the previous implementation
        if: matrix.service.name == 'schedule-service'
        timeout-minutes: 8
        env:
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          umask 077
          source=services/schedule-service/schedule-app/src/main/java/ru/rutcampustrack/schedule/replacement/AssignmentReplacementService.java
          results=services/schedule-service/schedule-app/build/test-results/integrationTest
          reports=services/schedule-service/schedule-app/build/reports/integrationTest
          private=$(mktemp -d "$RUNNER_TEMP/oneoff-regression.XXXXXX")
          cp "$source" "$private/current.java"
          restore() {
            result=$?
            trap - EXIT
            cp "$private/current.java" "$source" || exit 1
            cmp --silent "$private/current.java" "$source" || exit 1
            if [ -d "$results" ]; then mv "$results" "$private/red-results"; fi
            if [ -d "$reports" ]; then mv "$reports" "$private/red-reports"; fi
            if [ -f "$private/verified.safe.json" ]; then
              mkdir -p build/ci-test-outcomes/schedule-service
              cp "$private/verified.safe.json" build/ci-test-outcomes/schedule-service/oneoff-regression-safe.json
            fi
            rm -rf -- "$private"
            exit "$result"
          }
          trap restore EXIT
          git fetch --quiet --no-tags --depth=1 origin 75cb5ed5ae8d731991a5efd447c611b0eb9f65da
          git show "75cb5ed5ae8d731991a5efd447c611b0eb9f65da:$source" > "$private/previous.java"
          printf '%s  %s\n' f4ed91a3f41286a379325ee172acbbf0af24b37050f00307eb5b95938d1b3482 "$private/previous.java" | sha256sum --check --status
          cp "$private/previous.java" "$source"
          set +e
          ./gradlew :services:schedule-service:schedule-app:integrationTest --no-daemon --tests 'ru.rutcampustrack.schedule.integration.AssignmentReplacementServiceIT.oneOffCloseAdoptThenNextDayReplacementPreservesHistoryAndReplay' > "$private/red.private.log" 2>&1
          red_exit=$?
          set -e
          python3 - "$private" "$red_exit" <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys, xml.etree.ElementTree as ET
          private = pathlib.Path(sys.argv[1])
          assert int(sys.argv[2]) != 0, 'Previous implementation must violate the rule'
          source = pathlib.Path('services/schedule-service/schedule-app/src/main/java/ru/rutcampustrack/schedule/replacement/AssignmentReplacementService.java')
          result = pathlib.Path('services/schedule-service/schedule-app/build/test-results/integrationTest/TEST-ru.rutcampustrack.schedule.integration.AssignmentReplacementServiceIT.xml')
          assert result.is_file() and result.stat().st_size <= 33554432
          data = result.read_bytes()
          assert b'<!DOCTYPE' not in data.upper() and b'<!ENTITY' not in data.upper()
          suite = ET.fromstring(data)
          cases = suite.findall('testcase')
          assert len(cases) == 1 and cases[0].get('name') == 'oneOffCloseAdoptThenNextDayReplacementPreservesHistoryAndReplay()'
          case = cases[0]
          assert not case.findall('error') and not case.findall('skipped') and len(case.findall('failure')) == 1
          failure = case.find('failure')
          assert failure.get('type') in {'org.opentest4j.AssertionFailedError', 'java.lang.AssertionError'}
          message = failure.get('message', '')
          assert '[one-off replacement moved count]' in message
          assert re.search(r'expected:\s*1L?\s+but was:\s*0L?(?:\s|$)', message), 'Failure must identify the missing one-off movement'
          proof = {'schemaVersion': 1, 'state': 'EXPECTED_ONE_OFF_MOVEMENT_FAILURE',
                   'producerHeadSha': os.environ['RCT_CI_PR_HEAD_SHA'],
                   'checkoutSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                   'previousRevision': '75cb5ed5ae8d731991a5efd447c611b0eb9f65da',
                   'previousSourceSha256': hashlib.sha256(source.read_bytes()).hexdigest(),
                   'restoredSourceSha256': hashlib.sha256((private / 'current.java').read_bytes()).hexdigest(),
                   'testMethod': 'oneOffCloseAdoptThenNextDayReplacementPreservesHistoryAndReplay',
                   'expectedMovedCount': 1, 'observedMovedCount': 0,
                   'tests': 1, 'failures': 1, 'errors': 0, 'skipped': 0}
          (private / 'verified.safe.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY

      - name: Upload safe one-off regression proof
        if: always() && matrix.service.name == 'schedule-service'
        uses: actions/upload-artifact@v4
        with:
          name: oneoff-regression-safe-${{ github.run_attempt }}
          path: build/ci-test-outcomes/schedule-service/oneoff-regression-safe.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify changed data regressions reject their counterexamples
        if: matrix.service.name == 'schedule-service' || matrix.service.name == 'attendance-service'
        timeout-minutes: 8
        env:
          RCT_CI_SERVICE: ${{ matrix.service.name }}
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          umask 077
          python3 - <<'PY_DOMAIN_RED'
          import hashlib, json, os, pathlib, re, shutil, subprocess, tempfile
          import xml.etree.ElementTree as ET

          service = os.environ['RCT_CI_SERVICE']
          assert service in {'schedule-service', 'attendance-service'}
          app = pathlib.Path('services') / service / (service.removesuffix('-service') + '-app')
          private = pathlib.Path(tempfile.mkdtemp(prefix='changed-domain-red-', dir=os.environ['RUNNER_TEMP']))
          results = app / 'build/test-results/integrationTest'
          reports = app / 'build/reports/integrationTest'
          current = {}
          proof = {'schemaVersion': 1, 'producerHeadSha': os.environ['RCT_CI_PR_HEAD_SHA'],
                   'checkoutSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                   'service': service, 'state': 'UNEXPECTED_RED_RESULT', 'phase': 'SOURCE_ADMISSION'}
          try:
              if service == 'schedule-service':
                  package = 'ru.rutcampustrack.schedule.lesson.LessonRoomChangeIT'
                  method = 'committedRoomProvenanceReachesSingleAndBatchGrpcWithoutInventingHistory'
                  test_source = app / 'src/test/java/ru/rutcampustrack/schedule/lesson/LessonRoomChangeIT.java'
                  previous = '4065cda44239af33cd9716273dc8e61d569b5261'
                  paths = {
                      app / 'src/main/java/ru/rutcampustrack/schedule/grpc/ScheduleGrpcServiceImpl.java':
                          '8150bf229736d323aac5e1a33c76b4727400996a05e6900416497436497920b6',
                      app / 'src/main/java/ru/rutcampustrack/schedule/lesson/LessonRoomWriter.java':
                          'cdca65ab8862a74efc1b68ef677532cf99963257826f4690e965fd06fb16e06e',
                  }
                  with (private / 'fetch.private.log').open('wb') as log:
                      subprocess.run(['git', 'fetch', '--quiet', '--no-tags', '--depth=1', 'origin', previous],
                                     stdout=log, stderr=subprocess.STDOUT, timeout=60, check=True)
                  replacements = {}
                  for path, expected in paths.items():
                      old = subprocess.check_output(['git', 'show', previous + ':' + path.as_posix()], timeout=30)
                      assert 0 < len(old) <= 1048576 and hashlib.sha256(old).hexdigest() == expected
                      replacements[path] = old
                  proof['counterexample'] = 'PREVIOUS_ROOM_PROJECTION'
                  proof['previousRevision'] = previous
              else:
                  package = 'ru.rutcampustrack.attendance.studentrequest.StudentRequestDomainIT'
                  method = 'headmanIncreasePreservesUsedAndHasOnePermanentExactReplayReceipt'
                  test_source = app / 'src/test/java/ru/rutcampustrack/attendance/studentrequest/StudentRequestDomainIT.java'
                  path = app / 'src/main/java/ru/rutcampustrack/attendance/studentrequest/StudentRequestService.java'
                  original = b'long increased = (long) before.limit() + command.increase();'
                  source = path.read_bytes()
                  assert source.count(original) == 1
                  replacements = {path: source.replace(original, b'long increased = (long) before.limit();')}
                  proof['counterexample'] = 'OMITTED_BUDGET_INCREMENT'
              for path in replacements:
                  assert subprocess.check_output(['git', 'status', '--porcelain', '--', str(path)]) == b''
                  current[path] = path.read_bytes()
              proof['testMethod'] = package + '.' + method
              proof['testSourceSha256'] = hashlib.sha256(test_source.read_bytes()).hexdigest()
              proof['restoredSourceSha256'] = {str(p): hashlib.sha256(v).hexdigest() for p, v in current.items()}
              proof['counterexampleSourceSha256'] = {str(p): hashlib.sha256(v).hexdigest() for p, v in replacements.items()}
              for source, name in [(results, 'previous-results'), (reports, 'previous-reports')]:
                  if source.exists():
                      shutil.move(source, private / name)
              for path, content in replacements.items():
                  path.write_bytes(content)
              proof['phase'] = 'RED_RUN'
              with (private / 'red.private.log').open('wb') as log:
                  run = subprocess.run(['./gradlew', ':services:' + service + ':' + app.name + ':integrationTest',
                                        '--no-daemon', '--tests', package + '.' + method],
                                       stdout=log, stderr=subprocess.STDOUT, timeout=360)
              proof['nativeExit'] = run.returncode
              assert run.returncode != 0
              proof['phase'] = 'XML_RULE'
              result = results / ('TEST-' + package + '.xml')
              assert result.is_file() and result.stat().st_size <= 33554432
              data = result.read_bytes()
              assert b'<!DOCTYPE' not in data.upper() and b'<!ENTITY' not in data.upper()
              cases = ET.fromstring(data).findall('testcase')
              assert len(cases) == 1 and cases[0].get('name') == method + '()'
              case = cases[0]
              assert not case.findall('error') and not case.findall('skipped') and len(case.findall('failure')) == 1
              failure = case.find('failure')
              assert failure.get('type') in {'org.opentest4j.AssertionFailedError', 'java.lang.AssertionError'}
              message = failure.get('message', '')
              if service == 'schedule-service':
                  assert re.search(r'expected:\s*true\s+but was:\s*false(?:\s|$)', message)
                  lines = test_source.read_text().splitlines()
                  target = 'assertThat(response.hasPreviousRoom()).isEqualTo(previous != null);'
                  assert sum(target in line for line in lines) == 1
                  line_number = next(i for i, line in enumerate(lines, 1) if target in line)
                  assert 'assertRoomProjection(LessonRoomChangeIT.java:' + str(line_number) + ')' in (failure.text or '')
                  proof.update(expectedPreviousRoomPresent=True, observedPreviousRoomPresent=False)
              else:
                  assert '[headman budget increased limit]' in message
                  assert re.search(r'expected:\s*7\s+but was:\s*5(?:\s|$)', message)
                  proof.update(expectedLimit=7, observedLimit=5)
              proof.update(state='EXPECTED_RULE_FAILURE', tests=1, failures=1, errors=0, skipped=0,
                           restoredGreen='REQUIRED_IN_FOLLOWING_ORDINARY_INTEGRATION_GATE')
          finally:
              for path, content in current.items():
                  path.write_bytes(content)
                  assert path.read_bytes() == content
              for source, name in [(results, 'red-results'), (reports, 'red-reports')]:
                  if source.exists():
                      shutil.move(source, private / name)
              output = pathlib.Path('build/ci-test-outcomes') / service
              output.mkdir(parents=True, exist_ok=True)
              (output / 'changed-domain-regression-safe.json').write_text(json.dumps(proof, indent=2) + '\n')
              shutil.rmtree(private)
          PY_DOMAIN_RED

      - name: Upload safe changed-domain regression proof
        if: always() && (matrix.service.name == 'schedule-service' || matrix.service.name == 'attendance-service')
        uses: actions/upload-artifact@v4
        with:
          name: changed-domain-regression-safe-${{ matrix.service.name }}-${{ github.run_attempt }}
          path: build/ci-test-outcomes/${{ matrix.service.name }}/changed-domain-regression-safe.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify persisted attendance enum HTTP refusal rejects the previous reader
        if: matrix.service.name == 'attendance-service'
        timeout-minutes: 8
        env:
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          umask 077
          python3 - <<'PY_ENUM_RED'
          import hashlib, json, os, pathlib, re, shutil, subprocess, tempfile
          import xml.etree.ElementTree as ET

          app = pathlib.Path('services/attendance-service/attendance-app')
          source = app / 'src/main/java/ru/rutcampustrack/attendance/config/MongoConvertersConfig.java'
          test_source = app / 'src/test/java/ru/rutcampustrack/attendance/integration/ReportIT.java'
          package = 'ru.rutcampustrack.attendance.integration.ReportIT'
          method = 'getLessonAttendance_unknownStoredStatusRefusesWithoutChangingKnownRows'
          description = 'unknown stored AttendanceStatus is a typed HTTP conflict'
          protected = b'''    @ReadingConverter
              static class AttendanceStatusReader implements Converter<String, AttendanceStatus> {
                  @Override
                  public AttendanceStatus convert(String source) {
                      try {
                          return AttendanceStatus.valueOf(source.toUpperCase(Locale.ROOT));
                      } catch (IllegalArgumentException exception) {
                          throw new ConflictException(UNKNOWN_STORED_CODE);
                      }
                  }
              }'''
          previous = b'''    @ReadingConverter
              static class AttendanceStatusReader implements Converter<String, AttendanceStatus> {
                  @Override
                  public AttendanceStatus convert(String source) {
                      return AttendanceStatus.valueOf(source.toUpperCase(Locale.ROOT));
                  }
              }'''
          private = pathlib.Path(tempfile.mkdtemp(prefix='attendance-enum-red-', dir=os.environ['RUNNER_TEMP']))
          results = app / 'build/test-results/integrationTest'
          reports = app / 'build/reports/integrationTest'
          original = None
          red_started = False
          proof = {'schemaVersion': 1, 'producerHeadSha': os.environ['RCT_CI_PR_HEAD_SHA'],
                   'checkoutSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                   'service': 'attendance-service', 'counterexample': 'PREVIOUS_ATTENDANCE_STATUS_READER',
                   'testMethod': package + '.' + method,
                   'state': 'UNEXPECTED_RED_RESULT', 'phase': 'SOURCE_ADMISSION'}
          try:
              for path in (source, test_source):
                  assert subprocess.check_output(['git', 'status', '--porcelain', '--', str(path)]) == b''
                  assert path.read_bytes() == subprocess.check_output(['git', 'show', 'HEAD:' + path.as_posix()])
              current = source.read_bytes()
              assert current.count(protected) == 1
              replacement = current.replace(protected, previous)
              assert replacement != current and replacement.count(previous) == 1
              lines = test_source.read_text().splitlines()
              assert sum(description in line for line in lines) == 1
              target = '.isEqualTo(HttpStatus.CONFLICT);'
              assert sum(target in line for line in lines) == 1
              assertion_line = next(i for i, line in enumerate(lines, 1) if target in line)
              assert not results.exists() and not reports.exists()
              proof.update(testSourceSha256=hashlib.sha256(test_source.read_bytes()).hexdigest(),
                           currentSourceSha256=hashlib.sha256(current).hexdigest(),
                           previousReaderSourceSha256=hashlib.sha256(replacement).hexdigest(),
                           protectedReaderSha256=hashlib.sha256(protected).hexdigest(),
                           previousReaderSha256=hashlib.sha256(previous).hexdigest())
              original = current
              source.write_bytes(replacement)
              assert source.read_bytes() == replacement
              proof['phase'] = 'RED_RUN'
              red_started = True
              with (private / 'red.private.log').open('wb') as log:
                  run = subprocess.run(['./gradlew', ':services:attendance-service:attendance-app:integrationTest',
                                        '--no-daemon', '--tests', package + '.' + method],
                                       stdout=log, stderr=subprocess.STDOUT, timeout=360)
              proof.update(nativeExit=run.returncode, directGradleProcessReaped=True)
              assert run.returncode != 0
              proof['phase'] = 'XML_RULE'
              result = results / ('TEST-' + package + '.xml')
              assert result.is_file() and result.stat().st_size <= 33554432
              data = result.read_bytes()
              assert b'<!DOCTYPE' not in data.upper() and b'<!ENTITY' not in data.upper()
              suite = ET.fromstring(data)
              assert all(suite.get(key) == value for key, value in
                         [('tests', '1'), ('failures', '1'), ('errors', '0'), ('skipped', '0')])
              cases = suite.findall('testcase')
              assert len(cases) == 1
              case = cases[0]
              assert case.get('classname') == package and case.get('name') == method + '()'
              assert not case.findall('error') and not case.findall('skipped') and len(case.findall('failure')) == 1
              failure = case.find('failure')
              assert failure.get('type') in {'org.opentest4j.AssertionFailedError', 'java.lang.AssertionError'}
              message = failure.get('message', '')
              assert '[' + description + ']' in message
              assert re.search(r'expected:\s*409 CONFLICT\s+but was:\s*500 INTERNAL_SERVER_ERROR(?:\s|$)', message)
              assert method + '(ReportIT.java:' + str(assertion_line) + ')' in (failure.text or '')
              proof.update(state='EXPECTED_RULE_FAILURE', expectedHttpStatus=409, observedHttpStatus=500,
                           knownPositiveBeforeRefusal='PASSED_BEFORE_THE_NAMED_ASSERTION',
                           tests=1, failures=1, errors=0, skipped=0,
                           restoredGreen='REQUIRED_IN_FOLLOWING_ORDINARY_INTEGRATION_GATE')
          finally:
              if original is not None:
                  source.write_bytes(original)
                  assert source.read_bytes() == original
                  proof['restoredSourceSha256'] = hashlib.sha256(source.read_bytes()).hexdigest()
              if red_started:
                  for path, name in [(results, 'red-results'), (reports, 'red-reports')]:
                      if path.exists():
                          shutil.move(path, private / name)
                  assert not results.exists() and not reports.exists()
              output = pathlib.Path('build/ci-test-outcomes/attendance-service')
              output.mkdir(parents=True, exist_ok=True)
              (output / 'attendance-enum-regression-safe.json').write_text(json.dumps(proof, indent=2) + '\n')
              shutil.rmtree(private)
          PY_ENUM_RED

      - name: Upload safe persisted attendance enum regression proof
        if: always() && matrix.service.name == 'attendance-service'
        uses: actions/upload-artifact@v4
        with:
          name: attendance-enum-regression-safe-${{ github.run_attempt }}
          path: build/ci-test-outcomes/attendance-service/attendance-enum-regression-safe.json
          if-no-files-found: error
          retention-days: 7

      - name: Integration tests ${{ matrix.service.name }}
        id: java-tests
        # Auth failed before tests while resolving compileProtoPath dependencies.
        # Refresh resolution metadata for this lane; keep the same task and gates.
        run: ./gradlew ${{ matrix.service.path }}:integrationTest --no-daemon ${{ matrix.service.name == 'auth-service' && '--refresh-dependencies' || '' }}

      - name: Upload integration test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports-${{ matrix.service.name }}
          path: |
            services/**/build/reports/integrationTest/
            services/**/build/test-results/integrationTest/
          retention-days: 7

      - name: Collect safe integration outcomes
        if: always()
        env:
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RCT_CI_EVENT_NAME: ${{ github.event_name }}
          RCT_CI_RUN_ID: ${{ github.run_id }}
          RCT_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          RCT_CI_JOB_ID: ${{ github.job }}
          RCT_CI_TEST_OUTCOME: ${{ steps.java-tests.outcome }}
        run: python3 scripts/collect-ci-test-outcomes.py --service '${{ matrix.service.name }}' --task integrationTest

      - name: Upload safe integration outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-integration-outcomes-${{ matrix.service.name }}-${{ github.run_attempt }}
          path: build/ci-test-outcomes/${{ matrix.service.name }}/integrationTest/safe-outcomes.json
          if-no-files-found: error
          retention-days: 7

  java-verification:
    name: Java verification (verifyNoDebugInProd + verifyLogbackJsonInAllServices)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Lightweight verification tasks (не зависит от тестов).
      - name: Warm Gradle wrapper
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then
              exit 0
            fi
            echo "Gradle wrapper download failed, retrying in $((attempt * 10))s ($attempt/3)"
            sleep $((attempt * 10))
          done
          ./gradlew --version --no-daemon

      - name: Run verification tasks
        run: ./gradlew verifyNoDebugInProd verifyLogbackJsonInAllServices --no-daemon

  python-lint-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            services/notification-bot/requirements.txt
            services/notification-bot/requirements-test.txt

      - name: Install dependencies
        run: |
          pip install ruff==0.17.0
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest tests/ -v

  mobile-vue-build-test:
    name: Mobile Vue workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'npm'
          cache-dependency-path: frontends/package-lock.json
      - name: Install, contract checks, type checks, worker checks, build
        working-directory: frontends
        run: |
          npm ci
          npm run generate:types:check
          npm run generate:auth-types:check
          npm run generate:academic-schedule-types:check
          npm run test:contract
          npm run typecheck:foundation
          npm run typecheck
          node --test pwa-vue/tests/*.test.mjs
          npm run build
  # M13 G15 — ShellCheck lint для всех bash-скриптов.
  # Gate на ошибки уровня `error` и `warning`; `info`/`style` не блочат.
  shellcheck:
    name: ShellCheck scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts/*.sh
        run: shellcheck --severity=warning scripts/*.sh

  # M13 G17 — структурная валидация Grafana dashboard JSON-файлов.
  # Catch'ит broken JSON / missing uid|title / 0 panels до VPS deploy.
  # Live smoke (non-zero данные) deferred в G23 VPS dry-run.
  grafana-dashboards:
    name: Grafana dashboards structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dashboards
        run: bash scripts/validate-grafana-dashboards.sh

  # Current PWA/TMA Vue auth against the isolated backend stack.
  recovery-files:
    name: Synthetic database and file recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RCT_FILES_RECOVERY_PROJECT: rct-recovery-files-${{ github.run_id }}-${{ github.run_attempt }}
      RCT_RECOVERY_PG_IMAGE: postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
      RCT_RECOVERY_MONGO_IMAGE: mongo@sha256:1f995ad6fdb93244a1addab1b58f934a0bc2f5643c38e02f5e9d7f0c7d227a7b
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
      - name: Set the disposable recovery working path
        timeout-minutes: 1
        run: printf 'RCT_FILES_RECOVERY_DIR=%s\n' "$RUNNER_TEMP/rct-files-recovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        timeout-minutes: 1
        with:
          python-version: '3.12'
      - name: Fetch the explicit recovery images
        timeout-minutes: 3
        run: |
          docker pull "$RCT_RECOVERY_PG_IMAGE"
          docker pull "$RCT_RECOVERY_MONGO_IMAGE"
      - name: Exercise the existing files-mode recovery drill
        timeout-minutes: 8
        run: |
          umask 077
          python3 scripts/test-recovery.py --work-dir "$RCT_FILES_RECOVERY_DIR" \
            --project-base "$RCT_FILES_RECOVERY_PROJECT" \
            --pg-image "$RCT_RECOVERY_PG_IMAGE" --mongo-image "$RCT_RECOVERY_MONGO_IMAGE"
      - name: Record closed resource diagnostics after failure
        timeout-minutes: 1
        if: failure()
        run: |
          python3 - <<'PY_RECOVERY_RESOURCE'
          import json, os, subprocess
          services = {'postgres-academic', 'postgres-schedule', 'mongo-attendance'}
          try:
              for suffix in ('-src', '-dst'):
                  project = os.environ['RCT_FILES_RECOVERY_PROJECT'] + suffix
                  ids = subprocess.check_output(['docker', 'ps', '-aq', '--filter',
                                                 'label=com.docker.compose.project=' + project], stderr=subprocess.PIPE, timeout=5).decode().split()
                  if len(ids) > 3:
                      raise SystemExit('Unexpected disposable recovery resource count')
                  for cid in ids:
                      info = json.loads(subprocess.check_output(['docker', 'inspect', cid], stderr=subprocess.PIPE, timeout=5))[0]
                      labels, state = info['Config']['Labels'], info['State']
                      service = labels.get('com.docker.compose.service')
                      if (labels.get('com.docker.compose.project') != project
                              or labels.get('io.rutcampustrack.recovery') != 'disposable' or service not in services):
                          raise SystemExit('Disposable recovery resource ownership mismatch')
                      print(json.dumps({'service': service, 'target': suffix == '-dst',
                                        'running': bool(state['Running']), 'oomKilled': bool(state['OOMKilled']),
                                        'exitCode': int(state['ExitCode']),
                                        'memoryLimit': int(info['HostConfig']['Memory'])}))
          except (subprocess.SubprocessError, OSError, ValueError, KeyError, TypeError):
              print('Closed recovery resource diagnostic unavailable; original failure retained')
          PY_RECOVERY_RESOURCE
      - name: Upload the existing closed recovery receipt
        timeout-minutes: 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: files-recovery-safe-${{ github.run_attempt }}
          path: ${{ env.RCT_FILES_RECOVERY_DIR }}/PASS.json
          if-no-files-found: warn
          retention-days: 7
      - name: Stop only the marked disposable recovery projects
        if: always()
        timeout-minutes: 3
        run: |
          if [ -f "$RCT_FILES_RECOVERY_DIR/owned-projects.json" ]; then
            python3 scripts/test-recovery.py --work-dir "$RCT_FILES_RECOVERY_DIR" \
              --project-base "$RCT_FILES_RECOVERY_PROJECT" --cleanup
          fi

  e2e-auth:
    name: Playwright E2E auth flow
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Record the actual PR checkout revision
        env:
          RCT_CHECKOUT_PRODUCER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          umask 077
          python3 - <<'PY_CHECKOUT'
          import json, os, re, subprocess
          from pathlib import Path

          checkout = subprocess.check_output(['git', 'rev-parse', 'HEAD'], timeout=10).decode().strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], timeout=10).decode().strip()
          producer = os.environ['RCT_CHECKOUT_PRODUCER']
          if not all(re.fullmatch('[0-9a-f]{40}', value) for value in (checkout, tree, producer)):
              raise SystemExit('Invalid checkout revision metadata')
          path = Path(os.environ['RUNNER_TEMP']) / 'rct-checkout.safe.json'
          with path.open('x') as stream:
              json.dump({'checkout_sha': checkout, 'tree_sha': tree, 'producer_head_sha': producer}, stream)
              stream.write('\n')
          PY_CHECKOUT
      - name: Upload the closed checkout revision
        uses: actions/upload-artifact@v4
        with:
          name: checkout-safe-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rct-checkout.safe.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare disposable FIRST3 clock and private artifacts
        env:
          RCT_E2E_TEACHING_CLOCK_DIR: ${{ runner.temp }}/rct-first3-clock-${{ github.run_id }}-${{ github.run_attempt }}
          RCT_FOCUS3_RUN: ${{ runner.temp }}/rct-first3-${{ github.run_id }}-${{ github.run_attempt }}
          RCT_FOCUS3_OBSERVATIONS: ${{ runner.temp }}/rct-first3-${{ github.run_id }}-${{ github.run_attempt }}/supervision/observations.safe.json
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_SYNTHETIC_SEED: 'true'
        run: |
          umask 077
          {
            printf 'RCT_E2E_TEACHING_CLOCK_DIR=%s\n' "$RCT_E2E_TEACHING_CLOCK_DIR"
            printf 'RCT_FOCUS3_RUN=%s\n' "$RCT_FOCUS3_RUN"
            printf 'RCT_FOCUS3_OBSERVATIONS=%s\n' "$RCT_FOCUS3_OBSERVATIONS"
          } >> "$GITHUB_ENV"
          mkdir -m 700 -- "$RCT_FOCUS3_RUN"
          mkdir -m 700 -- "$RCT_FOCUS3_RUN/artifacts" "$RCT_FOCUS3_RUN/supervision"
          chmod +x gradlew
          ./gradlew e2eClockFixtureJar e2eClockFixtureControl --no-daemon --max-workers=1
          python3 tests/e2e/fixtures/semester-effect-diagnostic.control.py
          (
            umask 022
            node tests/e2e/backend-clock/prepare-clock.mjs "$RCT_E2E_TEACHING_CLOCK_DIR" "$PWD/build/e2e-clock/clock-fixture.jar"
          )

      # M13 G25.3 — buildx нужен для BuildKit cache mount
      # (`--mount=type=cache,target=/root/.gradle` в backend Dockerfile'ах).
      # Default docker driver игнорирует cache mounts → каждый build
      # повторно скачивает Gradle dependencies (+5-10 мин на CI).
      # Frontend bundles — Docker multi-stage сам делает npm ci/build,
      # ничего pre-build не нужно.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # M13 G25.3 — self-signed TLS cert для reverse-proxy nginx.
      # AuthCookies.java выставляет `Secure` flag → на чистом HTTP browser
      # cookie отбрасывает → T1 spec падает. TLS termination на e2e nginx
      # обходит проблему без изменения production code.
      - name: Generate self-signed TLS cert
        run: bash tests/e2e/infra/scripts/generate-test-certs.sh

      - name: Boot isolated Vue auth stack
        run: |
          docker compose --env-file tests/e2e/.env.ci -p rct-e2e -f docker-compose.e2e.yml -f tests/e2e/infra/docker-compose.clock-fixture.yml config --quiet
          docker compose --env-file tests/e2e/.env.ci -p rct-e2e -f docker-compose.e2e.yml -f tests/e2e/infra/docker-compose.clock-fixture.yml up -d --build --wait --wait-timeout 480
          docker compose --env-file tests/e2e/.env.ci -p rct-e2e -f docker-compose.e2e.yml exec -T notification-web \
            sh -c 'test ! -e /keys/private.key && test ! -L /keys/private.key'
          printf '%s\n' 'PASS disposable Notification consumer has no signing private-key file'

      - name: Link synthetic Telegram teacher in the ephemeral database
        run: |
          docker compose --env-file tests/e2e/.env.ci -p rct-e2e -f docker-compose.e2e.yml exec -T postgres-academic \
            psql -U rct_user -d academic_db -v ON_ERROR_STOP=1 \
            < tests/e2e/infra/seed-telegram.sql

      - name: Install Playwright + browsers
        working-directory: tests/e2e
        run: |
          npm ci
          node check-admission-retry.mjs
          npx playwright install --with-deps chromium webkit

      # Worker script validation needs actual certificate trust, independently of page error handling.
      - name: Trust the disposable localhost certificate for Chromium workers
        id: e2e-ready
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libnss3-tools
          python3 - <<'PY_TRUST'
          import hashlib, os, re, ssl, stat, subprocess
          from pathlib import Path
          if os.environ.get('RUNNER_ENVIRONMENT') != 'github-hosted':
              raise SystemExit('Test certificate trust requires a disposable GitHub-hosted runner')
          cert = Path('tests/e2e/infra/certs/server.crt')
          info = cert.lstat()
          if not stat.S_ISREG(info.st_mode) or cert.is_symlink() or info.st_size > 16384:
              raise SystemExit('Expected bounded generated public test certificate')
          # Chromium M146+ uses this path, retaining an existing legacy database if present.
          legacy = Path.home() / '.pki/nssdb'
          database = legacy if legacy.exists() else Path.home() / '.local/share/pki/nssdb'
          if database.is_symlink():
              raise SystemExit('Test certificate database must not be a link')
          database.mkdir(parents=True, exist_ok=True, mode=0o700)
          nickname = 'rct-e2e-localhost-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          db_args = ['certutil', '-d', 'sql:' + str(database)]
          def run(args):
              result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=30)
              if result.returncode:
                  raise SystemExit('Disposable test certificate trust operation failed')
              return result.stdout
          if not (database / 'cert9.db').exists():
              run([*db_args, '-N', '--empty-password'])
          # Trust this self-signed server as a peer, not as a CA for other servers.
          run([*db_args, '-A', '-t', 'P,,', '-n', nickname, '-i', str(cert)])
          exported = run([*db_args, '-L', '-n', nickname, '-a']).decode('ascii')
          pem = re.search(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----', exported, re.S)
          if not pem or hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem[0])).digest() != hashlib.sha256(ssl.PEM_cert_to_DER_cert(cert.read_text())).digest():
              raise SystemExit('Disposable trusted certificate identity mismatch')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RCT_E2E_NSS_DB=' + str(database) + '\nRCT_E2E_NSS_NICKNAME=' + nickname + '\n')
          print('PASS exact disposable localhost peer certificate trusted; TLS validation retained')
          PY_TRUST

      - name: Run auth-flow @smoke specs (chromium only)
        working-directory: tests/e2e
        env:
          # M13 G25.3 — HTTPS через self-signed cert на reverse-proxy
          # nginx. ignoreHTTPSErrors=true в playwright.config.ts.
          E2E_BASE_URL: https://localhost:8443
          CI: 'true'
        run: npx playwright test specs/auth-token-lifecycle.spec.ts specs/mini-app.spec.ts --project=chromium --grep @smoke

      - name: Run accepted FIRST3 with closed diagnostics (chromium only)
        id: first3
        if: ${{ !cancelled() && steps.e2e-ready.outcome == 'success' }}
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_SYNTHETIC_SEED: 'true'
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
          NODE_OPTIONS: --max-old-space-size=512
          CI: 'true'
        run: |
          umask 077
          npx playwright test --config playwright.first3.config.ts --project=chromium

      # Only these canonical allowlisted producers may publish data from the seeded lane.
      # Never upload raw HTML, traces, screenshots, error contexts or Docker logs.
      - name: Upload safe FIRST3 outcomes and observations
        if: always() && steps.first3.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: first3-safe-${{ github.run_attempt }}
          path: |
            ${{ env.RCT_FOCUS3_RUN }}/artifacts/safe-results.json
            ${{ env.RCT_FOCUS3_RUN }}/supervision/observations-student.safe.json
            ${{ env.RCT_FOCUS3_RUN }}/supervision/observations-headman.safe.json
            ${{ env.RCT_FOCUS3_RUN }}/supervision/observations-helper.safe.json
          if-no-files-found: warn
          retention-days: 7

      - name: Run remaining five accepted mobile scenarios (chromium only)
        id: remaining5
        if: ${{ !cancelled() && steps.e2e-ready.outcome == 'success' }}
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_SYNTHETIC_SEED: 'true'
          RCT_E2E_REMAINING5: 'true'
          RCT_REMAINING5_RUN: ${{ runner.temp }}/rct-remaining5-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
          NODE_OPTIONS: --max-old-space-size=512
          CI: 'true'
        run: |
          umask 077
          printf 'RCT_REMAINING5_RUN=%s\n' "$RCT_REMAINING5_RUN" >> "$GITHUB_ENV"
          mkdir -m 700 -- "$RCT_REMAINING5_RUN"
          mkdir -m 700 -- "$RCT_REMAINING5_RUN/artifacts"
          npx playwright test --config playwright.real-mobile.config.ts --project=chromium --grep '(?:LIMITED ADMIN views accounts while creation is denied by UI and server|empty foreign-group homework and transport failure provide a real retry path|another live session revokes the browser session and recovery exposes login only|D003 reuse admits twice; suspended grant yields neutral bootstrap and protected denials|D003 signed HEADMAN TMA marks an isolated own-group roster row|warm offline reload remains read-only; revoked session reconnect clears the cached user|D002 reconnect rechecks changed grants and a late old feed cannot replace the new account|D002 TMA stays online-only beside a warm PWA snapshot)$'

      - name: Upload safe remaining five outcomes
        if: always() && steps.remaining5.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: remaining5-safe-${{ github.run_attempt }}
          path: ${{ env.RCT_REMAINING5_RUN }}/artifacts/safe-results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Trust the disposable localhost certificate for WebKit workers
        id: webkit-ready
        if: ${{ !cancelled() && steps.e2e-ready.outcome == 'success' }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test ! -e /usr/local/share/ca-certificates/rct-e2e-localhost.crt
          sudo install -m 644 -- tests/e2e/infra/certs/server.crt /usr/local/share/ca-certificates/rct-e2e-localhost.crt
          printf 'RCT_E2E_SYSTEM_CERT=%s\n' /usr/local/share/ca-certificates/rct-e2e-localhost.crt >> "$GITHUB_ENV"
          sudo update-ca-certificates

      - name: Run accepted admission and offline reconnect in actual WebKit
        id: webkit-subset
        timeout-minutes: 7
        if: ${{ !cancelled() && steps.webkit-ready.outcome == 'success' }}
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_SYNTHETIC_SEED: 'true'
          RCT_E2E_REMAINING5: 'true'
          RCT_E2E_WEBKIT_SUBSET: 'true'
          RCT_REMAINING5_RUN: ${{ runner.temp }}/rct-webkit-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
          NODE_OPTIONS: --max-old-space-size=512
          CI: 'true'
        run: |
          umask 077
          printf 'RCT_WEBKIT_RUN=%s\n' "$RCT_REMAINING5_RUN" >> "$GITHUB_ENV"
          mkdir -m 700 -- "$RCT_REMAINING5_RUN"
          mkdir -m 700 -- "$RCT_REMAINING5_RUN/artifacts"
          npx playwright test --config playwright.real-mobile.config.ts --project=webkit

      - name: Upload closed WebKit outcomes
        if: always() && steps.webkit-subset.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: webkit-safe-${{ github.run_attempt }}
          path: ${{ env.RCT_WEBKIT_RUN }}/artifacts/safe-results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Run the real production worker update and install logic
        id: worker-lifecycle
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.e2e-ready.outcome == 'success' }}
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_SYNTHETIC_SEED: 'true'
          RCT_E2E_REMAINING5: 'true'
          RCT_E2E_SW_LIFECYCLE: 'true'
          RCT_REMAINING5_RUN: ${{ runner.temp }}/rct-worker-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
          NODE_OPTIONS: --max-old-space-size=512
          CI: 'true'
        run: |
          umask 077
          printf 'RCT_WORKER_RUN=%s\n' "$RCT_REMAINING5_RUN" >> "$GITHUB_ENV"
          mkdir -m 700 -- "$RCT_REMAINING5_RUN"
          mkdir -m 700 -- "$RCT_REMAINING5_RUN/artifacts"
          npx playwright test --config playwright.real-mobile.config.ts --project=chromium

      - name: Upload closed worker lifecycle and install logic outcomes
        if: always() && steps.worker-lifecycle.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: worker-lifecycle-safe-${{ github.run_attempt }}
          path: ${{ env.RCT_WORKER_RUN }}/artifacts/safe-results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Run real Vue administrator account lifecycle
        id: admin-lifecycle
        if: ${{ !cancelled() && steps.e2e-ready.outcome == 'success' }}
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_SYNTHETIC_SEED: 'true'
          RCT_E2E_REMAINING5: 'true'
          RCT_E2E_ADMIN_LIFECYCLE: 'true'
          RCT_REMAINING5_RUN: ${{ runner.temp }}/rct-admin-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
          NODE_OPTIONS: --max-old-space-size=512
          CI: 'true'
        run: |
          umask 077
          printf 'RCT_ADMIN_LIFECYCLE_RUN=%s\n' "$RCT_REMAINING5_RUN" >> "$GITHUB_ENV"
          mkdir -m 700 -- "$RCT_REMAINING5_RUN"
