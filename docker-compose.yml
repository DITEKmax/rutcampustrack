version: "3.9"

services:
  # ============================================================
  # INFRASTRUCTURE
  # ============================================================

  postgres-academic:
    image: postgres:16
    container_name: rct-postgres-academic
    environment:
      POSTGRES_DB: academic_db
      POSTGRES_USER: rct_user
      POSTGRES_PASSWORD: ${POSTGRES_ACADEMIC_PASSWORD:-rct_dev_pass}
    expose:
      - "5432"
    volumes:
      - pg-academic-data:/var/lib/postgresql/data
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rct_user -d academic_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-schedule:
    image: postgres:16
    container_name: rct-postgres-schedule
    environment:
      POSTGRES_DB: schedule_db
      POSTGRES_USER: rct_user
      POSTGRES_PASSWORD: ${POSTGRES_SCHEDULE_PASSWORD:-rct_dev_pass}
      TZ: Europe/Moscow
    expose:
      - "5432"
    volumes:
      - pg-schedule-data:/var/lib/postgresql/data
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rct_user -d schedule_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-attendance:
    # M13 G7 (Option B) — bitnami mongodb для declarative replica set
    # setup. M13 G24-fix-3: bitnami/ → bitnamilegacy/ (Bitnami в Aug 2025
    # убрали versioned tags). Dev compose без digest-pin'а (acceptable
    # для local dev, prod compose pinned). TODO v0.1: возможный switch
    # на mongo:7-jammy + custom rs.initiate entrypoint script.
    image: bitnamilegacy/mongodb:7.0
    container_name: rct-mongo-attendance
    environment:
      # Replica set bootstrap — single-node rs0 (primary + 0 secondaries).
      MONGODB_REPLICA_SET_MODE: primary
      MONGODB_REPLICA_SET_NAME: rs0
      # keyFile gen из ${MONGODB_REPLICA_SET_KEY} env (openssl rand -base64 756).
      # В dev default — fixed placeholder (не prod!). Prod — из .env.prod.
      MONGODB_REPLICA_SET_KEY: ${MONGODB_REPLICA_SET_KEY:-rct_dev_replica_set_key_must_be_replaced_in_prod_environment_security}
      MONGODB_ROOT_USER: ${MONGO_ROOT_USER:-root}
      MONGODB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rct_dev_pass}
      # Дополнительные users создаются Bitnami automatically:
      # MONGODB_EXTRA_USERNAMES/PASSWORDS/DATABASES — comma-separated arrays.
      # Заменяет legacy init-mongo.js из M10 D2.
      MONGODB_EXTRA_USERNAMES: ${MONGO_USER:-rct_user},${MONGO_NOTIFICATION_USER:-rct_notification_user}
      MONGODB_EXTRA_PASSWORDS: ${MONGO_PASSWORD:-rct_dev_pass},${MONGO_NOTIFICATION_PASSWORD:-rct_dev_pass}
      MONGODB_EXTRA_DATABASES: attendance_db,notification_db
      # M13 G7 — advertise hostname для корректной связки primary в replica set.
      MONGODB_ADVERTISED_HOSTNAME: mongo-attendance
    expose:
      - "27017"
    volumes:
      - mongo-data:/bitnami/mongodb
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: rct-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-rct_dev_pass}
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-rct_dev_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rct-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rct_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rct_dev_pass}
    expose:
      - "5672"
      - "15672"  # Management UI — доступ через docker exec или SSH tunnel
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # OBSERVABILITY (M04 QA2 — local Tempo for tracing dev)
  # ============================================================

  tempo:
    image: grafana/tempo:2.3.1
    container_name: rct-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"  # HTTP — Grafana datasource (если запускаешь grafana локально)
      - "4317:4317"  # OTLP gRPC — приёмник spans (для clients, использующих gRPC exporter)
      - "4318:4318"  # OTLP HTTP/protobuf — Spring Boot Micrometer default (M16 G1)
    networks:
      - private_net
    restart: unless-stopped

  # M04 Группа 9 — Alertmanager (dev profile). Secret для webhook
  # hardcoded placeholder (в prod берётся из .env). Routes webhook в
  # notification-web:9094/internal/alert.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: rct-alertmanager
    environment:
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-dev_alert_secret}
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/alertmanager && \
        echo -n "$${ALERT_WEBHOOK_SECRET}" > /etc/alertmanager/secret && \
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager
    ports:
      - "9093:9093"
    networks:
      - private_net
    restart: unless-stopped

  # ============================================================
  # NOTIFICATION SERVICES
  # ============================================================

  document-renderer-service:
    build:
      context: .
      dockerfile: services/document-renderer-service/document-renderer-app/Dockerfile
    container_name: rct-document-renderer-service
    environment:
      GRPC_SECRET: ${GRPC_SECRET:-rct_dev_grpc_secret}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    expose:
      - "9095"
      - "19095"
    networks:
      - private_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9095/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  notification-web:
    build:
      context: ./services/notification-service/notification-app
      dockerfile: Dockerfile
    container_name: rct-notification-web
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-rct_user}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rct_dev_pass}
      JWT_PUBLIC_KEY_PATH: /keys/public.key
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:noreply@rut.ru}
      # M10 G1 D3 — отдельная БД notification_db + отдельный credential
      # MONGO_NOTIFICATION_USER (PoLP — D2).
      # M13 G7: ?replicaSet=rs0 для MongoTransactionManager multi-doc transactions.
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_NOTIFICATION_USER:-rct_notification_user}:${MONGO_NOTIFICATION_PASSWORD:-rct_dev_pass}@mongo-attendance:27017/notification_db?authSource=admin&replicaSet=rs0
      # M10 G1 D4 — retention для notification_history (дней).
      NOTIFICATION_HISTORY_TTL_DAYS: ${NOTIFICATION_HISTORY_TTL_DAYS:-30}
      # M04 QA2 — distributed tracing OTLP exporter (HTTP/protobuf, M16 G1: 4317→4318).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    volumes:
      - jwt-keys:/keys:ro
    expose:
      - "9094"
    networks:
      - private_net
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo-attendance:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9094/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  notification-bot:
    build:
      context: ./services/notification-bot
      dockerfile: Dockerfile
    container_name: rct-notification-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-placeholder}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-rct_user}:${RABBITMQ_PASSWORD:-rct_dev_pass}@rabbitmq:5672/
      ACADEMIC_GRPC_HOST: academic-service
      ACADEMIC_GRPC_PORT: "19091"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-rct_dev_pass}
      HEALTH_PORT: "8081"
      SCHEDULE_GRPC_HOST: schedule-service
      SCHEDULE_GRPC_PORT: "19092"
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: "9090"
      API_GATEWAY_URL: http://api-gateway:8080
      MINI_APP_URL: ${MINI_APP_URL:-https://t.me/RutTrackBot/checkin}
      # M04 Группа 7 — distributed tracing OTLP gRPC → tempo:4317.
      # M16 G1: бот использует opentelemetry.exporter.otlp.proto.grpc, остаётся на 4317.
      # Java-сервисы (Spring Micrometer) шлют HTTP/protobuf на 4318/v1/traces.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      # M04 Группа 9 — admin Telegram IDs (comma-separated) для alert.fired.
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-0}
      TZ: Europe/Moscow
    networks:
      - private_net
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================
  # PWA
  # ============================================================

  pwa-nginx:
    image: nginx:1.27-alpine
    container_name: rct-pwa-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontends/pwa/dist:/usr/share/nginx/html:ro
      - ./frontends/pwa/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - private_net
    restart: unless-stopped

  # ============================================================
  # MINI APP
  # ============================================================

  mini-app-nginx:
    image: nginx:1.27-alpine
    container_name: rct-mini-app-nginx
    ports:
      - "3000:80"
    volumes:
      - ./frontends/mini-app/dist:/usr/share/nginx/html:ro
      - ./frontends/mini-app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - private_net
    restart: unless-stopped

  # ============================================================
  # WEB PANEL
  # ============================================================

  web-panel-nginx:
    image: nginx:1.27-alpine
    container_name: rct-web-panel-nginx
    ports:
      - "4200:80"
    volumes:
      - ./frontends/web-panel/dist:/usr/share/nginx/html:ro
      - ./frontends/web-panel/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - private_net
    restart: unless-stopped

  # ============================================================
  # LANDING
  # ============================================================

  landing-nginx:
    image: nginx:1.27-alpine
    container_name: rct-landing-nginx
    ports:
      - "8081:80"
    volumes:
      - ./frontends/landing/dist:/usr/share/nginx/html:ro
      - ./frontends/landing/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - private_net
    restart: unless-stopped

networks:
  private_net:
    driver: bridge

volumes:
  pg-academic-data:
  pg-schedule-data:
  mongo-data:
  redis-data:
  rabbitmq-data:
  jwt-keys:
  tempo-data:
  alertmanager-data:
