server:
  port: 9091

spring:
  application:
    name: academic-service

  datasource:
    url: jdbc:postgresql://postgres-academic:5432/academic_db
    username: rct_user
    password: ${POSTGRES_ACADEMIC_PASSWORD:rct_dev_pass}
    driver-class-name: org.postgresql.Driver
    # M05 Группа 6 / P2-10/6 — HikariCP tuning. Значения обосновываются
    # в docs/performance/connection-pool-tuning.md (NEW-147). Пересматривать при
    # scale-out, read-replicas или росте концурренси > 30 req/s.
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:rct_dev_pass}

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:rct_user}
    password: ${RABBITMQ_PASSWORD:rct_dev_pass}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

grpc:
  server:
    port: 19091
  auth:
    secret: ${GRPC_SECRET:}
  client:
    # Phase 61 D-04: резолв пары по (group, date, lessonNumber) для валидации ДЗ
    schedule-service:
      address: static://schedule-service:19092
      negotiation-type: plaintext

rutcampustrack:
  security:
    # M14 G4 v2 (CSO HIGH-06): см. shared-web/RequiredSecretsValidator.java.
    required-env-vars: POSTGRES_ACADEMIC_PASSWORD,REDIS_PASSWORD,RABBITMQ_PASSWORD,GRPC_SECRET
    internal-jwt:
      # M03a: pull RSA public key from auth-service /auth/public-key.
      auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:9090}
      public-key-refresh-minutes: 60
      clock-skew-seconds: 30
      # M14 G1 (CSO CRIT-01): strict by default — downstream принимает ТОЛЬКО Internal JWT.
      # legacy X-User-* отключены, чтобы compromised peer container на private_net не мог
      # форджить admin claims. Для local dev можно явно включить через env-override.
      legacy-headers-enabled: ${RUTCAMPUSTRACK_SECURITY_LEGACY_HEADERS_ENABLED:false}

cache:
  ttl:
    groups: PT5M
    group-members: PT5M
    users: PT5M
    active-semester: PT10M
    campus-geofence: PT1H
    rbac: PT1M
    subject: PT10M

# M04 QA1: INFO-default для secure-by-default. DEBUG включается через
# application-dev.yml (SPRING_PROFILES_ACTIVE=dev) или env-override.
logging:
  level:
    ru.rutcampustrack: INFO
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # M04 QA6: always — partial degradation видна (DB/Rabbit/Redis/Mongo down).
      # /actuator/health не public, детали утекают только аутентифицированным.
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  info:
    git:
      enabled: true
      mode: full
    build:
      enabled: true
  # M04 QA2 (NEW-58/59) — distributed tracing OTel → Tempo.
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
