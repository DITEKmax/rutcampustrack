# Production config — HTTPS termination + reverse proxy
# Requires SSL certificate at /etc/letsencrypt/live/ruttrack.site/

# HTTP -> HTTPS redirect (NET-05)
server {
    listen 80;
    server_name _;

    # ACME challenge MUST come before redirect (Pitfall 3)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server (NET-01, NET-02)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/ruttrack.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruttrack.site/privkey.pem;
    ssl_dhparam         /etc/nginx/dhparam.pem;

    # TLS hardening — TLSv1.2 + TLSv1.3 only (no TLSv1.0/1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # M07 G12 HIGH-1: inline scripts вынесены в assets/js/ — script-src 'self' достаточно.
    # M13 G16: report-uri (legacy Firefox/Safari) + report-to (Chrome 97+).
    # connect-src 'self' уже разрешает POST на /api/csp-report в том же origin.
    # Endpoint документирован в docs/security-headers.md.
    # M15 hotfix: 'unsafe-hashes' + sha256 хеши Angular @angular/build:application
    # `inlineCritical: true` lazy-CSS pattern (`onload="this.media='all'"`).
    # Без этого CSP блокирует onload event handler → CSS не активируется → fallback
    # на browser-default fonts (Times New Roman). M16 follow-up: `inlineCritical: false`
    # в angular.json чтобы убрать onload вообще, тогда хеши не нужны.
    # sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc= = `this.media='all'`
    # (sha256 от точного value атрибута onload, base64-encoded)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; font-src 'self'; report-uri /api/csp-report; report-to csp-endpoint;" always;
    add_header Report-To '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"/api/csp-report"}]}' always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # --- M16 G5: runtime DNS resolution для internal upstream'ов ---
    # Без этого nginx резолвит DNS один раз при старте и кэширует IP. Когда
    # docker compose recreate'ит upstream-контейнер (api-gateway, web-panel-nginx,
    # grafana и т.д.), он получает новый IP, а nginx ходит в старый → 502.
    # Симптом: после каждого `docker compose up -d --no-deps <X>` или deploy.yml
    # пробежки upstream X отдаёт 502 пока не сделать `docker compose restart nginx`.
    #
    # Fix: указать Docker embedded DNS (127.0.0.11) с TTL 10s + использовать
    # переменные в proxy_pass (variable triggers runtime resolve вместо
    # boot-time). См. https://www.nginx.com/blog/dns-service-discovery-nginx-plus/
    # и docs/archive/future-ideas.md § «nginx DNS race».
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upstream variables — каждая используется в proxy_pass ниже. Имя
    # контейнера + порт (private_net DNS). Изменение имени контейнера
    # (rct-*) требует апдейта здесь.
    set $upstream_gateway     "rct-api-gateway:8080";
    set $upstream_landing     "rct-landing-nginx:80";
    set $upstream_pwa         "rct-pwa-nginx:80";
    set $upstream_mini_app    "rct-mini-app-nginx:80";
    set $upstream_web_panel   "rct-web-panel-nginx:80";
    set $upstream_grafana     "rct-grafana:3000";
    set $upstream_prometheus  "rct-prometheus:9090";
    set $upstream_alertmanager "rct-alertmanager:9093";

    # --- Block sensitive file/path access (return 404, not 403 to avoid info leak) ---
    location ~* ^/(\.env|\.git|docker-compose|\.htaccess|\.htpasswd|Dockerfile|\.dockerignore|\.npmrc|\.yarnrc|\.npmignore|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|Makefile|Vagrantfile|\.travis\.yml|\.circleci|\.github|\.gitlab-ci\.yml|\.well-known/(?!acme-challenge)) {
        return 404;
    }

    # --- WebSocket / STOMP (SockJS) for notification-web ---
    # M13 G18: proxy_buffering off — nginx по умолчанию буферизует
    # response chunks; для STOMP это задерживает heartbeat-фреймы и
    # event'ы пока buffer не заполнится. С buffering off каждый
    # фрейм идёт клиенту немедленно. proxy_read_timeout 86400s — idle
    # WebSocket'ы держатся до явного close (heartbeat 10s/10s в
    # WebSocketConfig + frontend keep'ит соединение alive).
    location /api/ws/ {
        proxy_pass http://$upstream_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # --- Excuse file upload: per-location 25m (M07 G11, P2-9/3) ---
    # Prefix-match выше generic /api/ даёт точечный лимит только для
    # multipart endpoint'а; остальные /api/* наследуют global 2m (nginx.conf).
    # Backend enforce'ит 20MB (Spring Boot), 25m здесь = +5m запас для
    # multipart boundary overhead.
    location /api/attendance/excuses/with-file {
        client_max_body_size 25m;
        proxy_pass http://$upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- CSP report endpoint: tight body cap для DoS защиты (M13 G24-fix-6 H2) ---
    # CSP violation report от browser'а — JSON ~200-800 bytes typically.
    # 8k достаточно для Reporting API batch (несколько отчётов в одном POST)
    # с reasonable safety margin. Без cap'а злоумышленник может слать
    # 1MB JSON-payload'ов 60 req/min/IP → CPU exhaustion на JSON parsing.
    location /api/csp-report {
        client_max_body_size 8k;
        proxy_pass http://$upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API Gateway: all /api/* traffic (NET-01) ---
    location /api/ {
        proxy_pass http://$upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Landing page at /presentation/ (LAND-v9-01, INFRA-v9-02) ---
    location /presentation/ {
        proxy_pass http://$upstream_landing/;
        proxy_set_header Host $host;
    }

    # --- React PWA at /app/ (INFRA-v9-03) ---
    location /app/ {
        proxy_pass http://$upstream_pwa/;
        proxy_set_header Host $host;
    }

    # --- Telegram Mini App (NET-02) ---
    location /mini-app/ {
        proxy_pass http://$upstream_mini_app/;
        proxy_set_header Host $host;
    }

    # --- Swagger UI (Phase 47 — DOC-01) — behind basic auth (IMP-05) ---
    location /swagger-ui.html {
        auth_basic "Dev Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://$upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/ {
        auth_basic "Dev Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://$upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        auth_basic "Dev Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://$upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi/ {
        auth_basic "Dev Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://$upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Grafana — behind basic auth ---
    location /grafana/ {
        auth_basic "Dev Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://$upstream_grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Security-Policy "" always;
    }

    # --- Prometheus UI (M13 G14) — behind basic auth ---
    # Prometheus scrapes внутри private_net (expose: 9090, не publish'ится).
    # Этот location открывает UI через TLS + basic-auth для on-call запросов
    # (PromQL, rule debug). `--web.external-url=/prometheus/` в
    # docker-compose.prod.yml:prometheus.command чтобы internal links
    # работали через prefix (иначе /graph ведёт на абсолютный /, без prefix).
    location /prometheus/ {
        auth_basic "Dev Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://$upstream_prometheus/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Prometheus UI не применяет CSP — nginx-level header'ы (из server
        # block'а) этого location не ломают. Специальный override не нужен.
    }

    # --- Alertmanager UI (M13 G14) — behind basic auth ---
    # Alertmanager UI для управления silences / просмотра firing alerts.
    # `--web.external-url=/alertmanager/` обязателен — без него UI пишет
    # absolute links без prefix'а и теряется через reverse-proxy.
    location /alertmanager/ {
        auth_basic "Dev Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://$upstream_alertmanager/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Root redirects to unified /login entry point (INFRA-v9-01) ---
    # /login is resolved by the web-panel Angular SPA (baseHref: /) via the
    # catch-all location / block below. Exact match = / wins over prefix /.
    location = / {
        return 301 /login;
    }

    # --- Web Panel SPA — catch-all (INFRA-v9-04, Phase 50) ---
    # MUST be the last prefix block; more specific prefixes (/api/, /app/,
    # /presentation/, /mini-app/, /swagger-ui*, /v3/api-docs, /openapi/)
    # above win by nginx prefix-match precedence. Exact-match `= /` above
    # still 301-redirects root to /login. This block serves the web-panel
    # SPA for /login, /admin/*, /teacher/*, /student/*, /headman/*.
    #
    # Cache policy: forward Cache-Control set by the inner web-panel nginx
    # (no-store for HTML, immutable for hashed bundles). proxy_pass already
    # passes through upstream headers; we only need to make sure no
    # `add_header` here clobbers them — proxy_hide_header is intentionally
    # NOT used so the SPA stays fully controlled by the inner config.
    location / {
        proxy_pass http://$upstream_web_panel/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
