worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Supplemental payload-free diagnostics. Original main log and proxy behavior stay intact.
    map $uri $rct_evidence_route {
        default OTHER;
        /api/auth/login AUTH_LOGIN;
        /api/auth/session AUTH_SESSION;
        / APP_ROOT;
        /app/ APP_ROOT;
    }
    map $request_method $rct_evidence_method {
        default OTHER;
        GET GET;
        POST POST;
        HEAD HEAD;
        OPTIONS OPTIONS;
    }
    log_format rct_http_evidence escape=json
        '{"schema":"RCT_HTTP_EDGE_V1","route":"$rct_evidence_route","method":"$rct_evidence_method",'
        '"status":$status,"time":"$time_iso8601","requestTime":"$request_time",'
        '"upstreamConnectTime":"$upstream_connect_time","upstreamHeaderTime":"$upstream_header_time",'
        '"upstreamResponseTime":"$upstream_response_time"}';
    access_log /dev/stdout rct_http_evidence;

    sendfile on;
    keepalive_timeout 65;

    map $uri $student_requests_cache_control {
        default "";
        ~^/api/v1/student/requests(?:/|$) "no-store";
    }

    client_max_body_size 2m;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
