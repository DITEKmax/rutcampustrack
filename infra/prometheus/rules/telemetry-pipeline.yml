groups:
- name: telemetry-pipeline
  rules:
  - alert: CadvisorContainerMetricsMissing
    expr: (up{job="cadvisor"} == 1) unless on(job,instance,environment)
      count by(job,instance,environment) (container_last_seen{job="cadvisor",name=~"rct-.*"} > time() - 60)
    for: 2m
    labels:
      severity: critical
      owner: platform
    annotations:
      summary: cAdvisor отвечает, но метрики контейнеров Docker отсутствуют
      description: Сбор по HTTP проходит, но метрики только по cgroups хоста не охватывают память, CPU и OOM приложений. Проверьте совместимость Docker и containerd и имена контейнеров, прежде чем полагаться на полноту данных на дашбордах.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: PrometheusProcessRestarted
    expr: changes(process_start_time_seconds{job="prometheus"}[15m]) > 0
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: Prometheus перезапустился за последние 15 мин.
      description: Проверьте число перезапусков контейнера, нагрузку на память и непрерывность приёма метрик. Сигнал основан на истории сбора метрик. Если раннего замера процесса нет, исключить перезапуск нельзя.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: PrometheusRuleEvaluationFailed
    expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
    for: 2m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: Сбой вычисления правил Prometheus — {{ $labels.job }} / {{ $labels.instance }}
      description: Возможны потери телеметрии, сбои вычисления правил или доставки и нехватка места в хранилище.
        Проверьте журналы компонента и квоты, прежде чем полагаться на полноту данных на дашбордах. Сохраните данные в
        постоянном хранилище.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: PrometheusNotificationFailed
    expr: increase(prometheus_notifications_errors_total[5m]) > 0
    for: 2m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: Сбой отправки уведомлений Prometheus — {{ $labels.job }} / {{ $labels.instance }}
      description: Возможны потери телеметрии, сбои вычисления правил или доставки и нехватка места в хранилище.
        Проверьте журналы компонента и квоты, прежде чем полагаться на полноту данных на дашбордах. Сохраните данные в
        постоянном хранилище.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: PrometheusReloadFailed
    expr: prometheus_config_last_reload_successful == 0
    for: 2m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: Не удалось перечитать конфигурацию Prometheus — {{ $labels.job }} / {{ $labels.instance }}
      description: Возможны потери телеметрии, сбои вычисления правил или доставки и нехватка места в хранилище.
        Проверьте журналы компонента и квоты, прежде чем полагаться на полноту данных на дашбордах. Сохраните данные в
        постоянном хранилище.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: PrometheusStorageCompactionFailed
    expr: increase(prometheus_tsdb_compactions_failed_total[5m]) > 0
    for: 2m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: Сбой уплотнения хранилища Prometheus — {{ $labels.job }} / {{ $labels.instance }}
      description: Возможны потери телеметрии, сбои вычисления правил или доставки и нехватка места в хранилище.
        Проверьте журналы компонента и квоты, прежде чем полагаться на полноту данных на дашбордах. Сохраните данные в
        постоянном хранилище.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: AlertmanagerNotificationFailed
    expr: increase(alertmanager_notifications_failed_total[5m]) > 0
    for: 2m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: Сбой отправки уведомлений Alertmanager — {{ $labels.job }} / {{ $labels.instance }}
      description: Возможны потери телеметрии, сбои вычисления правил или доставки и нехватка места в хранилище.
        Проверьте журналы компонента и квоты, прежде чем полагаться на полноту данных на дашбордах. Сохраните данные в
        постоянном хранилище.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: AlertmanagerReloadFailed
    expr: alertmanager_config_last_reload_successful == 0
    for: 2m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: Не удалось перечитать конфигурацию Alertmanager — {{ $labels.job }} / {{ $labels.instance }}
      description: Возможны потери телеметрии, сбои вычисления правил или доставки и нехватка места в хранилище.
        Проверьте журналы компонента и квоты, прежде чем полагаться на полноту данных на дашбордах. Сохраните данные в
        постоянном хранилище.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: LokiIngestDiscarded
    expr: sum by (job, environment, reason) (increase(loki_discarded_samples_total[5m])) > 0
    for: 2m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: Loki отбрасывает данные при приёме — {{ $labels.job }} / {{ $labels.instance }}
      description: Возможны потери телеметрии, сбои вычисления правил или доставки и нехватка места в хранилище.
        Проверьте журналы компонента и квоты, прежде чем полагаться на полноту данных на дашбордах. Сохраните данные в
        постоянном хранилище.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: AlloyLogDeliveryDropped
    expr: sum by (job, environment, reason) (increase(loki_write_dropped_entries_total[5m])) > 0
    for: 2m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: Alloy отбрасывает записи при отправке журналов — {{ $labels.job }} / {{ $labels.instance }}
      description: Возможны потери телеметрии, сбои вычисления правил или доставки и нехватка места в хранилище.
        Проверьте журналы компонента и квоты, прежде чем полагаться на полноту данных на дашбордах. Сохраните данные в
        постоянном хранилище.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: TempoSpansDiscarded
    expr: sum by (job, environment, reason) (increase(tempo_discarded_spans_total[5m])) > 0
    for: 2m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: Tempo отбрасывает спаны трассировок — {{ $labels.job }} / {{ $labels.instance }}
      description: Возможны потери телеметрии, сбои вычисления правил или доставки и нехватка места в хранилище.
        Проверьте журналы компонента и квоты, прежде чем полагаться на полноту данных на дашбордах. Сохраните данные в
        постоянном хранилище.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: FilesystemInodesLow
    expr: (node_filesystem_files_free{fstype=~"ext4|xfs|btrfs"} / node_filesystem_files{fstype=~"ext4|xfs|btrfs"} < 0.10)
      and node_filesystem_files > 0
    for: 2m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: На файловой системе свободно менее 10% inode — {{ $labels.job }} / {{ $labels.instance }}
      description: Возможны потери телеметрии, сбои вычисления правил или доставки и нехватка места в хранилище.
        Проверьте журналы компонента и квоты, прежде чем полагаться на полноту данных на дашбордах. Сохраните данные в
        постоянном хранилище.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: FilesystemHeadroomLow
    expr: (node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} < 4 * 1024 * 1024 * 1024)
      and (node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"} < 0.10)
      and (node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"} > 0)
    for: 2m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: На файловой системе свободно менее 4 ГиБ и менее 10% места — {{ $labels.job }} / {{ $labels.instance }}
      description: Возможны потери телеметрии, сбои вычисления правил или доставки и нехватка места в хранилище.
        Проверьте журналы компонента и квоты, прежде чем полагаться на полноту данных на дашбордах. Сохраните данные в
        постоянном хранилище.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: ReportProcessingFailed
    expr: attendance_report_last_failure_timestamp_seconds > 0 and time() - attendance_report_last_failure_timestamp_seconds
      < 300
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: Сбой обработки отчёта {{ $labels.report }} / {{ $labels.format }}
      description: Произошёл сбой обработки допустимого запроса на отчёт или исчерпан лимит приёма задач. Ожидаемые
        отклонения с кодами 400/403/422 не обновляют эту метрику. Первое событие видно даже до второго замера счётчика.
        Проверьте разрешённые к просмотру идентификаторы запроса и трассировки. См. инструкцию по отчётам и DLQ.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/runbooks/dlq-triage.md
- name: business-producer-alerts
  rules:
  - record: rct_sli:export_bad_ratio5m
    expr: clamp_min(1 - sum by(job,instance,environment,kind) (rate(rct_export_jobs_duration_seconds_bucket{outcome="success",le="60.0"}[5m])) / sum by(job,instance,environment,kind)
      (rate(rct_export_jobs_terminal_total{outcome=~"success|failure"}[5m])),0)
  - record: rct_sli:export_bad_ratio1h
    expr: clamp_min(1 - sum by(job,instance,environment,kind) (rate(rct_export_jobs_duration_seconds_bucket{outcome="success",le="60.0"}[1h])) / sum by(job,instance,environment,kind)
      (rate(rct_export_jobs_terminal_total{outcome=~"success|failure"}[1h])),0)
  - alert: ExportJobTerminalFailure
    expr: (max by(job,environment,kind,reason) (rct_export_jobs_failures and on(job,instance,environment) (rct_export_jobs_snapshot_timestamp_seconds >
      time() - 30)) > 0) or (rct_export_jobs_last_failure_timestamp_seconds > time() - 300)
    for: 0m
    labels:
      severity: critical
      owner: platform
    annotations:
      summary: Задача экспорта завершилась ошибкой
      description: Свежий снимок ERROR показывает сохранённый окончательный результат задачи. Метка времени последнего
        сбоя процесса фиксирует первую наблюдаемую окончательную ошибку и сбрасывается при перезапуске. Сохранённое
        состояние ERROR учитывается и после перезапуска. Отклонённые запросы и отказы в доступе исключены. Проверьте
        состояние задачи и связанные журналы. Не удаляйте сохранённые задачи.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: ExportJobDeadlineExceeded
    expr: max by(job,environment,kind) (rct_export_jobs_oldest_nonterminal_age_seconds and on(job,instance,environment) (rct_export_jobs_snapshot_timestamp_seconds
      > time() - 30)) > 60
    for: 0m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: Принятая задача экспорта выполняется дольше 60 с
      description: Время отсчитывается с момента сохранения принятой задачи и включает ожидание в очереди между
        повторными попытками. Проверьте состояния ready/error/queued/preparing и загрузку обработчиков.
        Сохраните принятые задачи.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: ExportJobLeaseStuck
    expr: max by(job,environment,kind) (rct_export_jobs_stuck_leases and on(job,instance,environment) (rct_export_jobs_snapshot_timestamp_seconds > time()
      - 30)) > 0
    for: 1m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: У задачи экспорта в состоянии running истёк срок аренды
      description: Свежий снимок общей БД показывает задачи в состоянии running с истёкшей арендой. Проверьте
        автоматический повторный захват и восстановление в пределах установленных лимитов, а также доступность
        зависимостей. Избегайте дублирующего ручного запуска.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: ExportJobSnapshotStale
    expr: (time() - rct_export_jobs_snapshot_timestamp_seconds) > 30
    for: 1m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: Снимок состояния задач экспорта устарел
      description: SQL-снимок, запланированный каждые 5 с, не обновлялся более 30 с. Метрики очереди и возраста задач
        исключаются при устаревшем снимке, поэтому нулевое значение не гарантирует отсутствия задач. Проверьте
        подключение к БД и snapshot_failures_total.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: NotificationBotTaskDown
    expr: notification_bot_task_alive{task=~"watchdog|polling"} == 0 or notification_bot_consumer_connected == 0
    for: 1m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: Задача или потребитель бота уведомлений остановились
      description: Метрика состояния задачи или потребителя равна нулю. Уведомления в очереди ещё не доставлены.
        Проверьте журналы задачи, подключение к брокеру и восстановление через watchdog.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: NotificationBotStartupFailed
    expr: notification_bot_keyboard_sync_registry_available != 1 or notification_bot_keyboard_sync_catalog_available != 1 or (time() - notification_bot_keyboard_sync_snapshot_timestamp_seconds) > 60 or notification_bot_task_alive{task="keyboard_sync"} == 0
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: Недоступна проверка восстановления клавиатур бота уведомлений
      description: Недоступны сохранённый реестр, источник данных о получателях, обработчик восстановления или снимок состояния. Завершение задачи само по себе не подтверждает доставку клавиатуры. Алерт закроется после восстановления работоспособности.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: NotificationBotKeyboardSyncUsersFailed
    expr: notification_bot_keyboard_sync_pending > 0
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: Синхронизация клавиатур бота уведомлений ещё не подтверждена
      description: Для части получателей ещё нужно подтвердить область доступа по основному источнику, получить подтверждение Telegram (ACK) и сохранить отметку о доставке. Периодическая задача повторяет попытки с увеличением интервала. Алерт закроется, когда ожидающих получателей не останется. Счётчики прошлых ошибок не сбрасываются. Чаты без привязки или без возможности доставки учитываются отдельно, когда попытки завершены.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: NotificationBotSendExhausted
    expr: notification_bot_send_tasks_exhausted_total > 0
    for: 0m
    labels:
      severity: critical
      owner: platform
    annotations:
      summary: Бот уведомлений исчерпал попытки отправки
      description: Счётчик процесса учитывает задачи отправки, исчерпавшие повторные попытки. Подтверждение доставки
        пользователю учитывается отдельно. Абсолютное значение позволяет заметить первый сбой ещё до первого сбора
        метрик. Счётчик сбрасывается при перезапуске процесса. Проверьте сохранённое состояние брокера и DLQ.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: ExportJobBudgetBurnFast
    expr: rct_sli:export_bad_ratio5m > (14.4 * 0.005) and rct_sli:export_bad_ratio1h > (14.4 * 0.005) and (sum by(job,instance,environment,kind) (increase(rct_export_jobs_terminal_total{outcome=~"success|failure"}[5m]))
      >= 20)
    for: 2m
    labels:
      severity: critical
      owner: platform
    annotations:
      summary: Быстро расходуется бюджет ошибок экспорта (99,5% задач за 60 с)
      description: В расчёт один раз входит зафиксированный итог каждой задачи — успех или ошибка. Успехом считается
        завершение за 60 с с учётом ожидания в очереди и повторных попыток. Ожидаемые отказы в доступе или по размеру и
        внутренние повторы исключены. При низком трафике данных недостаточно, значение может быть NaN. Для отдельных
        окончательных сбоев и превышения возраста принятой задачи есть свои алерты.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
- name: export-slo-window-rollup
  interval: 30m
  rules:
  - record: rct_sli:export_scrape_complete30m
    expr: (min by(job,environment)(min_over_time(up{job="academic-service",environment="production"}[30m])) == 1) and on(job,environment) (min by(job,environment)(count_over_time(up{job="academic-service",environment="production"}[30m]))
      >= 120) and on(job,environment) (count by(job,environment)(up{job="academic-service",environment="production"}) == count by(job,environment)(rct_expected_target{job="academic-service",environment="production"}))
  - record: rct_sli:export_eligible_events30m
    expr: sum by(job,environment,kind)(increase(rct_export_jobs_terminal_total{job="academic-service",environment="production",outcome=~"success|failure"}[30m]))
  - record: rct_sli:export_good_events30m
    expr: sum by(job,environment,kind)(increase(rct_export_jobs_duration_seconds_bucket{job="academic-service",environment="production",outcome="success",le="60.0"}[30m]))
  - record: rct_sli:export_window_timestamp_seconds
    expr: time() + 0 * ((min by(job,environment,kind)(count_over_time(rct_export_jobs_terminal_total{job="academic-service",environment="production",outcome=~"success|failure"}[30m]))
      >= 120) and on(job,environment,kind) (min by(job,environment,kind)(count_over_time(rct_export_jobs_duration_seconds_bucket{job="academic-service",environment="production",outcome="success",le="60.0"}[30m]))
      >= 120) and on(job,environment) rct_sli:export_scrape_complete30m)
- name: export-slo-long-window
  interval: 1m
  rules:
  - record: rct_sli:export_source_coverage_seconds30d
    expr: time() - min_over_time(rct_sli:export_window_timestamp_seconds[29d23h59m59s])
  - record: rct_sli:export_source_samples30d
    expr: count_over_time(rct_sli:export_window_timestamp_seconds[29d23h59m59s])
  - record: rct_sli:export_good_fraction30d
    expr: (sum_over_time(rct_sli:export_good_events30m[29d23h59m59s]) / sum_over_time(rct_sli:export_eligible_events30m[29d23h59m59s])) and on(job,environment,kind)
      (rct_sli:export_source_coverage_seconds30d >= 2590200) and on(job,environment,kind) (rct_sli:export_source_samples30d >= 1440)
