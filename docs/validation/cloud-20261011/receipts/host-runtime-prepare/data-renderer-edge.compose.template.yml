# SOURCE TEMPLATE ONLY: no startup grant/current artifact freeze. Credentials must be NEW own synthetic env.
name: rct-client-host-current
services:
  postgres-academic:
    image: sha256:275447c94b11b151decd1f29877965301d5a77032037c46de93d990f739f00a9
    environment:
      POSTGRES_DB: academic_db
      POSTGRES_USER: rct_user
      POSTGRES_PASSWORD: ${POSTGRES_ACADEMIC_PASSWORD}
    expose:
    - '5432'
    networks:
    - private_net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U rct_user -d academic_db
      interval: 10s
      timeout: 5s
      retries: 5
    pull_policy: never
    mem_limit: 384m
    cpus: '1.0'
    ports:
    - 127.0.0.1:28432:5432
    volumes:
    - owned-postgres-academic:/var/lib/postgresql/data
  postgres-schedule:
    image: sha256:275447c94b11b151decd1f29877965301d5a77032037c46de93d990f739f00a9
    environment:
      POSTGRES_DB: schedule_db
      POSTGRES_USER: rct_user
      POSTGRES_PASSWORD: ${POSTGRES_SCHEDULE_PASSWORD}
      TZ: Europe/Moscow
    expose:
    - '5432'
    networks:
    - private_net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U rct_user -d schedule_db
      interval: 10s
      timeout: 5s
      retries: 5
    pull_policy: never
    mem_limit: 384m
    cpus: '1.0'
    ports:
    - 127.0.0.1:28433:5432
    volumes:
    - owned-postgres-schedule:/var/lib/postgresql/data
  mongo-attendance:
    image: sha256:cc6e50c173ff2cf38ffb812fb582450e9b40fc1f67eadd63e81071f18fc8cc96
    environment:
      MONGODB_REPLICA_SET_MODE: primary
      MONGODB_REPLICA_SET_NAME: rs0
      MONGODB_REPLICA_SET_KEY: ${MONGODB_REPLICA_SET_KEY}
      MONGODB_ROOT_USER: ${MONGO_ROOT_USER}
      MONGODB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGODB_ADVERTISED_HOSTNAME: mongo-attendance
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_NOTIFICATION_USER: ${MONGO_NOTIFICATION_USER}
      MONGO_NOTIFICATION_PASSWORD: ${MONGO_NOTIFICATION_PASSWORD}
    expose:
    - '27017'
    networks:
    - private_net
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - db.adminCommand('ping').ok
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    pull_policy: never
    mem_limit: 768m
    cpus: '1.0'
    ports:
    - 127.0.0.1:28417:27017
    volumes:
    - owned-mongo-attendance:/bitnami/mongodb
    - type: bind
      source: /workspace/rutcampustrack/infra/mongo/init-mongo.js
      target: /docker-entrypoint-initdb.d/init-mongo.js
      read_only: true
      bind:
        create_host_path: false
  redis:
    image: sha256:f84b0c4678011602b9b98c227a4dcd5468bf8b088b02fdd4165cb7758bad8058
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    expose:
    - '6379'
    networks:
    - private_net
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD}
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    pull_policy: never
    mem_limit: 128m
    cpus: '1.0'
    ports:
    - 127.0.0.1:28379:6379
    volumes:
    - owned-redis:/data
  rabbitmq:
    image: sha256:1031d41f3f1611f61f0fe9011e26201967f460f93f96f92d5be0e823d59e7541
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    expose:
    - '5672'
    networks:
    - private_net
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    pull_policy: never
    mem_limit: 768m
    cpus: '1.0'
    ports:
    - 127.0.0.1:28672:5672
    volumes:
    - owned-rabbitmq:/var/lib/rabbitmq
  document-renderer-service:
    image: sha256:cdb912dd9171d42e2af4c677e2adfbb2a923621be23556f731fd7193d3cfa22f
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GRPC_SECRET: ${GRPC_SECRET}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=30.0 -XX:+UseG1GC
    expose:
    - '9095'
    - '19095'
    networks:
    - private_net
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9095/actuator/health/liveness || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    pull_policy: never
    mem_limit: 1024m
    cpus: '0.5'
    ports:
    - 127.0.0.1:19095:19095
  pwa-nginx:
    image: sha256:6769dc3a703c719c1d2756bda113659be28ae16cf0da58dd5fd823d6b9a050ea
    expose:
    - '80'
    networks:
    - private_net
    pull_policy: never
    mem_limit: 128m
    cpus: '1.0'
    volumes:
    - type: bind
      source: /workspace/scratch/rct-validation/host_runtime_prepare/runtime/frontend/pwa-vue/dist
      target: /usr/share/nginx/html
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /workspace/rutcampustrack/frontends/pwa-vue/nginx.conf
      target: /etc/nginx/conf.d/default.conf
      read_only: true
      bind:
        create_host_path: false
  mini-app-nginx:
    image: sha256:6769dc3a703c719c1d2756bda113659be28ae16cf0da58dd5fd823d6b9a050ea
    expose:
    - '80'
    networks:
    - private_net
    pull_policy: never
    mem_limit: 128m
    cpus: '1.0'
    volumes:
    - type: bind
      source: /workspace/scratch/rct-validation/host_runtime_prepare/runtime/frontend/tma-vue/dist
      target: /usr/share/nginx/html
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /workspace/rutcampustrack/frontends/tma-vue/nginx.conf
      target: /etc/nginx/conf.d/default.conf
      read_only: true
      bind:
        create_host_path: false
  nginx:
    image: sha256:6769dc3a703c719c1d2756bda113659be28ae16cf0da58dd5fd823d6b9a050ea
    ports:
    - 127.0.0.1:28488:80
    - 127.0.0.1:8443:443
    networks:
      private_net:
        ipv4_address: 172.29.84.10
    pull_policy: never
    mem_limit: 128m
    cpus: '1.0'
    extra_hosts:
      api-gateway: 172.29.84.1
    volumes:
    - type: bind
      source: /workspace/rutcampustrack/tests/e2e/infra/nginx/nginx.conf
      target: /etc/nginx/nginx.conf
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /workspace/rutcampustrack/tests/e2e/infra/nginx/default.conf
      target: /etc/nginx/conf.d/default.conf
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /workspace/scratch/rct-validation/host_runtime_prepare/runtime/tls/edge
      target: /etc/nginx/certs
      read_only: true
      bind:
        create_host_path: false
    depends_on:
      pwa-nginx:
        condition: service_started
      mini-app-nginx:
        condition: service_started
networks:
  private_net:
    name: rct-client-host-current_private_net
    driver: bridge
    ipam:
      config:
      - subnet: 172.29.84.0/24
        gateway: 172.29.84.1
        ip_range: 172.29.84.128/25
volumes:
  owned-postgres-academic:
    name: rct-client-host-current_owned-postgres-academic
  owned-postgres-schedule:
    name: rct-client-host-current_owned-postgres-schedule
  owned-mongo-attendance:
    name: rct-client-host-current_owned-mongo-attendance
  owned-redis:
    name: rct-client-host-current_owned-redis
  owned-rabbitmq:
    name: rct-client-host-current_owned-rabbitmq
