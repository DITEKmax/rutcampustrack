server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Entry point — must not be cached so users always get fresh asset hashes
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Static assets (JS/CSS with content hash) — cache aggressively
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static site — return 404 for missing files (no SPA fallback)
    location / {
        try_files $uri $uri/ =404;
    }
}
