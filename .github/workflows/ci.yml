              pass
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('restorationSucceeded=' + str(restored).lower() + '\n')
          print('Semester reconciliation restoration gate: ' + ('RESTORED' if restored else 'UNPROVEN'))
          if not restored:
              raise SystemExit(1)
          PY_RECONCILIATION_GATE
          then
            if [ "$case_exit" -ne 0 ]; then exit "$case_exit"; fi
            exit 1
          fi
          exit "$case_exit"

      - name: Upload closed semester reconciliation outcome
        if: always() && steps.semester-reconciliation.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: semester-reconciliation-safe-${{ github.run_attempt }}
          path: |
            ${{ env.RCT_SEMESTER_RECONCILIATION_RUN }}/artifacts/safe-results.json
            ${{ env.RCT_SEMESTER_RECONCILIATION_RUN }}/reconciliation.safe.json
          if-no-files-found: warn
          retention-days: 7

      - name: Record a closed exception hint after the failed archived lesson report
        if: ${{ !cancelled() && steps.semester-reconciliation.outcome == 'failure' }}
        timeout-minutes: 1
        env:
          RCT_HTTP500_DIAGNOSTIC_STAGE: REPORT500
          RCT_E2E_SYNTHETIC_SEED: 'true'
        run: *closed-http500-diagnostic

      - name: Restore a real application checkpoint into fresh disposable databases
        id: application-recovery
        timeout-minutes: 12
        if: ${{ matrix.group == 'lifecycle' && !cancelled() && steps.e2e-ready.outcome == 'success' && steps.assignment-lifecycle.outputs.restorationSucceeded == 'true' && steps.semester-reconciliation.outputs.restorationSucceeded == 'true' && steps.lesson-lifecycle.outputs.clockReady == 'true' }}
        env:
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_SYNTHETIC_SEED: 'true'
          RCT_APP_RECOVERY_RUN: ${{ runner.temp }}/rct-application-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          RCT_APP_RECOVERY_PROJECT: rct-recovery-${{ github.run_id }}-${{ github.run_attempt }}-dst
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/tests/e2e/infra/certs/server.crt
          SSL_CERT_FILE: ${{ github.workspace }}/tests/e2e/infra/certs/server.crt
          NODE_OPTIONS: --max-old-space-size=512
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
        run: |
          umask 077
          printf 'RCT_APP_RECOVERY_RUN=%s\nRCT_APP_RECOVERY_PROJECT=%s\n' "$RCT_APP_RECOVERY_RUN" "$RCT_APP_RECOVERY_PROJECT" >> "$GITHUB_ENV"
