            build/ci-test-outcomes/schedule-service/openapi-generated/schedule.json
            build/ci-test-outcomes/schedule-service/openapi-generated/generation.safe.json
          if-no-files-found: error
          retention-days: 7

      - name: Generate the official Notification OpenAPI candidate after an exact snapshot drift
        id: notification-openapi-candidate
        if: ${{ !cancelled() && matrix.service.name == 'notification-service' && steps.java-tests.outcome == 'failure' }}
        timeout-minutes: 8
        env:
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          umask 077
          python3 - <<'PY_NOTIFICATION_OPENAPI'
          import hashlib, json, os, pathlib, re, shutil, subprocess
          import xml.etree.ElementTree as ET

          def decode(raw):
              def pairs(items):
                  value = {}
                  for key, item in items:
                      assert key not in value
                      value[key] = item
                  return value
              return json.loads(raw, object_pairs_hook=pairs,
                                parse_constant=lambda _: (_ for _ in ()).throw(ValueError('Nonfinite JSON')))

          package = 'ru.rutcampustrack.notification.OpenApiSnapshotIT'
          method = 'apiDocsMatchesSnapshot'
          app = pathlib.Path('services/notification-service/notification-app')
          test_source = app / 'src/test/java/ru/rutcampustrack/notification/OpenApiSnapshotIT.java'
          test_sha = '4a4f00092bab210cadb7e4da91a1da7815564acf82b02b6e5b0a721f2ad088cb'
          source = test_source.read_bytes()
          assert hashlib.sha256(source).hexdigest() == test_sha
          assert source == subprocess.check_output(['git', 'show', 'HEAD:' + test_source.as_posix()])
          lines = source.decode().splitlines()
          target = '                .isEqualTo(expected);'
          assert lines.count(target) == 1
          expected_line = lines.index(target) + 1
          report = pathlib.Path('build/ci-test-outcomes/notification-service/integrationTest/safe-outcomes.json')
          if not report.is_file() or not 0 < report.stat().st_size <= 33554432:
              raise SystemExit(0)
          value = decode(report.read_bytes())
          if value.get('collection') != 'RESULTS':
              raise SystemExit(0)
          meta = value['metadata']
          checkout = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert (meta['checkoutSha'] == checkout
                  and meta['prHeadSha'] == os.environ['RCT_CI_PR_HEAD_SHA']
                  and meta['service'] == 'notification-service' and meta['task'] == 'integrationTest'
                  and meta['job'] == 'java-integration-test' and meta['testStepOutcome'] == 'failure'
                  and meta['runId'] == os.environ['GITHUB_RUN_ID']
                  and meta['runAttempt'] == os.environ['GITHUB_RUN_ATTEMPT'])
          selected = [case for case in value['cases']
                      if case.get('classname') == package and case.get('method') == method]
          if not selected:
              raise SystemExit(0)
          assert len(selected) == 1
          case = selected[0]
          assert (case['identity'] == 'SOURCE_METHOD' and case['source'] == test_source.as_posix()
                  and case['sourceSha256'] == test_sha)
          if case['status'] != 'FAILED':
              raise SystemExit(0)
          result = app / ('build/test-results/integrationTest/TEST-' + package + '.xml')
          assert result.is_file() and not result.is_symlink() and 0 < result.stat().st_size <= 33554432
          raw = result.read_bytes()
          assert b'<!DOCTYPE' not in raw.upper() and b'<!ENTITY' not in raw.upper()
          suite = ET.fromstring(raw)
          cases = suite.findall('testcase')
          if (suite.tag != 'testsuite' or suite.get('name') != package or len(cases) != 1
                  or cases[0].get('classname') != package or cases[0].get('name') != method + '()'
                  or {key: suite.get(key) for key in ('tests', 'failures', 'errors', 'skipped')}
                  != {'tests': '1', 'failures': '1', 'errors': '0', 'skipped': '0'}):
              raise SystemExit(0)
          native_case = cases[0]
          if native_case.findall('error') or native_case.findall('skipped') or len(native_case.findall('failure')) != 1:
              raise SystemExit(0)
          failure = native_case.find('failure')
          if failure.get('type') not in {'org.opentest4j.AssertionFailedError', 'java.lang.AssertionError'}:
              raise SystemExit(0)
          named_lines = re.findall(
              r'(?m)^[ \t]*at[ \t]+(?:[^ \t\r\n()]{1,256}/)?'
              + re.escape(package + '.' + method)
              + r'\(OpenApiSnapshotIT\.java:([1-9][0-9]{0,5})\)[ \t]*$', failure.text or '')
          if named_lines != [str(expected_line)]:
              raise SystemExit(0)
          wrapper = pathlib.Path('gradlew')
          assert subprocess.check_output(['git', 'ls-tree', '--format=%(objectmode)', 'HEAD', '--', 'gradlew']) == b'100644\n'
          wrapper_head = subprocess.check_output(['git', 'show', 'HEAD:gradlew'])
          wrapper_sha = hashlib.sha256(wrapper_head).hexdigest()
          assert wrapper_sha == 'c07475b363508dbe7cf7d1ded1b31f6d44bb97d98d069a455ab862b1fb9b25f0'
          wrapper_mode = wrapper.stat().st_mode & 0o7777
          assert wrapper_mode in {0o644, 0o755}

          def verify_wrapper():
              assert wrapper.is_file() and not wrapper.is_symlink()
              assert wrapper.stat().st_mode & 0o7777 == wrapper_mode
              assert 0 < wrapper.stat().st_size <= 1048576
              assert hashlib.sha256(wrapper.read_bytes()).hexdigest() == wrapper_sha

          verify_wrapper()
          assert subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']) == b''
          baseline = {path for path in subprocess.check_output(
              ['git', 'diff', 'HEAD', '--name-only', '-z']).split(b'\0') if path}
          assert baseline in (set(), {b'gradlew'})
          if baseline:
              assert wrapper_mode == 0o755
          subprocess.run(
              ['./gradlew', ':services:notification-service:notification-app:integrationTest', '--no-daemon',
               '--tests', package + '.' + method, '-Popenapi.snapshot.update=true'],
              stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT, timeout=360, check=True)
          snapshot = pathlib.Path('docs/openapi/notification.json')
          assert not snapshot.is_symlink() and snapshot.is_file() and 0 < snapshot.stat().st_size <= 2097152
          payload = snapshot.read_bytes()
          generated = decode(payload)
          assert (type(generated) is dict and set(generated) == {'openapi', 'info', 'tags', 'paths', 'components'}
                  and generated['openapi'] == '3.1.0' and type(generated['info']) is dict
                  and all(type(generated['info'].get(key)) is str for key in ('title', 'version'))
                  and type(generated['tags']) is list and all(type(tag) is dict for tag in generated['tags'])
                  and type(generated['paths']) is dict and generated['paths']
                  and all(path.startswith('/') and type(item) is dict for path, item in generated['paths'].items())
                  and type(generated['components']) is dict and type(generated['components'].get('schemas')) is dict)
          changed = subprocess.check_output(['git', 'diff', 'HEAD', '--name-only', '-z']).split(b'\0')
          assert {path for path in changed if path} == baseline | {b'docs/openapi/notification.json'}
          assert subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']) == b''
          verify_wrapper()
          assert subprocess.check_output(['git', 'ls-tree', '--format=%(objectmode)', 'HEAD', '--', snapshot.as_posix()]) == b'100644\n'
          assert snapshot.stat().st_mode & 0o7777 == 0o644
          assert payload != subprocess.check_output(['git', 'show', 'HEAD:' + snapshot.as_posix()])
          output = pathlib.Path('build/ci-test-outcomes/notification-service/openapi-generated')
          output.mkdir(mode=0o700, parents=True, exist_ok=False)
          shutil.copyfile(snapshot, output / 'notification.json')
          proof = {'schemaVersion': 1, 'state': 'OFFICIAL_NOTIFICATION_OPENAPI_GENERATED',
                   'producerHeadSha': os.environ['RCT_CI_PR_HEAD_SHA'], 'checkoutSha': checkout,
                   'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                   'testMethod': package + '.' + method, 'testSourceSha256': test_sha,
                   'originalDriftFrameLine': expected_line, 'originalIntegrationOutcome': 'failure',
                   'generatedSnapshotSha256': hashlib.sha256(payload).hexdigest(), 'generatedSnapshotBytes': len(payload),
                   'trackedChanges': sorted(path.decode('ascii') for path in changed if path),
                   'preexistingWrapperModeChange': baseline == {b'gradlew'}, 'wrapperSourceSha256': wrapper_sha,
                   'ordinaryFailurePreserved': True}
          (output / 'generation.safe.json').write_text(json.dumps(proof, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as target_output:
              target_output.write('generated=true\n')
          PY_NOTIFICATION_OPENAPI

      - name: Upload the official Notification OpenAPI candidate
        if: ${{ !cancelled() && steps.notification-openapi-candidate.outputs.generated == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: notification-openapi-generated-${{ github.run_attempt }}
          path: |
            build/ci-test-outcomes/notification-service/openapi-generated/notification.json
            build/ci-test-outcomes/notification-service/openapi-generated/generation.safe.json
          if-no-files-found: error
          retention-days: 7

  java-verification:
    name: Java verification (verifyNoDebugInProd + verifyLogbackJsonInAllServices)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve published Flyway migration history
        run: python3 scripts/check-published-migrations.py --fetch-published

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Configuration gates use existing parser/logging JVM dependencies, without services or databases.
      - name: Warm Gradle wrapper
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then
              exit 0
            fi
            echo "Gradle wrapper download failed, retrying in $((attempt * 10))s ($attempt/3)"
            sleep $((attempt * 10))
          done
          ./gradlew --version --no-daemon

      - name: Verify bounded parser and infrastructure refusal controls
        timeout-minutes: 3
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          umask 077
          controls=(tests/harness/test_ci_test_outcomes.py
                    tests/harness/test_gateway_smoke.py
                    tests/harness/test_deploy_prerequisites.py
                    tests/harness/test_served_web_panel.py
                    scripts/test-recovery-failure-boundaries.py)
          for control in "${controls[@]}"; do
            log="$RUNNER_TEMP/$(basename "$control").private.log"
            if python3 -B "$control" > "$log" 2>&1; then
              printf 'PASS bounded control %s\n' "$control"
            else
              status=$?
              printf 'FAIL bounded control %s (exit %d)\n' "$control" "$status"
              exit "$status"
            fi
          done
          for script in smoke-prod verify-gateway-e2e preflight-deploy verify-deploy; do
            bash -n "scripts/$script.sh"
          done

      - name: Run verification tasks
        run: ./gradlew verifyNoDebugInProd verifyLogbackJsonInAllServices --no-daemon

  python-lint-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            services/notification-bot/requirements.txt
            services/notification-bot/requirements-test.txt

      - name: Install dependencies
        run: |
          pip install ruff==0.17.0
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest tests/ -v

  mobile-vue-build-test:
    name: Vue workspace — WEB, PWA, TMA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'npm'
          cache-dependency-path: frontends/package-lock.json
      - name: Install, contract checks, type checks, worker checks, build
        working-directory: frontends
        run: |
          npm ci
          npm run generate:types:check
          npm run generate:auth-types:check
          npm run generate:academic-schedule-types:check
          npm run test:contract
          npm run typecheck:foundation
          npm run typecheck
          npm run test:web
          node --test pwa-vue/tests/*.test.mjs
          node ../tests/load/scenario-controls.cjs
          npm run build
  # M13 G15 — ShellCheck lint для всех bash-скриптов.
  # Gate на ошибки уровня `error` и `warning`; `info`/`style` не блочат.
  shellcheck:
    name: ShellCheck scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts/*.sh
        run: shellcheck --severity=warning scripts/*.sh
      - name: Parse local-stand PowerShell source
        shell: pwsh
        run: |
          $localStandTokens = $null
          $localStandParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/local-stand.ps1'), [ref]$localStandTokens, [ref]$localStandParseErrors) | Out-Null
          if ($localStandParseErrors.Count -gt 0) { throw 'Tracked local-stand PowerShell syntax validation failed' }

  # M13 G17 — структурная валидация Grafana dashboard JSON-файлов.
  # Catch'ит broken JSON / missing uid|title / 0 panels до VPS deploy.
  # Live smoke (non-zero данные) deferred в G23 VPS dry-run.
  grafana-dashboards:
    name: Grafana dashboards structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dashboards
        run: bash scripts/validate-grafana-dashboards.sh

  # Current PWA/TMA Vue auth against the isolated backend stack.
  recovery-files:
    name: Synthetic database and file recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RCT_FILES_RECOVERY_PROJECT: rct-recovery-files-${{ github.run_id }}-${{ github.run_attempt }}
      RCT_RECOVERY_PG_IMAGE: postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
      RCT_RECOVERY_MONGO_IMAGE: mongo@sha256:1f995ad6fdb93244a1addab1b58f934a0bc2f5643c38e02f5e9d7f0c7d227a7b
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
      - name: Set the disposable recovery working path
        timeout-minutes: 1
        run: printf 'RCT_FILES_RECOVERY_DIR=%s\n' "$RUNNER_TEMP/rct-files-recovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        timeout-minutes: 1
        with:
          python-version: '3.12'
      - name: Fetch the explicit recovery images
        timeout-minutes: 3
        run: |
          docker pull "$RCT_RECOVERY_PG_IMAGE"
          docker pull "$RCT_RECOVERY_MONGO_IMAGE"
      - name: Exercise the existing files-mode recovery drill
        timeout-minutes: 8
        run: |
          umask 077
          python3 scripts/test-recovery.py --work-dir "$RCT_FILES_RECOVERY_DIR" \
            --project-base "$RCT_FILES_RECOVERY_PROJECT" \
            --pg-image "$RCT_RECOVERY_PG_IMAGE" --mongo-image "$RCT_RECOVERY_MONGO_IMAGE"
      - name: Record closed resource diagnostics after failure
        timeout-minutes: 1
        if: failure()
        run: |
          python3 - <<'PY_RECOVERY_RESOURCE'
          import json, os, subprocess
          services = {'postgres-academic', 'postgres-schedule', 'mongo-attendance'}
          try:
              for suffix in ('-src', '-dst'):
                  project = os.environ['RCT_FILES_RECOVERY_PROJECT'] + suffix
                  ids = subprocess.check_output(['docker', 'ps', '-aq', '--filter',
                                                 'label=com.docker.compose.project=' + project], stderr=subprocess.PIPE, timeout=5).decode().split()
                  if len(ids) > 3:
                      raise SystemExit('Unexpected disposable recovery resource count')
                  for cid in ids:
                      info = json.loads(subprocess.check_output(['docker', 'inspect', cid], stderr=subprocess.PIPE, timeout=5))[0]
                      labels, state = info['Config']['Labels'], info['State']
                      service = labels.get('com.docker.compose.service')
                      if (labels.get('com.docker.compose.project') != project
                              or labels.get('io.rutcampustrack.recovery') != 'disposable' or service not in services):
                          raise SystemExit('Disposable recovery resource ownership mismatch')
                      print(json.dumps({'service': service, 'target': suffix == '-dst',
                                        'running': bool(state['Running']), 'oomKilled': bool(state['OOMKilled']),
                                        'exitCode': int(state['ExitCode']),
                                        'memoryLimit': int(info['HostConfig']['Memory'])}))
          except (subprocess.SubprocessError, OSError, ValueError, KeyError, TypeError):
              print('Closed recovery resource diagnostic unavailable; original failure retained')
          PY_RECOVERY_RESOURCE
      - name: Upload the existing closed recovery receipt
        timeout-minutes: 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: files-recovery-safe-${{ github.run_attempt }}
          path: ${{ env.RCT_FILES_RECOVERY_DIR }}/PASS.json
          if-no-files-found: warn
          retention-days: 7
      - name: Stop only the marked disposable recovery projects
        if: always()
        timeout-minutes: 3
        run: |
          if [ -f "$RCT_FILES_RECOVERY_DIR/owned-projects.json" ]; then
            python3 scripts/test-recovery.py --work-dir "$RCT_FILES_RECOVERY_DIR" \
              --project-base "$RCT_FILES_RECOVERY_PROJECT" --cleanup
          fi

  e2e-auth:
    name: Playwright E2E auth flow (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [client, lifecycle]
    steps:
      - uses: actions/checkout@v4
      - name: Record the actual PR checkout revision
        env:
          RCT_CHECKOUT_PRODUCER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          umask 077
          python3 - <<'PY_CHECKOUT'
          import json, os, re, subprocess
          from pathlib import Path

          checkout = subprocess.check_output(['git', 'rev-parse', 'HEAD'], timeout=10).decode().strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], timeout=10).decode().strip()
          producer = os.environ['RCT_CHECKOUT_PRODUCER']
          if not all(re.fullmatch('[0-9a-f]{40}', value) for value in (checkout, tree, producer)):
              raise SystemExit('Invalid checkout revision metadata')
          path = Path(os.environ['RUNNER_TEMP']) / 'rct-checkout.safe.json'
          with path.open('x') as stream:
              json.dump({'checkout_sha': checkout, 'tree_sha': tree, 'producer_head_sha': producer}, stream)
              stream.write('\n')
          PY_CHECKOUT
      - name: Upload the closed checkout revision
        uses: actions/upload-artifact@v4
        with:
          name: checkout-safe-${{ matrix.group }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rct-checkout.safe.json
          if-no-files-found: error
          retention-days: 7

      - name: Validate closed diagnostic semantics and privacy before runtime startup
        if: ${{ matrix.group == 'lifecycle' }}
        timeout-minutes: 1
        run: python3 -B tests/e2e/fixtures/http500-diagnostic-contract.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare disposable FIRST3 clock and private artifacts
        env:
          RCT_E2E_TEACHING_CLOCK_DIR: ${{ runner.temp }}/rct-first3-clock-${{ github.run_id }}-${{ github.run_attempt }}
          RCT_FOCUS3_RUN: ${{ runner.temp }}/rct-first3-${{ github.run_id }}-${{ github.run_attempt }}
          RCT_FOCUS3_OBSERVATIONS: ${{ runner.temp }}/rct-first3-${{ github.run_id }}-${{ github.run_attempt }}/supervision/observations.safe.json
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_SYNTHETIC_SEED: 'true'
        run: |
          umask 077
          python3 - <<'PY_ATTENDANCE_SERVICE_TOKEN'
          import os, secrets, stat, sys
          sys.path.insert(0, 'scripts')
          from e2e_fixture_credentials import fresh_credentials

          tokens = {name: secrets.token_urlsafe(32) for name in (
              'ACADEMIC_TO_ATTENDANCE_SERVICE_TOKEN',
              'SCHEDULE_TO_ACADEMIC_SERVICE_TOKEN',
              'ATTENDANCE_TO_ACADEMIC_SERVICE_TOKEN',
          )}
          tokens.update(fresh_credentials())
          if len(set(tokens.values())) != len(tokens):
              raise SystemExit('Synthetic directed service tokens must be distinct')
          for token in tokens.values():
              print('::add-mask::' + token)
          # Sanitized owned Compose children use this same dotenv, without inheriting tokens.
          fds, temporary, temporary_identity = [], None, None
          try:
              try:
                  if (os.environ.get('GITHUB_ACTIONS') != 'true'
                          or os.environ.get('RUNNER_ENVIRONMENT') != 'github-hosted'
                          or os.environ.get('RCT_E2E_SYNTHETIC_SEED') != 'true'):
                      raise ValueError('Disposable CI required')
                  workspace = os.environ['GITHUB_WORKSPACE']
                  if not os.path.isabs(workspace):
                      raise ValueError('Owned workspace required')
                  flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
                  fds.append(os.open('.', flags))
                  root = os.fstat(fds[-1])
                  expected = os.stat(workspace, follow_symlinks=False)
                  if (root.st_dev, root.st_ino) != (expected.st_dev, expected.st_ino):
                      raise ValueError('Workspace identity changed')
                  for component in (None, 'tests', 'e2e'):
                      if component is not None:
                          fds.append(os.open(component, flags, dir_fd=fds[-1]))
                      directory = os.fstat(fds[-1])
                      if (not stat.S_ISDIR(directory.st_mode) or directory.st_uid != os.getuid()
                              or stat.S_IMODE(directory.st_mode) & 0o022):
                          raise ValueError('Unsafe owned directory')
                  directory_fd = fds[-1]
                  fds.append(os.open('.env.ci', os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK,
                                     dir_fd=directory_fd))
                  source = os.fstat(fds[-1])
                  if (not stat.S_ISREG(source.st_mode) or source.st_uid != os.getuid()
                          or source.st_nlink != 1 or stat.S_IMODE(source.st_mode) & 0o022
                          or not 0 < source.st_size <= 65536):
                      raise ValueError('Unsafe synthetic dotenv')
                  identity = lambda value: (value.st_dev, value.st_ino, value.st_uid, value.st_nlink,
                                            value.st_mode, value.st_size, value.st_mtime_ns, value.st_ctime_ns)
                  raw = os.read(fds[-1], 65537)
                  if len(raw) != source.st_size or identity(os.fstat(fds[-1])) != identity(source):
                      raise ValueError('Synthetic dotenv changed')
                  encoded = {name.encode(): token.encode() for name, token in tokens.items()}
                  seen, lines = set(), []
                  for line in raw.splitlines(keepends=True):
                      content = line.rstrip(b'\r\n')
                      active = content.lstrip()
                      if active and not active.startswith(b'#') and b'=' in active:
                          value = active.split(b'=', 1)[1].lstrip()
                          if value[:1] in (b"'", b'"'):
                              escaped = closed = False
                              for symbol in value[1:]:
                                  if symbol == value[0] and not escaped:
                                      closed = True
                                      break
                                  escaped = symbol == 92 and not escaped
                              if not closed:
                                  raise ValueError('Synthetic dotenv requires closed single-line values')
                      mentioned = [] if active.startswith(b'#') else [key for key in encoded if key in content]
                      if not mentioned:
                          lines.append(line)
                          continue
                      if (len(mentioned) != 1 or not content.startswith(mentioned[0] + b'=')
                              or mentioned[0] in seen):
                          raise ValueError('Malformed synthetic credential assignment')
                      key = mentioned[0]
                      seen.add(key)
                      lines.append(key + b'=' + encoded[key] + line[len(content):])
                  updated = b''.join(lines)
                  missing = [key for key in encoded if key not in seen]
                  if missing and updated and not updated.endswith(b'\n'):
                      updated += b'\n'
                  updated += b''.join(key + b'=' + encoded[key] + b'\n' for key in missing)
                  if len(updated) > 65536:
                      raise ValueError('Synthetic dotenv exceeds its bound')
                  temporary = '.env.ci.' + secrets.token_hex(16) + '.tmp'
                  temp_fd = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                                    0o600, dir_fd=directory_fd)
                  temporary_identity = os.fstat(temp_fd)
                  with os.fdopen(temp_fd, 'wb') as output:
                      output.write(updated)
                      output.flush()
                      os.fsync(output.fileno())
                  for parent_fd, name, held_fd in ((None, workspace, fds[0]),
                                                        (fds[0], 'tests', fds[1]),
                                                        (fds[1], 'e2e', fds[2])):
                      linked = os.stat(name, dir_fd=parent_fd, follow_symlinks=False)
                      held = os.fstat(held_fd)
                      if (linked.st_dev, linked.st_ino) != (held.st_dev, held.st_ino):
                          raise ValueError('Owned directory identity changed before commit')
                  current = os.stat('.env.ci', dir_fd=directory_fd, follow_symlinks=False)
                  temp_current = os.stat(temporary, dir_fd=directory_fd, follow_symlinks=False)
                  if (identity(current) != identity(source)
                          or (temp_current.st_dev, temp_current.st_ino) !=
                             (temporary_identity.st_dev, temporary_identity.st_ino)
                          or not stat.S_ISREG(temp_current.st_mode) or temp_current.st_nlink != 1
                          or temp_current.st_uid != os.getuid() or stat.S_IMODE(temp_current.st_mode) != 0o600
                          or temp_current.st_size != len(updated)):
                      raise ValueError('Synthetic dotenv identity changed before commit')
                  os.replace(temporary, '.env.ci', src_dir_fd=directory_fd, dst_dir_fd=directory_fd)
                  temporary = None
                  os.fsync(directory_fd)
              finally:
                  try:
                      if temporary is not None and temporary_identity is not None:
                          remaining = os.stat(temporary, dir_fd=directory_fd, follow_symlinks=False)
                          if (remaining.st_dev, remaining.st_ino) != (temporary_identity.st_dev, temporary_identity.st_ino):
                              raise ValueError('Temporary dotenv ownership changed')
                          os.unlink(temporary, dir_fd=directory_fd)
                  finally:
                      for fd in reversed(fds):
                          os.close(fd)
          except Exception:
              raise SystemExit('Owned synthetic Compose environment preparation failed') from None
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(''.join(name + '=' + token + '\n' for name, token in tokens.items()))
          PY_ATTENDANCE_SERVICE_TOKEN
          {
            printf 'RCT_E2E_TEACHING_CLOCK_DIR=%s\n' "$RCT_E2E_TEACHING_CLOCK_DIR"
            printf 'RCT_FOCUS3_RUN=%s\n' "$RCT_FOCUS3_RUN"
            printf 'RCT_FOCUS3_OBSERVATIONS=%s\n' "$RCT_FOCUS3_OBSERVATIONS"
          } >> "$GITHUB_ENV"
          mkdir -m 700 -- "$RCT_FOCUS3_RUN"
          mkdir -m 700 -- "$RCT_FOCUS3_RUN/artifacts" "$RCT_FOCUS3_RUN/supervision"
          chmod +x gradlew
          ./gradlew e2eClockFixtureJar e2eClockFixtureControl --no-daemon --max-workers=1
          python3 tests/e2e/fixtures/semester-effect-diagnostic.control.py
          (
            umask 022
            node tests/e2e/backend-clock/prepare-clock.mjs "$RCT_E2E_TEACHING_CLOCK_DIR" "$PWD/build/e2e-clock/clock-fixture.jar"
          )

      # M13 G25.3 — buildx нужен для BuildKit cache mount
      # (`--mount=type=cache,target=/root/.gradle` в backend Dockerfile'ах).
      # Default docker driver игнорирует cache mounts → каждый build
      # повторно скачивает Gradle dependencies (+5-10 мин на CI).
      # Frontend bundles — Docker multi-stage сам делает npm ci/build,
      # ничего pre-build не нужно.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # M13 G25.3 — self-signed TLS cert для reverse-proxy nginx.
      # AuthCookies.java выставляет `Secure` flag → на чистом HTTP browser
      # cookie отбрасывает → T1 spec падает. TLS termination на e2e nginx
      # обходит проблему без изменения production code.
      - name: Generate self-signed TLS cert
        run: |
          bash tests/e2e/infra/scripts/generate-test-certs.sh
          printf 'NODE_EXTRA_CA_CERTS=%s\n' "$GITHUB_WORKSPACE/tests/e2e/infra/certs/server.crt" >> "$GITHUB_ENV"

      - name: Boot isolated Vue auth stack
        id: bootstrap-images
        env:
          RCT_E2E_SYNTHETIC_BASELINE: browser-v2-split-20261018-v1
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          identity=()
          if [ '${{ matrix.group }}' = client ]; then
            identity=(-f tests/e2e/infra/docker-compose.monitoring-identity.yml)
          fi
          docker compose --env-file tests/e2e/.env.ci -p rct-e2e -f docker-compose.e2e.yml -f tests/e2e/infra/docker-compose.clock-fixture.yml -f tests/e2e/infra/docker-compose.synthetic-baseline.yml "${identity[@]}" config --quiet
          docker compose --env-file tests/e2e/.env.ci -p rct-e2e -f docker-compose.e2e.yml -f tests/e2e/infra/docker-compose.clock-fixture.yml -f tests/e2e/infra/docker-compose.synthetic-baseline.yml "${identity[@]}" up -d --build --wait --wait-timeout 480
          docker compose --env-file tests/e2e/.env.ci -p rct-e2e -f docker-compose.e2e.yml exec -T notification-web \
            sh -c 'test ! -e /keys/private.key && test ! -L /keys/private.key'
          printf '%s\n' 'PASS disposable Notification consumer has no signing private-key file'

      - name: Install Playwright + browsers
        working-directory: tests/e2e
        run: |
          npm ci
          node check-admission-retry.mjs
          npx playwright install --with-deps chromium webkit
          node fixtures/semester-lifecycle-ui.control.mjs
          node fixtures/admin-activity-response.control.mjs
          node fixtures/web-panel-route.control.mjs
          node fixtures/registry-html-privacy.control.mjs
          node fixtures/semester-health-diagnostic.control.mjs
          python3 -B fixtures/lesson-transfer-diagnostic.control.py

      - name: Validate diagnostic producer reporter and shared consumer contract
        if: ${{ matrix.group == 'client' }}
        timeout-minutes: 3
        run: node tests/e2e/fixtures/diagnostic-events.control.mjs --with-consumer

      - name: Validate the existing safe artifact privacy contract for client scenarios
        id: artifact-privacy-controls
        if: ${{ matrix.group == 'client' }}
        working-directory: tests/e2e
        env:
          RCT_E2E_CONTROL_RECEIPT_PATH: ${{ runner.temp }}/rct-artifact-privacy-client-${{ github.run_id }}-${{ github.run_attempt }}.safe.json
        run: |
          umask 077
          test ! -e "$RCT_E2E_CONTROL_RECEIPT_PATH" && test ! -L "$RCT_E2E_CONTROL_RECEIPT_PATH"
          if npm run test:artifact-privacy; then privacy_status=0; else privacy_status=$?; fi
          python3 -B fixtures/http500_diagnostic.py --privacy-receipt-status "$privacy_status"

      - name: Upload only the closed existing privacy control receipt
        if: ${{ always() && steps.artifact-privacy-controls.outcome != 'skipped' && steps.artifact-privacy-controls.outputs.safe_receipt == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: artifact-privacy-safe-client-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rct-artifact-privacy-client-${{ github.run_id }}-${{ github.run_attempt }}.safe.json
          if-no-files-found: error
          retention-days: 7

      # Worker script validation needs actual certificate trust, independently of page error handling.
      - name: Trust the disposable localhost certificate for Chromium workers
        id: e2e-ready
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libnss3-tools
          python3 - <<'PY_TRUST'
          import hashlib, os, re, ssl, stat, subprocess
          from pathlib import Path
          if os.environ.get('RUNNER_ENVIRONMENT') != 'github-hosted':
              raise SystemExit('Test certificate trust requires a disposable GitHub-hosted runner')
          cert = Path('tests/e2e/infra/certs/server.crt')
          info = cert.lstat()
          if not stat.S_ISREG(info.st_mode) or cert.is_symlink() or info.st_size > 16384:
              raise SystemExit('Expected bounded generated public test certificate')
          # Chromium M146+ uses this path, retaining an existing legacy database if present.
          legacy = Path.home() / '.pki/nssdb'
          database = legacy if legacy.exists() else Path.home() / '.local/share/pki/nssdb'
          if database.is_symlink():
              raise SystemExit('Test certificate database must not be a link')
          database.mkdir(parents=True, exist_ok=True, mode=0o700)
          nickname = 'rct-e2e-localhost-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          db_args = ['certutil', '-d', 'sql:' + str(database)]
          def run(args):
              result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=30)
              if result.returncode:
                  raise SystemExit('Disposable test certificate trust operation failed')
              return result.stdout
          if not (database / 'cert9.db').exists():
              run([*db_args, '-N', '--empty-password'])
          # Trust this self-signed server as a peer, not as a CA for other servers.
          run([*db_args, '-A', '-t', 'P,,', '-n', nickname, '-i', str(cert)])
          exported = run([*db_args, '-L', '-n', nickname, '-a']).decode('ascii')
          pem = re.search(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----', exported, re.S)
          if not pem or hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem[0])).digest() != hashlib.sha256(ssl.PEM_cert_to_DER_cert(cert.read_text())).digest():
              raise SystemExit('Disposable trusted certificate identity mismatch')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RCT_E2E_NSS_DB=' + str(database) + '\nRCT_E2E_NSS_NICKNAME=' + nickname + '\n')
          print('PASS exact disposable localhost peer certificate trusted; TLS validation retained')
          PY_TRUST

      - uses: actions/setup-python@v5
        if: matrix.group == 'client'
        with:
          python-version: '3.12'

      # Must precede every client dataset fixture: the disposable active semester
      # can be widened through the normal API only before assignments exist.
      - name: Resume actual eighteen-week async DOCX after navigation and lost response
        id: stage17-async
        if: ${{ matrix.group == 'client' && !cancelled() && steps.e2e-ready.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_ASYNC_REPORT: 'true'
          RCT_E2E_REMAINING5: 'true'
          RCT_E2E_SYNTHETIC_SEED: 'true'
          RCT_REMAINING5_RUN: ${{ runner.temp }}/rct-stage17-async-${{ github.run_id }}-${{ github.run_attempt }}
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/tests/e2e/infra/certs/server.crt
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
          NODE_OPTIONS: --max-old-space-size=512
          CI: 'true'
        run: |
          umask 077
          mkdir -m 700 "$RCT_REMAINING5_RUN" "$RCT_REMAINING5_RUN/artifacts"
          python3 -m venv "$RCT_REMAINING5_RUN/metrics-python"
          "$RCT_REMAINING5_RUN/metrics-python/bin/python" -m pip install --quiet PyYAML==6.0.3
          "$RCT_REMAINING5_RUN/metrics-python/bin/python" "$GITHUB_WORKSPACE/infra/prometheus/tests/check_pipeline.py" --e2e-async-browser

      - name: Upload only safe async report browser outcomes
        if: always() && matrix.group == 'client' && steps.stage17-async.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: stage17-async-safe-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rct-stage17-async-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/safe-results.json
            ${{ runner.temp }}/rct-stage17-async-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/metrics.safe.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify actual private bot menus roster and teacher Today on the hosted services
        id: hosted-bot-roles
        if: ${{ matrix.group == 'client' && !cancelled() && steps.e2e-ready.outcome == 'success' }}
        timeout-minutes: 6
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_BOT_ROLE_MENU: 'true'
          RCT_E2E_REMAINING5: 'true'
          RCT_E2E_SYNTHETIC_SEED: 'true'
          RCT_REMAINING5_RUN: ${{ runner.temp }}/rct-u20-bot-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
          NODE_OPTIONS: --max-old-space-size=512
          CI: 'true'
        run: |
          umask 077
          mkdir -m 700 "$RCT_REMAINING5_RUN" "$RCT_REMAINING5_RUN/artifacts"
          docker build --tag "rct/notification-bot:u20-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ../../services/notification-bot
          npx playwright test --config playwright.real-mobile.config.ts --project=chromium --grep 'actual private bot menu roster and teacher Today use hosted current authority$'

      - name: Upload only safe hosted bot role outcomes
        if: always() && matrix.group == 'client' && steps.hosted-bot-roles.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: hosted-bot-roles-safe-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rct-u20-bot-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/safe-results.json
          if-no-files-found: error
          retention-days: 7

      - name: Run auth-flow @smoke specs (chromium only)
        if: ${{ matrix.group == 'client' }}
        working-directory: tests/e2e
        env:
          # M13 G25.3 — HTTPS через self-signed cert на reverse-proxy
          # nginx. ignoreHTTPSErrors=true в playwright.config.ts.
          E2E_BASE_URL: https://localhost:8443
          CI: 'true'
        run: npx playwright test specs/auth-token-lifecycle.spec.ts specs/mini-app.spec.ts --project=chromium --grep @smoke

      - name: Run accepted FIRST3 with closed diagnostics (chromium only)
        id: first3
        if: ${{ matrix.group == 'lifecycle' && !cancelled() && steps.e2e-ready.outcome == 'success' }}
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_SYNTHETIC_SEED: 'true'
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
          NODE_OPTIONS: --max-old-space-size=512
          CI: 'true'
        run: |
          umask 077
          npx playwright test --config playwright.first3.config.ts --project=chromium

      # Only these canonical allowlisted producers may publish data from the seeded lane.
      # Never upload raw HTML, traces, screenshots, error contexts or Docker logs.
      - name: Upload safe FIRST3 outcomes and observations
        if: always() && steps.first3.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: first3-safe-${{ github.run_attempt }}
          path: |
            ${{ env.RCT_FOCUS3_RUN }}/artifacts/safe-results.json
            ${{ env.RCT_FOCUS3_RUN }}/supervision/observations-student.safe.json
            ${{ env.RCT_FOCUS3_RUN }}/supervision/observations-headman.safe.json
            ${{ env.RCT_FOCUS3_RUN }}/supervision/observations-helper.safe.json
          if-no-files-found: warn
          retention-days: 7

      - name: Run remaining five accepted mobile scenarios (chromium only)
        id: remaining5
        if: ${{ matrix.group == 'client' && !cancelled() && steps.e2e-ready.outcome == 'success' }}
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_SYNTHETIC_SEED: 'true'
          RCT_E2E_REMAINING5: 'true'
          RCT_REMAINING5_RUN: ${{ runner.temp }}/rct-remaining5-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
          NODE_OPTIONS: --max-old-space-size=512
          CI: 'true'
        run: |
          umask 077
          printf 'RCT_REMAINING5_RUN=%s\n' "$RCT_REMAINING5_RUN" >> "$GITHUB_ENV"
          mkdir -m 700 -- "$RCT_REMAINING5_RUN"
          mkdir -m 700 -- "$RCT_REMAINING5_RUN/artifacts"
          npx playwright test --config playwright.real-mobile.config.ts --project=chromium --grep '(?:LIMITED ADMIN views accounts while creation is denied by UI and server|empty foreign-group homework and transport failure provide a real retry path|another live session revokes the browser session and recovery exposes login only|D003 reuse admits twice; suspended grant yields neutral bootstrap and protected denials|D003 signed HEADMAN TMA marks an isolated own-group roster row|warm offline reload remains read-only; revoked session reconnect clears the cached user|D002 reconnect rechecks changed grants and a late old feed cannot replace the new account|D002 TMA stays online-only beside a warm PWA snapshot|N2 retained Student shell recovers through current-only retry \(active\)|N2 retained Student shell recovers through current-only retry \(suspended\))$'

      - name: Record closed Homework503 dependency hints after remaining5 failure
        if: ${{ matrix.group == 'client' && !cancelled() && steps.remaining5.outcome == 'failure' }}
