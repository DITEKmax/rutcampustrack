spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  autoconfigure:
    # No RabbitMQ in tests — publisher beans aren't needed and health probe would fail.
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

management:
  health:
    rabbit:
      enabled: false

jwt:
  key-dir: ${java.io.tmpdir}/rct-test-keys
  access-token-expiration: 900
  refresh-token-expiration: 604800

rutcampustrack:
  security:
    internal-issuer:
      secret: test-internal-issuer-secret-32-bytes-or-more-for-test-env
      token-ttl-seconds: 300

otp:
  code-length: 6
  ttl-seconds: 120
  max-attempts: 3
  attempts-window-seconds: 300
  resend-cooldown-seconds: 60

logging:
  level:
    ru.rutcampustrack: DEBUG
    org.testcontainers: INFO
