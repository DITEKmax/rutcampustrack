# Only scripts/test-restore.sh uses this disposable stack. No published ports,
# global container/network names, host DB mounts, or persistent DB volumes.
services:
  postgres-academic:
    image: ${RCT_RECOVERY_PG_IMAGE:?explicit cached PostgreSQL image required}
    labels:
      io.rutcampustrack.recovery: disposable
    environment:
      TZ: Europe/Moscow
      POSTGRES_DB: academic_db
      POSTGRES_USER: rct_user
      POSTGRES_PASSWORD: ${POSTGRES_RECOVERY_ADMIN_PASSWORD:?required}
      POSTGRES_ACADEMIC_PASSWORD: ${POSTGRES_ACADEMIC_PASSWORD:?required}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD:?required}
      POSTGRES_ACADEMIC_MIGRATION_PASSWORD: ${POSTGRES_ACADEMIC_MIGRATION_PASSWORD:?required}
      POSTGRES_AUTH_MIGRATION_PASSWORD: ${POSTGRES_AUTH_MIGRATION_PASSWORD:?required}
    configs:
      - source: recovery-academic-init
        target: /docker-entrypoint-initdb.d/10-recovery-owners.sql
    tmpfs:
      - /var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          [ "$$(cat /proc/1/comm)" = postgres ] &&
          PGPASSWORD="$${POSTGRES_PASSWORD}" psql -X -h 127.0.0.1
          -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
          -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null 2>&1
      interval: 2s
      timeout: 3s
      retries: 40

  postgres-schedule:
    image: ${RCT_RECOVERY_PG_IMAGE:?explicit cached PostgreSQL image required}
    labels:
      io.rutcampustrack.recovery: disposable
    environment:
      TZ: Europe/Moscow
      POSTGRES_DB: schedule_db
      POSTGRES_USER: rct_user
      POSTGRES_PASSWORD: ${POSTGRES_SCHEDULE_PASSWORD:?required}
    tmpfs:
      - /var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          [ "$$(cat /proc/1/comm)" = postgres ] &&
          PGPASSWORD="$${POSTGRES_PASSWORD}" psql -X -h 127.0.0.1
          -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
          -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null 2>&1
      interval: 2s
      timeout: 3s
      retries: 40
  mongo-attendance:
    image: ${RCT_RECOVERY_MONGO_IMAGE:?explicit cached official MongoDB 7 image required}
    labels:
      io.rutcampustrack.recovery: disposable
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?required}
    tmpfs:
      - /data/db
      - /data/configdb
    # Bootstrap includes WiredTiger files on tmpfs and the health-check shell.
    # The previous 512 MiB disposable MongoDB was OOM-killed before seeding.
    mem_limit: 1g
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          [ "$$(cat /proc/1/comm)" = mongod ] &&
          mongosh --quiet --host 127.0.0.1 --port 27017 --eval '
          try {
            const admin = db.getSiblingDB("admin");
            const auth = admin.auth({user: process.env.MONGO_INITDB_ROOT_USERNAME,
              pwd: process.env.MONGO_INITDB_ROOT_PASSWORD});
            quit((auth === 1 || auth.ok === 1) && admin.runCommand({ping: 1}).ok === 1 ? 0 : 1);
          } catch (error) { quit(1); }
          ' >/dev/null 2>&1
      interval: 2s
      timeout: 5s
      retries: 40

networks:
  default:
    labels:
      io.rutcampustrack.recovery: disposable

# Disposable bootstrap only; no production mounts or role changes are invoked.
configs:
  recovery-academic-init:
    content: |
      \getenv academic_password POSTGRES_ACADEMIC_PASSWORD
      \getenv auth_password POSTGRES_AUTH_PASSWORD
      \getenv academic_migration_password POSTGRES_ACADEMIC_MIGRATION_PASSWORD
      \getenv auth_migration_password POSTGRES_AUTH_MIGRATION_PASSWORD
      CREATE ROLE rct_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
      CREATE ROLE rct_auth_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
      CREATE ROLE rct_academic_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
      CREATE ROLE rct_auth_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
      SELECT format('ALTER ROLE rct_migrator PASSWORD %L', :'academic_migration_password') \gexec
      SELECT format('ALTER ROLE rct_auth_migrator PASSWORD %L', :'auth_migration_password') \gexec
      SELECT format('ALTER ROLE rct_academic_runtime PASSWORD %L', :'academic_password') \gexec
      SELECT format('ALTER ROLE rct_auth_runtime PASSWORD %L', :'auth_password') \gexec
      ALTER DATABASE academic_db OWNER TO rct_migrator;
      REVOKE ALL ON DATABASE academic_db FROM PUBLIC;
      GRANT CONNECT ON DATABASE academic_db TO rct_academic_runtime;
      REVOKE ALL ON SCHEMA public FROM PUBLIC;
      ALTER SCHEMA public OWNER TO rct_migrator;
      GRANT USAGE ON SCHEMA public TO rct_academic_runtime;
      ALTER DEFAULT PRIVILEGES FOR ROLE rct_migrator IN SCHEMA public GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO rct_academic_runtime;
      ALTER DEFAULT PRIVILEGES FOR ROLE rct_migrator IN SCHEMA public GRANT USAGE,SELECT ON SEQUENCES TO rct_academic_runtime;
      CREATE DATABASE auth_db OWNER rct_auth_migrator;
      REVOKE ALL ON DATABASE auth_db FROM PUBLIC;
      GRANT CONNECT ON DATABASE auth_db TO rct_auth_runtime;
      REVOKE CONNECT ON DATABASE postgres,template1 FROM PUBLIC;
      \connect auth_db
      REVOKE ALL ON SCHEMA public FROM PUBLIC;
      ALTER SCHEMA public OWNER TO rct_auth_migrator;
      GRANT USAGE ON SCHEMA public TO rct_auth_runtime;
      ALTER DEFAULT PRIVILEGES FOR ROLE rct_auth_migrator IN SCHEMA public GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO rct_auth_runtime;
      ALTER DEFAULT PRIVILEGES FOR ROLE rct_auth_migrator IN SCHEMA public GRANT USAGE,SELECT ON SEQUENCES TO rct_auth_runtime;
