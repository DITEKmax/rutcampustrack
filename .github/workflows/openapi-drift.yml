name: OpenAPI Drift Guard

# Temporary owner-authorized pause for codex/web-vue-redesign.
# Restore automatic triggers before merge after explicit owner GO.
# See docs/plans/web-vue-pr3/CI-DEVELOPMENT-POLICY.md.
on:
  workflow_dispatch:

jobs:
  drift-check:
    name: OpenAPI ↔ generated types drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Install mobile Vue workspace dependencies
        working-directory: frontends
        run: npm ci --no-audit --no-fund
      - name: Check canonical mobile snapshots (offline)
        working-directory: frontends
        run: |
          npm run generate:types:check
          npm run generate:auth-types:check
          npm run generate:academic-schedule-types:check
