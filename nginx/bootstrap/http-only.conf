# Bootstrap template — HTTP only, no SSL references.
# init-letsencrypt.sh activates a copy only for first certificate issuance,
# then retires that copy after enabling HTTPS. Keep this template outside
# conf.d so ordinary deployments cannot load both HTTP servers.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'nginx is ready for certbot challenge';
        add_header Content-Type text/plain;
    }
}
