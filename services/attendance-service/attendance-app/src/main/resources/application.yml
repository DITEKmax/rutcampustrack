server:
  port: 9093

spring:
  application:
    name: attendance-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://rct_user:rct_dev_pass@mongo-attendance:27017/attendance_db?authSource=admin}
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:rct_dev_pass}
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:rct_user}
    password: ${RABBITMQ_PASSWORD:rct_dev_pass}

grpc:
  server:
    port: -1
  auth:
    secret: ${GRPC_SECRET:}
  client:
    schedule-service:
      address: static://schedule-service:19092
      negotiation-type: plaintext
    academic-service:
      address: static://academic-service:19091
      negotiation-type: plaintext

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

rutcampustrack:
  security:
    internal-jwt:
      # M03a: pull RSA public key from auth-service /auth/public-key.
      auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:9090}
      public-key-refresh-minutes: 60
      clock-skew-seconds: 30
      legacy-headers-enabled: ${RUTCAMPUSTRACK_SECURITY_LEGACY_HEADERS_ENABLED:true}

logging:
  level:
    ru.rutcampustrack: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
