# Production config — HTTPS termination + reverse proxy
# Requires SSL certificate at /etc/letsencrypt/live/rutcampustrack/

# HTTP -> HTTPS redirect (NET-05)
server {
    listen 80;
    server_name _;

    # ACME challenge MUST come before redirect (Pitfall 3)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server (NET-01, NET-02)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/rutcampustrack/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rutcampustrack/privkey.pem;
    ssl_dhparam         /etc/nginx/dhparam.pem;

    # TLS hardening — TLSv1.2 + TLSv1.3 only (no TLSv1.0/1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- WebSocket / STOMP (SockJS) for notification-web ---
    location /api/ws/ {
        proxy_pass http://rct-api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # --- API Gateway: all /api/* traffic (NET-01) ---
    location /api/ {
        proxy_pass http://rct-api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Landing page (NET-02) ---
    location /landing/ {
        proxy_pass http://rct-landing-nginx:80/;
        proxy_set_header Host $host;
    }

    # --- Admin Web Panel (NET-02) ---
    location /admin/ {
        proxy_pass http://rct-web-panel-nginx:80/;
        proxy_set_header Host $host;
    }

    # --- Telegram Mini App (NET-02) ---
    location /mini-app/ {
        proxy_pass http://rct-mini-app-nginx:80/;
        proxy_set_header Host $host;
    }

    # --- PWA at root (NET-02) — MUST be last (catch-all) ---
    location / {
        proxy_pass http://rct-pwa-nginx:80;
        proxy_set_header Host $host;
    }
}
