groups:
- name: datastores
  rules:
  - alert: PostgreSQLUnavailable
    expr: pg_up == 0
    for: 1m
    labels:
      severity: critical
      owner: platform
    annotations:
      summary: PostgreSQL недоступен ({{ $labels.service }})
      description: Экспортёр работает, но не может выполнить запрос к хранилищу. Проверьте готовность хранилища, сетевое
        подключение и права учётной записи мониторинга. Используйте отдельную учётную запись с минимальными правами, без
        доступа приложения или администратора.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: MongoDBUnavailable
    expr: mongodb_up == 0
    for: 1m
    labels:
      severity: critical
      owner: platform
    annotations:
      summary: MongoDB недоступна ({{ $labels.service }})
      description: Экспортёр работает, но не может выполнить запрос к хранилищу. Проверьте готовность хранилища, сетевое
        подключение и права учётной записи мониторинга. Используйте отдельную учётную запись с минимальными правами, без
        доступа приложения или администратора.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: RedisUnavailable
    expr: redis_up{redis_role!="cache"} == 0
    for: 1m
    labels:
      severity: critical
      owner: platform
    annotations:
      summary: Redis недоступен ({{ $labels.service }})
      description: Экспортёр работает, но не может выполнить запрос к хранилищу. Проверьте готовность хранилища, сетевое
        подключение и права учётной записи мониторинга. Используйте отдельную учётную запись с минимальными правами, без
        доступа приложения или администратора.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: RedisCacheUnavailable
    expr: redis_up{redis_role="cache"} == 0
    for: 1m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: Временный кэш Redis недоступен
      description: Academic использует PostgreSQL в качестве резерва. Восстановите изолированный кэш и перезапустите Academic для создания нового пространства имён кэша. Не очищайте критический Redis.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: RedisCriticalMemoryEviction
    expr: increase(redis_evicted_keys_total{redis_role="critical"}[5m]) > 0
    labels:
      severity: critical
      owner: platform
    annotations:
      summary: Критический Redis вытесняет ключи вопреки политике noeviction
      description: Проверьте политику и изоляцию процесса критического Redis. Сохраните OTP, билеты и лимиты. Не перенаправляйте временные кэши на этот экземпляр.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
