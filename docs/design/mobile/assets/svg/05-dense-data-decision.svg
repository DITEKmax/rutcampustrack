<text x="90" y="720" text-anchor="start" fill="#C8C2D6" font-size="15" font-weight="450"><tspan x="90" dy="0">На телефоне теряется ось</tspan><tspan x="90" dy="22">сравнения,</tspan><tspan x="90" dy="22">контекст и точность попадания.</tspan></text>
