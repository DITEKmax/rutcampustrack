        run: *closed-http500-diagnostic

      - name: Upload safe remaining five outcomes
        if: always() && steps.remaining5.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: remaining5-safe-${{ github.run_attempt }}
          path: ${{ env.RCT_REMAINING5_RUN }}/artifacts/safe-results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Trust the disposable localhost certificate for WebKit workers
        id: webkit-ready
        if: ${{ matrix.group == 'client' && !cancelled() && steps.e2e-ready.outcome == 'success' }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test ! -e /usr/local/share/ca-certificates/rct-e2e-localhost.crt
          sudo install -m 644 -- tests/e2e/infra/certs/server.crt /usr/local/share/ca-certificates/rct-e2e-localhost.crt
          printf 'RCT_E2E_SYSTEM_CERT=%s\n' /usr/local/share/ca-certificates/rct-e2e-localhost.crt >> "$GITHUB_ENV"
          sudo update-ca-certificates

      - name: Run accepted online session revocation and recovery in actual WebKit
        id: webkit-subset
        timeout-minutes: 7
        if: ${{ matrix.group == 'client' && !cancelled() && steps.webkit-ready.outcome == 'success' }}
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_SYNTHETIC_SEED: 'true'
          RCT_E2E_REMAINING5: 'true'
          RCT_E2E_WEBKIT_SUBSET: 'true'
          RCT_REMAINING5_RUN: ${{ runner.temp }}/rct-webkit-${{ github.run_id }}-${{ github.run_attempt }}
