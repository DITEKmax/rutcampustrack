<header class="shell-header">
  <div class="shell-header__title">
    <span class="shell-header__eyebrow">{{ pageEyebrow() }}</span>
    <p class="shell-header__heading">{{ pageTitle() }}</p>
  </div>

  <div class="shell-header__actions">
    <app-theme-toggle />

    @if (currentUser()) {
      <button type="button"
              class="user-chip user-chip--button"
              aria-label="Открыть профиль"
              (click)="openProfile()">
        <app-avatar [avatarId]="profile()?.avatarId" [initials]="userInitial()" [size]="36" />
        <div class="user-chip__meta">
          <span class="user-chip__name">{{ profileDisplayName() || roleLabel() }}</span>
          <span [class]="roleChipClass()">{{ roleLabel() }}</span>
        </div>
      </button>
    }
  </div>
</header>
