groups:
- name: grpc-client-dashboard
  interval: 30s
  rules:
  # Aggregate status buckets BEFORE the quantile. Keep caller instance and
  # downstream identity; these per-instance quantiles must never be averaged.
  - record: rct_grpc:client_duration_seconds:quantile5m
    labels:
      quantile: "0.5"
    expr: histogram_quantile(0.5, sum by (job, instance, environment, service, grpc_service, method, le) (rate(grpc_client_duration_seconds_bucket[5m])))
  - record: rct_grpc:client_duration_seconds:quantile5m
    labels:
      quantile: "0.95"
    expr: histogram_quantile(0.95, sum by (job, instance, environment, service, grpc_service, method, le) (rate(grpc_client_duration_seconds_bucket[5m])))
  - record: rct_grpc:client_duration_seconds:quantile5m
    labels:
      quantile: "0.99"
    expr: histogram_quantile(0.99, sum by (job, instance, environment, service, grpc_service, method, le) (rate(grpc_client_duration_seconds_bucket[5m])))
  - record: rct_grpc:client_requests:rate5m
    expr: sum by (job, instance, environment, service, grpc_service, method, status) (rate(grpc_client_duration_seconds_count[5m]))
