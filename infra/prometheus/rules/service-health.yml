# M04 Группа 9 — alert rules. QA4 + NEW-62/63/64.
#
# Правила группируются по domain — Prometheus oбрабатывает каждую
# группу sequentially, но группы независимы друг от друга. Severity
# labels routed в alertmanager.yml (critical → немедленно,
# warning → с задержкой).
groups:
  - name: service-health
    rules:
      # up == 0 пятнадцать секунд — сервис упал или не scrape-ится.
      # for=1m чтобы не фальсивить на рестартах (обычный рестарт
      # укладывается в 30-40с).
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Сервис {{ $labels.job }} недоступен"
          description: "Prometheus не может scrape {{ $labels.instance }} более 1 мин. {{ $labels.job }} либо упал, либо сеть сломана."

      # Liveness probe: actuator/health сам говорит DOWN (M04 G4 добавил
      # show-details:always + per-dep indicators). Полезно для: RabbitMQ
      # обрыв, Postgres не отвечает, Redis unreachable — сервис up, но
      # dependency упала.
      - alert: HealthCheckDown
        expr: health_status{status!="UP"} == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} health={{ $labels.status }}"
          description: "Actuator health endpoint возвращает {{ $labels.status }} более 2 мин. Проверь /actuator/health."

  - name: outbox-eventing
    rules:
      # M04 Группа 8 — outbox.lag.seconds gauge. Если старейшая pending
      # запись висит более 5 мин — publisher не справляется или
      # RabbitMQ недоступен.
      - alert: OutboxLagHigh
        expr: outbox_lag_seconds > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Outbox lag {{ $value | humanizeDuration }} в {{ $labels.job }}"
          description: "Старейшее pending-событие висит > 5 мин. Проверь RabbitMQ + publisher job logs. Событие: {{ $labels.instance }}."

      # DLQBacklog перенесён в rabbitmq.yml (M13 G19) — был silent
      # dangling до image switch на management-alpine.

  - name: http-sli
    rules:
      # M13 G19 — SLI alerts на http_server_requests_seconds (Spring
      # Boot Actuator default metric). 5xx rate > 1 req/sec на сервис
      # = регрессия release / зависимость отвалилась / panic loop.
      - alert: HighErrorRate
        expr: |
          sum by (job) (
            rate(http_server_requests_seconds_count{status=~"5.."}[5m])
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx rate > 1 req/s в {{ $labels.job }}"
          description: "{{ $labels.job }} возвращает {{ $value | printf \"%.2f\" }} req/sec ошибок 5xx за последние 5 мин. Проверь логи + последние deploy'и."

      # p95 latency > 2 сек — аномалия для всех endpoint'ов кроме
      # batch upload'ов. Использует _bucket метрику для quantile().
      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.95,
            sum by (job, le) (
              rate(http_server_requests_seconds_bucket[5m])
            )
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency > 2s в {{ $labels.job }}"
          description: "{{ $labels.job }} p95={{ $value | printf \"%.2f\" }}s за последние 10 мин. Проверь HikariPoolExhaustion + downstream latency + slow queries."

  - name: infra
    rules:
      # cAdvisor → container_fs_usage_bytes / container_fs_limit_bytes.
      # Для prod-VPS > 80% — начать чистку (Mongo/PG backup'ы, Docker
      # volumes, logs).
      - alert: DiskUsageHigh
        expr: (container_fs_usage_bytes{device=~"/dev/.*"} / container_fs_limit_bytes) > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.device }} > 80%"
          description: "{{ $value | humanizePercentage }} использования на {{ $labels.instance }}. Почисти docker volumes / старые бэкапы."

      # Heap — утечка памяти в Java-сервисах. G max JVM / heap_used
      # уже имеется через Micrometer JVM metrics.
      - alert: JvmHeapPressure
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap > 90% в {{ $labels.application }}"
          description: "{{ $labels.application }} heap={{ $value | humanizePercentage }}. Возможна утечка — сними heap dump."

      # M05 Группа 6 / P2-10/6 — HikariCP pool exhaustion. Если >80% pool
      # занято 5 минут — concurrent-queries растут быстрее чем pool
      # spec'нут (n+2+diskSpindles формула в NEW-147). Решение:
      # поднять maximum-pool-size или профилировать hot-path на leak.
      # Метрика hikaricp_connections_active / hikaricp_connections_max
      # экспортится Micrometer'ом автоматически из spring-boot-actuator.
      - alert: HikariPoolExhaustion
        expr: (hikaricp_connections_active / hikaricp_connections_max) > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HikariCP pool > 80% в {{ $labels.application }}"
          description: "{{ $labels.application }} pool={{ $value | humanizePercentage }} занято. Риск connection-timeout. Подними maximum-pool-size или ищи долгие транзакции (leak-detection-threshold=60s)."

  - name: business-anomaly
    rules:
      # Если за рабочее окно (09:00-18:00 MSK) rate checkin'ов = 0 — что-то
      # случилось: либо gateway не пускает, либо клиенты offline, либо
      # геоотметка повсеместно отваливается. Правило срабатывает только
      # в рабочие часы (Prometheus не поддерживает time-window expr
      # directly — используем hour() из Prometheus functions). Vector
      # hour() возвращает UTC, поэтому 06-15 ≈ 09-18 MSK.
      - alert: CheckinRateZero
        # G11 H5 fix: добавлен absent() branch. Без него, если counter
        # отсутствует совсем (fresh restart, 0 отметок за retention
        # window), rate() возвращает пустой vector и alert не fire'ит.
        expr: |
          (
            (rate(attendance_checkin_total[10m]) == 0)
            or absent(attendance_checkin_total)
          )
          and on() (hour() >= 6 and hour() <= 15)
          and on() (day_of_week() >= 1 and day_of_week() <= 5)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Нет гео-отметок 10 минут подряд в рабочее время"
          description: "rate(attendance.checkin)=0 уже 10 мин. Проверь Gateway + attendance-service. Если целенаправленно сервис выкачен — silence alert."

      # KI-2 silent fallback — индикатор того, что какой-то service-to-
      # service вызов до сих пор не несёт internal JWT. Не critical,
      # но должен в норме быть нулевой — пика rate > 0.1/s означает
      # регрессию.
      - alert: InternalJwtFallbackUnexpected
        expr: rate(internal_jwt_fallback_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "KI-2 fallback rate={{ $value }}/s в {{ $labels.job }}"
          description: "Silent fallback на legacy X-User-* headers. В M03a+ все service-calls обязаны нести X-Internal-Token. Проверь источник: `{{ $labels.from }}` → `{{ $labels.to }}`."
