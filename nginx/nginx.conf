worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=rct_browser_errors:1m rate=2r/s;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Requests responses are never cacheable. Keep this at http scope so the
    # policy survives location-level proxy/security header inheritance.
    map $uri $student_requests_cache_control {
        default "";
        ~^/api/v1/student/requests(?:/|$) "no-store";
    }

    # Early request errors can produce headers before the HTTPS rewrite phase.
    # Keep restrictive policies without relying on an uninitialized capture variable.
    map "" $original_normalized_uri {
        default "";
    }

    # The Mini App needs Telegram's official SDK to read native launch data.
    # Use the normalized path captured before location rewrites strip its prefix.
    map $original_normalized_uri $content_security_policy_script_src {
        default "'self'";
        ~^/mini-app/ "'self' https://telegram.org/js/telegram-web-app.js";
    }

    # The mobile apps use a same-origin camera for QR when supported by the host.
    # Keep the policy consistent on revalidation; error pages stay blocked.
    map "$status:$original_normalized_uri" $camera_permission_origin {
        default "";
        ~^(?:200|304):/(?:app|mini-app)/ self;
    }

    # Report download capabilities live in the URL path. Keep the normal
    # access log useful while replacing the complete sensitive request line.
    map $uri $safe_log_request {
        default $request;
        ~^/api/report-download/ "$request_method /api/report-download/[REDACTED] $server_protocol";
    }
    map $uri $safe_log_referer {
        default $http_referer;
        ~^/api/report-download/ "-";
    }
    map $uri $safe_log_user_agent {
        default $http_user_agent;
        ~^/api/report-download/ "-";
    }
    map $uri $referrer_policy {
        default "strict-origin-when-cross-origin";
        ~^/api/report-download/ "no-referrer";
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$safe_log_request" '
                    '$status $body_bytes_sent "$safe_log_referer" '
                    '"$safe_log_user_agent" request_time=$request_time '
                    'upstream_connect_time=$upstream_connect_time '
                    'upstream_header_time=$upstream_header_time upstream_response_time=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # M07 G11 (P2-9/3, NEW-152): глобальный лимит 2m для большинства
    # endpoint'ов (JSON payload'ы sub-kb, защита от DoS через giant body).
    # Раньше был 12m — достаточно для upload'ов, но не защищал от
    # malicious bulk-post'ов. Исключения — per-location в conf.d/default.conf:
    #   /api/attendance/excuses/with-file → 25m (multipart excuse file).
    # Остальные upload endpoint'ы не существуют (avatar = JSON preset-id,
    # не file upload).
    client_max_body_size 2m;

    # Hide nginx version in Server header (NET-01 security)
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
