<rect x="576" y="576" width="230" height="38" rx="19.0" fill="url(#accent)" stroke="none" stroke-width="1" opacity="1" /><text x="691.0" y="600.0" text-anchor="middle" fill="#F6F4FA" font-size="12" font-weight="600"><tspan x="691.0" dy="0">Search + cards + detail</tspan></text>
<text x="576" y="646" text-anchor="start" fill="#9E7AFF" font-size="14" font-weight="650"><tspan x="576" dy="0">116 · 132 · 133</tspan></text>
<text x="576" y="684" text-anchor="start" fill="#C8C2D6" font-size="15" font-weight="450"><tspan x="576" dy="0">Карточка несёт 3–5 полей; остальное —</tspan><tspan x="576" dy="22">отдельный экран.</tspan></text>
<text x="576" y="774" text-anchor="start" fill="#8A8299" font-size="13" font-weight="500"><tspan x="576" dy="0">Цена: дополнительный переход</tspan></text>
<rect x="1000" y="510" width="470" height="300" rx="26" fill="#292531" stroke="#565061" stroke-width="1" opacity="1" />
<text x="1026" y="555" text-anchor="start" fill="#F6F4FA" font-size="20" font-weight="700"><tspan x="1026" dy="0">Увидеть тенденцию</tspan></text>
<rect x="1026" y="576" width="230" height="38" rx="19.0" fill="url(#accent)" stroke="none" stroke-width="1" opacity="1" /><text x="1141.0" y="600.0" text-anchor="middle" fill="#F6F4FA" font-size="12" font-weight="600"><tspan x="1141.0" dy="0">Сводка + график + table view</tspan></text>
<text x="1026" y="646" text-anchor="start" fill="#9E7AFF" font-size="14" font-weight="650"><tspan x="1026" dy="0">102 · 103 · 131</tspan></text>
<text x="1026" y="684" text-anchor="start" fill="#C8C2D6" font-size="15" font-weight="450"><tspan x="1026" dy="0">График отвечает на вопрос, числа и таблица</tspan><tspan x="1026" dy="22">остаются доступными.</tspan></text>
<text x="1026" y="774" text-anchor="start" fill="#8A8299" font-size="13" font-weight="500"><tspan x="1026" dy="0">Цена: нужна доступная альтернатива</tspan></text>
<text x="800" y="920" text-anchor="middle" fill="#C8C2D6" font-size="16" font-weight="500"><tspan x="800" dy="0">Горизонтальный скролл остаётся для карты и короткой ленты дат, но не становится способом читать журнал.</tspan></text>
