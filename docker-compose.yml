version: "3.9"

services:
  # ============================================================
  # INFRASTRUCTURE
  # ============================================================

  postgres-academic:
    image: postgres:16
    container_name: rct-postgres-academic
    environment:
      POSTGRES_DB: academic_db
      POSTGRES_USER: rct_user
      POSTGRES_PASSWORD: ${POSTGRES_ACADEMIC_PASSWORD:-rct_dev_pass}
    expose:
      - "5432"
    volumes:
      - pg-academic-data:/var/lib/postgresql/data
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rct_user -d academic_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-schedule:
    image: postgres:16
    container_name: rct-postgres-schedule
    environment:
      POSTGRES_DB: schedule_db
      POSTGRES_USER: rct_user
      POSTGRES_PASSWORD: ${POSTGRES_SCHEDULE_PASSWORD:-rct_dev_pass}
      TZ: Europe/Moscow
    expose:
      - "5432"
    volumes:
      - pg-schedule-data:/var/lib/postgresql/data
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rct_user -d schedule_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-attendance:
    image: mongo:7
    container_name: rct-mongo-attendance
    environment:
      MONGO_INITDB_DATABASE: attendance_db
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rct-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rct-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rct_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rct_dev_pass}
    expose:
      - "5672"
    ports:
      - "15672:15672"   # Management UI — только для dev, убрать в production
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # NOTIFICATION SERVICES
  # ============================================================

  notification-web:
    build:
      context: ./services/notification-web
      dockerfile: Dockerfile
    container_name: rct-notification-web
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-rct_user}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rct_dev_pass}
    expose:
      - "9094"
    networks:
      - private_net
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9094/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  notification-bot:
    build:
      context: ./services/notification-bot
      dockerfile: Dockerfile
    container_name: rct-notification-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-placeholder}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-rct_user}:${RABBITMQ_PASSWORD:-rct_dev_pass}@rabbitmq:5672/
      ACADEMIC_GRPC_HOST: academic-service
      ACADEMIC_GRPC_PORT: "19091"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HEALTH_PORT: "8081"
    networks:
      - private_net
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  private_net:
    driver: bridge

volumes:
  pg-academic-data:
  pg-schedule-data:
  mongo-data:
  redis-data:
  rabbitmq-data:
