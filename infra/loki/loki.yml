auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# M16 G4 — diagnose `InstancesCount <= 0` от Loki ingester'а.
#
# Симптом: 1-2 ошибки/час в логах в первые секунды после старта Loki:
#   "pusher failed to consume trace data" err="DoBatch: InstancesCount <= 0"
#
# Root cause (по mimir/loki tracker'у): startup race — distributor
# (в monolithic mode он же ingester) пытается DoBatch до того как
# ingester прошёл lifecycle JOINING → ACTIVE и поднял gRPC listener.
# Ring видит self-instance, но gRPC connect к 127.0.0.1:9096 fails →
# instance помечается unhealthy → InstancesCount=0.
#
# `min_ready_duration: 15s` (= default, но эксплицитно для
# документации) — readiness endpoint /ready вернёт 200 только через
# 15s после ACTIVE, давая promtail/любым клиентам понять что Loki
# готов. Promtail respect'ит /ready перед началом push'а.
#
# Если ошибка остаётся после redeploy + 24h наблюдения — следующий
# шаг проверять что promtail НЕ начинает push до того как Loki ready
# (см. docs/operations/runbooks/loki-troubleshooting.md).
ingester:
  lifecycler:
    min_ready_duration: 15s

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://alertmanager:9093

# M04 Группа 10 — retention 14d (QA5). Alert rules пуш через
# alertmanager:9093 (в alertmanager.yml routed на notification-web
# webhook → Telegram).
limits_config:
  retention_period: 336h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem
