          retention-days: 7

      - name: Verify exact stranded semester effect reconciliation
        id: semester-reconciliation
        timeout-minutes: 9
        if: ${{ !cancelled() && steps.e2e-ready.outcome == 'success' && (steps.homework-target-sensitivity.outcome == 'skipped' || steps.homework-target-sensitivity.outputs.restorationSucceeded == 'true') }}
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_SYNTHETIC_SEED: 'true'
          RCT_SEMESTER_LIFECYCLE_RUN: ${{ runner.temp }}/rct-semester-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/tests/e2e/infra/certs/server.crt
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
          NODE_OPTIONS: --max-old-space-size=512
          CI: 'true'
        run: |
          umask 077
          printf 'RCT_SEMESTER_RECONCILIATION_RUN=%s\n' "$RCT_SEMESTER_LIFECYCLE_RUN" >> "$GITHUB_ENV"
          mkdir -m 700 -- "$RCT_SEMESTER_LIFECYCLE_RUN"
          mkdir -m 700 -- "$RCT_SEMESTER_LIFECYCLE_RUN/artifacts"
          printf 'RCT_SEMESTER_DISPOSABLE\n' > "$RCT_SEMESTER_LIFECYCLE_RUN/disposable-target"
          set +e
          npx playwright test --config playwright.semester-lifecycle.config.ts --project=chromium --grep 'FULL admin reconciles one exact stranded close before archive completion$'
          case_exit=$?
          set -e
          if ! python3 - <<'PY_RECONCILIATION_GATE'
          import json, os, stat
          from pathlib import Path

          def pairs(items):
              result = {}
              for key, value in items:
                  if key in result:
                      raise ValueError('Duplicate reconciliation field')
                  result[key] = value
              return result

          restored = False
          try:
              path = Path(os.environ['RCT_SEMESTER_LIFECYCLE_RUN']) / 'reconciliation.safe.json'
              with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW), 'rb') as stream:
                  info = os.fstat(stream.fileno())
                  if not stat.S_ISREG(info.st_mode) or stat.S_IMODE(info.st_mode) != 0o600 or not 0 < info.st_size <= 4096:
                      raise ValueError('Invalid reconciliation receipt')
                  raw = stream.read(4097)
                  if len(raw) != info.st_size:
                      raise ValueError('Reconciliation receipt size changed')
              value = json.loads(raw, object_pairs_hook=pairs,
                                 parse_constant=lambda _: (_ for _ in ()).throw(ValueError('Nonfinite reconciliation field')))
              booleans = {'exactDlqEnvelope', 'pendingBeforeReplay', 'appliedAfterReplay',
                          'sameArchiveCompleted', 'duplicateBusinessUnchanged', 'recoveryPublishAttempted',
                          'duplicateAttempted', 'restorationSucceeded', 'clockUnchanged'}
              keys = booleans | {'schema', 'phase', 'configuredListenerAttempts',
                                 'measuredListenerAttempts', 'retainedDlqCopies', 'cleanupOutcome'}
              if (type(value) is not dict or set(value) != keys
                      or value['schema'] != 'semester-reconciliation.v1'
                      or value['phase'] not in {'SETUP', 'CONTROLLED_CLOSE', 'STRANDED', 'PENDING_ARCHIVE', 'EXACT_REPLAY', 'DUPLICATE'}
                      or type(value['configuredListenerAttempts']) is not int or value['configuredListenerAttempts'] != 3
                      or value['measuredListenerAttempts'] != 'UNKNOWN'
                      or not all(type(value[key]) is bool for key in booleans)
                      or not (value['retainedDlqCopies'] == 'UNKNOWN'
                              or (type(value['retainedDlqCopies']) is int and value['retainedDlqCopies'] == 1))
                      or value['cleanupOutcome'] not in {'PENDING', 'PASSED', 'FAILED'}):
                  raise ValueError('Invalid closed reconciliation schema')
              restored = (value['restorationSucceeded'] is True
                          and value['clockUnchanged'] is True and value['cleanupOutcome'] == 'PASSED')
          except Exception:
              pass
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('restorationSucceeded=' + str(restored).lower() + '\n')
          print('Semester reconciliation restoration gate: ' + ('RESTORED' if restored else 'UNPROVEN'))
          if not restored:
              raise SystemExit(1)
          PY_RECONCILIATION_GATE
          then
            if [ "$case_exit" -ne 0 ]; then exit "$case_exit"; fi
            exit 1
          fi
          exit "$case_exit"

      - name: Upload closed semester reconciliation outcome
        if: always() && steps.semester-reconciliation.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: semester-reconciliation-safe-${{ github.run_attempt }}
          path: |
            ${{ env.RCT_SEMESTER_RECONCILIATION_RUN }}/artifacts/safe-results.json
            ${{ env.RCT_SEMESTER_RECONCILIATION_RUN }}/reconciliation.safe.json
          if-no-files-found: warn
          retention-days: 7

      - name: Record a closed exception hint after the failed archived lesson report
        if: ${{ !cancelled() && steps.semester-reconciliation.outcome == 'failure' }}
        timeout-minutes: 1
        env:
          RCT_HTTP500_DIAGNOSTIC_STAGE: REPORT500
          RCT_E2E_SYNTHETIC_SEED: 'true'
        run: &closed-http500-diagnostic |
          python3 - <<'PY_HTTP500_DIAGNOSTIC'
          import hashlib, json, os, re, selectors, stat, subprocess, time
          from pathlib import Path

          STAGES = {
              'STUDENT_STATS503': ('RCT_LESSON_LIFECYCLE_RUN', 'rct-lesson-lifecycle-',
                                   ('artifacts',), 'mobile-schedule-lifecycle.spec.ts', 'STUDENT_STATS_HTTP503',
                                   'attendance-service', 'ATTENDANCE_STUDENT_PROJECTION',
                                   'ru.rutcampustrack.attendance.grpc.AttendanceStudentGrpcServiceImpl.getStudentAttendanceProjection',
                                   'AttendanceStudentGrpcServiceImpl.java'),
              'REPORT500': ('RCT_SEMESTER_RECONCILIATION_RUN', 'rct-semester-reconciliation-',
                            ('artifacts',), 'semester-lifecycle.spec.ts', 'DATASET_ATTENDANCE_REPORT_HTTP',
                            'attendance-service', 'ATTENDANCE_LESSON_REPORT',
                            'ru.rutcampustrack.attendance.report.ReportController.getLessonAttendance',
                            'ReportController.java'),
              'LESSON_CREATE500': ('RCT_ASSIGNMENT_LIFECYCLE_RUN', 'rct-assignment-lifecycle-',
                                  ('artifacts', 'prepare'), 'assignment-lifecycle.spec.ts',
                                  'DATASET_LESSON_CREATE_HTTP', 'schedule-service', 'SCHEDULE_ONEOFF_LESSON_CREATE',
                                  'ru.rutcampustrack.schedule.oneoff.OneOffLessonController.createOneOffLesson',
                                  'OneOffLessonController.java'),
          }
          CLASSES = {
              'io.grpc.StatusRuntimeException': 'GRPC_STATUS',
              'io.grpc.StatusException': 'GRPC_STATUS',
              'org.postgresql.util.PSQLException': 'POSTGRESQL',
              'javax.net.ssl.SSLHandshakeException': 'TLS_HANDSHAKE',
              'java.net.ConnectException': 'CONNECT',
              'java.lang.IllegalStateException': 'ILLEGAL_STATE',
              'java.lang.IllegalArgumentException': 'ILLEGAL_ARGUMENT',
              'java.lang.NullPointerException': 'NULL_POINTER',
              'org.springframework.dao.DataIntegrityViolationException': 'DATA_INTEGRITY',
              'org.springframework.http.converter.HttpMessageNotWritableException': 'HTTP_SERIALIZATION',
          }
          PROJECTION_KINDS = {
              'INVALID_OCCURRENCE', 'DUPLICATE_OCCURRENCE', 'UNSUPPORTED_ATTENDANCE_STATUS',
              'INVALID_ROSTER', 'INVALID_METRICS', 'ACADEMIC_DEPENDENCY', 'SCHEDULE_DEPENDENCY', 'UNKNOWN',
          } | {'RPC_' + code for code in (
              'OK', 'CANCELLED', 'UNKNOWN', 'INVALID_ARGUMENT', 'DEADLINE_EXCEEDED', 'NOT_FOUND',
              'ALREADY_EXISTS', 'PERMISSION_DENIED', 'RESOURCE_EXHAUSTED', 'FAILED_PRECONDITION',
              'ABORTED', 'OUT_OF_RANGE', 'UNIMPLEMENTED', 'INTERNAL', 'UNAVAILABLE', 'DATA_LOSS', 'UNAUTHENTICATED')}
          PROJECTION_STAGES = {'ACADEMIC_SCOPE', 'ACADEMIC_MEMBERS', 'SCHEDULE_LESSONS',
                               'CURRENT_GROUP_SCOPE', 'GROUP_CATALOGUE', 'GROUP_SERIES', 'OWN_MARKS',
                               'LESSON_SNAPSHOT', 'RANK', 'UNKNOWN'}
          STATS_SOURCES = {
              'tests/e2e/specs/mobile-schedule-lifecycle.spec.ts':
                  'cbe0122cdcd7f9ee73f50811f884accca1f9a6ed0f7776580755c6df52088eb3',
              'services/attendance-service/attendance-app/src/main/java/ru/rutcampustrack/attendance/grpc/AttendanceStudentGrpcServiceImpl.java':
                  'f5a49c00d8cb1724830876994ac5d93a14b36375dc8180db3163537f2190b3f0',
          }
          LIMIT = 8388608

          def decode(raw):
              def pairs(items):
                  result = {}
                  for key, value in items:
                      if key in result:
                          raise ValueError('Duplicate closed field')
                      result[key] = value
                  return result
              return json.loads(raw, object_pairs_hook=pairs,
                                parse_constant=lambda _: (_ for _ in ()).throw(ValueError()))

          def output(state, stage, category='UNKNOWN'):
              return {'state': state, 'exceptionCategory': category, 'sourceStage': stage}

          def is_student_stats_failure(value):
              keys = {'file', 'line', 'project', 'status', 'expectedStatus', 'durationMs',
                      'errorCount', 'diagnostics', 'errorLocations'}
              expected = {('mobile-attendance-requests.spec.ts', 9), ('mobile-lesson-lifecycle.spec.ts', 20),
                          ('mobile-schedule-lifecycle.spec.ts', 390), ('mobile-schedule-lifecycle.spec.ts', 1771)}
              seen, target = set(), None
              for row in value['results']:
                  if type(row) is not dict or set(row) != keys:
                      return False
                  identity = (row['file'], row['line'])
                  if (type(row['file']) is not str or type(row['line']) is not int
                          or identity not in expected or identity in seen or row['project'] != 'chromium'
                          or row['status'] not in {'passed', 'failed', 'timedOut', 'skipped', 'interrupted'}
                          or row['expectedStatus'] != 'passed' or type(row['errorCount']) is not int
                          or not 0 <= row['errorCount'] <= 8 or type(row['durationMs']) not in (int, float)
                          or not 0 <= row['durationMs'] <= 1800000
                          or type(row['diagnostics']) is not list or len(row['diagnostics']) > 8
                          or not all(type(item) is dict and set(item) == {'stage', 'cause', 'httpStatus'}
                                     and type(item['stage']) is str and type(item['cause']) is str
                                     and type(item['httpStatus']) is int for item in row['diagnostics'])
                          or type(row['errorLocations']) is not list
                          or len(row['errorLocations']) > row['errorCount']
                          or not all(type(frame) is dict and set(frame) == {'file', 'line'}
                                     and type(frame['file']) is str and type(frame['line']) is int
                                     and 0 < frame['line'] < 1000000 for frame in row['errorLocations'])):
                      return False
                  seen.add(identity)
                  if identity == ('mobile-schedule-lifecycle.spec.ts', 390):
                      target = row
              return (seen == expected and target['status'] == 'failed' and target['errorCount'] == 1
                      and target['errorLocations'] == [{'file': 'mobile-schedule-lifecycle.spec.ts', 'line': 1363}])

          def is_target_failure(value, config):
              core = {'status', 'runnerErrors', 'unsafeArtifact', 'suppressedStdoutBytes',
                      'suppressedStderrBytes', 'results'}
              if (type(value) is not dict or set(value) != core or value['status'] != 'failed'
                      or type(value['runnerErrors']) is not int or value['runnerErrors'] != 0
                      or value['unsafeArtifact'] is not False
                      or any(type(value[key]) is not int or value[key] != 0
                             for key in ('suppressedStdoutBytes', 'suppressedStderrBytes'))
                      or type(value['results']) is not list
                      or len(value['results']) != (4 if config[4] == 'STUDENT_STATS_HTTP503' else 1)):
                  return False
              if config[4] == 'STUDENT_STATS_HTTP503':
                  return is_student_stats_failure(value)
              row = value['results'][0]
              keys = {'file', 'line', 'project', 'status', 'expectedStatus', 'durationMs',
                      'errorCount', 'diagnostics', 'errorLocations'}
              return (type(row) is dict and set(row) == keys and row['file'] == config[3]
                      and type(row['line']) is int and 0 < row['line'] < 1000000
                      and row['project'] == 'chromium' and row['status'] == 'failed'
                      and row['expectedStatus'] == 'passed' and type(row['errorCount']) is int
                      and 0 < row['errorCount'] <= 8 and type(row['diagnostics']) is list
                      and 0 < len(row['diagnostics']) <= 8
                      and all(type(item) is dict and set(item) == {'stage', 'cause', 'httpStatus'}
                              for item in row['diagnostics'])
                      and {'stage': 'DATASET_HTTP', 'cause': config[4], 'httpStatus': 500}
                          in row['diagnostics'])

          def classify_projection(payload, config):
              # An unkeyed log record is a reported operation hint, never exact request causality.
              stage = config[6]
              pattern = re.compile(r'Student projection failed: kind=([A-Z_]+), stage=([A-Z_]+)')
              matches, unusable = [], False
              for line in payload.splitlines():
                  if len(line) > 131072:
                      unusable = True
                      continue
                  try:
                      record = decode(line)
                  except (ValueError, UnicodeError, RecursionError):
                      unusable = True
                      continue
                  if type(record) is not dict:
                      unusable = True
                      continue
                  if (record.get('logger') != 'ru.rutcampustrack.attendance.grpc.AttendanceStudentGrpcServiceImpl'
                          or record.get('level') != 'WARN'):
                      continue
                  message = record.get('msg')
                  match = pattern.fullmatch(message) if type(message) is str else None
                  if not match or match[1] not in PROJECTION_KINDS or match[2] not in PROJECTION_STAGES:
                      unusable = True
                      continue
                  matches.append((match[1], match[2]))
              if unusable:
                  return output('UNAVAILABLE_LOG_FORMAT', stage)
              distinct = sorted(set(matches))
              if len(distinct) > 1:
                  pairs = '|'.join(kind + '@' + source for kind, source in distinct)
                  return output('AMBIGUOUS', stage, 'REPORTED_PAIRS:' + pairs)
              return (output('UNIQUE', stage + '_' + distinct[0][1], 'REPORTED_' + distinct[0][0])
                      if distinct else output('ABSENT', stage))

          def classify(payload, config):
              stage = config[6]
              if len(payload) > LIMIT or len(payload.splitlines()) > 200:
                  return output('UNAVAILABLE_LOG_FORMAT', stage)
              if config[4] == 'STUDENT_STATS_HTTP503':
                  return classify_projection(payload, config)
              frame = re.compile(r'(?m)^[ \t]*at (?:[A-Za-z0-9_.$/@-]{1,256}/)?'
                                 + re.escape(config[7] + '(' + config[8] + ':') + r'[1-9][0-9]{0,5}\)')
              throwable = re.compile(r'(?m)^[ \t]*(?:Caused by: )?'
                                     r'((?:[A-Za-z_$][A-Za-z0-9_$]*\.)+'
                                     r'[A-Za-z_$][A-Za-z0-9_$]*(?:Exception|Error))(?::|$)')
              matches, unusable = [], False
              for line in payload.splitlines():
                  if len(line) > 131072:
                      unusable = True
                      continue
                  try:
                      record = decode(line)
                  except (ValueError, UnicodeError, RecursionError):
                      unusable = True
                      continue
                  if type(record) is not dict:
                      unusable = True
                      continue
                  if (record.get('logger') != 'ru.rutcampustrack.shared.web.exception.GlobalExceptionHandler'
                          or record.get('level') != 'ERROR'):
                      continue
                  stack = record.get('stack')
                  if type(stack) is not str or len(stack.encode()) > 131072:
                      unusable = True
                      continue
                  frames = frame.findall(stack)
                  if not frames:
                      continue
                  if len(frames) != 1 or re.search(r'(?m)^[ \t]*Suppressed:', stack):
                      return output('AMBIGUOUS', stage)
                  kinds = throwable.findall(stack)
                  matches.append(CLASSES.get(kinds[-1], 'UNKNOWN') if kinds else 'UNKNOWN')
              if unusable:
                  return output('UNAVAILABLE_LOG_FORMAT', stage)
              if len(matches) > 1:
                  return output('AMBIGUOUS', stage)
              return output('UNIQUE', stage, matches[0]) if matches else output('ABSENT', stage)

          def load_failure(config):
              if (os.environ.get('GITHUB_ACTIONS') != 'true'
                      or os.environ.get('RUNNER_ENVIRONMENT') != 'github-hosted'
                      or os.environ.get('RCT_E2E_SYNTHETIC_SEED') != 'true'):
                  raise ValueError('Disposable diagnostic unavailable')
              if config[4] == 'STUDENT_STATS_HTTP503':
                  for source, digest in STATS_SOURCES.items():
                      path = Path(source)
                      info = path.lstat()
                      if (not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= 262144
                              or hashlib.sha256(path.read_bytes()).hexdigest() != digest):
                          raise ValueError('Projection diagnostic source changed')
              run, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
              if not re.fullmatch(r'[1-9][0-9]{0,19}', run) or not re.fullmatch(r'[1-9][0-9]{0,5}', attempt):
                  raise ValueError('Invalid diagnostic binding')
              temporary = Path(os.environ['RUNNER_TEMP'])
              work = Path(os.environ[config[0]])
              if not temporary.is_absolute() or work != temporary / (config[1] + run + '-' + attempt):
                  raise ValueError('Invalid diagnostic directory')
              for directory in [work] + [work.joinpath(*config[2][:i]) for i in range(1, len(config[2]) + 1)]:
                  info = directory.lstat()
                  if not stat.S_ISDIR(info.st_mode) or stat.S_IMODE(info.st_mode) != 0o700 or info.st_uid != os.getuid():
                      raise ValueError('Invalid private directory')
              path = work.joinpath(*config[2], 'safe-results.json')
              before = path.lstat()
              with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW), 'rb') as stream:
                  info = os.fstat(stream.fileno())
                  if (not stat.S_ISREG(info.st_mode) or stat.S_IMODE(info.st_mode) != 0o600
                          or info.st_uid != os.getuid() or not 0 < info.st_size <= 32768
                          or (info.st_dev, info.st_ino) != (before.st_dev, before.st_ino)):
                      raise ValueError('Invalid closed input')
                  raw = stream.read(32769)
                  if len(raw) != info.st_size:
                      raise ValueError('Closed input changed')
              return decode(raw)

          def collect(config):
              global result
              deadline, remaining_bytes = time.monotonic() + 15, LIMIT
              def remaining():
                  seconds = deadline - time.monotonic()
                  if seconds <= 0:
                      raise TimeoutError('Diagnostic deadline')
                  return seconds
              def call(argv, merge_stderr=False):
                  nonlocal remaining_bytes
                  payload = bytearray()
                  with subprocess.Popen(argv, stdout=subprocess.PIPE,
                                        stderr=subprocess.STDOUT if merge_stderr else subprocess.DEVNULL) as child:
                      try:
                          with selectors.DefaultSelector() as ready:
                              ready.register(child.stdout, selectors.EVENT_READ)
                              while True:
                                  if not ready.select(remaining()):
                                      raise TimeoutError('Diagnostic deadline')
                                  chunk = os.read(child.stdout.fileno(), min(65536, remaining_bytes + 1))
                                  if not chunk:
                                      break
                                  remaining_bytes -= len(chunk)
                                  if remaining_bytes < 0:
                                      raise ValueError('Diagnostic byte limit')
                                  payload.extend(chunk)
                          if child.wait(timeout=remaining()):
                              raise ValueError('Diagnostic command failed')
                      finally:
                          if child.poll() is None:
                              child.kill()
                          child.wait(timeout=5)
                  return bytes(payload)
              compose = ['docker', 'compose', '--env-file', 'tests/e2e/.env.ci', '-p', 'rct-e2e',
                         '-f', 'docker-compose.e2e.yml', '-f', 'tests/e2e/infra/docker-compose.clock-fixture.yml']
              cid = call([*compose, 'ps', '-q', config[5]]).decode().strip()
              if not re.fullmatch('[0-9a-f]{64}', cid):
                  raise ValueError('Owned service unavailable')
              template = '[{{json .Id}},{{json (index .Config.Labels "com.docker.compose.project")}},{{json (index .Config.Labels "com.docker.compose.service")}},{{json .State.Running}}]'
              def verify():
                  if decode(call(['docker', 'inspect', '--format', template, cid])) != [cid, 'rct-e2e', config[5], True]:
                      raise ValueError('Owned service changed')
              verify()
              result = output('UNAVAILABLE_LOG_CAPTURE', config[6])
              payload = call(['docker', 'logs', '--since', '180s', '--tail', '200', cid], True)
              result = output('UNAVAILABLE_SERVICE_OWNERSHIP', config[6])
              verify()
              return payload

          result = output('UNAVAILABLE_PRIVATE_INPUT', 'UNKNOWN')
          try:
              config = STAGES[os.environ['RCT_HTTP500_DIAGNOSTIC_STAGE']]
              result = output('UNAVAILABLE_PRIVATE_INPUT', config[6])
              failure = load_failure(config)
              result = output('UNAVAILABLE_TARGET_SIGNATURE', config[6])
              if is_target_failure(failure, config):
                  result = output('UNAVAILABLE_SERVICE_OWNERSHIP', config[6])
                  payload = collect(config)
                  result = output('UNAVAILABLE_LOG_FORMAT', config[6])
                  result = classify(payload, config)
          except Exception:
              pass
          print(json.dumps(result, sort_keys=True))
          PY_HTTP500_DIAGNOSTIC

      - name: Verify interrupted assignment closure and next-day replacement
        id: assignment-lifecycle
        timeout-minutes: 12
        if: ${{ !cancelled() && steps.e2e-ready.outcome == 'success' && (steps.homework-target-sensitivity.outcome == 'skipped' || steps.homework-target-sensitivity.outputs.restorationSucceeded == 'true') && steps.semester-reconciliation.outputs.restorationSucceeded == 'true' }}
        env:
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_SYNTHETIC_SEED: 'true'
          RCT_ASSIGNMENT_LIFECYCLE_RUN: ${{ runner.temp }}/rct-assignment-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/tests/e2e/infra/certs/server.crt
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
          NODE_OPTIONS: --max-old-space-size=512
          CI: 'true'
        run: |
          umask 077
          printf 'RCT_ASSIGNMENT_LIFECYCLE_RUN=%s\n' "$RCT_ASSIGNMENT_LIFECYCLE_RUN" >> "$GITHUB_ENV"
          python3 - <<'PY_ASSIGNMENT'
          import datetime, json, os, re, selectors, subprocess, time
          from pathlib import Path

          root = Path.cwd()
          work = Path(os.environ['RCT_ASSIGNMENT_LIFECYCLE_RUN'])
          work.mkdir(mode=0o700)
          (work / 'artifacts').mkdir(mode=0o700)
          for phase in ('prepare', 'pending', 'resume'):
              (work / 'artifacts' / phase).mkdir(mode=0o700)
          (work / 'disposable-target').write_text('RCT_ASSIGNMENT_LIFECYCLE_DISPOSABLE\n')
          compose = ['docker', 'compose', '--env-file', 'tests/e2e/.env.ci', '-p', 'rct-e2e',
                     '-f', 'docker-compose.e2e.yml', '-f', 'tests/e2e/infra/docker-compose.clock-fixture.yml']

          def call(argv, *, cwd=root, env=None, seconds=180):
              result = subprocess.run(argv, cwd=cwd, env=env, stdout=subprocess.PIPE,
                                      stderr=subprocess.PIPE, timeout=seconds)
              if result.returncode:
                  raise RuntimeError('Assignment lifecycle command failed')
              return result.stdout

          def inspect(cid):
              info = json.loads(call(['docker', 'inspect', cid], seconds=15))[0]
              labels = info['Config']['Labels']
              if (labels.get('com.docker.compose.project') != 'rct-e2e'
                      or labels.get('com.docker.compose.service') != 'schedule-service'):
                  raise RuntimeError('Schedule ownership mismatch')
              return info

          def api(phase, restart_ready_until_ms=None):
              env = {**os.environ, 'RCT_ASSIGNMENT_LIFECYCLE_PHASE': phase}
              if phase == 'resume':
                  if not isinstance(restart_ready_until_ms, int):
                      raise RuntimeError('Assignment restart deadline is missing')
                  env['RCT_ASSIGNMENT_RESTART_READY_UNTIL_MS'] = str(restart_ready_until_ms)
              call(['npx', 'playwright', 'test', '--config', 'playwright.assignment-lifecycle.config.ts',
                    '--project=chromium'], cwd=root / 'tests/e2e',
                   env=env,
                   seconds=330 if phase == 'prepare' else 150)

          def close_failure_diagnostic(since):
              academic = call([*compose, 'ps', '-q', 'academic-service'], seconds=15).decode().strip()
              info = json.loads(call(['docker', 'inspect', academic], seconds=15))[0]
              labels = info['Config']['Labels']
              if (labels.get('com.docker.compose.project') != 'rct-e2e'
                      or labels.get('com.docker.compose.service') != 'academic-service'):
                  raise RuntimeError('Academic diagnostic ownership mismatch')
              payload = bytearray()
              deadline = time.monotonic() + 15
              with subprocess.Popen(['docker', 'logs', '--since', since, '--tail', '200', academic],
                                    stdout=subprocess.PIPE, stderr=subprocess.STDOUT) as process:
                  try:
                      with selectors.DefaultSelector() as ready:
                          ready.register(process.stdout, selectors.EVENT_READ)
                          while True:
                              remaining = deadline - time.monotonic()
                              if remaining <= 0 or not ready.select(remaining):
                                  raise TimeoutError('Academic diagnostic deadline')
                              chunk = os.read(process.stdout.fileno(), min(65536, 8388609 - len(payload)))
                              if not chunk:
                                  break
                              payload.extend(chunk)
                              if len(payload) > 8388608:
                                  print('ASSIGNMENT_CLOSE_DIAGNOSTIC_UNAVAILABLE')
                                  return
                      if process.wait(timeout=max(0.01, deadline - time.monotonic())):
                          print('ASSIGNMENT_CLOSE_DIAGNOSTIC_UNAVAILABLE')
                          return
                  finally:
                      if process.poll() is None:
                          process.kill()
                      process.wait(timeout=5)
              classes = {
                  'io.grpc.StatusRuntimeException': 'GRPC_STATUS',
                  'io.grpc.StatusException': 'GRPC_STATUS',
                  'org.postgresql.util.PSQLException': 'POSTGRESQL',
                  'javax.net.ssl.SSLHandshakeException': 'TLS_HANDSHAKE',
                  'java.net.ConnectException': 'CONNECT',
                  'java.lang.IllegalStateException': 'ILLEGAL_STATE',
                  'java.lang.IllegalArgumentException': 'ILLEGAL_ARGUMENT',
              }
              sites = {'ScheduleGrpcClient.java': 'ACADEMIC_SCHEDULE_GRPC',
                       'AssignmentClosureService.java': 'ASSIGNMENT_CLOSURE'}
              statuses = {'OK', 'CANCELLED', 'UNKNOWN', 'INVALID_ARGUMENT', 'DEADLINE_EXCEEDED',
                          'NOT_FOUND', 'ALREADY_EXISTS', 'PERMISSION_DENIED', 'RESOURCE_EXHAUSTED',
                          'FAILED_PRECONDITION', 'ABORTED', 'OUT_OF_RANGE', 'UNIMPLEMENTED',
                          'INTERNAL', 'UNAVAILABLE', 'DATA_LOSS', 'UNAUTHENTICATED'}
              pattern = re.compile(r'Assignment lifecycle pending operationId=([0-9a-fA-F-]{36}) '
                                   r'operationKind=CLOSE_UNASSIGN phase=RESUME_CLOSE '
                                   r'failureClass=([A-Za-z0-9_.$]{1,256}) grpcStatus=([A-Z_]{1,32}) '
                                   r'applicationFrame=(NONE|[A-Za-z0-9_.$-]{1,128}#[A-Za-z0-9_.$<>-]{1,128}:-?[0-9]{1,9})')
              warnings, operations = [], set()
              for line in payload.splitlines():
                  if len(line) > 16384:
                      continue
                  try:
                      record = json.loads(line)
                      if record.get('logger') != 'ru.rutcampustrack.academic.assignment.AssignmentClosureService':
                          continue
                      message = record.get('msg')
                      match = pattern.fullmatch(message) if isinstance(message, str) else None
                      if not match or match[3] not in statuses:
                          continue
                      operations.add(match[1])
                      warnings.append({'operationKind': 'CLOSE_UNASSIGN', 'phase': 'RESUME_CLOSE',
                                       'failureClass': classes.get(match[2], 'OTHER'),
                                       'grpcStatus': match[3],
                                       'applicationSite': ('NONE' if match[4] == 'NONE' else
                                                           sites.get(match[4].split('#', 1)[0], 'OTHER'))})
                  except (ValueError, TypeError, AttributeError):
                      continue
              print(json.dumps({'diagnostic': 'ASSIGNMENT_CLOSE', 'resumeWindow': True,
                                'state': 'MATCHES' if warnings else 'NO_MATCH',
                                'singleOperation': len(operations) == 1, 'warnings': warnings[-4:]}))

          cid = call([*compose, 'ps', '-q', 'schedule-service'], seconds=15).decode().strip()
          if not cid:
              raise SystemExit('Owned Schedule is missing')
          original = inspect(cid)
          if not original['State']['Running'] or original['State'].get('Health', {}).get('Status') != 'healthy':
              raise SystemExit('Owned Schedule is not ready')
          restart_needed = False
          stage = 'prepare'
          resume_since = None

          def restart():
              ready_until_ms = int((time.time() + 120) * 1000)
              call([*compose, 'up', '-d', '--no-build', '--no-recreate', '--no-deps', '--pull', 'never',
                    '--wait', '--wait-timeout', '120', 'schedule-service'], seconds=150)
              current = call([*compose, 'ps', '-q', 'schedule-service'], seconds=15).decode().strip()
              info = inspect(current)
              if (current != cid or info['Image'] != original['Image']
                      or not info['State']['Running']
                      or info['State'].get('Health', {}).get('Status') != 'healthy'):
                  raise RuntimeError('Original Schedule did not recover')
              return ready_until_ms

          try:
              api('prepare')
              stage = 'pending'
              restart_needed = True
              call([*compose, 'stop', '--timeout', '15', 'schedule-service'], seconds=45)
              if inspect(cid)['State']['Running']:
                  raise RuntimeError('Owned Schedule did not stop')
              api('pending')
              stage = 'restart'
              restart_ready_until_ms = restart()
              restart_needed = False
              stage = 'resume'
              resume_since = datetime.datetime.now(datetime.timezone.utc).isoformat()
              api('resume', restart_ready_until_ms)
              print('PASS real assignment closure retry, retained history and next-day replacement')
          except Exception as error:
              if stage == 'resume' and resume_since:
                  try:
                      close_failure_diagnostic(resume_since)
                  except Exception:
                      print('ASSIGNMENT_CLOSE_DIAGNOSTIC_UNAVAILABLE')
              print('FAIL assignment lifecycle stage=' + stage + ' class=' + type(error).__name__)
              raise SystemExit(1)
          finally:
              if restart_needed:
                  restart()
          PY_ASSIGNMENT

