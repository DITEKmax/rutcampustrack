                                  value = run[offset:offset + size]
                                  if value in candidates:
                                      counts[value] = counts.get(value, 0) + 1
                      for value in notes:
                          offset = text.find(value)
                          while offset >= 0:
                              counts[value] = counts.get(value, 0) + 1
                              offset = text.find(value, offset + 1)
                      for value in values:
                          if counts.get(value, 0) != len(allowed.get(value, ())):
                              blocked.add(value)
                  values = seen_allowed - blocked
                  for rule in ("sourcegraph-access-token", "generic-api-key"):
                      admitted = sorted(v for v in values if rule == "generic-api-key" or hex40.fullmatch(v))
                      if not admitted:
                          continue
                      allowlists[rule].extend(["[[rules.allowlists]]",
                                        'condition = "AND"', 'regexTarget = "secret"',
                                        "paths = [" + json.dumps("^" + re.escape(path) + "$") + "]",
                                        "regexes = [" + json.dumps("^(?:" + "|".join(re.escape(v) for v in admitted) + ")$") + "]", ""])
              for rule, entries in allowlists.items():
                  if entries:
                      generated.extend(["[[rules]]", "id = " + json.dumps(rule)] + entries)
              text = "\n".join(generated)
              if len(text.encode()) > limits["config_bytes"] or output.exists() or output.parent.stat().st_mode & 0o077:
                  raise ValueError
              with output.open("x", encoding="utf-8") as stream:
                  stream.write(text)

          try:
              metadata_config(Path(os.environ["RCT_GITLEAKS_METADATA_CONFIG"]), revision)
          except Exception:
              raise SystemExit("Gitleaks metadata preparation failed") from None

          # Walk every parent; first-parent applies only to how merge diffs are shown.
          print("--full-history --diff-merges=first-parent " + revision)
          PY
          )"
          test "$(uname -m)" = x86_64
          tool_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks-8.24.3.XXXXXX")"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$tool_dir/archive.tar.gz"
          printf '%s  %s\n' \
            9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c \
            "$tool_dir/archive.tar.gz" | sha256sum --check --status
          tar -xzf "$tool_dir/archive.tar.gz" -C "$tool_dir" gitleaks
          scan_status=0
          "$tool_dir/gitleaks" detect --source . --redact=100 --exit-code=2 \
            --report-format=sarif --report-path=results.sarif \
            --config="$RCT_GITLEAKS_METADATA_CONFIG" --gitleaks-ignore-path=.gitleaksignore --log-opts="$log_opts" || scan_status=$?
          if [[ "$scan_status" -eq 0 || "$scan_status" -eq 2 ]]; then
            if [[ -s results.sarif ]]; then
              echo 'has_report=true' >> "$GITHUB_OUTPUT"
            elif [[ "$scan_status" -eq 0 ]]; then
              exit 1
            fi
          fi
          exit "$scan_status"

      - name: Retain redacted Gitleaks SARIF
        if: ${{ always() && steps.gitleaks.outputs.has_report == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-results.sarif
          path: results.sarif
          if-no-files-found: error

  trivy-images:
    name: Trivy (built images)
    runs-on: ubuntu-latest
    # Только на schedule — weekly deep scan GHCR-образов. На push/PR
    # используется Trivy fs (быстрее, не требует pull всех 11 образов).
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        image:
          - auth-service
          - academic-service
          - schedule-service
          - attendance-service
          - document-renderer-service
          - notification-web
          - notification-bot
          - api-gateway
          - pwa-nginx
          - mini-app-nginx
          - landing-nginx
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy image scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0 — M08 G11 SHA-pin
        with:
          image-ref: ghcr.io/ditekmax/rutcampustrack/${{ matrix.image }}:latest
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
