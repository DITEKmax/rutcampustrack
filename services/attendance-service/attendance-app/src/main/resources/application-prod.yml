management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # M04 QA6: prod не переопределяет — default уже always.
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Schedule's binding and lesson RPCs use the same authenticated TLS channel in
# prod. Trust material is supplied by the deployment, with no plaintext
# fallback when the prod profile is active.
grpc:
  client:
    schedule-service:
      negotiation-type: TLS
      security:
        trust-cert-collection: ${SCHEDULE_GRPC_TRUST_CERT_COLLECTION}
        authority-override: ${SCHEDULE_GRPC_TLS_AUTHORITY:schedule-service}
    academic-service:
      negotiation-type: TLS
      security:
        trust-cert-collection: ${ACADEMIC_GRPC_TRUST_CERT_COLLECTION}
        authority-override: ${ACADEMIC_GRPC_TLS_AUTHORITY}
