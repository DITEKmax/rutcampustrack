  # ============================================================
  # NOTIFICATION SERVICES
  # ============================================================

  notification-web:
    build:
      context: .
      dockerfile: services/notification-service/notification-app/Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/notification-web:${IMAGE_TAG:-latest}
    container_name: rct-notification-web
    logging: *bounded-logs
    environment:
      MANAGEMENT_TRACING_BAGGAGE_REMOTE_FIELDS: requestId
      MANAGEMENT_TRACING_BAGGAGE_CORRELATION_FIELDS: requestId
      MANAGEMENT_TRACING_BAGGAGE_TAG_FIELDS: requestId
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_MAX_QUEUE_SIZE: "1024"
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_MAX_BATCH_SIZE: "128"
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_TIMEOUT: 1s
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_SCHEDULE_DELAY: 5s
      MANAGEMENT_OTLP_TRACING_TIMEOUT: 1s
      MANAGEMENT_OTLP_TRACING_CONNECT_TIMEOUT: 1s
      BOT_TO_NOTIFICATION_SERVICE_TOKEN: ${BOT_TO_NOTIFICATION_SERVICE_TOKEN:?BOT_TO_NOTIFICATION_SERVICE_TOKEN must be set}
      SPRING_PROFILES_ACTIVE: prod
      DEPLOYMENT_ENVIRONMENT: production
      SERVICE_VERSION: ${IMAGE_TAG:-unknown}
      MANAGEMENT_METRICS_TAGS_ENVIRONMENT: production
      MANAGEMENT_METRICS_TAGS_VERSION: ${IMAGE_TAG:-unknown}
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      GRPC_SECRET: ${GRPC_SECRET:?GRPC_SECRET must be set}
      ACADEMIC_GRPC_TRUST_CERT_COLLECTION: file:/run/rct-academic-tls/academic-server.crt
      ACADEMIC_GRPC_TLS_AUTHORITY: ${ACADEMIC_GRPC_TLS_AUTHORITY:?ACADEMIC_GRPC_TLS_AUTHORITY must be set}
      # M04 QA2 — distributed tracing OTLP exporter (HTTP/protobuf, M16 G1: 4317→4318).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: '5672'
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # M14 G9 (CSO HIGH-06): notification-service application.yml использует
      # ${RABBITMQ_PASSWORD} (не SPRING_RABBITMQ_PASSWORD) →
      # RequiredSecretsValidator ищет env var ровно с этим именем. Без
      # дублирования validator fail-fast'нет на boot.
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # M14 G9 (CSO HIGH-06): INTERNAL_ISSUER_SECRET для WS-ticket consume
      # (notification.ws-ticket.internal-issuer-secret в application.yml).
      # Должен совпадать с api-gateway / auth-service INTERNAL_ISSUER_SECRET.
      INTERNAL_ISSUER_SECRET: ${INTERNAL_ISSUER_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_PUBLIC_KEY_PATH: /keys/public.key
      NOTIFICATION_WS_ALLOWED_ORIGINS: ${NOTIFICATION_WS_ALLOWED_ORIGINS:-https://ruttrack.site}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # M04 Группа 9 — shared secret для Alertmanager webhook в /internal/alert.
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET}
      # M10 G1 D3 — отдельная БД notification_db + отдельный credential
      # MONGO_NOTIFICATION_USER (PoLP — D2).
      # M13 G7: ?replicaSet=rs0 для MongoTransactionManager multi-doc transactions.
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_NOTIFICATION_USER}:${MONGO_NOTIFICATION_PASSWORD}@mongo-attendance:27017/notification_db?authSource=admin&replicaSet=rs0
      # M10 G1 D4 — retention для notification_history (дней).
      NOTIFICATION_HISTORY_TTL_DAYS: ${NOTIFICATION_HISTORY_TTL_DAYS:-30}
      # M09 G7 (NEW-157).
      JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp'
    volumes:
      - ${ACADEMIC_GRPC_TLS_DIR:?ACADEMIC_GRPC_TLS_DIR must be set}/academic-server.crt:/run/rct-academic-tls/academic-server.crt:ro
    expose:
      - '9094'
    networks:
      - private_net
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo-attendance:
        condition: service_healthy
      auth-service: # Wait for the Auth public-key endpoint.
        condition: service_healthy
    # M09 G7 (NEW-157). M15 hotfix: 256m → 384m. Идентичная OOM проблема как у
    # auth-service: heap 75% от 256m = 192m + non-heap (metaspace, OTel, STOMP
    # WebSocket buffers, MongoDB driver, RabbitMQ NIO, Caffeine cache) > 256m.
    mem_limit: 384m
    mem_reservation: 256m
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9094/actuator/health/liveness || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  notification-bot:
    build:
      context: ./services/notification-bot
      dockerfile: Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/notification-bot:${IMAGE_TAG:-latest}
    container_name: rct-notification-bot
    logging: *bounded-logs
    # The dedicated credential is not part of the shared Compose environment.
    command: ['/bin/sh', '-ec', 'BOT_TO_AUTH_SERVICE_TOKEN="$$(cat /run/secrets/bot-to-auth-service-token)"; export BOT_TO_AUTH_SERVICE_TOKEN; exec python -m bot']
    secrets:
    - source: bot-to-auth-service-token
      target: bot-to-auth-service-token
    environment:
      AUTH_GRPC_HOST: auth-service
      AUTH_GRPC_PORT: '19090'
      AUTH_GRPC_TLS_ENABLED: 'true'
      AUTH_GRPC_TLS_CA_PATH: /run/rct-auth-tls/auth-server.crt
      DEPLOYMENT_ENVIRONMENT: production
      SERVICE_VERSION: ${IMAGE_TAG:-unknown}
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production,service.version=${IMAGE_TAG:-unknown}
      OTEL_BSP_MAX_QUEUE_SIZE: "1024"
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: "128"
      OTEL_BSP_EXPORT_TIMEOUT: "1000"
      OTEL_EXPORTER_OTLP_TIMEOUT: "1"
      OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT: "256"
      OTEL_SPAN_ATTRIBUTE_COUNT_LIMIT: "64"
      OTEL_SPAN_EVENT_COUNT_LIMIT: "32"
      OTEL_SPAN_LINK_COUNT_LIMIT: "32"
      BOT_TO_NOTIFICATION_SERVICE_TOKEN: ${BOT_TO_NOTIFICATION_SERVICE_TOKEN:?BOT_TO_NOTIFICATION_SERVICE_TOKEN must be set}
      NOTIFICATION_SERVICE_URL: http://notification-web:9094
      BOT_TOKEN: ${BOT_TOKEN}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      ACADEMIC_GRPC_HOST: academic-service
      ACADEMIC_GRPC_PORT: '19091'
      ACADEMIC_GRPC_TLS_ENABLED: 'true'
      ACADEMIC_GRPC_TLS_CA_PATH: /run/rct-academic-tls/academic-server.crt
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      HEALTH_PORT: '8081'
      SCHEDULE_GRPC_HOST: schedule-service
      SCHEDULE_GRPC_PORT: '19092'
      GRPC_SECRET: ${GRPC_SECRET}
      SCHEDULE_GRPC_TLS_ENABLED: 'true'
      SCHEDULE_GRPC_TLS_CA_PATH: /run/rct-schedule-tls/schedule-server.crt
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: '9090'
      API_GATEWAY_URL: http://api-gateway:8080
      MINI_APP_URL: ${MINI_APP_URL}
      MINI_APP_WEB_URL: ${MINI_APP_WEB_URL:-https://ruttrack.site/mini-app/}
      # M04 Группа 7 — distributed tracing OTLP gRPC → tempo:4317.
      # M16 G1: бот использует opentelemetry.exporter.otlp.proto.grpc, остаётся на 4317.
      # Java-сервисы (Spring Micrometer) шлют HTTP/protobuf на 4318/v1/traces.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      # M04 Группа 9 — список Telegram ID админов (comma-separated), куда
      # форвардить alert.fired. "0" = disabled.
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-0}
      TZ: Europe/Moscow
    volumes:
      - ${AUTH_GRPC_TLS_DIR:?AUTH_GRPC_TLS_DIR must be set}/auth-server.crt:/run/rct-auth-tls/auth-server.crt:ro
      - ${SCHEDULE_GRPC_TLS_DIR:?SCHEDULE_GRPC_TLS_DIR must be set}/schedule-server.crt:/run/rct-schedule-tls/schedule-server.crt:ro
      - ${ACADEMIC_GRPC_TLS_DIR:?ACADEMIC_GRPC_TLS_DIR must be set}/academic-server.crt:/run/rct-academic-tls/academic-server.crt:ro
    networks:
      - private_net
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # M09 G7 (NEW-157). Python ~80-120MB RSS, 256M — с запасом.
    mem_limit: 256m
    mem_reservation: 128m
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8081/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

