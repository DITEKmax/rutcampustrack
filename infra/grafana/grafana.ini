[server]
root_url = https://ruttrack.site/grafana/
serve_from_sub_path = true

[security]
admin_user = admin
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}

[auth.anonymous]
enabled = false

[unified_alerting]
enabled = true


[paths]
provisioning = /etc/grafana/provisioning

[users]
allow_sign_up = false
auto_assign_org_role = Viewer

[metrics]
enabled = true
