global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:9090']

  - job_name: 'academic-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['academic-service:9091']

  - job_name: 'schedule-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['schedule-service:9092']

  - job_name: 'attendance-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['attendance-service:9093']

  - job_name: 'notification-web'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['notification-web:9094']
