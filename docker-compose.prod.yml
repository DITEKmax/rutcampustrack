x-bounded-logs: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================================
  # INFRASTRUCTURE
  # ============================================================

  postgres-academic:
    # M08 G11 (P2-8/G11, M06 defer): digest-pin base image. Bump через Renovate
    # (см. renovate.json packageRules для pinDigests). Update command:
    #   docker buildx imagetools inspect postgres:16
    image: postgres:16@sha256:760ea41aae126965bedd587d35a23de37447bb13a6ac4444bef6ff73b8b72234
    container_name: rct-postgres-academic
    logging: *bounded-logs
    environment:
      POSTGRES_DB: academic_db
      POSTGRES_USER: rct_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/rct-bootstrap-password
    expose:
      - '5432'
    volumes:
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-rct-roles.sh:ro
      - pg-academic-data:/var/lib/postgresql/data
    secrets:
    - source: pg-academic-bootstrap-password
      target: rct-bootstrap-password
    - source: pg-academic-runtime-password
      target: rct-runtime-password
    - source: pg-auth-runtime-password
      target: rct-auth-runtime-password
    - source: pg-academic-service-runtime-password
      target: rct-academic-runtime-password
    - source: pg-academic-migration-password
      target: rct-migration-password
    - source: pg-academic-monitor-password
      target: rct-monitor-password
    networks:
      - private_net
    # M09 G7 (NEW-157) — см. docs/resource-limits.md.
    mem_limit: 192m
    mem_reservation: 128m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rct_user -d academic_db']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-schedule:
    # M08 G11 — digest-pin.
    image: postgres:16@sha256:760ea41aae126965bedd587d35a23de37447bb13a6ac4444bef6ff73b8b72234
    container_name: rct-postgres-schedule
    logging: *bounded-logs
    environment:
      POSTGRES_DB: schedule_db
      POSTGRES_USER: rct_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/rct-bootstrap-password
      TZ: Europe/Moscow
    expose:
      - '5432'
    volumes:
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-rct-roles.sh:ro
      - pg-schedule-data:/var/lib/postgresql/data
    secrets:
    - source: pg-schedule-bootstrap-password
      target: rct-bootstrap-password
    - source: pg-schedule-runtime-password
      target: rct-runtime-password
    - source: pg-schedule-migration-password
      target: rct-migration-password
    - source: pg-schedule-monitor-password
      target: rct-monitor-password
    networks:
      - private_net
    # M09 G7 (NEW-157).
    mem_limit: 256m
    mem_reservation: 192m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rct_user -d schedule_db']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo-attendance:
    # M13 G7 (Option B): bitnami mongodb — declarative replica set
    # setup (RS required для MongoTransactionManager multi-doc transactions).
    #
    # M13 G24-fix-3: namespace switched bitnami/ → bitnamilegacy/.
    # В Aug 2025 Bitnami убрали versioned tags из bitnami/ (только :latest
    # и платная подписка). bitnamilegacy/ — официальный frozen fallback
    # без security updates. Acceptable risk: single-node RS, internal
    # network only, нельзя атаковать извне.
    #
    # TODO v0.1: оценить миграцию на mongo:7-jammy + custom entrypoint
    # с rs.initiate() init-script. Возврат к Option A из M13 G7 (был
    # rejected в пользу Bitnami declarative setup). Альтернативы —
    # percona/percona-server-mongodb:7 либо Bitnami Secure Images по
    # подписке. Re-evaluate через 3 месяца после v0.0.0 GA.
    #
    # M08 G11 digest-pin — update:
    #   docker buildx imagetools inspect bitnamilegacy/mongodb:7.0
    image: bitnamilegacy/mongodb:7.0@sha256:16a57fa081f18e7acd1b4de1cd74f3e294cc6de861007e6fe3a418eb61db8a54
    container_name: rct-mongo-attendance
    logging: *bounded-logs
    environment:
      # Single-node replica set (primary + 0 secondaries).
      MONGODB_REPLICA_SET_MODE: primary
      MONGODB_REPLICA_SET_NAME: rs0
      # keyFile generated из MONGODB_REPLICA_SET_KEY env (openssl rand -base64 756).
      # REQUIRED в prod — см. .env.prod.example.
      MONGODB_REPLICA_SET_KEY: ${MONGODB_REPLICA_SET_KEY}
      MONGODB_ROOT_USER: root
      MONGODB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGODB_ADVERTISED_HOSTNAME: mongo-attendance
      # M13 G25.12 — application users создаются через явный init-script
      # /docker-entrypoint-initdb.d/init-mongo.js (idempotent на existing
      # volume — Bitnami пропускает initdb scripts при non-empty data dir).
      # Замена MONGODB_EXTRA_USERNAMES/PASSWORDS/DATABASES — в digest
      # sha256:16a57fa Bitnami declarative-механизм создаёт users в `test`
      # вместо `admin` → AuthenticationFailed с authSource=admin.
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_NOTIFICATION_USER: ${MONGO_NOTIFICATION_USER}
      MONGO_NOTIFICATION_PASSWORD: ${MONGO_NOTIFICATION_PASSWORD}
    expose:
      - '27017'
    secrets:
      - mongo-monitor-env
    volumes:
      - mongo-data:/bitnami/mongodb
      - ./infra/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - private_net
    # M09 G7 (NEW-157). Bitnami RS init может потреблять больше памяти чем
    # bare mongod — подняли limit с 384m до 512m для safety margin.
    mem_limit: 512m
    mem_reservation: 320m
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  redis:
    # M08 G11 — digest-pin. Update: docker buildx imagetools inspect redis:7-alpine
    image: redis:7-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    container_name: rct-redis
    logging: *bounded-logs
    # Critical OTP/tickets/limits never compete with disposable application cache.
    # noeviction preserves existing entries; writes may fail when memory is full.
    command: redis-server --aclfile /run/secrets/redis-users-acl --maxmemory 64mb --maxmemory-policy noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    secrets:
      - redis-users-acl
    expose:
      - '6379'
    volumes:
      - redis-data:/data
    networks:
      - private_net
    # M09 G7 (NEW-157).
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.25
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    container_name: rct-redis-cache
    logging: *bounded-logs
    command:
      - redis-server
      - --aclfile
      - /run/secrets/redis-cache-users-acl
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ''
    secrets:
      - redis-cache-users-acl
      - redis-cache-runtime-password
    expose:
      - '6379'
    networks:
      - private_net
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.25
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$(cat /run/secrets/redis-cache-runtime-password)" redis-cli --no-auth-warning -e --user rct_cache ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    # M13 G19 — switched to management-alpine flavor (drop-in replacement,
    # включает rabbitmq_management + rabbitmq_prometheus plugins).
    # Без этого scrape job rabbitmq:15692/metrics не работает →
    # alert DLQBacklog был silent dangling. Dev compose уже был на
    # management-alpine, prod догнал.
    # Update: docker buildx imagetools inspect rabbitmq:3.13-management-alpine
    image: rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    container_name: rct-rabbitmq
    logging: *bounded-logs
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    expose:
      - '5672'
      # M13 G19 — Prometheus metrics endpoint (rabbitmq_prometheus plugin).
      - '15692'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/prometheus/rabbitmq-enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - private_net
    # M09 G7 (NEW-157). M13 G19: +128m под management/prometheus plugin overhead.
    mem_limit: 384m
    mem_reservation: 256m
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # BACKEND SERVICES
  # ============================================================

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/auth-service:${IMAGE_TAG:-latest}
    container_name: rct-auth-service
    logging: *bounded-logs
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/rct-db/,configtree:/run/rct-auth/
      SPRING_DATASOURCE_USERNAME: rct_auth_runtime
      MANAGEMENT_TRACING_BAGGAGE_REMOTE_FIELDS: requestId
      MANAGEMENT_TRACING_BAGGAGE_CORRELATION_FIELDS: requestId
      MANAGEMENT_TRACING_BAGGAGE_TAG_FIELDS: requestId
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_MAX_QUEUE_SIZE: "1024"
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_MAX_BATCH_SIZE: "128"
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_TIMEOUT: 1s
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_SCHEDULE_DELAY: 5s
      MANAGEMENT_OTLP_TRACING_TIMEOUT: 1s
      MANAGEMENT_OTLP_TRACING_CONNECT_TIMEOUT: 1s
      SPRING_PROFILES_ACTIVE: prod
      DEPLOYMENT_ENVIRONMENT: production
      SERVICE_VERSION: ${IMAGE_TAG:-unknown}
      MANAGEMENT_METRICS_TAGS_ENVIRONMENT: production
      MANAGEMENT_METRICS_TAGS_VERSION: ${IMAGE_TAG:-unknown}
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      # M04 QA2 — distributed tracing OTLP exporter (HTTP/protobuf, M16 G1: 4317→4318).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: '5672'
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_KEY_DIR: /keys
      TMA_BOT_TOKEN: ${TMA_BOT_TOKEN}
      # M14 G9 (CSO HIGH-06) — INTERNAL_ISSUER_SECRET для подписи internal JWT.
      # auth-service — issuer этих token'ов (M03a). api-gateway / notification-web
      # верифицируют ими же. RequiredSecretsValidator (M14 G4 v2) fail-fast при
      # отсутствии. Должен совпадать с api-gateway / notification-web env value.
      INTERNAL_ISSUER_SECRET: ${INTERNAL_ISSUER_SECRET}
      GRPC_SECRET: ${GRPC_SECRET:?GRPC_SECRET must be set}
      AUTH_GRPC_PORT: '19090'
      AUTH_GRPC_CERTIFICATE_CHAIN: file:/run/rct-auth-tls/auth-server.crt
      AUTH_GRPC_PRIVATE_KEY: file:/run/rct-auth-tls/auth-server.key
      ACADEMIC_GRPC_TRUST_CERT_COLLECTION: file:/run/rct-academic-tls/academic-server.crt
      ACADEMIC_GRPC_TLS_AUTHORITY: ${ACADEMIC_GRPC_TLS_AUTHORITY:?ACADEMIC_GRPC_TLS_AUTHORITY must be set}
      # M09 G7 (NEW-157) — heap = 0.75 × mem_limit. См. docs/resource-limits.md.
      JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp'
    secrets:
    - source: bot-to-auth-service-token
      target: /run/rct-auth/BOT_TO_AUTH_SERVICE_TOKEN
    - source: pg-auth-runtime-password
      target: /run/rct-db/POSTGRES_ACADEMIC_PASSWORD
    volumes:
      - ${AUTH_GRPC_TLS_DIR:?AUTH_GRPC_TLS_DIR must be set}/auth-server.crt:/run/rct-auth-tls/auth-server.crt:ro
      - ${AUTH_GRPC_TLS_DIR:?AUTH_GRPC_TLS_DIR must be set}/auth-server.key:/run/rct-auth-tls/auth-server.key:ro
      - jwt-keys:/keys
      - ${ACADEMIC_GRPC_TLS_DIR:?ACADEMIC_GRPC_TLS_DIR must be set}/academic-server.crt:/run/rct-academic-tls/academic-server.crt:ro
    expose:
      - '9090'
      - '19090'
    networks:
      - private_net
    depends_on:
      postgres-academic:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # M16 G6 hotfix #4 — auth-service использует academic_db (общая
      # PG instance) в read-only режиме (только users / sessions /
      # headman_assistants), но Hibernate `ddl-auto: validate` требует
      # чтобы schema УЖЕ была migrate'нута. Academic-service владеет
      # миграциями (V1-V20), и должен closeflyway ДО того как auth-service
      # стартует. Иначе race: auth стартует раньше → schema-validate fail
      # → exit 1 → Playwright e2e падает на Boot stack.
      # Подтверждено: M16 V19+V20 удлинили flyway до ~25 сек, race
      # триггерится. M15 deploy случайно проскочил (academic стартовал
      # быстрее).
      academic-service:
        condition: service_healthy
    # M09 G7 (NEW-157). M15 hotfix: 256m → 384m. На prod boot exit 137 (OOM):
    # JVM heap 75% от 256m = 192m, плюс non-heap (metaspace, native, OTel
    # instrumentation, RabbitMQ NIO buffers, Hikari pool overhead, Spring
    # Boot reflective bytecode) → > 256m. 384m даёт безопасный margin.
    mem_limit: 384m
    mem_reservation: 256m
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9090/actuator/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  academic-service:
    build:
      context: .
      dockerfile: services/academic-service/academic-app/Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/academic-service:${IMAGE_TAG:-latest}
    container_name: rct-academic-service
    logging: *bounded-logs
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/rct-db/,configtree:/run/rct-cache/
      RCT_CACHE_REDIS_HOST: redis-cache
      RCT_CACHE_REDIS_PORT: '6379'
      RCT_CACHE_REDIS_USERNAME: rct_cache
      SPRING_DATASOURCE_USERNAME: rct_academic_runtime
      SPRING_FLYWAY_USER: rct_migrator
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,filesystem:/etc/rct/flyway-callbacks
      MANAGEMENT_TRACING_BAGGAGE_REMOTE_FIELDS: requestId
      MANAGEMENT_TRACING_BAGGAGE_CORRELATION_FIELDS: requestId
      MANAGEMENT_TRACING_BAGGAGE_TAG_FIELDS: requestId
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_MAX_QUEUE_SIZE: "1024"
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_MAX_BATCH_SIZE: "128"
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_TIMEOUT: 1s
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_SCHEDULE_DELAY: 5s
      MANAGEMENT_OTLP_TRACING_TIMEOUT: 1s
      MANAGEMENT_OTLP_TRACING_CONNECT_TIMEOUT: 1s
      SPRING_PROFILES_ACTIVE: prod
      DEPLOYMENT_ENVIRONMENT: production
      SERVICE_VERSION: ${IMAGE_TAG:-unknown}
      MANAGEMENT_METRICS_TAGS_ENVIRONMENT: production
      MANAGEMENT_METRICS_TAGS_VERSION: ${IMAGE_TAG:-unknown}
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      # M04 QA2 — distributed tracing OTLP exporter (HTTP/protobuf, M16 G1: 4317→4318).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GRPC_SECRET: ${GRPC_SECRET}
      ATTENDANCE_TO_ACADEMIC_SERVICE_TOKEN: ${ATTENDANCE_TO_ACADEMIC_SERVICE_TOKEN:?ATTENDANCE_TO_ACADEMIC_SERVICE_TOKEN must be set}
      INTERNAL_ISSUER_SECRET: ${INTERNAL_ISSUER_SECRET}
      CAMPUS_MAP_USAGE_HMAC_KEY: ${CAMPUS_MAP_USAGE_HMAC_KEY:?CAMPUS_MAP_USAGE_HMAC_KEY must be set}
      ACADEMIC_TO_SCHEDULE_SERVICE_TOKEN: ${ACADEMIC_TO_SCHEDULE_SERVICE_TOKEN:?ACADEMIC_TO_SCHEDULE_SERVICE_TOKEN must be set}
      SCHEDULE_TO_ACADEMIC_SERVICE_TOKEN: ${SCHEDULE_TO_ACADEMIC_SERVICE_TOKEN:?SCHEDULE_TO_ACADEMIC_SERVICE_TOKEN must be set}
      ACADEMIC_GRPC_CERTIFICATE_CHAIN: file:/run/rct-academic-tls/academic-server.crt
      ACADEMIC_GRPC_PRIVATE_KEY: file:/run/rct-academic-tls/academic-server.key
      SCHEDULE_GRPC_TRUST_CERT_COLLECTION: file:/run/rct-schedule-tls/schedule-server.crt
      # M09 G7 (NEW-157).
      JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp'
    secrets:
    - source: redis-cache-runtime-password
      target: /run/rct-cache/rct.cache.redis.password
    - source: pg-academic-service-runtime-password
      target: /run/rct-db/POSTGRES_ACADEMIC_PASSWORD
    - source: pg-academic-migration-password
      target: /run/rct-db/spring.flyway.password
    volumes:
      - ./infra/postgres/flyway-callbacks:/etc/rct/flyway-callbacks:ro
      - ${SCHEDULE_GRPC_TLS_DIR:?SCHEDULE_GRPC_TLS_DIR must be set}/schedule-server.crt:/run/rct-schedule-tls/schedule-server.crt:ro
      - ${ACADEMIC_GRPC_TLS_DIR:?ACADEMIC_GRPC_TLS_DIR must be set}/academic-server.crt:/run/rct-academic-tls/academic-server.crt:ro
      - ${ACADEMIC_GRPC_TLS_DIR:?ACADEMIC_GRPC_TLS_DIR must be set}/academic-server.key:/run/rct-academic-tls/academic-server.key:ro
    expose:
      - '9091'
    networks:
      - private_net
    depends_on:
      postgres-academic:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # M09 G7 (NEW-157).
    mem_limit: 512m
    mem_reservation: 384m
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9091/actuator/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  schedule-service:
    build:
      context: .
      dockerfile: services/schedule-service/schedule-app/Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/schedule-service:${IMAGE_TAG:-latest}
    container_name: rct-schedule-service
    logging: *bounded-logs
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/rct-db/
      SPRING_DATASOURCE_USERNAME: rct_runtime
      SPRING_FLYWAY_USER: rct_migrator
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,filesystem:/etc/rct/flyway-callbacks
      MANAGEMENT_TRACING_BAGGAGE_REMOTE_FIELDS: requestId
      MANAGEMENT_TRACING_BAGGAGE_CORRELATION_FIELDS: requestId
      MANAGEMENT_TRACING_BAGGAGE_TAG_FIELDS: requestId
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_MAX_QUEUE_SIZE: "1024"
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_MAX_BATCH_SIZE: "128"
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_TIMEOUT: 1s
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_SCHEDULE_DELAY: 5s
      MANAGEMENT_OTLP_TRACING_TIMEOUT: 1s
      MANAGEMENT_OTLP_TRACING_CONNECT_TIMEOUT: 1s
      SPRING_PROFILES_ACTIVE: prod
      DEPLOYMENT_ENVIRONMENT: production
      SERVICE_VERSION: ${IMAGE_TAG:-unknown}
      MANAGEMENT_METRICS_TAGS_ENVIRONMENT: production
      MANAGEMENT_METRICS_TAGS_VERSION: ${IMAGE_TAG:-unknown}
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      # M04 QA2 — distributed tracing OTLP exporter (HTTP/protobuf, M16 G1: 4317→4318).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GRPC_SECRET: ${GRPC_SECRET}
      ACADEMIC_TO_SCHEDULE_SERVICE_TOKEN: ${ACADEMIC_TO_SCHEDULE_SERVICE_TOKEN:?ACADEMIC_TO_SCHEDULE_SERVICE_TOKEN must be set}
      SCHEDULE_TO_ACADEMIC_SERVICE_TOKEN: ${SCHEDULE_TO_ACADEMIC_SERVICE_TOKEN:?SCHEDULE_TO_ACADEMIC_SERVICE_TOKEN must be set}
      ACADEMIC_GRPC_TRUST_CERT_COLLECTION: file:/run/rct-academic-tls/academic-server.crt
      ACADEMIC_GRPC_TLS_AUTHORITY: ${ACADEMIC_GRPC_TLS_AUTHORITY:?ACADEMIC_GRPC_TLS_AUTHORITY must be set}
      SCHEDULE_GRPC_CERTIFICATE_CHAIN: file:/run/rct-schedule-tls/schedule-server.crt
      SCHEDULE_GRPC_PRIVATE_KEY: file:/run/rct-schedule-tls/schedule-server.key
      TZ: Europe/Moscow
      # M09 G7 (NEW-157).
      JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp'
    secrets:
    - source: pg-schedule-runtime-password
