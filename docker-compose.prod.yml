services:
  # ============================================================
  # INFRASTRUCTURE
  # ============================================================

  postgres-academic:
    # M08 G11 (P2-8/G11, M06 defer): digest-pin base image. Bump через Renovate
    # (см. renovate.json packageRules для pinDigests). Update command:
    #   docker buildx imagetools inspect postgres:16
    image: postgres:16@sha256:760ea41aae126965bedd587d35a23de37447bb13a6ac4444bef6ff73b8b72234
    container_name: rct-postgres-academic
    environment:
      POSTGRES_DB: academic_db
      POSTGRES_USER: rct_user
      POSTGRES_PASSWORD: ${POSTGRES_ACADEMIC_PASSWORD}
    expose:
      - "5432"
    volumes:
      - pg-academic-data:/var/lib/postgresql/data
    networks:
      - private_net
    # M09 G7 (NEW-157) — см. docs/resource-limits.md.
    mem_limit: 192m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rct_user -d academic_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-schedule:
    # M08 G11 — digest-pin.
    image: postgres:16@sha256:760ea41aae126965bedd587d35a23de37447bb13a6ac4444bef6ff73b8b72234
    container_name: rct-postgres-schedule
    environment:
      POSTGRES_DB: schedule_db
      POSTGRES_USER: rct_user
      POSTGRES_PASSWORD: ${POSTGRES_SCHEDULE_PASSWORD}
      TZ: Europe/Moscow
    expose:
      - "5432"
    volumes:
      - pg-schedule-data:/var/lib/postgresql/data
    networks:
      - private_net
    # M09 G7 (NEW-157).
    mem_limit: 256m
    mem_reservation: 192m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rct_user -d schedule_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo-attendance:
    # M13 G7 (Option B): bitnami mongodb — declarative replica set
    # setup (RS required для MongoTransactionManager multi-doc transactions).
    #
    # M13 G24-fix-3: namespace switched bitnami/ → bitnamilegacy/.
    # В Aug 2025 Bitnami убрали versioned tags из bitnami/ (только :latest
    # и платная подписка). bitnamilegacy/ — официальный frozen fallback
    # без security updates. Acceptable risk: single-node RS, internal
    # network only, нельзя атаковать извне.
    #
    # TODO v0.1: оценить миграцию на mongo:7-jammy + custom entrypoint
    # с rs.initiate() init-script. Возврат к Option A из M13 G7 (был
    # rejected в пользу Bitnami declarative setup). Альтернативы —
    # percona/percona-server-mongodb:7 либо Bitnami Secure Images по
    # подписке. Re-evaluate через 3 месяца после v0.0.0 GA.
    #
    # M08 G11 digest-pin — update:
    #   docker buildx imagetools inspect bitnamilegacy/mongodb:7.0
    image: bitnamilegacy/mongodb:7.0@sha256:16a57fa081f18e7acd1b4de1cd74f3e294cc6de861007e6fe3a418eb61db8a54
    container_name: rct-mongo-attendance
    environment:
      # Single-node replica set (primary + 0 secondaries).
      MONGODB_REPLICA_SET_MODE: primary
      MONGODB_REPLICA_SET_NAME: rs0
      # keyFile generated из MONGODB_REPLICA_SET_KEY env (openssl rand -base64 756).
      # REQUIRED в prod — см. .env.prod.example.
      MONGODB_REPLICA_SET_KEY: ${MONGODB_REPLICA_SET_KEY}
      MONGODB_ROOT_USER: root
      MONGODB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGODB_ADVERTISED_HOSTNAME: mongo-attendance
      # M13 G25.12 — application users создаются через явный init-script
      # /docker-entrypoint-initdb.d/init-mongo.js (idempotent на existing
      # volume — Bitnami пропускает initdb scripts при non-empty data dir).
      # Замена MONGODB_EXTRA_USERNAMES/PASSWORDS/DATABASES — в digest
      # sha256:16a57fa Bitnami declarative-механизм создаёт users в `test`
      # вместо `admin` → AuthenticationFailed с authSource=admin.
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_NOTIFICATION_USER: ${MONGO_NOTIFICATION_USER}
      MONGO_NOTIFICATION_PASSWORD: ${MONGO_NOTIFICATION_PASSWORD}
    expose:
      - "27017"
    volumes:
      - mongo-data:/bitnami/mongodb
      - ./infra/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - private_net
    # M09 G7 (NEW-157). Bitnami RS init может потреблять больше памяти чем
    # bare mongod — подняли limit с 384m до 512m для safety margin.
    mem_limit: 512m
    mem_reservation: 320m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  redis:
    # M08 G11 — digest-pin. Update: docker buildx imagetools inspect redis:7-alpine
    image: redis:7-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    container_name: rct-redis
    # M09 G7 — maxmemory чуть ниже mem_limit, allkeys-lru выбрасывает
    # холодные OTP/RBAC-entries раньше, чем OOMKill срубит контейнер.
    command: redis-server --requirepass "${REDIS_PASSWORD}" --maxmemory 96mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - private_net
    # M09 G7 (NEW-157).
    mem_limit: 128m
    mem_reservation: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    # M13 G19 — switched to management-alpine flavor (drop-in replacement,
    # включает rabbitmq_management + rabbitmq_prometheus plugins).
    # Без этого scrape job rabbitmq:15692/metrics не работает →
    # alert DLQBacklog был silent dangling. Dev compose уже был на
    # management-alpine, prod догнал.
    # Update: docker buildx imagetools inspect rabbitmq:3.13-management-alpine
    image: rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    container_name: rct-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    expose:
      - "5672"
      # M13 G19 — Prometheus metrics endpoint (rabbitmq_prometheus plugin).
      - "15692"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - private_net
    # M09 G7 (NEW-157). M13 G19: +128m под management/prometheus plugin overhead.
    mem_limit: 384m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # BACKEND SERVICES
  # ============================================================

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/auth-service:${IMAGE_TAG:-latest}
    container_name: rct-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # M04 QA2 — distributed tracing OTLP exporter → tempo:4317.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      POSTGRES_ACADEMIC_PASSWORD: ${POSTGRES_ACADEMIC_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_KEY_DIR: /keys
      TMA_BOT_TOKEN: ${TMA_BOT_TOKEN}
      # M14 G9 (CSO HIGH-06) — INTERNAL_ISSUER_SECRET для подписи internal JWT.
      # auth-service — issuer этих token'ов (M03a). api-gateway / notification-web
      # верифицируют ими же. RequiredSecretsValidator (M14 G4 v2) fail-fast при
      # отсутствии. Должен совпадать с api-gateway / notification-web env value.
      INTERNAL_ISSUER_SECRET: ${INTERNAL_ISSUER_SECRET}
      # M09 G7 (NEW-157) — heap = 0.75 × mem_limit. См. docs/resource-limits.md.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp"
    volumes:
      - jwt-keys:/keys
    expose:
      - "9090"
    networks:
      - private_net
    depends_on:
      postgres-academic:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # M09 G7 (NEW-157). M15 hotfix: 256m → 384m. На prod boot exit 137 (OOM):
    # JVM heap 75% от 256m = 192m, плюс non-heap (metaspace, native, OTel
    # instrumentation, RabbitMQ NIO buffers, Hikari pool overhead, Spring
    # Boot reflective bytecode) → > 256m. 384m даёт безопасный margin.
    mem_limit: 384m
    mem_reservation: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  academic-service:
    build:
      context: .
      dockerfile: services/academic-service/academic-app/Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/academic-service:${IMAGE_TAG:-latest}
    container_name: rct-academic-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # M04 QA2 — distributed tracing OTLP exporter → tempo:4317.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      POSTGRES_ACADEMIC_PASSWORD: ${POSTGRES_ACADEMIC_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GRPC_SECRET: ${GRPC_SECRET}
      # M09 G7 (NEW-157).
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp"
    expose:
      - "9091"
    networks:
      - private_net
    depends_on:
      postgres-academic:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # M09 G7 (NEW-157).
    mem_limit: 512m
    mem_reservation: 384m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9091/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  schedule-service:
    build:
      context: .
      dockerfile: services/schedule-service/schedule-app/Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/schedule-service:${IMAGE_TAG:-latest}
    container_name: rct-schedule-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # M04 QA2 — distributed tracing OTLP exporter → tempo:4317.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      POSTGRES_SCHEDULE_PASSWORD: ${POSTGRES_SCHEDULE_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GRPC_SECRET: ${GRPC_SECRET}
      TZ: Europe/Moscow
      # M09 G7 (NEW-157).
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp"
    expose:
      - "9092"
    networks:
      - private_net
    depends_on:
      postgres-schedule:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # M09 G7 (NEW-157).
    mem_limit: 512m
    mem_reservation: 384m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9092/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  attendance-service:
    build:
      context: .
      dockerfile: services/attendance-service/attendance-app/Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/attendance-service:${IMAGE_TAG:-latest}
    container_name: rct-attendance-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # M04 QA2 — distributed tracing OTLP exporter → tempo:4317.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      # M13 G7: ?replicaSet=rs0 для MongoTransactionManager multi-doc transactions.
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo-attendance:27017/attendance_db?authSource=admin&replicaSet=rs0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GRPC_SECRET: ${GRPC_SECRET}
      # M09 G7 (NEW-157).
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp"
    expose:
      - "9093"
    networks:
      - private_net
    depends_on:
      mongo-attendance:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # M09 G7 (NEW-157).
    mem_limit: 512m
    mem_reservation: 384m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ============================================================
  # NOTIFICATION SERVICES
  # ============================================================

  notification-web:
    build:
      context: .
      dockerfile: services/notification-service/notification-app/Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/notification-web:${IMAGE_TAG:-latest}
    container_name: rct-notification-web
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # M04 QA2 — distributed tracing OTLP exporter → tempo:4317.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # M14 G9 (CSO HIGH-06): notification-service application.yml использует
      # ${RABBITMQ_PASSWORD} (не SPRING_RABBITMQ_PASSWORD) →
      # RequiredSecretsValidator ищет env var ровно с этим именем. Без
      # дублирования validator fail-fast'нет на boot.
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # M14 G9 (CSO HIGH-06): INTERNAL_ISSUER_SECRET для WS-ticket consume
      # (notification.ws-ticket.internal-issuer-secret в application.yml).
      # Должен совпадать с api-gateway / auth-service INTERNAL_ISSUER_SECRET.
      INTERNAL_ISSUER_SECRET: ${INTERNAL_ISSUER_SECRET}
      JWT_PUBLIC_KEY_PATH: /keys/public.key
      NOTIFICATION_WS_ALLOWED_ORIGINS: ${NOTIFICATION_WS_ALLOWED_ORIGINS:-https://ruttrack.site}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # M04 Группа 9 — shared secret для Alertmanager webhook в /internal/alert.
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET}
      # M10 G1 D3 — отдельная БД notification_db + отдельный credential
      # MONGO_NOTIFICATION_USER (PoLP — D2).
      # M13 G7: ?replicaSet=rs0 для MongoTransactionManager multi-doc transactions.
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_NOTIFICATION_USER}:${MONGO_NOTIFICATION_PASSWORD}@mongo-attendance:27017/notification_db?authSource=admin&replicaSet=rs0
      # M10 G1 D4 — retention для notification_history (дней).
      NOTIFICATION_HISTORY_TTL_DAYS: ${NOTIFICATION_HISTORY_TTL_DAYS:-30}
      # M09 G7 (NEW-157).
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp"
    volumes:
      - jwt-keys:/keys:ro
    expose:
      - "9094"
    networks:
      - private_net
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-attendance:
        condition: service_healthy
      auth-service:          # <-- FIX: ждём пока auth-service сгенерит /keys/public.key
        condition: service_healthy
    # M09 G7 (NEW-157). M15 hotfix: 256m → 384m. Идентичная OOM проблема как у
    # auth-service: heap 75% от 256m = 192m + non-heap (metaspace, OTel, STOMP
    # WebSocket buffers, MongoDB driver, RabbitMQ NIO, Caffeine cache) > 256m.
    mem_limit: 384m
    mem_reservation: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9094/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  notification-bot:
    build:
      context: ./services/notification-bot
      dockerfile: Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/notification-bot:${IMAGE_TAG:-latest}
    container_name: rct-notification-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      ACADEMIC_GRPC_HOST: academic-service
      ACADEMIC_GRPC_PORT: "19091"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      HEALTH_PORT: "8081"
      SCHEDULE_GRPC_HOST: schedule-service
      SCHEDULE_GRPC_PORT: "19092"
      GRPC_SECRET: ${GRPC_SECRET}
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: "9090"
      API_GATEWAY_URL: http://api-gateway:8080
      MINI_APP_URL: ${MINI_APP_URL}
      # M04 Группа 7 — distributed tracing OTLP exporter → tempo:4317.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      # M04 Группа 9 — список Telegram ID админов (comma-separated), куда
      # форвардить alert.fired. "0" = disabled.
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-0}
      TZ: Europe/Moscow
    networks:
      - private_net
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # M09 G7 (NEW-157). Python ~80-120MB RSS, 256M — с запасом.
    mem_limit: 256m
    mem_reservation: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/api-gateway:${IMAGE_TAG:-latest}
    container_name: rct-api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # M04 QA2 — distributed tracing OTLP exporter → tempo:4317.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      AUTH_SERVICE_URL: http://auth-service:9090
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      # M03a Group 9: Redis-backed rate-limiter (shared Redis с auth-service)
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # M03a: Gateway → auth-service token-exchange shared secret
      INTERNAL_ISSUER_SECRET: ${INTERNAL_ISSUER_SECRET}
      # M09 G7 (NEW-157).
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp"
    expose:
      - "8080"
    networks:
      - private_net
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
      attendance-service:
        condition: service_healthy
      notification-web:
        condition: service_healthy
    # M09 G7 (NEW-157). M15 hotfix: 256m → 384m. Spring Cloud Gateway boot
    # peak: Reactor Netty + Redis + RSA pub key fetch + OTel SDK + Spring
    # Security + WebFlux. После warmup ~150m steady-state, но cold start
    # пробивает 256m mem_limit → exit 137 → restart loop.
    mem_limit: 384m
    mem_reservation: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # MONITORING
  # ============================================================

  node-exporter:
    # M08 G11 — digest-pin (было semver-only M06 P2-9/2). Update:
    #   docker buildx imagetools inspect prom/node-exporter:v1.8.2
    image: prom/node-exporter:v1.8.2@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    container_name: rct-node-exporter
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    networks:
      - private_net
    # M13 G11 (NEW-154/155/157) — bound aux container memory.
    # node-exporter — резидентный footprint ~15-25m, 128m даёт запас
    # под /proc reading peaks без OOM на 8GB VPS.
    mem_limit: 128m
    mem_reservation: 32m
    restart: unless-stopped

  cadvisor:
    # M06 D2: digest-пин обязателен — privileged: true + mounts /:/rootfs + /sys.
    # Supply-chain compromise = full host access. Bump digest через Renovate (QD6).
    # Version: v0.49.1. Update: `docker buildx imagetools inspect gcr.io/cadvisor/cadvisor:<ver>`
    image: gcr.io/cadvisor/cadvisor:v0.49.1@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388
    container_name: rct-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - private_net
    # M13 G11 — cadvisor scrape'ает все containers, ~50-150m residual
    # под нагрузкой. 256m с запасом.
    mem_limit: 256m
    mem_reservation: 64m
    restart: unless-stopped
    privileged: true

  # M13 G20 — blackbox-exporter probe'ит публичный URL https://ruttrack.site,
  # экспортирует метрики probe_success, probe_ssl_earliest_cert_expiry,
  # probe_http_status_code. Используется для alert'а SslCertExpiresSoon
  # (cert < 30d) — без этого Prometheus не имеет visibility на TLS-cert
  # expiry (внутренние сервисы scrape'ят /actuator/prometheus, certificate
  # info там не экспортируется).
  # Update: docker buildx imagetools inspect prom/blackbox-exporter:v0.25.0
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0@sha256:67847e8aaec3c4852a2c7d84d5344e7931521962988c48df00cd980cd1b490a2
    container_name: rct-blackbox-exporter
    volumes:
      - ./infra/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    expose:
      - "9115"
    networks:
      - private_net
    # Lightweight: probe overhead minimal, scrape interval 60s. 64m headroom.
    mem_limit: 64m
    mem_reservation: 16m
    restart: unless-stopped

  prometheus:
    # M08 G11 — digest-pin (было semver-only M06 P2-9/2). Update:
    #   docker buildx imagetools inspect prom/prometheus:v2.55.1
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    container_name: rct-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # M04 Группа 10 — retention 14d (QA5). 30d было дефолт после
      # первичной инсталляции, но для наших 6 сервисов 14d достаточно
      # (incident analysis + weekly review). NEW-66: review по
      # накоплению disk usage.
      - '--storage.tsdb.retention.time=14d'
      # M13 G14 — UI за nginx reverse-proxy под /prometheus/ с basic-auth.
      # --web.external-url ставит base URL для absolute links в UI; без
      # него Graph/Targets/Alerts пишут absolute "/graph" без prefix'а и
      # ломаются через proxy. --web.route-prefix нужен чтобы prometheus
      # сам отвечал на /prometheus/* (иначе upstream отдаёт 404).
      - '--web.external-url=https://ruttrack.site/prometheus/'
      - '--web.route-prefix=/'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # M04 Группа 9 — rule files подключаются через prometheus.yml
      # (rule_files: /etc/prometheus/rules/*.yml).
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks:
      - private_net
    depends_on:
      - node-exporter
      - cadvisor
      - alertmanager
    # M09 G7 (NEW-157).
    mem_limit: 192m
    mem_reservation: 128m
    restart: unless-stopped

  # M04 Группа 9 — Alertmanager. Принимает fired alerts от prometheus
  # (alertmanager:9093), через routing отсылает webhook в
  # notification-web:9094/internal/alert. Silence 22:00-08:00 MSK
  # для warning (critical — всегда).
  alertmanager:
    # M08 G11 — digest-pin. Update: docker buildx imagetools inspect prom/alertmanager:v0.27.0
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    container_name: rct-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    environment:
      # Токен для Authorization: Bearer в webhook. Alertmanager читает
      # файл по пути credentials_file (см. alertmanager.yml).
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET}
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    # Записываем secret в volume at startup — alertmanager не поддерживает
    # env-vars в yaml напрямую, credentials_file единственный путь.
    # M13 G14 — --web.external-url ставит base URL для absolute links в UI.
    # --web.route-prefix=/ — alertmanager слушает на / внутри container'а,
    # nginx strip'ает /alertmanager/ prefix через proxy_pass с trailing slash.
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/alertmanager && \
        echo -n "$${ALERT_WEBHOOK_SECRET}" > /etc/alertmanager/secret && \
        exec /bin/alertmanager \
          --config.file=/etc/alertmanager/alertmanager.yml \
          --storage.path=/alertmanager \
          --web.external-url=https://ruttrack.site/alertmanager/ \
          --web.route-prefix=/
    expose:
      - "9093"
    networks:
      - private_net
    # M09 G7 (NEW-157).
    mem_limit: 64m
    mem_reservation: 32m
    restart: unless-stopped

  # M04 QA2 — Grafana Tempo, distributed tracing storage. Retention 14d (QA5).
  # OTLP gRPC :4317 принимает spans от 6 backend-сервисов (NEW-59).
  # HTTP :3200 — Tempo HTTP API для Grafana datasource.
  tempo:
    # M08 G11 — digest-pin. Update: docker buildx imagetools inspect grafana/tempo:2.3.1
    image: grafana/tempo:2.3.1@sha256:1c6fb7c74831474f82c9bde218c84b61e5269b676e6505e7dc3c1862dae9b5cc
    container_name: rct-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    expose:
      - "3200"  # HTTP — Grafana datasource
      - "4317"  # OTLP gRPC — приёмник spans
      - "4318"  # OTLP HTTP (на будущее)
    networks:
      - private_net
    # M09 G7 (NEW-157).
    mem_limit: 128m
    mem_reservation: 96m
    restart: unless-stopped

  grafana:
    # M08 G11 — digest-pin (было semver-only M06 P2-9/2). Update:
    #   docker buildx imagetools inspect grafana/grafana:11.3.1
    image: grafana/grafana:11.3.1@sha256:fa801ab6e1ae035135309580891e09f7eb94d1abdbd2106bdc288030b028158c
    container_name: rct-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_ALERTING_TELEGRAM_BOT_TOKEN: ${BOT_ALERT_TOKEN}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./infra/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    networks:
      - private_net
    depends_on:
      - prometheus
      - tempo
    # M09 G7 (NEW-157).
    mem_limit: 96m
    mem_reservation: 64m
    restart: unless-stopped

  loki:
    # M08 G11 — digest-pin (было semver-only M06 P2-9/2). Major upgrade — MANUAL
    # через Renovate (см. docs/runbooks/loki-major-upgrade.md, NEW-151).
    # Update: docker buildx imagetools inspect grafana/loki:3.2.1
    image: grafana/loki:3.2.1@sha256:09a53b4a4ff81ffcd8f13886df19d33fac7a8d3aaf952e3c7e66cbade5b2fc31
    container_name: rct-loki
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    expose:
      - "3100"
    networks:
      - private_net
    # M09 G7 (NEW-157).
    mem_limit: 192m
    mem_reservation: 128m
    restart: unless-stopped

  promtail:
    # M06 D2: digest-пин обязателен — mounts /var/run/docker.sock:ro.
    # Socket compromise = docker daemon control (= root host). Bump через Renovate (QD6).
    # Version: 3.2.1. Update: `docker buildx imagetools inspect grafana/promtail:<ver>`
    image: grafana/promtail:3.2.1@sha256:bf617e9d67e80247a59f717f9c1ad388d7d32dc0a1d29abd5799516d15e0a9b5
    container_name: rct-promtail
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./infra/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - private_net
    depends_on:
      - loki
    # M13 G11 — promtail tails docker logs всех containers, batch buffer
    # + positions file. ~50-100m под нагрузкой, 256m даёт большой запас.
    mem_limit: 256m
    mem_reservation: 64m
    restart: unless-stopped

  # ============================================================
  # REVERSE PROXY
  # ============================================================

  nginx:
    # M08 G11 — digest-pin. Update: docker buildx imagetools inspect nginx:1.27-alpine
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: rct-nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      # M11 G4 (NEW-125): bcrypt htpasswd line «swagger:$2y$05$...» из
      # `.env.prod`. На старте контейнера записывается в
      # `/etc/nginx/.htpasswd` (см. command ниже). См. runbook
      # docs/runbooks/swagger-prod-access.md.
      SWAGGER_HTPASSWD: ${SWAGGER_HTPASSWD:?SWAGGER_HTPASSWD must be set — see docs/runbooks/swagger-prod-access.md}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/dhparam.pem:/etc/nginx/dhparam.pem:ro
      # M13 G14 — fail-fast entrypoint: validate SWAGGER_HTPASSWD format
      # перед стартом nginx. Без этого пустой .htpasswd → silent security
      # regression (любой пароль проходит).
      - ./nginx/scripts/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - private_net
    depends_on:
      api-gateway:
        condition: service_healthy
    # M13 G11 — reverse proxy + SSL termination + WebSocket fan-out.
    # nginx alpine ~5m residual, 256m под высокий keepalive load + buffers.
    mem_limit: 256m
    mem_reservation: 32m
    restart: unless-stopped
    # M13 G14 — fail-fast entrypoint:
    # 1. Validate SWAGGER_HTPASSWD env var (defined + non-empty + правильный
    #    format `login:$apr1$...` либо `login:$2y$...`). Без этих проверок
    #    /swagger-ui / /prometheus/ / /alertmanager/ basic-auth могла бы
    #    silently accept'ить любой password при пустом .htpasswd.
    # 2. Materialize .htpasswd from env (preserves M11 G4 behaviour).
    # 3. Background loop reloads nginx every 5 min (safety-net для cases
    #    когда deploy.yml's explicit `nginx -s reload` step skipped/failed).
    #    Primary reload path: GitHub Actions deploy.yml.
    # 4. Foreground nginx daemon.
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint.sh"]

  certbot:
    # M08 G11 — digest-pin + explicit tag (было implicit :latest, supply-chain риск).
    # Update: docker buildx imagetools inspect certbot/certbot:latest
    image: certbot/certbot:latest@sha256:78a7eaa40af657301e25731297b6e73646c695370d17e9bb03189fa82966d65c
    container_name: rct-certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - private_net
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h; done'"
    # M13 G11 — certbot Python runtime + ACME client. Sleeps большинство
    # времени, peak только во время renew (~30-50m). 128m с запасом.
    mem_limit: 128m
    mem_reservation: 32m
    restart: unless-stopped

  # ============================================================
  # FRONTEND CONTAINERS
  # ============================================================

  # M13 G11 (extended scope) — все 4 frontend-nginx контейнеров отдают
  # только статику (Angular/React build artefacts + Tailwind CSS).
  # Resident footprint ~5-10m, 64m mem_limit достаточен с большим запасом
  # на keepalive connections + sendfile buffers. Симметрично с reverse-proxy
  # nginx, чтобы не оставлять unbounded контейнеры в prod.
  pwa-nginx:
    build:
      context: ./frontends/pwa
      dockerfile: Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/pwa-nginx:${IMAGE_TAG:-latest}
    container_name: rct-pwa-nginx
    expose:
      - "80"
    networks:
      - private_net
    mem_limit: 64m
    mem_reservation: 16m
    restart: unless-stopped

  mini-app-nginx:
    build:
      context: ./frontends/mini-app
      dockerfile: Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/mini-app-nginx:${IMAGE_TAG:-latest}
    container_name: rct-mini-app-nginx
    expose:
      - "80"
    networks:
      - private_net
    mem_limit: 64m
    mem_reservation: 16m
    restart: unless-stopped

  web-panel-nginx:
    build:
      context: ./frontends/web-panel
      dockerfile: Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/web-panel-nginx:${IMAGE_TAG:-latest}
    container_name: rct-web-panel-nginx
    expose:
      - "80"
    networks:
      - private_net
    mem_limit: 64m
    mem_reservation: 16m
    restart: unless-stopped

  landing-nginx:
    build:
      context: ./frontends/landing
      dockerfile: Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/landing-nginx:${IMAGE_TAG:-latest}
    container_name: rct-landing-nginx
    expose:
      - "80"
    networks:
      - private_net
    mem_limit: 64m
    mem_reservation: 16m
    restart: unless-stopped

networks:
  private_net:
    driver: bridge

volumes:
  pg-academic-data:
  pg-schedule-data:
  mongo-data:
  redis-data:
  rabbitmq-data:
  jwt-keys:
  certbot-conf:
  certbot-www:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  alertmanager-data: