# M04 Группа 9 — Alertmanager config. QA4 + NEW-62/63/64.
#
# Routing: все алерты → single webhook в notification-web:9094
# (/internal/alert), который re-publishes в RabbitMQ `alert.fired`;
# notification-bot consumer форвардит в Telegram админу (D2=(a)).
#
# Mute window 22:00-08:00 MSK — только для severity!=critical (D3).
# Critical (ServiceDown) будит ночью, warning — отложен до утра.

global:
  resolve_timeout: 5m

# Тихий час — fixed 22:00-08:00 MSK. D3=(a).
# `time_intervals` — v0.27+ alertmanager формат.
# MSK = UTC+3: 22:00 MSK = 19:00 UTC, 08:00 MSK = 05:00 UTC.
# M15 hotfix: split интервал через полночь UTC на два диапазона.
# Alertmanager v0.27 reject'ит `start_time >= end_time` в одной записи
# (configuration error: "start time cannot be equal or greater than end time"),
# поэтому 19:00 → 23:59 + 00:00 → 05:00 — два sub-interval'а покрывают
# те же 10 часов quiet window'а.
time_intervals:
  - name: quiet-hours-msk
    time_intervals:
      - times:
          - start_time: '19:00'
            end_time: '23:59'
          - start_time: '00:00'
            end_time: '05:00'
        location: 'UTC'

route:
  receiver: 'notification-webhook'
  group_by: ['alertname', 'service']
  group_wait: 30s       # accumulate related alerts в одну notification
  group_interval: 5m    # between group notifications same group
  repeat_interval: 3h   # повторное уведомление если alert продолжается
  routes:
    # Critical — идут всегда, включая тихий час. Мышление простое:
    # если сервис лёг ночью, лучше разбудить админа, чем ждать утра.
    - matchers:
        - severity="critical"
      receiver: 'notification-webhook'
      continue: false

    # Warnings — muted в тихий час. Остальные отсылаются сразу.
    - matchers:
        - severity="warning"
      receiver: 'notification-webhook'
      mute_time_intervals:
        - quiet-hours-msk
      continue: false

receivers:
  - name: 'notification-webhook'
    webhook_configs:
      - url: 'http://notification-web:9094/internal/alert'
        send_resolved: true
        max_alerts: 0  # без лимита в одном POST payload'е
        http_config:
          # Internal secret для защиты endpoint'а (M06 заменит на mTLS).
          # Alertmanager добавляет header Authorization: Bearer <token>
          # автоматически из credentials.
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secret

inhibit_rules:
  # Если ServiceDown — не шумим HealthCheckDown для того же target
  # (сервис down → health тоже down, один сигнал достаточен).
  - source_matchers:
      - alertname="ServiceDown"
    target_matchers:
      - alertname="HealthCheckDown"
    equal: ['instance', 'job']
