syntax = "proto3";
package rutcampustrack.authoperations;
option java_multiple_files = true;
option java_package = "ru.rutcampustrack.authoperations.grpc";
import "auth_identity_operations.proto";

// Exact Academic->Auth directed credential + TLS; <=3s, no cross-service DB locks.
// This conservatively invalidates only stale HEADMAN credential-reader preflights.
// It never changes grants/profile/account/TG or fences ordinary Auth admission.
service AuthCredentialReaderInvalidationService {
  rpc PrepareCredentialReaderInvalidation(PrepareCredentialReaderInvalidationRequest) returns (CredentialReaderInvalidationResult);
  rpc GetCredentialReaderInvalidation(GetCredentialReaderInvalidationRequest) returns (CredentialReaderInvalidationResult);
  rpc CommitCredentialReaderInvalidation(CommitCredentialReaderInvalidationRequest) returns (CredentialReaderInvalidationResult);
  rpc FailCredentialReaderInvalidation(FailCredentialReaderInvalidationRequest) returns (CredentialReaderInvalidationResult);
  rpc RejectUnpreparedCredentialReaderInvalidation(RejectUnpreparedCredentialReaderInvalidationRequest) returns (CredentialReaderInvalidationResult);
}
enum CredentialReaderInvalidationAction {
  CREDENTIAL_READER_INVALIDATION_ACTION_UNSPECIFIED = 0;
  CREDENTIAL_READER_INVALIDATION_ACTION_GROUP_DEACTIVATE = 1;
  CREDENTIAL_READER_INVALIDATION_ACTION_GROUP_RESTORE = 2;
  CREDENTIAL_READER_INVALIDATION_ACTION_MANUAL_CYCLE_ARCHIVE = 3;
  CREDENTIAL_READER_INVALIDATION_ACTION_AUTOMATIC_CYCLE_ARCHIVE = 4;
}
enum CredentialReaderInvalidationPhase {
  CREDENTIAL_READER_INVALIDATION_PHASE_UNSPECIFIED = 0;
  CREDENTIAL_READER_INVALIDATION_PHASE_INVALIDATED = 1;
  CREDENTIAL_READER_INVALIDATION_PHASE_COMMITTED = 2;
  CREDENTIAL_READER_INVALIDATION_PHASE_FAILED_SAFE = 3;
  CREDENTIAL_READER_INVALIDATION_PHASE_REJECTED = 4;
}
message CredentialReaderGroup {
  int64 group_id = 1;
  int64 expected_group_revision = 2;
  // Zero means the verified EMPTY eligible HEADMAN set, not an unknown selector.
  int64 headman_user_id = 3;
  int64 expected_headman_roles_version = 4;
  int64 expected_headman_academic_revision = 5;
}
message PrepareCredentialReaderInvalidationRequest {
  string operation_id = 1;
  // SHA256(clearCommandHash().build().toByteArray()); reject unknown fields.
  bytes command_hash = 2;
  CredentialReaderInvalidationAction action = 3;
  repeated CredentialReaderGroup groups = 4; // unique increasing group IDs
  // Binds the WHOLE immutable Academic command, including non-credential effects.
  bytes academic_command_hash = 5;
  int64 cycle_semester_id = 6; // positive for either CYCLE action only
  int32 cycle_year = 7; // 2000..9999 for either CYCLE action only
  // Fresh current GROUPS_MANAGE actor; same action/manifest/business digest only.
  // Expected headman RV/local revision may refresh after a FAILED_SAFE attempt.
  string supersedes_failed_operation_id = 8;
}
message GetCredentialReaderInvalidationRequest {
  string operation_id = 1;
  bytes command_hash = 2;
}
message RejectUnpreparedCredentialReaderInvalidationRequest {
  PrepareCredentialReaderInvalidationRequest canonical_prepare = 1;
  IdentityOperationRejectionReason reason = 2;
  IdentityOperationActor actor = 3; // original manual actor; absent for exact automatic action
  // Same Auth operation lock as Prepare. Existing positive is never cancelled.
  // Only exact positive REJECTED permits releasing an unapplied Academic guard.
}
message FailCredentialReaderInvalidationRequest {
  string operation_id = 1;
  bytes command_hash = 2;
  int64 expected_operation_revision = 3;
}
message CredentialReaderGroupCommitReceipt {
  int64 group_id = 1;
  int64 previous_group_revision = 2;
  int64 committed_group_revision = 3;
}
message CommitCredentialReaderInvalidationRequest {
  string operation_id = 1;
  bytes command_hash = 2;
  int64 expected_operation_revision = 3;
  repeated CredentialReaderGroupCommitReceipt groups = 4;
  repeated AcademicIdentityCommitReceipt headmen = 5; // unique increasing UID
}
message CredentialReaderInvalidationResult {
  string operation_id = 1;
  bytes command_hash = 2;
  CredentialReaderInvalidationPhase phase = 3;
  int64 operation_revision = 4;
  repeated PreparedIdentityTarget headmen = 5; // only UID/finalRV/expectedAcademicRevision
  int64 committed_catalog_version = 6;
  // INVALIDATED/Get is no permission to expose staged local changes. Academic
  // retains its durable group/headman-set guard until COMMITTED and catalog catchup.
  // Explicit actor revocation fails safe; natural expiry alone does not lose intent.
}
