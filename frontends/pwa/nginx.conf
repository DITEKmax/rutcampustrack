server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets (JS/CSS with content hash) — cache aggressively.
    # MUST come BEFORE location / so the no-store fallback headers don't leak
    # into hashed bundles.
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Service worker — must not be cached, it's the update pivot.
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
    }

    # Runtime version policy for forced PWA updates.
    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
    }

    # Explicit /index.html — never cache.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
    }

    # SPA fallback — every unknown route returns index.html. Headers here also
    # apply when nginx serves index.html via try_files for routes like
    # /checkin or /schedule (otherwise location = /index.html never matches
    # and the browser heuristic-caches the HTML — the stale-chunk bug).
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
        try_files $uri $uri/ /index.html;
    }
}
