# Только шесть разрешённых routing values. Apply script рендерит их в живой
# config, сохраняя остальные ключи/секции и line endings.
model = "gpt-6-astra"
model_reasoning_effort = "medium"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
