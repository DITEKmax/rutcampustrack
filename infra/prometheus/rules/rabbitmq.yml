groups:
- name: rabbitmq
  rules:
  - alert: DLQBacklog
    expr: rabbitmq_detailed_queue_messages{queue=~".*\\.dlq"} > 0
    for: 1m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: Retained DLQ message in {{ $labels.queue }}
      description: A message exhausted bounded processing or is permanently invalid and remains isolated. Inspect safe reason/IDs
        and the DLQ runbook; preserve the message and avoid an infinite redrive loop.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/runbooks/dlq-triage.md
  - alert: RabbitMQQueueBacklog
    expr: rabbitmq_detailed_queue_messages{queue!~".*\\.dlq"} > 1000
    for: 5m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: "\u041E\u0447\u0435\u0440\u0435\u0434\u044C {{ $labels.queue }} > 1000 pending"
      description: "{{ $value }} pending messages \u0432 {{ $labels.queue }} > 5 \u043C\u0438\u043D. Consumer \u043E\u0442\
        \u0441\u0442\u0430\u0451\u0442 \u2014 \u043F\u0440\u043E\u0432\u0435\u0440\u044C thread pool / DB latency / external\
        \ calls."
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/runbooks/dlq-triage.md
  - alert: RabbitMQConnectionLost
    expr: rabbitmq_connections == 0
    for: 1m
    labels:
      severity: critical
      owner: platform
    annotations:
      summary: "RabbitMQ \u0431\u0435\u0437 \u0430\u043A\u0442\u0438\u0432\u043D\u044B\u0445 \u043F\u043E\u0434\u043A\u043B\
        \u044E\u0447\u0435\u043D\u0438\u0439"
      description: "\u041D\u0438 \u043E\u0434\u0438\u043D \u0441\u0435\u0440\u0432\u0438\u0441 \u043D\u0435 \u043F\u043E\u0434\
        \u043A\u043B\u044E\u0447\u0451\u043D \u043A RabbitMQ. \u0412\u0441\u0435 consumer'\u044B \u043E\u0442\u0432\u0430\u043B\
        \u0438\u043B\u0438\u0441\u044C \u0438\u043B\u0438 RabbitMQ \u043F\u0435\u0440\u0435\u0437\u0430\u043F\u0443\u0441\u0442\
        \u0438\u043B\u0441\u044F \u0431\u0435\u0437 graceful reconnect. \u041F\u0440\u043E\u0432\u0435\u0440\u044C network\
        \ + service logs."
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/runbooks/dlq-triage.md
  - alert: RabbitMQConsumerMissing
    expr: rabbitmq_detailed_queue_consumers{queue!~".*\\.(dlq|retry)"} == 0 and on (job, instance, vhost, queue) rabbitmq_detailed_queue_messages
      > 0
    for: 2m
    labels:
      severity: critical
      owner: platform
    annotations:
      summary: Pending queue {{ $labels.queue }} has no consumer
      description: Messages cannot be processed. Inspect consumer readiness, broker connection and retry budget. Do not purge/requeue
        poison messages blindly. Retry TTL queues intentionally have no consumer and are excluded.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/runbooks/dlq-triage.md
