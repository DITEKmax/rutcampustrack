syntax = "proto3";

package rutcampustrack.teacher;

option java_multiple_files = true;
option java_package = "ru.rutcampustrack.teacher.grpc";

// Additive teacher read boundary.  Identity is taken from the validated
// signed internal JWT at the gRPC boundary; request messages intentionally do
// not carry a caller supplied teacher id.
service TeacherAcademicReadService {
  rpc GetTeacherActiveSemester(TeacherActiveSemesterRequest)
      returns (TeacherSemesterResponse);
  rpc ListTeacherAssignments(TeacherAssignmentsRequest)
      returns (TeacherAssignmentsResponse);
}

// Additive attendance read boundary for the teacher PWA/TMA.  Lesson, journal
// and stats reads use current group authority plus the concrete schedule
// snapshot; excuse and attachment reads retain the own-lesson assignment gate.
service TeacherAttendanceReadService {
  rpc GetTeacherLesson(TeacherLessonRequest) returns (TeacherLessonResponse);
  rpc GetTeacherJournal(TeacherJournalRequest) returns (TeacherJournalResponse);
  rpc GetTeacherExcuse(TeacherExcuseRequest) returns (TeacherExcuseResponse);
  rpc DownloadTeacherExcuseAttachment(TeacherExcuseAttachmentRequest)
      returns (TeacherAttachmentDownload);
  rpc GetTeacherStats(TeacherStatsRequest) returns (TeacherStatsResponse);
  rpc ExportTeacherStats(TeacherStatsExportRequest)
      returns (TeacherStatsExportResponse);
  rpc ExportTeacherAttendance(TeacherAttendanceExportRequest)
      returns (TeacherAttendanceExportResponse);
}

message TeacherStatsExportRequest {
  TeacherStatsRequest stats_request = 1;
  string format = 2; // docx, pdf, png, html, or xlsx
}

message TeacherStatsExportResponse {
  bytes content = 1;
  string file_name = 2;
  string content_type = 3;
}

message TeacherAttendanceExportRequest {
  int64 semester_id = 1;
  int64 group_id = 2;
  int64 subject_id = 3;
  repeated string lesson_types = 4;
  string format = 5; // docx, pdf, png, html, or xlsx
  TeacherAttendanceReportKind report_kind = 6;
  string date_from = 7; // ISO-8601 date, inclusive; both empty means full semester
  string date_to = 8; // ISO-8601 date, inclusive; both empty means full semester
}

message TeacherAttendanceExportResponse {
  bytes content = 1;
  string file_name = 2;
  string content_type = 3;
}

enum TeacherAttendanceReportKind {
  TEACHER_ATTENDANCE_REPORT_KIND_UNSPECIFIED = 0;
  TEACHER_ATTENDANCE_REPORT_KIND_WEEKLY_ATTENDANCE = 1;
  TEACHER_ATTENDANCE_REPORT_KIND_SUBJECT_JOURNAL = 2;
}

message TeacherActiveSemesterRequest {}

message TeacherSemesterResponse {
  int64 semester_id = 1;
  string name = 2;
  string date_from = 3;
  string date_to = 4;
}

message TeacherAssignmentsRequest {
  int64 semester_id = 1;
  string date_from = 2; // ISO-8601 date, inclusive
  string date_to = 3; // ISO-8601 date, inclusive
  // When true, the Academic service derives the complete semester range.
  bool full_semester = 4;
}

message TeacherAssignmentsResponse {
  repeated TeacherAssignment assignments = 1;
  string server_now = 2;
  string semester_date_from = 3;
  string semester_date_to = 4;
}

message TeacherAssignment {
  int64 assignment_id = 1;
  int64 teacher_id = 2;
  int64 group_id = 3;
  string group_name = 4;
  int64 subject_id = 5;
  string subject_name = 6;
  int64 semester_id = 7;
  string lesson_type = 8;
  string valid_from = 9;
  string valid_until_exclusive = 10;
}

message TeacherLessonRequest {
  int64 lesson_id = 1;
}

message TeacherLessonResponse {
  TeacherLessonSummary lesson = 1;
  repeated TeacherRosterEntry roster = 2;
  string server_now = 3;
}

message TeacherRosterEntry {
  int64 student_id = 1;
  string display_name = 2;
  string status = 3;
  string symbol = 4;
  string source = 5;
  // False means the group roster has no attendance document for this student.
  bool record_present = 6;
  bool pending_ticket = 7;
  // True only for a persisted ABSENT record with source AUTO_SCHEDULER.
  bool auto_absent = 8;
  string ticket_id = 9;
  string excuse_type = 10;
  string excuse_reason = 11;
  string excuse_comment = 12;
  string attachment_id = 13;
  string attachment_name = 14;
  string attachment_content_type = 15;
  int64 attachment_size = 16;
}

message TeacherJournalRequest {
  repeated int64 lesson_ids = 1;
}

message TeacherJournalResponse {
  repeated TeacherLessonSummary lessons = 1;
  repeated TeacherJournalStudent students = 2;
  string server_now = 3;
}

message TeacherJournalStudent {
  int64 student_id = 1;
  string display_name = 2;
  repeated TeacherJournalCell cells = 3;
}

message TeacherJournalCell {
  int64 lesson_id = 1;
  string status = 2;
  string symbol = 3;
  string source = 4;
  bool record_present = 5; // false means no attendance document exists
  bool pending_ticket = 6;
  bool auto_absent = 7; // persisted ABSENT with source AUTO_SCHEDULER
  string ticket_id = 8;
  string excuse_type = 9;
  string excuse_reason = 10;
}

message TeacherExcuseRequest {
  string request_id = 1;
}

message TeacherExcuseResponse {
  string request_id = 1;
  string request_kind = 2;
  string status = 3;
  int64 student_id = 4;
  string student_name = 5;
  int64 group_id = 6;
  string group_name = 7;
  string created_at = 8;
  int64 decision_by = 9;
  string decision_at = 10;
  string decision_comment = 11;
  string excuse_type = 12;
  string reason = 13;
  string comment = 14;
  repeated TeacherLessonSummary lessons = 15;
  repeated TeacherExcuseAttachment attachments = 16;
  string server_now = 17;
}

message TeacherExcuseAttachment {
  string attachment_id = 1;
  string file_name = 2;
  string content_type = 3;
  int64 size = 4;
  string uploaded_at = 5;
  string expires_at = 6;
}

message TeacherExcuseAttachmentRequest {
  string request_id = 1;
  string attachment_id = 2;
}

message TeacherAttachmentDownload {
  string file_name = 1;
  string content_type = 2;
  int64 size = 3;
  bytes data = 4;
}

enum TeacherStatsScope {
  TEACHER_STATS_SCOPE_UNSPECIFIED = 0;
  TEACHER_STATS_STUDENTS = 1;
  TEACHER_STATS_GROUPS = 2;
}

message TeacherStatsRequest {
  // The BFF resolves complete semester ranges to concrete lesson ids.
  // Attendance re-authorizes every id against the signed teacher identity and
  // the actor's current active group authority.
  repeated int64 lesson_ids = 1;
  TeacherStatsScope scope = 2;
  int64 group_id = 3; // required for TEACHER_STATS_STUDENTS
  int64 subject_id = 4; // required for TEACHER_STATS_STUDENTS
  repeated string lesson_types = 5;
  repeated TeacherStatsSort sorts = 6;
  repeated TeacherStatsFilter filters = 7;
  int64 semester_id = 8;
}

message TeacherStatsSort {
  string column = 1;
  bool descending = 2;
}

message TeacherStatsFilter {
  string column = 1;
  string contains = 2;
  optional double min_percent = 3;
  optional double max_percent = 4;
  optional int32 min_value = 5;
  optional int32 max_value = 6;
}

message TeacherStatsResponse {
  TeacherStatsScope scope = 1;
  int64 semester_id = 2;
  string period_from = 3;
  string period_to = 4;
  int32 lessons_count = 5;
  repeated TeacherStudentStats students = 6;
  repeated TeacherGroupStats groups = 7;
  string server_now = 8;
  repeated TeacherStatsSubjectOption subject_options = 9;
}

message TeacherStatsSubjectOption {
  int64 group_id = 1;
  int64 subject_id = 2;
  string subject_name = 3;
  repeated string lesson_types = 4;
}

message TeacherStatsMetric {
  int32 numerator = 1;
  int32 denominator = 2;
  double percent = 3;
}

message TeacherStudentStats {
  int64 student_id = 1;
  string display_name = 2;
  TeacherStatsMetric present = 3;
  TeacherStatsMetric present_or_excused = 4;
  TeacherStatsMetric excused = 5;
  TeacherStatsMetric absent = 6;
}

message TeacherGroupStats {
  int64 group_id = 1;
  string group_name = 2;
  int32 lessons_count = 3;
  TeacherStatsMetric present = 4;
  TeacherStatsMetric present_or_excused = 5;
  TeacherStatsMetric excused = 6;
  TeacherStatsMetric absent = 7;
}

message TeacherLessonSummary {
  int64 lesson_id = 1;
  int64 schedule_item_id = 2;
  int64 group_id = 3;
  string group_name = 4;
  int64 subject_id = 5;
  string subject_name = 6;
  int64 semester_id = 7;
  int64 assignment_id = 8;
  int64 assigned_teacher_id = 9;
  string lesson_type = 10;
  string lesson_date = 11;
  int32 lesson_number = 12;
  string start_time = 13;
  string end_time = 14;
  string room = 15;
  string status = 16;
  string occurrence_id = 17;
  int32 generation = 18;
  int32 revision = 19;
  bool one_off = 20;
  bool moved = 21;
  bool cancelled = 22;
}
