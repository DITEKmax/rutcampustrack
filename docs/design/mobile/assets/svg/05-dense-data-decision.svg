    <defs>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#9E7AFF"/>
        <stop offset="1" stop-color="#6D28D9"/>
      </linearGradient>
      <linearGradient id="accentSoft" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#6D28D9" stop-opacity=".72"/>
        <stop offset="1" stop-color="#9E7AFF" stop-opacity=".16"/>
      </linearGradient>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.5" fill="#9E7AFF" opacity=".18"/>
      </pattern>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".42"/>
      </filter>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="24" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#9E7AFF"/>
      </marker>
      <style>
        text { font-family: Onest, 'DejaVu Sans', Arial, sans-serif; }
      </style>
    </defs>
    
