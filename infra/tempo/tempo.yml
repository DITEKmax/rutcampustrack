server:
  http_listen_port: 3200
  grpc_listen_port: 9095
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
ingester:
  trace_idle_period: 10s
  max_block_duration: 5m
compactor:
  compaction:
    block_retention: 336h
    compacted_block_retention: 1h
storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
usage_report:
  reporting_enabled: false
overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 1048576
      burst_size_bytes: 2097152
      max_traces_per_user: 2000
    global:
      max_bytes_per_trace: 1048576
    read:
      max_bytes_per_tag_values_query: 1048576
      max_search_duration: 336h
