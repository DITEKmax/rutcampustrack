spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
logging:
  level:
    ru.rutcampustrack: DEBUG
    org.hibernate.SQL: DEBUG
grpc:
  server:
    port: -1

management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false

rutcampustrack:
  security:
    internal-jwt:
      auth-service-url: http://localhost:9999
      public-key-refresh-minutes: 60
      clock-skew-seconds: 30
      legacy-headers-enabled: true
