groups:
- name: rabbitmq
  rules:
  - alert: DLQBacklog
    expr: rabbitmq_detailed_queue_messages{queue=~".*\\.(dlq|parked)"} > 0
    for: 1m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: В DLQ {{ $labels.queue }} осталось сообщение
      description: Сообщение исчерпало допустимые попытки обработки или признано окончательно невалидным и остаётся
        изолированным. Проверьте причину и идентификаторы, разрешённые к просмотру, и откройте инструкцию по DLQ.
        Сохраните сообщение и избегайте бесконечного повторного запуска обработки.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/runbooks/dlq-triage.md
  - alert: RabbitMQQueueBacklog
    expr: rabbitmq_detailed_queue_messages{queue!~".*\\.(dlq|parked)"} > 1000
    for: 5m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: "В очереди {{ $labels.queue }} больше 1000 сообщений"
      description: "{{ $value }} сообщений в очереди {{ $labels.queue }} ждут обработки. Порог превышен более 5 мин.
        Обработчик отстаёт — проверьте пул потоков, задержки БД и внешние вызовы."
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/runbooks/dlq-triage.md
  - alert: RabbitMQConnectionLost
    expr: rabbitmq_connections == 0
    for: 1m
    labels:
      severity: critical
      owner: platform
    annotations:
      summary: "RabbitMQ \u0431\u0435\u0437 \u0430\u043A\u0442\u0438\u0432\u043D\u044B\u0445 \u043F\u043E\u0434\u043A\u043B\
        \u044E\u0447\u0435\u043D\u0438\u0439"
      description: "Ни один сервис не подключён к RabbitMQ. Все потребители могли потерять связь, либо RabbitMQ
        перезапустился без восстановления подключений. Проверьте сеть и журналы сервисов."
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/runbooks/dlq-triage.md
  - alert: RabbitMQConsumerMissing
    expr: rabbitmq_detailed_queue_consumers{queue!~".*\\.(dlq|retry|parked)"} == 0 and on (job, instance, vhost, queue) rabbitmq_detailed_queue_messages
      > 0
    for: 2m
    labels:
      severity: critical
      owner: platform
    annotations:
      summary: В очереди {{ $labels.queue }} есть сообщения, но нет потребителя
      description: Сообщения ждут обработки. Проверьте готовность потребителя, подключение к брокеру и оставшиеся
        попытки. Не очищайте очередь и не возвращайте необрабатываемые сообщения без разбора. Очереди повторных попыток
        с TTL и очереди отложенных сообщений без потребителей намеренно исключены.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/runbooks/dlq-triage.md
