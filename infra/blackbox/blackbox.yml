# M13 G20 — blackbox-exporter config.
#
# Probe модули: http_2xx используется для probing'а https://ruttrack.site
# из Prometheus scrape config'а через __param_module=http_2xx + relabel.
# Нам нужно не только up/down (что покрывает ServiceDown через scrape),
# но и SSL expiry — `probe_ssl_earliest_cert_expiry` метрика, экспортируется
# когда `tls_config` allow + `prober: http`.

modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: "ip4"
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []  # default 2xx
      method: GET
      follow_redirects: true
      fail_if_ssl: false
      fail_if_not_ssl: true   # ruttrack.site — only HTTPS
      tls_config:
        insecure_skip_verify: false
