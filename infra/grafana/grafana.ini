[server]
root_url = %(protocol)s://%(domain)s/grafana/

[security]
admin_user = admin
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}

[auth.anonymous]
enabled = false

[alerting]
enabled = true

[unified_alerting]
enabled = true

[alerting.telegram]
enabled = true
bot_token = ${GF_ALERTING_TELEGRAM_BOT_TOKEN}
chat_id = 1171502265

[paths]
provisioning = /etc/grafana/provisioning
