server:
  port: 9091

spring:
  application:
    name: academic-service

  datasource:
    url: jdbc:postgresql://postgres-academic:5432/academic_db
    username: rct_user
    password: ${POSTGRES_ACADEMIC_PASSWORD:rct_dev_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:rct_dev_pass}

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:rct_user}
    password: ${RABBITMQ_PASSWORD:rct_dev_pass}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

grpc:
  server:
    port: 19091
  auth:
    secret: ${GRPC_SECRET:}
  client:
    # Phase 61 D-04: резолв пары по (group, date, lessonNumber) для валидации ДЗ
    schedule-service:
      address: static://schedule-service:19092
      negotiation-type: plaintext

cache:
  ttl:
    groups: PT5M
    group-members: PT5M
    users: PT5M
    active-semester: PT10M
    campus-geofence: PT1H

logging:
  level:
    ru.rutcampustrack: DEBUG
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
