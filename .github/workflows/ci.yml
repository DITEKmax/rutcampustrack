        if: ${{ matrix.group == 'client' && !cancelled() && steps.e2e-ready.outcome == 'success' }}
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_SYNTHETIC_SEED: 'true'
          RCT_E2E_REMAINING5: 'true'
          RCT_E2E_ADMIN_LIFECYCLE: 'true'
          RCT_REMAINING5_RUN: ${{ runner.temp }}/rct-admin-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
          NODE_OPTIONS: --max-old-space-size=512
          CI: 'true'
        run: |
          umask 077
          printf 'RCT_ADMIN_LIFECYCLE_RUN=%s\n' "$RCT_REMAINING5_RUN" >> "$GITHUB_ENV"
