groups:
- name: service-health
  rules:
  - alert: ServiceDown
    expr: up == 0
    for: 1m
    labels:
      severity: critical
      owner: platform
    annotations:
      summary: "\u0421\u0435\u0440\u0432\u0438\u0441 {{ $labels.job }} \u043D\u0435\u0434\u043E\u0441\u0442\u0443\u043F\u0435\
        \u043D"
      description: Scrape failed for {{ $labels.instance }}. Check target process, scrape authorization and network; this
        is not useful-operation availability.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: HealthCheckDown
    expr: probe_success{job="blackbox-readiness"} == 0
    for: 2m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: '{{ $labels.instance }} health={{ $labels.status }}'
      description: Readiness HTTP/JSON check failed for {{ $labels.service }}. Check dependency health and logs; liveness
        restart does not repair downstream outages.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
- name: outbox-eventing
  rules:
  - alert: OutboxLagHigh
    expr: outbox_lag_seconds > 300
    for: 2m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: "Outbox lag {{ $value | humanizeDuration }} \u0432 {{ $labels.job }}"
      description: "\u0421\u0442\u0430\u0440\u0435\u0439\u0448\u0435\u0435 pending-\u0441\u043E\u0431\u044B\u0442\u0438\u0435\
        \ \u0432\u0438\u0441\u0438\u0442 > 5 \u043C\u0438\u043D. \u041F\u0440\u043E\u0432\u0435\u0440\u044C RabbitMQ + publisher\
        \ job logs. \u0421\u043E\u0431\u044B\u0442\u0438\u0435: {{ $labels.instance }}."
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
- name: http-sli
  rules:
  - alert: HighErrorRate
    expr: sum by (job, environment) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[5m])) > 1
    for: 5m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: "HTTP 5xx rate > 1 req/s \u0432 {{ $labels.job }}"
      description: "{{ $labels.job }} \u0432\u043E\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442 {{ $value | printf \"%.2f\"\
        \ }} req/sec \u043E\u0448\u0438\u0431\u043E\u043A 5xx \u0437\u0430 \u043F\u043E\u0441\u043B\u0435\u0434\u043D\u0438\
        \u0435 5 \u043C\u0438\u043D. \u041F\u0440\u043E\u0432\u0435\u0440\u044C \u043B\u043E\u0433\u0438 + \u043F\u043E\u0441\
        \u043B\u0435\u0434\u043D\u0438\u0435 deploy'\u0438."
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
- name: infra
  rules:
  - alert: DiskUsageHigh
    expr: ((1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"})
      > 0.80) and on (instance, device, mountpoint) (node_filesystem_readonly == 0)
    for: 10m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: Disk {{ $labels.device }} > 80%
      description: Filesystem {{ $labels.mountpoint }} exceeds 80% available-space usage. Inspect retention, log rotation
        and capacity. Preserve data, backups and volumes; cleanup requires explicit authorization.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: JvmHeapPressure
    expr: (sum by (job, instance, environment) (jvm_memory_used_bytes{area="heap"}) / sum by (job, instance, environment)
      (jvm_memory_max_bytes{area="heap"} > 0)) > 0.90
    for: 5m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: JVM heap >90% in {{ $labels.job }}
      description: Per-instance bounded heap pools >90%. Inspect allocation/GC and limits; heap dumps contain sensitive data
        and require controlled handling.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: HikariPoolExhaustion
    expr: (hikaricp_connections_active / hikaricp_connections_max > 0.80) and hikaricp_connections_max > 0
    for: 5m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: "HikariCP pool > 80% \u0432 {{ $labels.application }}"
      description: Connection pool >80% occupied in {{ $labels.job }}. Inspect pending requests, slow/blocked transactions
        and DB capacity before changing limits.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
- name: business-anomaly
  rules:
  - alert: InternalJwtFallbackUnexpected
    expr: rate(internal_jwt_fallback_total[5m]) > 0.1
    for: 5m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: "KI-2 fallback rate={{ $value }}/s \u0432 {{ $labels.job }}"
      description: "Silent fallback \u043D\u0430 legacy X-User-* headers. \u0412 M03a+ \u0432\u0441\u0435 service-calls \u043E\
        \u0431\u044F\u0437\u0430\u043D\u044B \u043D\u0435\u0441\u0442\u0438 X-Internal-Token. \u041F\u0440\u043E\u0432\u0435\
        \u0440\u044C \u0438\u0441\u0442\u043E\u0447\u043D\u0438\u043A: `{{ $labels.from }}` \u2192 `{{ $labels.to }}`."
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: OtpBruteForceSuspect
    expr: rate(otp_verify_total{outcome="mismatch"}[5m]) > 10
    for: 2m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: "OTP brute-force suspect rate={{ $value | printf \"%.2f\" }}/s \u0432 {{ $labels.job }}"
      description: "Mismatch rate > 10/s \u043D\u0430 /otp/verify-by-code \u0437\u0430 5 \u043C\u0438\u043D. Per-IP counter\
        \ \u0443\u0436\u0435 throttle'\u0438\u0442 \u043F\u043E\u0441\u043B\u0435 20 mismatch'\u0435\u0439, \u043D\u043E \u0448\
        \u0438\u0440\u043E\u043A\u0438\u0439 botnet \u043C\u043E\u0436\u0435\u0442 \u0440\u0430\u0441\u043F\u0440\u0435\u0434\
        \u0435\u043B\u044F\u0442\u044C. \u041F\u0440\u043E\u0432\u0435\u0440\u044C Loki ({service=\"rct-auth-service\"} |=\
        \ \"verify-by-code\") + Gateway IP-distribution."
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
