# Trivy misconfiguration suppressions (Trivy v0.70+ structured format).
# Structured YAML restricts the accepted nginx exception to listed paths;
# pass `trivyignores: .trivyignore.yaml` explicitly in security.yml.
#
# M15 first VPS deploy temporary suppressions.

misconfigurations:
  # DS-0002 — frontend nginx containers run as root inside the container.
  # Containers are bridge-network only (not exposed to host), proxied
  # through main rct-nginx. Switching to non-root user requires either
  # nginxinc/nginx-unprivileged base image or port 80→8080 migration with
  # coordinated changes in main nginx proxy_pass + external SSH/proxy
  # tunnels (MSK→FIN tunnel for RKN bypass). M16 follow-up — migrate all
  # frontend containers to nginx-unprivileged in a coordinated change.
  # Owner 2026-10-11 keeps this limited risk for the current Vue images,
  # which preserve the retired PWA/TMA nginx root + port 80 runtime.
  - id: DS-0002
    paths:
      - "frontends/landing/Dockerfile"
      - "frontends/tma-vue/Dockerfile"
      - "frontends/pwa-vue/Dockerfile"
      - "frontends/web-panel/Dockerfile"
    statement: >-
      Temporary M15 nginx exception, confirmed by owner 2026-10-11:
      bridge-network frontend containers retain the current port 80 runtime.
      Root inside these containers remains a security risk. M16 follow-up:
      coordinated non-root nginx migration with proxy and runtime verification.
