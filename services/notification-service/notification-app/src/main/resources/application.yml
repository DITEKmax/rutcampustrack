server:
  port: 9094

spring:
  application:
    name: notification-web

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:rct_user}
    password: ${RABBITMQ_PASSWORD:rct_dev_pass}

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/attendance_db}

notification:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:/keys/public.key}

rutcampustrack:
  security:
    internal-jwt:
      # M03a: pull RSA public key from auth-service /auth/public-key.
      auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:9090}
      public-key-refresh-minutes: 60
      clock-skew-seconds: 30
      legacy-headers-enabled: ${RUTCAMPUSTRACK_SECURITY_LEGACY_HEADERS_ENABLED:true}

vapid:
  public-key: ${VAPID_PUBLIC_KEY:}
  private-key: ${VAPID_PRIVATE_KEY:}
  subject: ${VAPID_SUBJECT:mailto:noreply@rut.ru}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    ru.rutcampustrack: DEBUG
