          RCT_REMAINING5_RUN: ${{ runner.temp }}/rct-worker-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
          NODE_OPTIONS: --max-old-space-size=512
