server:
  port: 9092

spring:
  application:
    name: schedule-service

  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 200

  datasource:
    url: jdbc:postgresql://postgres-schedule:5432/schedule_db
    username: rct_user
    password: ${POSTGRES_SCHEDULE_PASSWORD:rct_dev_pass}
    driver-class-name: org.postgresql.Driver
    # M05 Группа 6 / P2-10/6 — HikariCP tuning. См. docs/connection-pool-tuning.md (NEW-147).
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Europe/Moscow

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:rct_user}
    password: ${RABBITMQ_PASSWORD:rct_dev_pass}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

grpc:
  server:
    port: 19092
  auth:
    secret: ${GRPC_SECRET:}
  client:
    academic-service:
      address: static://academic-service:19091
      negotiation-type: plaintext

rutcampustrack:
  security:
    # M14 G4 v2 (CSO HIGH-06): см. shared-web/RequiredSecretsValidator.java.
    required-env-vars: POSTGRES_SCHEDULE_PASSWORD,RABBITMQ_PASSWORD,GRPC_SECRET
    internal-jwt:
      # M03a: pull RSA public key from auth-service /auth/public-key.
      auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:9090}
      public-key-refresh-minutes: 60
      clock-skew-seconds: 30
      # M14 G1 (CSO CRIT-01): strict by default — см. academic-app/application.yml.
      legacy-headers-enabled: ${RUTCAMPUSTRACK_SECURITY_LEGACY_HEADERS_ENABLED:false}

# M04 QA1: INFO-default для secure-by-default. DEBUG включается через
# application-dev.yml (SPRING_PROFILES_ACTIVE=dev) или env-override.
logging:
  level:
    ru.rutcampustrack: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # M04 QA6: always — partial degradation видна (DB/Rabbit/Redis/Mongo down).
      # /actuator/health не public, детали утекают только аутентифицированным.
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  info:
    git:
      enabled: true
      mode: full
    build:
      enabled: true
  # M04 QA2 (NEW-58/59) — distributed tracing OTel → Tempo.
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4317}
  metrics:
    tags:
      application: ${spring.application.name}
