groups:
- name: service-health
  rules:
  - alert: ServiceDown
    expr: up == 0
    for: 1m
    labels:
      severity: critical
      owner: platform
    annotations:
      summary: "\u0421\u0435\u0440\u0432\u0438\u0441 {{ $labels.job }} \u043D\u0435\u0434\u043E\u0441\u0442\u0443\u043F\u0435\
        \u043D"
      description: Не удалось собрать метрики с {{ $labels.instance }}. Проверьте процесс сервиса, права доступа к
        метрикам и сеть. Этот сигнал показывает доступность сбора метрик. Доступность операций оценивается отдельно.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: HealthCheckDown
    expr: probe_success{job="blackbox-readiness"} == 0
    for: 2m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: 'Проверка готовности {{ $labels.instance }} не прошла (статус {{ $labels.status }})'
      description: Не прошла проверка готовности HTTP/JSON для {{ $labels.service }}. Проверьте состояние зависимостей и
        журналы. Перезапуск по проверке liveness не устранит сбой в зависимом сервисе.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
- name: outbox-eventing
  rules:
  - alert: OutboxLagHigh
    expr: outbox_lag_seconds > 300
    for: 2m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: "Задержка обработки outbox в {{ $labels.job }} — {{ $value | humanizeDuration }}"
      description: "Самое старое событие ждёт отправки больше 5 мин. Проверьте RabbitMQ и журналы обработчика отправки. Экземпляр — {{ $labels.instance }}."
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
- name: http-sli
  rules:
  - alert: HighErrorRate
    expr: sum by (job, environment) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[5m])) > 1
    for: 5m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: "В {{ $labels.job }} больше одной ошибки HTTP 5xx в секунду"
      description: "За последние 5 мин. {{ $labels.job }} возвращал в среднем {{ $value | printf \"%.2f\" }} ответа HTTP 5xx в секунду. Проверьте журналы и последние развёртывания."
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
- name: infra
  rules:
  - alert: DiskUsageHigh
    expr: ((1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"})
      > 0.80) and on (instance, device, mountpoint) (node_filesystem_readonly == 0)
    for: 10m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: На диске {{ $labels.device }} занято больше 80% пространства
      description: На файловой системе {{ $labels.mountpoint }} занято больше 80% доступного пространства. Проверьте
        сроки хранения, ротацию журналов и ёмкость диска. Сохраните данные, резервные копии и тома. Очистка требует
        явного разрешения.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: JvmHeapPressure
    expr: (sum by (job, instance, environment) (jvm_memory_used_bytes{area="heap"}) / sum by (job, instance, environment)
      (jvm_memory_max_bytes{area="heap"} > 0)) > 0.90
    for: 5m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: В {{ $labels.job }} занято больше 90% кучи JVM
      description: В пределах экземпляра занято больше 90% суммарного лимита пулов кучи. Проверьте выделение памяти,
        работу GC и лимиты. Дампы кучи содержат чувствительные данные и требуют контролируемого обращения.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: HikariPoolExhaustion
    expr: (hikaricp_connections_active / hikaricp_connections_max > 0.80) and hikaricp_connections_max > 0
    for: 5m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: "Пул подключений HikariCP в {{ $labels.application }} занят больше чем на 80%"
      description: В {{ $labels.job }} занято больше 80% пула подключений. Проверьте ожидающие запросы, медленные и
        заблокированные транзакции, а также доступные ресурсы БД перед изменением лимитов.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
- name: business-anomaly
  rules:
  - alert: InternalJwtFallbackUnexpected
    expr: rate(internal_jwt_fallback_total[5m]) > 0.1
    for: 5m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: "В {{ $labels.job }} используется резервная схема KI-2 ({{ $value }}/с)"
      description: "Сервис незаметно переходит на устаревшие заголовки X-User-*. Начиная с M03a, все межсервисные вызовы должны передавать X-Internal-Token. Проверьте источник вызова `{{ $labels.from }}` → `{{ $labels.to }}`."
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
  - alert: OtpBruteForceSuspect
    expr: rate(otp_verify_total{outcome="mismatch"}[5m]) > 10
    for: 2m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: "Возможен подбор OTP в {{ $labels.job }} ({{ $value | printf \"%.2f\" }} ошибок в секунду)"
      description: "За последние 5 мин. частота неверных кодов на /otp/verify-by-code превысила 10 в секунду. Ограничение для одного IP-адреса срабатывает после 20 ошибок, но ботнет может распределять запросы. Проверьте Loki ({service=\"rct-auth-service\"} |= \"verify-by-code\") и распределение запросов по IP-адресам на Gateway."
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
