      - name: Verify exact stranded semester effect reconciliation
        id: semester-reconciliation
        timeout-minutes: 11
        if: ${{ matrix.group == 'lifecycle' && !cancelled() && steps.e2e-ready.outcome == 'success' && (steps.homework-target-sensitivity.outcome == 'skipped' || steps.homework-target-sensitivity.outputs.restorationSucceeded == 'true') && steps.assignment-lifecycle.outputs.restorationSucceeded == 'true' }}
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_SYNTHETIC_SEED: 'true'
          RCT_SEMESTER_LIFECYCLE_RUN: ${{ runner.temp }}/rct-semester-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/tests/e2e/infra/certs/server.crt
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
          NODE_OPTIONS: --max-old-space-size=512
          CI: 'true'
        run: |
          umask 077
          printf 'RCT_SEMESTER_RECONCILIATION_RUN=%s\n' "$RCT_SEMESTER_LIFECYCLE_RUN" >> "$GITHUB_ENV"
          mkdir -m 700 -- "$RCT_SEMESTER_LIFECYCLE_RUN"
          mkdir -m 700 -- "$RCT_SEMESTER_LIFECYCLE_RUN/artifacts"
          printf 'RCT_SEMESTER_DISPOSABLE\n' > "$RCT_SEMESTER_LIFECYCLE_RUN/disposable-target"
          set +e
          npx playwright test --config playwright.semester-lifecycle.config.ts --project=chromium --grep 'FULL admin reconciles one exact stranded close before archive completion$'
          case_exit=$?
          set -e
          if ! python3 - <<'PY_RECONCILIATION_GATE'
          import hashlib, json, os, re, stat
          from pathlib import Path

          def pairs(items):
              result = {}
              for key, value in items:
                  if key in result:
                      raise ValueError('Duplicate reconciliation field')
                  result[key] = value
              return result

          restored = False
          try:
              path = Path(os.environ['RCT_SEMESTER_LIFECYCLE_RUN']) / 'reconciliation.safe.json'
              with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW), 'rb') as stream:
                  info = os.fstat(stream.fileno())
                  if not stat.S_ISREG(info.st_mode) or stat.S_IMODE(info.st_mode) != 0o600 or not 0 < info.st_size <= 4096:
                      raise ValueError('Invalid reconciliation receipt')
                  raw = stream.read(4097)
                  if len(raw) != info.st_size:
                      raise ValueError('Reconciliation receipt size changed')
              value = json.loads(raw, object_pairs_hook=pairs,
                                 parse_constant=lambda _: (_ for _ in ()).throw(ValueError('Nonfinite reconciliation field')))
              booleans = {'exactDlqEnvelope', 'pendingBeforeReplay', 'appliedAfterReplay',
                          'sameArchiveCompleted', 'duplicateBusinessUnchanged', 'recoveryPublishAttempted',
                          'duplicateAttempted', 'restorationSucceeded', 'clockUnchanged'}
              keys = booleans | {'schema', 'phase', 'configuredListenerAttempts',
                                 'measuredListenerAttempts', 'retainedDlqCopies', 'cleanupOutcome',
                                 'firstRestartFailure', 'mainCloseLastRead'}
              if type(value) is dict and value.get('schema') in {'semester-reconciliation.v4', 'semester-reconciliation.v5', 'semester-reconciliation.v6', 'semester-reconciliation.v7', 'semester-reconciliation.v8', 'semester-reconciliation.v9', 'semester-reconciliation.v10', 'semester-reconciliation.v11'}:
                  keys |= {'firstHttp500OwnedServices', 'strandedLastRead'}
              if (type(value) is dict and value.get('schema') == 'semester-reconciliation.v5'
                      and 'setupQuiescenceLastRead' in value):
                  keys.add('setupQuiescenceLastRead')
              if type(value) is dict and value.get('schema') in {'semester-reconciliation.v6', 'semester-reconciliation.v7', 'semester-reconciliation.v8', 'semester-reconciliation.v9', 'semester-reconciliation.v10', 'semester-reconciliation.v11'}:
                  keys |= {'setupQuiescenceLastRead', 'replayLastRead', 'replayFailureLog'}
              if type(value) is dict and value.get('schema') in {'semester-reconciliation.v7', 'semester-reconciliation.v8', 'semester-reconciliation.v9', 'semester-reconciliation.v10', 'semester-reconciliation.v11'}:
                  keys.add('archiveReadinessLastRead')
              if type(value) is dict and value.get('schema') in ('semester-reconciliation.v9', 'semester-reconciliation.v10', 'semester-reconciliation.v11'):
                  keys |= {'readinessFailureLog', 'recoveryHealthLastRead'}
              if type(value) is dict and value.get('schema') == 'semester-reconciliation.v11':
                  keys.add('academicRecoveryHealthLastRead')
              if (type(value) is not dict or set(value) != keys
                      or value['schema'] not in {'semester-reconciliation.v3', 'semester-reconciliation.v4', 'semester-reconciliation.v5', 'semester-reconciliation.v6', 'semester-reconciliation.v7', 'semester-reconciliation.v8', 'semester-reconciliation.v9', 'semester-reconciliation.v10', 'semester-reconciliation.v11'}
                      or value['phase'] not in {'SETUP', 'CONTROLLED_CLOSE', 'STRANDED', 'PENDING_ARCHIVE', 'EXACT_REPLAY', 'DUPLICATE'}
                      or type(value['configuredListenerAttempts']) is not int or value['configuredListenerAttempts'] != 3
                      or value['measuredListenerAttempts'] != 'UNKNOWN'
                      or not all(type(value[key]) is bool for key in booleans)
                      or not (value['retainedDlqCopies'] == 'UNKNOWN'
                              or (type(value['retainedDlqCopies']) is int and value['retainedDlqCopies'] == 1))
                      or value['cleanupOutcome'] not in {'PENDING', 'PASSED', 'FAILED'}):
                  raise ValueError('Invalid closed reconciliation schema')
              restart = value['firstRestartFailure']
              if restart is not None and (
                      type(restart) is not dict or set(restart) != {'phase', 'service', 'cause'}
                      or not all(type(restart[key]) is str for key in ('phase', 'service', 'cause'))
                      or restart['phase'] not in {'MAIN', 'CLEANUP'}
                      or restart['service'] not in {'ATTENDANCE', 'SCHEDULE'}
                      or restart['cause'] not in {'NOT_RUNNING', 'HEALTH_STARTING', 'HEALTH_UNHEALTHY', 'HEALTH_UNKNOWN'}):
                  raise ValueError('Invalid closed reconciliation restart failure')
              last_read = value['mainCloseLastRead']
              if last_read is not None and (
                      type(last_read) is not dict
                      or set(last_read) != {'targetPresent', 'groupMatches', 'semesterMatches', 'status'}
                      or not all(type(last_read[key]) is bool
                                 for key in ('targetPresent', 'groupMatches', 'semesterMatches'))
                      or type(last_read['status']) is not str
                      or last_read['status'] not in {'PLANNED', 'ACTIVE', 'CLOSED', 'OTHER_OR_ABSENT'}):
                  raise ValueError('Invalid closed reconciliation main close read')
              if value['schema'] in {'semester-reconciliation.v4', 'semester-reconciliation.v5', 'semester-reconciliation.v6', 'semester-reconciliation.v7', 'semester-reconciliation.v8', 'semester-reconciliation.v9', 'semester-reconciliation.v10', 'semester-reconciliation.v11'}:
                  services = value['firstHttp500OwnedServices']
                  if services is not None:
                      if type(services) is not dict or set(services) != {'ATTENDANCE', 'SCHEDULE'}:
                          raise ValueError('Invalid closed reconciliation service snapshot')
                      for state in services.values():
                          if (type(state) is not dict
                                  or set(state) != {'running', 'health', 'samePinnedId', 'sameNetworkAddresses'}
                                  or not all(type(state[key]) is bool or state[key] == 'UNKNOWN'
                                             for key in ('running', 'samePinnedId', 'sameNetworkAddresses'))
                                  or state['health'] not in {'HEALTHY', 'STARTING', 'UNHEALTHY', 'UNKNOWN'}):
                              raise ValueError('Invalid closed reconciliation service state')
                  stranded = value['strandedLastRead']
                  stranded_flags = {'deadReadyOne', 'deadUnackedZero', 'mainReadyZero', 'mainUnackedZero'}
