                        'networks': {'private_net': {'external': True, 'name': network}}}
              init_mounts = {
                  'postgres-academic': {str(root / 'infra/postgres/init-roles.sh'): '/docker-entrypoint-initdb.d/10-rct-roles.sh'},
                  'postgres-schedule': {},
                  'mongo-attendance': {str(root / 'infra/mongo/init-mongo.js'): '/docker-entrypoint-initdb.d/init-mongo.js'},
              }
              for service in db_services:
                  original = config['services'][service]
                  target['services'][service] = {
                      key: original[key] for key in ('image', 'environment', 'healthcheck')
                      if key in original
                  }
                  mounts = original.get('volumes', [])
                  expected_mounts = init_mounts[service]
                  if len(mounts) != len(expected_mounts) or any(
                          item.get('type') != 'bind' or item.get('read_only') is not True
                          or expected_mounts.get(item.get('source')) != item.get('target')
                          or len([mount for mount in sources[service]['Mounts']
                                  if mount.get('Type') == 'bind' and mount.get('RW') is False
                                  and mount.get('Source') == item['source']
                                  and mount.get('Destination') == item['target']]) != 1
                          for item in mounts):
                      raise RuntimeError('Only pinned read-only database init mounts may enter fresh targets')
                  if mounts:
                      target['services'][service]['volumes'] = mounts
                  if service == 'postgres-academic':
                      target['services'][service]['secrets'] = original['secrets']
                  if service == 'mongo-attendance':
                      target['services'][service]['healthcheck'] = recovery.mongo_restore_healthcheck(original['healthcheck'])
                  target['services'][service].update(
                      labels={'io.rutcampustrack.recovery': 'disposable'},
                      networks={'private_net': {'aliases': [service]}})
              target_file = work / 'fresh-target.compose.json'
              target_file.write_text(json.dumps(target))
              target_compose = ['docker', 'compose', '-p', project, '-f', str(target_file)]
              api('seed')
              stage = 'pending'
              call([*compose, 'stop', '--timeout', '15', 'rabbitmq'])
              if inspect(ids['rabbitmq'])['State']['Running']:
                  raise RuntimeError('Owned broker did not stop')
              api('pending')
              stage = 'backup'
              writers = [name for name in ids if name not in (*db_services, 'rabbitmq', 'redis')]
              backup_failure['action'] = 'WRITERS_STOP'
              call([*compose, 'stop', '--timeout', '30', *writers])
              backup_failure['action'] = 'WRITER_INSPECT'
              if any(inspect(ids[name])['State']['Running'] for name in writers):
                  raise RuntimeError('Application writers remain active')
              db_args = ['--env-file', str(recovery_env), '--academic-container', ids['postgres-academic'],
                         '--schedule-container', ids['postgres-schedule'], '--mongo-container', ids['mongo-attendance']]
              bundle = work / 'bundle'
              backup_failure['action'] = 'BACKUP_SCRIPT'
              call(['python3', 'scripts/recovery.py', 'backup', *db_args,
                    '--no-files', '--quiesced', '--output', str(bundle)])
              backup_failure['action'] = 'TRANSFER_CAPTURE'
              pending = json.loads((work / 'pending.json').read_text())
              baseline = work / 'capture.private.json'
              call(['python3', 'scripts/test-application-recovery.py', 'capture', '--bundle', str(bundle),
                    '--operation-id', pending['operationId'], '--request-file', str(work / 'request.json'),
                    '--history-before', str(work / 'history-before.json'), '--history-pointer', pending['historyPointer'],
                    '--history-lesson-id', str(pending['historyLessonId']), '--quiesced', '--output', str(baseline)])
              stage = 'fresh-restore'
              backup_failure['action'] = 'SOURCE_DATABASE_STOP'
              call([*compose, 'stop', '--timeout', '15', *db_services, 'redis'])
              for service in db_services:
                  backup_failure['action'] = 'SOURCE_DATABASE_INSPECT'
                  if inspect(ids[service])['State']['Running']:
                      raise RuntimeError('Source database did not stop')
                  backup_failure['action'] = 'SOURCE_ENDPOINT_DISCONNECT'
                  call(['docker', 'network', 'disconnect', network, ids[service]])
              # New target containers have no application/Flyway startup or source database mounts.
              backup_failure['action'] = 'TARGET_DATABASE_START'
              call([*target_compose, 'up', '-d', '--pull', 'never', '--wait', '--wait-timeout', '150'])
              backup_failure['action'] = 'TARGET_DATABASE_IDENTIFY'
              target_ids = {name: call([*target_compose, 'ps', '-q', name]).decode().strip() for name in db_services}
              for name, cid in target_ids.items():
                  backup_failure['action'] = 'TARGET_DATABASE_INSPECT'
                  restored_info = json.loads(call(['docker', 'inspect', cid]))[0]
                  labels = restored_info['Config']['Labels']
                  if (labels.get('com.docker.compose.project') != project
                          or labels.get('io.rutcampustrack.recovery') != 'disposable'
                          or restored_info['Image'] != sources[name]['Image']):
                      raise RuntimeError('Fresh target identity mismatch')
              target_args = ['--env-file', str(recovery_env), '--academic-container', target_ids['postgres-academic'],
                             '--schedule-container', target_ids['postgres-schedule'], '--mongo-container', target_ids['mongo-attendance']]
              backup_failure['action'] = 'RESTORE_SCRIPT'
              call(['python3', 'scripts/recovery.py', 'restore', *target_args,
                    '--no-files', '--bundle', str(bundle), '--target-project', project])
              stage = 'application'
              application_failure['action'] = 'START_APPLICATIONS'
              # Restart the same built apps, signing volume and TLS identities on restored databases.
              call([*compose, 'up', '-d', '--no-build', '--no-recreate', '--no-deps', '--pull', 'never',
                    '--wait', '--wait-timeout', '180', 'redis', 'rabbitmq', *writers], seconds=220)
              application_failure['action'] = 'VERIFY_APPLICATION_IDENTITIES'
              for name in ('redis', 'rabbitmq', *writers):
                  cid = call([*compose, 'ps', '-q', name]).decode().strip()
                  if cid != ids[name] or inspect(cid)['Image'] != sources[name]['Image']:
                      application_failure['reason'] = 'APPLICATION_IDENTITY_CHANGED'
                      raise RuntimeError('Original application container or image changed')
              application_failure['action'] = 'VERIFY_SOURCE_DATABASES_STOPPED'
              if any(inspect(ids[name])['State']['Running'] for name in db_services):
                  application_failure['reason'] = 'SOURCE_DATABASE_RUNNING'
                  raise RuntimeError('Source database restarted unexpectedly')
              application_failure['action'] = 'VERIFY_DATABASE_ENDPOINTS'
              connected = json.loads(call(['docker', 'network', 'inspect', network]))[0]['Containers']
              if any(ids[name] in connected for name in db_services):
                  application_failure['reason'] = 'SOURCE_ENDPOINT_ATTACHED'
                  raise RuntimeError('Source database endpoint remains attached')
              if not all(target_ids[name] in connected for name in db_services):
                  application_failure['reason'] = 'RESTORED_ENDPOINT_MISSING'
                  raise RuntimeError('Restored database endpoint is missing')
              application_failure['action'] = 'API_ADMIT'
              api('admit')
              application_failure['action'] = 'VERIFY_RESTORED_STATE'
              call(['python3', 'scripts/test-application-recovery.py', 'verify', *target_args,
                    '--bundle', str(bundle), '--baseline', str(baseline), '--target-project', project,
                    '--schedule-url', 'https://localhost:8443/api',
                    '--history-url', 'https://localhost:8443' + pending['historyUrl'],
                    '--actor-token-file', str(work / 'actor-token.private'),
                    '--history-token-file', str(work / 'history-token.private'),
                    '--timeout-seconds', '130', '--output', str(work / 'verified.private.json')])
              application_failure['action'] = 'API_ATTACHMENT'
              api('attachment')
              print('PASS real application recovery: fresh inventory, historical attachment and exact transfer replay')
          except Exception as error:
              if stage in {'backup', 'fresh-restore'}:
                  retain_backup_failure(error)
                  receipt = {'stage': 'RESTORE' if stage == 'fresh-restore' else 'BACKUP', **backup_failure}
                  try:
                      fd = os.open(work / 'artifacts' / 'admit' / 'backup-failure.safe.json',
                                   os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                      with os.fdopen(fd, 'w') as stream:
                          json.dump(receipt, stream, sort_keys=True)
                          stream.write('\n')
                  except OSError:
                      print('Backup failure receipt unavailable; original failure retained')
                  print(json.dumps(receipt, sort_keys=True))
              if stage == 'source' and (work / 'lifecycle-input.private.json').exists():
                  try:
                      lifecycle_diagnostic()
                  except Exception:
                      print('Lifecycle diagnostic unavailable; original failure retained')
              if stage == 'application':
                  retain_application_failure(error)
                  try:
                      services = application_service_observation()
                  except Exception:
                      services = {'capture': 'UNAVAILABLE', 'unsupportedService': False, 'services': []}
                  receipt = {'stage': 'APPLICATION', **application_failure, 'serviceObservation': services}
                  try:
                      data = (json.dumps(receipt, sort_keys=True) + '\n').encode('ascii')
                      if len(data) > 16384:
                          raise ValueError('Closed application failure receipt exceeds its bound')
                      fd = os.open(work / 'artifacts' / 'admit' / 'application-failure.safe.json',
                                   os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                      with os.fdopen(fd, 'wb') as stream:
                          stream.write(data)
                  except Exception:
                      print('Application failure receipt unavailable; original failure retained')
                  print(json.dumps(receipt, sort_keys=True))
              error_class = application_failure['errorClass'] if stage == 'application' else type(error).__name__
              print('FAIL application recovery stage=' + stage + ' class=' + error_class)
              raise SystemExit(1)
          PY_RECOVERY

      - name: Upload closed application recovery API outcomes
        if: always() && steps.application-recovery.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: application-recovery-safe-${{ github.run_attempt }}
          path: |
            ${{ env.RCT_APP_RECOVERY_RUN }}/artifacts/*/safe-results.json
            ${{ env.RCT_APP_RECOVERY_RUN }}/artifacts/seed/lifecycle.safe.json
            ${{ env.RCT_APP_RECOVERY_RUN }}/artifacts/seed/lifecycle-server.safe.json
            ${{ env.RCT_APP_RECOVERY_RUN }}/artifacts/admit/verification.safe.json
            ${{ env.RCT_APP_RECOVERY_RUN }}/artifacts/admit/application-failure.safe.json
            ${{ env.RCT_APP_RECOVERY_RUN }}/artifacts/admit/backup-failure.safe.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify real semester archive and restore participants
        id: semester-lifecycle
        timeout-minutes: 9
        if: ${{ matrix.group == 'lifecycle' && !cancelled() && steps.application-recovery.outcome == 'success' && steps.semester-reconciliation.outputs.restorationSucceeded == 'true' }}
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_SYNTHETIC_SEED: 'true'
          RCT_SEMESTER_LIFECYCLE_RUN: ${{ runner.temp }}/rct-semester-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/tests/e2e/infra/certs/server.crt
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
          NODE_OPTIONS: --max-old-space-size=512
          CI: 'true'
        run: |
          umask 077
          printf 'RCT_SEMESTER_LIFECYCLE_RUN=%s\n' "$RCT_SEMESTER_LIFECYCLE_RUN" >> "$GITHUB_ENV"
          mkdir -m 700 -- "$RCT_SEMESTER_LIFECYCLE_RUN"
          mkdir -m 700 -- "$RCT_SEMESTER_LIFECYCLE_RUN/artifacts"
          printf 'RCT_SEMESTER_DISPOSABLE\n' > "$RCT_SEMESTER_LIFECYCLE_RUN/disposable-target"
          npx playwright test --config playwright.semester-lifecycle.config.ts --project=chromium --grep 'FULL admin archives and restores the disposable CI semester through real participants$'

      - name: Record the exact failed ordinary MARK without exposing request identity
        if: ${{ !cancelled() && steps.semester-lifecycle.outcome == 'failure' }}
        timeout-minutes: 1
        env:
          RCT_HTTP500_DIAGNOSTIC_STAGE: MARK500
          RCT_E2E_SYNTHETIC_SEED: 'true'
        run: *closed-http500-diagnostic

      - name: Locate the pending semester effect without exposing event data
        timeout-minutes: 1
        if: ${{ !cancelled() && steps.semester-lifecycle.outcome == 'failure' }}
        run: python3 tests/e2e/fixtures/semester-effect-diagnostic.py

      - name: Upload closed semester lifecycle outcome
        if: always() && steps.semester-lifecycle.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: semester-lifecycle-safe-${{ github.run_attempt }}
          path: |
            ${{ env.RCT_SEMESTER_LIFECYCLE_RUN }}/artifacts/safe-results.json
            ${{ env.RCT_SEMESTER_LIFECYCLE_RUN }}/lifecycle.safe.json
            ${{ env.RCT_SEMESTER_LIFECYCLE_RUN }}/effect.safe.json
            ${{ env.RCT_SEMESTER_LIFECYCLE_RUN }}/mark-http500.safe.json
          if-no-files-found: warn
          retention-days: 7

      - name: Stop owned fresh recovery targets
        if: always() && env.RCT_APP_RECOVERY_PROJECT != ''
        run: |
          python3 - <<'PY_CLEANUP'
          import json, os, subprocess
          from pathlib import Path
          project = os.environ['RCT_APP_RECOVERY_PROJECT']
          target = Path(os.environ['RCT_APP_RECOVERY_RUN']) / 'fresh-target.compose.json'
          ids = subprocess.check_output(['docker', 'ps', '-aq', '--filter', 'label=com.docker.compose.project=' + project], text=True).split()
          for cid in ids:
              info = json.loads(subprocess.check_output(['docker', 'inspect', cid]))[0]
              if info['Config']['Labels'].get('io.rutcampustrack.recovery') != 'disposable':
                  raise SystemExit('Recovery target cleanup ownership mismatch')
          if ids:
              if not target.is_file() or target.is_symlink():
                  raise SystemExit('Recovery target cleanup configuration unavailable')
              result = subprocess.run(['docker', 'compose', '-p', project, '-f', str(target), 'down', '--timeout', '15'],
                                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if result.returncode:
                  raise SystemExit('Recovery target cleanup failed')
          print('PASS recovery target cleanup; source data, signing volume and bundle retained')
          PY_CLEANUP

      - name: Remove only this job's test certificate trust
        if: always() && env.RCT_E2E_NSS_NICKNAME != ''
        run: |
          certutil -d "sql:$RCT_E2E_NSS_DB" -D -n "$RCT_E2E_NSS_NICKNAME"

      - name: Remove only this job's WebKit test certificate trust
        if: always() && env.RCT_E2E_SYSTEM_CERT != ''
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RCT_E2E_SYSTEM_CERT" = /usr/local/share/ca-certificates/rct-e2e-localhost.crt
          cmp -- tests/e2e/infra/certs/server.crt "$RCT_E2E_SYSTEM_CERT"
          sudo rm -- "$RCT_E2E_SYSTEM_CERT"
          sudo update-ca-certificates

      - name: Stop isolated e2e containers
        id: e2e-stop
        if: always()
        run: docker compose --env-file tests/e2e/.env.ci -p rct-e2e -f docker-compose.e2e.yml down

      - name: Verify the actual initial-administrator operator CLI
        id: bootstrap-cli
        if: ${{ !cancelled() && matrix.group == 'client' && steps.bootstrap-images.outcome == 'success' && steps.e2e-stop.outcome == 'success' }}
        timeout-minutes: 10
        env:
          RCT_BOOTSTRAP_CLI_ACCEPTANCE: 'true'
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          TESTCONTAINERS_CHECKS_DISABLE: 'true'
          RCT_BOOTSTRAP_CLI_PROJECT: rct-bootstrap-cli-${{ github.run_id }}-${{ github.run_attempt }}
          RCT_BOOTSTRAP_AUTH_IMAGE: rct/auth-service:e2e-local
          RCT_BOOTSTRAP_ACADEMIC_IMAGE: rct/academic-service:e2e-local
          RCT_CI_JOB_ID: ${{ github.job }}
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RCT_CI_EVENT_NAME: ${{ github.event_name }}
          RCT_CI_RUN_ID: ${{ github.run_id }}
          RCT_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          umask 077
          python3 - <<'PY_BOOTSTRAP_CLI'
          import hashlib, json, os, pathlib, re, shutil, signal, subprocess, tempfile

          root = pathlib.Path.cwd()
          project = os.environ['RCT_BOOTSTRAP_CLI_PROJECT']
          source = 'services/academic-service/academic-app/src/test/java/ru/rutcampustrack/academic/bootstrap/InitialAdministratorBootstrapIT.java'
          classname = 'ru.rutcampustrack.academic.bootstrap.InitialAdministratorBootstrapIT'
          method = 'operatorCliLoadsPrivateConfigAndCommitsFirstAdministrator'
          owned_images = set()
          current = None
          temporary = None

          def interrupted(number, frame):
              raise KeyboardInterrupt()

          signal.signal(signal.SIGTERM, interrupted)
          signal.signal(signal.SIGINT, interrupted)

          def call(arguments, seconds=20, discard=False):
              global current
              current = subprocess.Popen(arguments, cwd=root,
                                         stdout=subprocess.DEVNULL if discard else subprocess.PIPE,
                                         stderr=subprocess.DEVNULL, start_new_session=True)
              try:
                  output, _ = current.communicate(timeout=seconds)
                  output = output or b''
                  if current.returncode != 0 or len(output) > 1048576:
                      raise ValueError('bounded bootstrap command failed')
                  return output
              finally:
                  if current.poll() is None:
                      os.killpg(current.pid, signal.SIGKILL)
                      current.wait(timeout=10)
                  current = None

          try:
              if (os.environ.get('GITHUB_ACTIONS') != 'true'
                      or os.environ.get('RUNNER_ENVIRONMENT') != 'github-hosted'
                      or not re.fullmatch(r'rct-bootstrap-cli-[0-9]{1,20}-[0-9]{1,20}', project)):
                  raise ValueError('disposable bootstrap CI scope required')
              if shutil.disk_usage(root).free < 4 * 1024**3:
                  raise ValueError('bootstrap disk reserve unavailable')
              memory = dict(line.split(':', 1) for line in pathlib.Path('/proc/meminfo').read_text().splitlines())
              if int(memory['MemAvailable'].split()[0]) * 1024 < 4 * 1024**3:
                  raise ValueError('bootstrap memory reserve unavailable')
              call(['docker', 'compose', 'version'])
              if call(['docker', 'ps', '-q', '--filter', 'label=com.docker.compose.project=rct-e2e']).strip():
                  raise ValueError('existing browser stack must be stopped first')
              for reference in ('rct/auth-service:e2e-local', 'rct/academic-service:e2e-local', 'postgres:16'):
                  image = call(['docker', 'image', 'inspect', '--format', '{{.Id}}', reference]).decode().strip()
                  if not re.fullmatch(r'sha256:[0-9a-f]{64}', image):
                      raise ValueError('current local bootstrap image required')
                  owned_images.add(image)
              results = root / 'services/academic-service/academic-app/build/test-results/integrationTest'
              if results.exists() and any(results.glob('TEST-*.xml')):
                  raise ValueError('fresh bootstrap result directory required')
              tracked = call(['git', 'show', 'HEAD:' + source])
              if tracked != (root / source).read_bytes():
                  raise ValueError('tracked bootstrap test required')
              temporary = tempfile.TemporaryDirectory(prefix=project + '-', dir=os.environ['RUNNER_TEMP'])
              os.environ['RCT_BOOTSTRAP_CLI_DIRECTORY'] = temporary.name
              environment = dict(os.environ)
              try:
                  # No Docker rebuild/pull and no test worker parallelism after stack shutdown.
                  call(['bash', 'gradlew', ':services:academic-service:academic-app:integrationTest',
                        '--no-daemon', '--max-workers=1',
                        '-Dorg.gradle.jvmargs=-Xmx512m -XX:ActiveProcessorCount=1',
                        '--tests', classname + '.' + method], seconds=480, discard=True)
                  environment['RCT_CI_TEST_OUTCOME'] = 'success'
              except Exception:
                  environment['RCT_CI_TEST_OUTCOME'] = 'failure'
              collected = subprocess.run(
                  ['python3', 'scripts/collect-ci-test-outcomes.py', '--service', 'academic-service',
                   '--task', 'integrationTest'], cwd=root, env=environment,
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=30)
              if collected.returncode != 0:
                  raise ValueError('bootstrap safe collection failed')
              report = json.loads((root / 'build/ci-test-outcomes/academic-service/integrationTest/safe-outcomes.json').read_text())
              checkout = call(['git', 'rev-parse', 'HEAD']).decode().strip()
              expected_metadata = {
                  'checkoutSha': checkout, 'prHeadSha': os.environ['RCT_CI_PR_HEAD_SHA'],
                  'runId': os.environ['RCT_CI_RUN_ID'], 'runAttempt': os.environ['RCT_CI_RUN_ATTEMPT'],
                  'event': os.environ['RCT_CI_EVENT_NAME'], 'testStepOutcome': 'success',
                  'service': 'academic-service', 'task': 'integrationTest', 'job': 'e2e-auth'}
              cases = report.get('cases', [])
              if (report.get('collection') != 'RESULTS'
                      or report.get('summary') != {'PASSED': 1, 'FAILED': 0, 'ERROR': 0,
                                                  'SKIPPED': 0, 'NOT_EXECUTED': 0}
                      or len(cases) != 1
                      or any(report.get('metadata', {}).get(k) != v for k, v in expected_metadata.items())):
                  raise ValueError('one executed bootstrap CLI pass required')
              case = cases[0]
              if (case.get('identity') != 'SOURCE_METHOD' or case.get('status') != 'PASSED'
                      or case.get('classname') != classname or case.get('method') != method
                      or case.get('source') != source
                      or case.get('sourceSha256') != hashlib.sha256(tracked).hexdigest()
                      or tracked != (root / source).read_bytes()):
                  raise ValueError('current bootstrap source-linked pass required')
          except BaseException:
              raise SystemExit('Initial-administrator CLI acceptance failed')
          finally:
              # Exact current-run labels only. Never stop the browser stand or prune shared objects.
              try:
                  for label in ('rct.bootstrap.cli.owner', 'rct.bootstrap.cli.fixture'):
                      identifiers = call(['docker', 'ps', '-aq', '--filter', 'label=' + label + '=' + project]).decode().split()
                      for identifier in identifiers:
                          if not re.fullmatch(r'[0-9a-f]{12,64}', identifier):
                              raise SystemExit('Bootstrap owned cleanup failed')
                          info = json.loads(call(['docker', 'inspect', identifier]))[0]
                          labels = info['Config'].get('Labels') or {}
                          if (labels.get(label) != project or info['Image'] not in owned_images
                                  or label == 'rct.bootstrap.cli.owner' and (
                                      labels.get('com.docker.compose.project') != project
                                      or labels.get('com.docker.compose.service') not in ('auth-service', 'academic-service'))):
                              raise SystemExit('Bootstrap owned cleanup scope refused')
                          call(['docker', 'rm', '--force', '--volumes', identifier])
              except BaseException:
                  raise SystemExit('Bootstrap owned cleanup failed') from None
              finally:
                  if temporary is not None:
                      try:
                          temporary.cleanup()
                      except Exception:
                          raise SystemExit('Bootstrap private-file cleanup failed') from None
          print('PASS actual operator CLI, private ConfigData and coherent own-DB bootstrap/retry')
          PY_BOOTSTRAP_CLI

      - name: Upload the existing collector's operator CLI outcome
        if: ${{ !cancelled() && matrix.group == 'client' && steps.bootstrap-images.outcome == 'success' && steps.e2e-stop.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-cli-safe-${{ github.run_attempt }}
          path: build/ci-test-outcomes/academic-service/integrationTest/safe-outcomes.json
          if-no-files-found: error
          retention-days: 7

  e2e-auth-required:
    name: Playwright E2E auth flow
    if: ${{ always() }}
    needs: e2e-auth
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both isolated browser groups to succeed
        env:
          RCT_BROWSER_MATRIX_RESULT: ${{ needs.e2e-auth.result }}
        run: |
          if [ "$RCT_BROWSER_MATRIX_RESULT" != success ]; then
            printf '%s\n' 'Required browser groups did not both succeed'
            exit 1
          fi

  monitoring-contract:
    name: Monitoring — formulas, delivery, stores and Grafana pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RCT_MONITORING_RUNTIME: isolated-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Setup Gradle for the existing application transport IT
        uses: gradle/actions/setup-gradle@v6
      - name: Check the complete synthetic production environment contract
        run: python3 scripts/test-env-prod.py --compose-config
      - name: Install bounded config parser and exact telemetry tools
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install PyYAML==6.0.3 aio-pika==9.5.3
          mkdir -p "$RUNNER_TEMP/rct-monitoring-tools" build/monitoring
          python - <<'PY'
          import hashlib, os, pathlib, tarfile, urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'rct-monitoring-tools'
          for project,version,binaries in [('prometheus','2.55.1',['prometheus','promtool']),('alertmanager','0.27.0',['alertmanager','amtool'])]:
              filename=f'{project}-{version}.linux-amd64.tar.gz'
              base=f'https://github.com/prometheus/{project}/releases/download/v{version}/'
              sums=urllib.request.urlopen(base+'sha256sums.txt',timeout=30).read().decode()
              expected=next(line.split()[0] for line in sums.splitlines() if line.endswith(filename))
              archive=out/filename
              with urllib.request.urlopen(base+filename,timeout=60) as response, archive.open('wb') as output:
                  while chunk:=response.read(1024*1024):output.write(chunk)
              assert hashlib.sha256(archive.read_bytes()).hexdigest()==expected
              with tarfile.open(archive) as tar:
                  for binary in binaries:
                      data=tar.extractfile(f'{project}-{version}.linux-amd64/{binary}').read()
                      (out/binary).write_bytes(data);(out/binary).chmod(0o700)
          PY
          echo "$RUNNER_TEMP/rct-monitoring-tools" >> "$GITHUB_PATH"
          echo "PROMTOOL=$RUNNER_TEMP/rct-monitoring-tools/promtool" >> "$GITHUB_ENV"
          echo "PROMETHEUS_BIN=$RUNNER_TEMP/rct-monitoring-tools/prometheus" >> "$GITHUB_ENV"
          echo "ALERTMANAGER_BIN=$RUNNER_TEMP/rct-monitoring-tools/alertmanager" >> "$GITHUB_ENV"
      - name: Validate actual rule/config syntax and diagnostic formulas
        id: formulas
        run: |
          promtool check config --syntax-only infra/prometheus/prometheus.yml
          promtool check rules infra/prometheus/rules/*.yml
          amtool check-config infra/alertmanager/alertmanager.yml
          python infra/prometheus/tests/check_formulas.py
      - name: Real firing and resolved delivery to isolated authenticated receiver
        id: delivery
        shell: bash
        run: |
          set -euo pipefail
          python infra/prometheus/tests/check_delivery.py | tee build/monitoring/delivery.json
      - name: Datastores and official exporters with least privilege
        id: exporters
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python infra/prometheus/tests/check_exporters.py | tee build/monitoring/exporters.json
      - name: Grafana queries, log-trace links and persisted checkpoints
        id: pipeline
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python infra/prometheus/tests/check_pipeline.py | tee build/monitoring/pipeline.json
      - name: Record only safe source and check outcomes
        if: always()
        env:
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          FORMULAS_OUTCOME: ${{ steps.formulas.outcome }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
          EXPORTERS_OUTCOME: ${{ steps.exporters.outcome }}
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path('build/monitoring');out.mkdir(parents=True,exist_ok=True)
          paths=[pathlib.Path('docker-compose.prod.yml'),pathlib.Path('nginx/conf.d/default.conf')]
          paths.extend(p for root in ['infra/prometheus','infra/grafana','infra/alertmanager','infra/loki','infra/tempo','infra/alloy','infra/blackbox','infra/postgres'] for p in pathlib.Path(root).rglob('*') if p.is_file() and p.suffix in ['.yml','.json','.ini','.py','.sh','.sql','.alloy','.template'])
          outcomes={k.lower():os.environ[k+'_OUTCOME'] for k in ['TOOLS','FORMULAS','DELIVERY','EXPORTERS','PIPELINE']}
          checks=dict(outcomes);receipts={}
          for name in ['delivery','exporters','pipeline']:
              try:
                  data=json.loads((out/(name+'.json')).read_text())
                  valid=data.get('result')=='PASS' and (name=='delivery' or data.get('source_sha')==os.environ['GITHUB_SHA'])
                  receipts[name]='PASS' if valid else 'FAIL'
              except (OSError,ValueError,TypeError,AttributeError):
                  receipts[name]='MISSING_OR_INVALID'
              if receipts[name]!='PASS':checks[name]='failure'
          result={'source_sha':os.environ['GITHUB_SHA'],'result':'PASS' if all(v=='success' for v in checks.values()) else 'FAIL','checks':checks,'step_outcomes':outcomes,'receipt_results':receipts,'file_sha256':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths if p.is_file()},'qualification':'Isolated telemetry, actual Gateway/BFF transport and controlled fixtures; report/business broker acceptance remains separate.'}
          (out/'manifest.json').write_text(json.dumps(result,indent=2)+'\n')
          assert result['result']=='PASS','Monitoring checks or safe result receipts failed'
          PY
      - name: Upload safe monitoring outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-monitoring-outcomes-${{ github.run_attempt }}
          path: build/monitoring/*.json
          if-no-files-found: error
          retention-days: 7

  observability-apps:
    name: Isolated GlitchTip, Java CPU profiles and protected operator links
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      RCT_OBSERVABILITY_APPS_RUNTIME: isolated-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Install the locked Vue and existing browser test dependencies
        run: |
          python -m pip install PyYAML==6.0.3
          npm ci --prefix frontends --ignore-scripts --no-audit --no-fund
          npm ci --prefix tests/e2e --ignore-scripts --no-audit --no-fund
          tests/e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Compile the actual Java report and check error privacy
        run: |
          bash ./gradlew --no-daemon --max-workers=2 --console=plain \
            '-Dorg.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m -XX:ActiveProcessorCount=2' \
            --system-prop=org.gradle.java.compile-classpath-packaging=true \
            :services:shared:shared-observability:compileJava \
            :services:shared:shared-observability:compileTestJava \
            :services:shared:shared-observability:test --tests '*SafeErrorEventTest' \
            :services:attendance-service:attendance-app:observabilityProbeClasspath
      - name: Check Vue privacy and platform bootstrap types
        working-directory: frontends
        run: |
          npm run typecheck:foundation
          npx vitest run --config vitest.config.ts mobile-core/src/observability/privacy.test.ts
      - name: Exercise the three actual apps, private access, grouping and bounded overhead
        run: python infra/observability-apps/check_apps.py
      - name: Upload only the safe app outcome and measured resource receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-observability-apps-${{ github.run_attempt }}
          path: build/monitoring/apps.json
          if-no-files-found: error
