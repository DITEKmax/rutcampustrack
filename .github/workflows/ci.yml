                  path = Path(source)
                  info = path.lstat()
                  if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= 262144:
                      raise ValueError('Reported frame source unavailable')
                  raw = path.read_bytes()
                  if hashlib.sha256(raw).hexdigest() != digest or len(raw.splitlines()) != lines:
                      raise ValueError('Reported frame source changed')
              if is_ordinary_mark(config):
                  for source, digest in ORDINARY_MARK_SOURCES.items():
