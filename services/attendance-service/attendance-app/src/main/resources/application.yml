server:
  port: 9093

spring:
  application:
    name: attendance-service
  data:
    mongodb:
      uri: mongodb://mongo-attendance:27017/attendance_db
    redis:
      host: redis
      port: 6379
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:rct_user}
    password: ${RABBITMQ_PASSWORD:rct_dev_pass}

grpc:
  server:
    port: -1
  client:
    schedule-service:
      address: static://schedule-service:19092
      negotiation-type: plaintext
    academic-service:
      address: static://academic-service:19091
      negotiation-type: plaintext

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    ru.rutcampustrack: DEBUG
