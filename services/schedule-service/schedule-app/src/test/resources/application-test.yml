spring:
  datasource:
    hikari:
      # Cached Spring contexts share one test database. Keep room for concurrent writers
      # without retaining the production pool's five idle connections per context.
      maximum-pool-size: 4
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
logging:
  level:
    ru.rutcampustrack: DEBUG
    org.hibernate.SQL: DEBUG
grpc:
  server:
    port: -1
  client:
    academic-service:
      address: static://localhost:19091
      negotiation-type: plaintext

management:
  health:
    rabbit:
      enabled: false

rct:
  schedule:
    iso-parity-reconciler:
      enabled: false

rutcampustrack:
  security:
    internal-jwt:
      auth-service-url: http://localhost:9999
      public-key-refresh-minutes: 60
      clock-skew-seconds: 30
      legacy-headers-enabled: true
