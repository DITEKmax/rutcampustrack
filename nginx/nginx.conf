worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # M07 G11 (P2-9/3, NEW-152): глобальный лимит 2m для большинства
    # endpoint'ов (JSON payload'ы sub-kb, защита от DoS через giant body).
    # Раньше был 12m — достаточно для upload'ов, но не защищал от
    # malicious bulk-post'ов. Исключения — per-location в conf.d/default.conf:
    #   /api/attendance/excuses/with-file → 25m (multipart excuse file).
    # Остальные upload endpoint'ы не существуют (avatar = JSON preset-id,
    # не file upload).
    client_max_body_size 2m;

    # Hide nginx version in Server header (NET-01 security)
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
