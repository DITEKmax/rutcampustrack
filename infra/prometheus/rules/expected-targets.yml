  - alert: ExpectedTargetMissing
    expr: rct_expected_target unless on (job, instance, environment) up
    for: 2m
    labels:
      severity: critical
      owner: platform
    annotations:
      summary: Expected target {{ $labels.job }} / {{ $labels.instance }} disappeared
      description: Scrape discovery/configuration or staleness removed an expected series. Restore target; zero traffic does
        not remove up.
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/monitoring/observability.md
