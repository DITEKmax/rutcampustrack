spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  # M09 G2.6: RabbitAutoConfiguration больше не исключаем — auth-service
  # публикует otp.requested event через RabbitTemplate (DomainEventListener).
  # Без autoconfig'а user-@Configuration с @ConditionalOnBean давал false
  # (оценка до autoconfig) → rabbitTemplate из RabbitConfig не создавался,
  # default-autoconfig-шаблон с SimpleMessageConverter ломал JSON-контракт.
  # Тесты, не проверяющие Rabbit, не делают convertAndSend — connection
  # factory просто не используется.
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  health:
    rabbit:
      enabled: false

jwt:
  key-dir: ${java.io.tmpdir}/rct-test-keys
  access-token-expiration: 900
  refresh-token-expiration: 604800

rutcampustrack:
  security:
    internal-issuer:
      secret: test-internal-issuer-secret-32-bytes-or-more-for-test-env
      token-ttl-seconds: 300

otp:
  code-length: 6
  ttl-seconds: 120
  max-attempts: 3
  attempts-window-seconds: 300
  resend-cooldown-seconds: 60

logging:
  level:
    ru.rutcampustrack: DEBUG
    org.testcontainers: INFO
