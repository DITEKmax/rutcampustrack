name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '.planning/**'
      - '*.md'
      - 'SECURITY.md'
      - 'renovate.json'
      - '.pre-commit-config.yaml'
  pull_request:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '.planning/**'
      - '*.md'
      - 'SECURITY.md'
      - 'renovate.json'
      - '.pre-commit-config.yaml'

jobs:
  java-unit-test:
    name: Java unit — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            path: ':services:api-gateway'
          - name: auth-service
            path: ':services:auth-service:auth-app'
          - name: academic-service
            path: ':services:academic-service:academic-app'
          - name: schedule-service
            path: ':services:schedule-service:schedule-app'
          - name: attendance-service
            path: ':services:attendance-service:attendance-app'
          - name: notification-service
            path: ':services:notification-service:notification-app'
          - name: mobile-bff
            path: ':services:mobile-bff:mobile-bff-app'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # M08 Группа 1 (P2-8/1) — только unit (*Test), БЕЗ *IT.
      # Быстрая jobs, блокирующая PR при базовых регрессиях.
      - name: Warm Gradle wrapper
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then
              exit 0
            fi
            echo "Gradle wrapper download failed, retrying in $((attempt * 10))s ($attempt/3)"
            sleep $((attempt * 10))
          done
          ./gradlew --version --no-daemon

      - name: Verify the admitted reason wire mapping rejects one valid counterexample
        if: matrix.service.name == 'attendance-service'
        timeout-minutes: 8
        env:
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          umask 077
          python3 - <<'PY_REASON_ENUM'
          import hashlib, json, os, pathlib, re, shutil, subprocess, tempfile, time
          import xml.etree.ElementTree as ET

          app = pathlib.Path('services/attendance-service/attendance-app')
          source = app / 'src/main/java/ru/rutcampustrack/attendance/grpc/StudentRequestGrpcMapper.java'
          test_source = app / 'src/test/java/ru/rutcampustrack/attendance/grpc/StudentRequestGrpcMapperTest.java'
          source_sha = '21c29e14a84fa54dfea8d9762b11c230d89b3ed8cfab158ee1185fcd8b6a857e'
          test_sha = '634d96cfefafc74800bdeed29b55445992db45e4fdd278291a9ee17304bd0fe1'
          negative_sha = '98a95e309edc13bfa0d3def34db03143ef3c179cb2f46015f8c5164af8f1486a'
          package = 'ru.rutcampustrack.attendance.grpc.StudentRequestGrpcMapperTest'
          method = 'studentReasonCodesRoundtripWithoutChangingPublishedNumbers'
          results, reports = app / 'build/test-results/test', app / 'build/reports/tests/test'
          private = pathlib.Path(tempfile.mkdtemp(prefix='reason-enum-red-', dir=os.environ['RUNNER_TEMP']))
          deadline = time.monotonic() + 360
          current = None
          proof = {'schemaVersion': 1, 'state': 'UNEXPECTED_RULE_RESULT', 'phase': 'SOURCE_ADMISSION',
                   'producerHeadSha': os.environ['RCT_CI_PR_HEAD_SHA'],
                   'checkoutSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                   'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                   'event': os.environ['GITHUB_EVENT_NAME'], 'service': 'attendance-service', 'task': 'test',
                   'testMethod': package + '.' + method, 'testSourceSha256': test_sha,
                   'restoredSourceSha256': source_sha, 'counterexampleSourceSha256': negative_sha,
                   'counterexample': 'UNIVERSITY_ORDER_MAPPED_TO_SUMMONS',
                   'expectedWireCode': 6, 'observedWireCode': 7, 'sourceRestoredExact': False,
                   'restoredCompileCacheDisabled': True}
          def run_target(label):
              remaining = deadline - time.monotonic()
              assert remaining > 0
              with (private / (label + '.private.log')).open('wb') as log:
                  return subprocess.run(
                      ['./gradlew', ':services:attendance-service:attendance-app:test', '--no-daemon',
                       '--no-build-cache', '--tests', package + '.' + method],
                      stdout=log, stderr=subprocess.STDOUT, timeout=remaining).returncode

          def native_case(failed):
              result = results / ('TEST-' + package + '.xml')
              if failed:
                  proof['phase'] = 'RED_XML_FILE'
              assert result.is_file() and not result.is_symlink() and 0 < result.stat().st_size <= 33554432
              raw = result.read_bytes()
              if failed:
                  proof['phase'] = 'RED_XML_DTD'
              assert b'<!DOCTYPE' not in raw.upper() and b'<!ENTITY' not in raw.upper()
              suite = ET.fromstring(raw)
              expected = {'tests': '1', 'failures': '1' if failed else '0', 'errors': '0', 'skipped': '0'}
              if failed:
                  proof['phase'] = 'RED_XML_SUITE'
              assert suite.tag == 'testsuite' and suite.get('name') == package
              if failed:
                  proof['phase'] = 'RED_XML_COUNTS'
              assert {key: suite.get(key) for key in expected} == expected
              cases = suite.findall('testcase')
              if failed:
                  proof['phase'] = 'RED_XML_CASE_IDENTITY'
              assert len(cases) == 1 and cases[0].get('classname') == package and cases[0].get('name') == method + '()'
              case = cases[0]
              if failed:
                  proof['phase'] = 'RED_XML_ERRORS'
              assert not case.findall('error') and not case.findall('skipped')
              if failed:
                  proof['phase'] = 'RED_XML_FAILURE_COUNT'
              assert len(case.findall('failure')) == int(failed)
              return case

          try:
              assert all(re.fullmatch('[0-9a-f]{40}', proof[key]) for key in ('producerHeadSha', 'checkoutSha'))
              assert all(re.fullmatch('[0-9]{1,20}', proof[key]) for key in ('runId', 'runAttempt'))
              assert proof['event'] in {'push', 'pull_request'}
              current = source.read_bytes()
              assert 0 < len(current) <= 1048576 and hashlib.sha256(current).hexdigest() == source_sha
              assert subprocess.check_output(['git', 'status', '--porcelain', '--', str(source)]) == b''
              assert current == subprocess.check_output(['git', 'show', 'HEAD:' + source.as_posix()])
              test_bytes = test_source.read_bytes()
              assert hashlib.sha256(test_bytes).hexdigest() == test_sha
              assert test_bytes == subprocess.check_output(['git', 'show', 'HEAD:' + test_source.as_posix()])
              target = '                .containsExactly(1, 2, 3, 4, 5, 6, 7);'
              lines = test_bytes.decode().splitlines()
              assert lines.count(target) == 1
              rule_line = lines.index(target) + 1
              assert rule_line == 152
              original = b'case UNIVERSITY_ORDER -> StudentExcuseReason.STUDENT_EXCUSE_REASON_UNIVERSITY_ORDER;'
              changed = b'case UNIVERSITY_ORDER -> StudentExcuseReason.STUDENT_EXCUSE_REASON_SUMMONS;'
              assert current.count(original) == 1
              negative = current.replace(original, changed)
              assert hashlib.sha256(negative).hexdigest() == negative_sha
              assert negative.replace(changed, original) == current
              for path, label in ((results, 'previous-results'), (reports, 'previous-reports')):
                  if path.exists():
                      shutil.move(path, private / label)
              source.write_bytes(negative)
              proof['phase'] = 'RED_RUN'
              red_exit = run_target('red')
              proof['red'] = {'nativeExit': red_exit}
              assert red_exit != 0
              proof['phase'] = 'RED_XML_IDENTITY'
              failure = native_case(True).find('failure')
              proof['phase'] = 'RED_FAILURE_TYPE'
              assert failure.get('type') in {'org.opentest4j.AssertionFailedError', 'java.lang.AssertionError'}
              proof['phase'] = 'RED_MESSAGE_RULE'
              message = failure.get('message', '').removeprefix(failure.get('type') + ': ')
              assert re.fullmatch(
                  r'\s*Expecting actual:\s*\[1,\s*2,\s*3,\s*4,\s*5,\s*7,\s*7\]\s*'
                  r'to contain exactly \(and in same order\):\s*\[1,\s*2,\s*3,\s*4,\s*5,\s*6,\s*7\]\s*'
                  r'but some elements were not found:\s*\[6\]\s*'
                  r'and others were not expected:\s*\[7\]\s*', message)
              proof['phase'] = 'RED_NAMED_FRAME'
              named_lines = re.findall(
                  r'(?m)^[ \t]*at[ \t]+(?:[^ \t\r\n()]{1,256}/)?' + re.escape(package + '.' + method)
                  + r'\(StudentRequestGrpcMapperTest\.java:([1-9][0-9]{0,5})\)[ \t]*$', failure.text or '')
              assert named_lines == [str(rule_line)]
              proof['red'].update(tests=1, failures=1, errors=0, skipped=0,
                                  namedMethodFrameCount=1, expectedRuleFrameMatched=True, ruleFrameLine=rule_line)
              proof['phase'] = 'RESTORE'
              source.write_bytes(current)
              assert source.read_bytes() == current
              assert subprocess.check_output(['git', 'status', '--porcelain', '--', str(source)]) == b''
              proof['sourceRestoredExact'] = True
              for path, label in ((results, 'red-results'), (reports, 'red-reports')):
                  if path.exists():
                      shutil.move(path, private / label)
              proof['phase'] = 'RESTORED_GREEN_RUN'
              green_exit = run_target('green')
              proof['green'] = {'nativeExit': green_exit}
              assert green_exit == 0
              proof['phase'] = 'RESTORED_GREEN_XML'
              native_case(False)
              proof['green'].update(tests=1, failures=0, errors=0, skipped=0)
              proof.update(state='EXPECTED_RULE_FAILURE_RESTORED_GREEN', phase='COMPLETE')
          except Exception as error:
              proof['failureClass'] = type(error).__name__ if type(error).__name__ in {
                  'AssertionError', 'TimeoutExpired', 'CalledProcessError', 'FileNotFoundError',
                  'ParseError', 'UnicodeDecodeError', 'ValueError', 'OSError'} else 'UNKNOWN'
          finally:
              try:
                  if current is not None:
                      source.write_bytes(current)
                      assert source.read_bytes() == current
                      assert hashlib.sha256(source.read_bytes()).hexdigest() == source_sha
                      assert subprocess.check_output(['git', 'status', '--porcelain', '--', str(source)]) == b''
                      proof['sourceRestoredExact'] = True
                  assert hashlib.sha256(test_source.read_bytes()).hexdigest() == test_sha
                  for path, label in ((results, 'final-results'), (reports, 'final-reports')):
                      if path.exists():
                          shutil.move(path, private / label)
              except Exception:
                  proof.update(state='SOURCE_RESTORE_OR_PRIVATE_CLEANUP_FAILED', sourceRestoredExact=False)
              output = pathlib.Path('build/ci-test-outcomes/attendance-service')
              output.mkdir(mode=0o700, parents=True, exist_ok=True)
              encoded = json.dumps(proof, indent=2) + '\n'
              assert len(encoded.encode()) <= 32768
              (output / 'reason-enum-regression-safe.json').write_text(encoded)
              shutil.rmtree(private)
          raise SystemExit(0 if proof['state'] == 'EXPECTED_RULE_FAILURE_RESTORED_GREEN' else 1)
          PY_REASON_ENUM

      - name: Upload the closed reason wire mapping sensitivity proof
        if: always() && matrix.service.name == 'attendance-service'
        uses: actions/upload-artifact@v4
        with:
          name: reason-enum-regression-safe-${{ github.run_attempt }}
          path: build/ci-test-outcomes/attendance-service/reason-enum-regression-safe.json
          if-no-files-found: error
          retention-days: 7

      - name: Unit tests ${{ matrix.service.name }}
        id: java-tests
        if: ${{ !cancelled() }}
        run: |
          git -c core.fileMode=false diff --exit-code -- services proto event-schemas
          ./gradlew ${{ matrix.service.path }}:test --no-daemon ${{ matrix.service.name == 'schedule-service' && '--no-build-cache' || '' }}

      # Raw JUnit XML/HTML can contain credentials in failure messages and captured output.
      # Publish source-linked identities and outcomes through the existing safe collector.
      - name: Collect safe unit outcomes
        if: always()
        env:
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RCT_CI_EVENT_NAME: ${{ github.event_name }}
          RCT_CI_RUN_ID: ${{ github.run_id }}
          RCT_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          RCT_CI_JOB_ID: ${{ github.job }}
          RCT_CI_TEST_OUTCOME: ${{ steps.java-tests.outcome }}
        run: python3 scripts/collect-ci-test-outcomes.py --service '${{ matrix.service.name }}' --task test

      - name: Upload safe unit outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-unit-outcomes-${{ matrix.service.name }}-${{ github.run_attempt }}
          path: build/ci-test-outcomes/${{ matrix.service.name }}/test/safe-outcomes.json
          if-no-files-found: error
          retention-days: 7

  java-integration-test:
    name: Java IT — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    # Integration tests независимы от unit job'ов (separate pipelines,
    # fail-fast на уровне jobs). Параллельный запуск ускоряет wall-time.
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            path: ':services:api-gateway'
          - name: auth-service
            path: ':services:auth-service:auth-app'
          - name: academic-service
            path: ':services:academic-service:academic-app'
          - name: schedule-service
            path: ':services:schedule-service:schedule-app'
          - name: attendance-service
            path: ':services:attendance-service:attendance-app'
          - name: notification-service
            path: ':services:notification-service:notification-app'
          - name: mobile-bff
            path: ':services:mobile-bff:mobile-bff-app'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # M08 Группа 1 (P2-8/1) — только *IT (Spring context + Testcontainers).
      # Gradle filter в root build.gradle.kts.
      - name: Warm Gradle wrapper
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then
              exit 0
            fi
            echo "Gradle wrapper download failed, retrying in $((attempt * 10))s ($attempt/3)"
            sleep $((attempt * 10))
          done
          ./gradlew --version --no-daemon

      - name: Setup Python for Academic credential bridge
        if: matrix.service.name == 'academic-service'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            services/notification-bot/requirements.txt
            services/notification-bot/requirements-test.txt

      - name: Install isolated Academic credential bridge dependencies
        if: matrix.service.name == 'academic-service'
        run: |
          python -m venv "$RUNNER_TEMP/np01-python"
          "$RUNNER_TEMP/np01-python/bin/python" -m pip install -r services/notification-bot/requirements.txt -r services/notification-bot/requirements-test.txt
          echo "NP01_PYTHON_EXECUTABLE=$RUNNER_TEMP/np01-python/bin/python" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"

      - name: Verify one-off replacement regression rejects the previous implementation
        if: matrix.service.name == 'schedule-service'
        timeout-minutes: 8
        env:
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          umask 077
          source=services/schedule-service/schedule-app/src/main/java/ru/rutcampustrack/schedule/replacement/AssignmentReplacementService.java
          results=services/schedule-service/schedule-app/build/test-results/integrationTest
          reports=services/schedule-service/schedule-app/build/reports/integrationTest
          private=$(mktemp -d "$RUNNER_TEMP/oneoff-regression.XXXXXX")
          cp "$source" "$private/current.java"
          restore() {
            result=$?
            trap - EXIT
            cp "$private/current.java" "$source" || exit 1
            cmp --silent "$private/current.java" "$source" || exit 1
            if [ -d "$results" ]; then mv "$results" "$private/red-results"; fi
            if [ -d "$reports" ]; then mv "$reports" "$private/red-reports"; fi
            if [ -f "$private/verified.safe.json" ]; then
              mkdir -p build/ci-test-outcomes/schedule-service
              cp "$private/verified.safe.json" build/ci-test-outcomes/schedule-service/oneoff-regression-safe.json
            fi
            rm -rf -- "$private"
            exit "$result"
          }
          trap restore EXIT
          git fetch --quiet --no-tags --depth=1 origin 75cb5ed5ae8d731991a5efd447c611b0eb9f65da
          git show "75cb5ed5ae8d731991a5efd447c611b0eb9f65da:$source" > "$private/previous.java"
          printf '%s  %s\n' f4ed91a3f41286a379325ee172acbbf0af24b37050f00307eb5b95938d1b3482 "$private/previous.java" | sha256sum --check --status
          cp "$private/previous.java" "$source"
          set +e
          ./gradlew :services:schedule-service:schedule-app:integrationTest --no-daemon --tests 'ru.rutcampustrack.schedule.integration.AssignmentReplacementServiceIT.oneOffCloseAdoptThenNextDayReplacementPreservesHistoryAndReplay' > "$private/red.private.log" 2>&1
          red_exit=$?
          set -e
          python3 - "$private" "$red_exit" <<'PY_ONEOFF_DIAGNOSTICS'
          import json, os, pathlib, re, subprocess, sys, xml.etree.ElementTree as ET
          private = pathlib.Path(sys.argv[1])
          proof = {'schemaVersion':1,'state':'UNEXPECTED_ONEOFF_RED','redExit':int(sys.argv[2]),
                   'producerHeadSha':os.environ['RCT_CI_PR_HEAD_SHA'],
                   'checkoutSha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                   'diagnosticKind':'NO_JUNIT','failureType':'NONE','causeClasses':[],'stackMethods':[]}
          allowed_types = {
              'org.opentest4j.AssertionFailedError','java.lang.AssertionError','java.lang.IllegalStateException',
              'org.springframework.beans.factory.BeanCreationException','org.springframework.beans.factory.UnsatisfiedDependencyException',
              'org.springframework.beans.factory.BeanDefinitionStoreException','org.springframework.beans.factory.NoSuchBeanDefinitionException',
              'org.springframework.context.ApplicationContextException','org.springframework.boot.context.properties.bind.BindException',
              'org.springframework.boot.context.properties.ConfigurationPropertiesBindException',
              'org.springframework.boot.context.properties.bind.validation.BindValidationException',
              'org.springframework.jdbc.BadSqlGrammarException','org.springframework.jdbc.CannotGetJdbcConnectionException',
              'org.springframework.jdbc.UncategorizedSQLException','org.flywaydb.core.api.FlywayException',
              'org.flywaydb.core.internal.exception.FlywayMigrateException','org.postgresql.util.PSQLException',
              'org.testcontainers.containers.ContainerLaunchException','org.testcontainers.shaded.org.awaitility.core.ConditionTimeoutException',
              'java.net.ConnectException','java.net.UnknownHostException','java.lang.NoSuchMethodError',
              'java.lang.ClassNotFoundException','java.lang.NoClassDefFoundError'}
          allowed_methods = {
              'ru.rutcampustrack.schedule.integration.AssignmentReplacementServiceIT.oneOffCloseAdoptThenNextDayReplacementPreservesHistoryAndReplay',
              'org.springframework.beans.factory.support.AbstractBeanFactory.doGetBean',
              'org.springframework.beans.factory.support.ConstructorResolver.autowireConstructor',
              'org.springframework.beans.factory.support.DefaultListableBeanFactory.resolveDependency',
              'org.flywaydb.core.Flyway.migrate','org.testcontainers.containers.GenericContainer.start',
              'org.testcontainers.containers.GenericContainer.tryStart','org.postgresql.core.v3.QueryExecutorImpl.receiveErrorResponse'}
          text = ''
          try:
              result = pathlib.Path('services/schedule-service/schedule-app/build/test-results/integrationTest/TEST-ru.rutcampustrack.schedule.integration.AssignmentReplacementServiceIT.xml')
              if result.is_file() and not result.is_symlink() and result.stat().st_size <= 33554432:
                  data = result.read_bytes()
                  assert b'<!DOCTYPE' not in data.upper() and b'<!ENTITY' not in data.upper()
                  suite = ET.fromstring(data)
                  failures = suite.findall('.//failure') + suite.findall('.//error')
                  proof['diagnosticKind'] = 'JUNIT_TYPES_ONLY'
                  if failures:
                      kind = failures[0].get('type','')
                      proof['failureType'] = kind if kind in allowed_types else 'OTHER'
                      text = '\n'.join((node.text or '') for node in failures)
              elif (private/'red.private.log').is_file():
                  with (private/'red.private.log').open('rb') as log:
                      log.seek(max(0,(private/'red.private.log').stat().st_size-1048576))
                      text = log.read(1048576).decode('utf-8',errors='replace')
              proof['causeClasses'] = sorted({value for value in re.findall(r'(?m)^\s*Caused by:\s+([A-Za-z0-9_.$]+)',text) if value in allowed_types})
              proof['stackMethods'] = sorted({value for value in re.findall(r'(?m)^\s*at\s+(?:[^\s/]+/)?([A-Za-z0-9_.$]+)\(',text) if value in allowed_methods})
          except (OSError,ValueError,AssertionError,ET.ParseError):
              proof['diagnosticKind'] = 'UNREADABLE_JUNIT'
          (private/'verified.safe.json').write_text(json.dumps(proof,indent=2)+'\n')
          PY_ONEOFF_DIAGNOSTICS
          python3 - "$private" "$red_exit" <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys, xml.etree.ElementTree as ET
          private = pathlib.Path(sys.argv[1])
          assert int(sys.argv[2]) != 0, 'Previous implementation must violate the rule'
          source = pathlib.Path('services/schedule-service/schedule-app/src/main/java/ru/rutcampustrack/schedule/replacement/AssignmentReplacementService.java')
          result = pathlib.Path('services/schedule-service/schedule-app/build/test-results/integrationTest/TEST-ru.rutcampustrack.schedule.integration.AssignmentReplacementServiceIT.xml')
          assert result.is_file() and result.stat().st_size <= 33554432
          data = result.read_bytes()
          assert b'<!DOCTYPE' not in data.upper() and b'<!ENTITY' not in data.upper()
          suite = ET.fromstring(data)
          cases = suite.findall('testcase')
          assert len(cases) == 1 and cases[0].get('name') == 'oneOffCloseAdoptThenNextDayReplacementPreservesHistoryAndReplay()'
          case = cases[0]
          assert not case.findall('error') and not case.findall('skipped') and len(case.findall('failure')) == 1
          failure = case.find('failure')
          assert failure.get('type') in {'org.opentest4j.AssertionFailedError', 'java.lang.AssertionError'}
          message = failure.get('message', '')
          assert '[one-off replacement moved count]' in message
          assert re.search(r'expected:\s*1L?\s+but was:\s*0L?(?:\s|$)', message), 'Failure must identify the missing one-off movement'
          proof = {'schemaVersion': 1, 'state': 'EXPECTED_ONE_OFF_MOVEMENT_FAILURE',
                   'producerHeadSha': os.environ['RCT_CI_PR_HEAD_SHA'],
                   'checkoutSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                   'previousRevision': '75cb5ed5ae8d731991a5efd447c611b0eb9f65da',
                   'previousSourceSha256': hashlib.sha256(source.read_bytes()).hexdigest(),
                   'restoredSourceSha256': hashlib.sha256((private / 'current.java').read_bytes()).hexdigest(),
                   'testMethod': 'oneOffCloseAdoptThenNextDayReplacementPreservesHistoryAndReplay',
                   'expectedMovedCount': 1, 'observedMovedCount': 0,
                   'tests': 1, 'failures': 1, 'errors': 0, 'skipped': 0}
          (private / 'verified.safe.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY

      - name: Upload safe one-off regression proof
        if: always() && matrix.service.name == 'schedule-service'
        uses: actions/upload-artifact@v4
        with:
          name: oneoff-regression-safe-${{ github.run_attempt }}
          path: build/ci-test-outcomes/schedule-service/oneoff-regression-safe.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify changed data regressions reject their counterexamples
