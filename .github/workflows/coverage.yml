name: Coverage

# Diagnostic coverage: test failures and report-generation errors remain blocking.
# Temporary owner-authorized pause for codex/web-vue-redesign.
# Restore automatic triggers before merge after explicit owner GO.
# See docs/plans/web-vue-pr3/CI-DEVELOPMENT-POLICY.md.
on:
  workflow_dispatch:
    inputs:
      omit_academic:
        description: 'Explicitly omit Academic tests and dependent operator CLI acceptance'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  java-coverage:
    name: Java coverage — ${{ matrix.service.name }}
    runs-on: ${{ matrix.service.name == 'attendance-service' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            path: ':services:api-gateway'
            report: 'services/api-gateway/build/reports/jacoco/test/jacocoTestReport.xml'
          - name: auth-service
            path: ':services:auth-service:auth-app'
            report: 'services/auth-service/auth-app/build/reports/jacoco/test/jacocoTestReport.xml'
          - name: academic-service
            path: ':services:academic-service:academic-app'
            report: 'services/academic-service/academic-app/build/reports/jacoco/test/jacocoTestReport.xml'
          - name: schedule-service
            path: ':services:schedule-service:schedule-app'
            report: 'services/schedule-service/schedule-app/build/reports/jacoco/test/jacocoTestReport.xml'
          - name: attendance-service
            path: ':services:attendance-service:attendance-app'
            report: 'services/attendance-service/attendance-app/build/reports/jacoco/test/jacocoTestReport.xml'
          - name: notification-service
            path: ':services:notification-service:notification-app'
            report: 'services/notification-service/notification-app/build/reports/jacoco/test/jacocoTestReport.xml'
          - name: mobile-bff
            path: ':services:mobile-bff:mobile-bff-app'
            report: 'services/mobile-bff/mobile-bff-app/build/reports/jacoco/test/jacocoTestReport.xml'
        exclude: ${{ fromJSON(inputs.omit_academic && '[{"service":{"name":"academic-service","path":":services:academic-service:academic-app","report":"services/academic-service/academic-app/build/reports/jacoco/test/jacocoTestReport.xml"}}]' || '[]') }}
    steps:
      - name: Record explicit coverage selection
        if: matrix.service.name == 'attendance-service'
        env:
          OMIT_ACADEMIC: ${{ inputs.omit_academic && 'true' || 'false' }}
        run: |
          if [ "$OMIT_ACADEMIC" = true ]; then
            printf '%s\n' 'Selected coverage scope: 6 Java + Python + Vue = 8 report families; Academic NOT_RUN by explicit selection.' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Default coverage scope: 7 Java + Python + Vue = 9 report families.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: ${{ matrix.service.name == 'attendance-service' && '21.0.13+9' || '21' }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Python for Academic credential bridge
        if: matrix.service.name == 'academic-service'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            services/notification-bot/requirements.txt
            services/notification-bot/requirements-test.txt

      - name: Install isolated Academic credential bridge dependencies
        if: matrix.service.name == 'academic-service'
        run: |
          python -m venv "$RUNNER_TEMP/np01-python"
          "$RUNNER_TEMP/np01-python/bin/python" -m pip install -r services/notification-bot/requirements.txt -r services/notification-bot/requirements-test.txt
          echo "NP01_PYTHON_EXECUTABLE=$RUNNER_TEMP/np01-python/bin/python" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"

      - name: Run tests with coverage
        id: coverage-tests
        shell: bash
        run: |
          if [ '${{ matrix.service.name }}' = attendance-service ]; then
            python3 -B scripts/attendance-memory/run.py --arms target
          else
            ./gradlew ${{ matrix.service.path }}:test ${{ matrix.service.path }}:integrationTest ${{ matrix.service.path }}:jacocoTestReport --no-daemon
          fi

      - name: Upload only bounded numeric Attendance memory diagnostics
        if: ${{ always() && matrix.service.name == 'attendance-service' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: attendance-memory-${{ github.run_attempt }}
          path: build/attendance-memory/*.safe.json*
          if-no-files-found: error
          retention-days: 7

      - name: Collect safe coverage test outcomes
        if: always()
        env:
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RCT_CI_EVENT_NAME: ${{ github.event_name }}
          RCT_CI_RUN_ID: ${{ github.run_id }}
          RCT_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          RCT_CI_JOB_ID: ${{ github.job }}
          RCT_CI_TEST_OUTCOME: ${{ steps.coverage-tests.outcome }}
        run: |
          python3 scripts/collect-ci-test-outcomes.py --service '${{ matrix.service.name }}' --task test
          python3 scripts/collect-ci-test-outcomes.py --service '${{ matrix.service.name }}' --task integrationTest

      - name: Upload safe coverage test outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safe-coverage-outcomes-${{ matrix.service.name }}-${{ github.run_attempt }}
          path: build/ci-test-outcomes/${{ matrix.service.name }}/*/safe-outcomes.json
          if-no-files-found: error
          retention-days: 7

      - name: Summarize JaCoCo report
        env:
          REPORT_PATH: ${{ matrix.service.report }}
          SERVICE_NAME: ${{ matrix.service.name }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          report = ET.parse(os.environ['REPORT_PATH']).getroot()
          line = next(item for item in report.findall('counter') if item.attrib['type'] == 'LINE')
          covered, missed = int(line.attrib['covered']), int(line.attrib['missed'])
          total = covered + missed
          percent = f'{covered / total:.1%}' if total else 'N/A'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"### {os.environ['SERVICE_NAME']}\n\nLines: {covered}/{total} ({percent}). Diagnostic coverage; no numeric gate.\n")
          PY

      - name: Upload JaCoCo XML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-${{ matrix.service.name }}
          path: ${{ matrix.service.report }}
          if-no-files-found: error
          retention-days: 7

  frontend-coverage:
    name: Vue coverage — WEB, PWA, TMA, mobile-core, shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
          cache: 'npm'
          cache-dependency-path: frontends/package-lock.json
      - name: Install Vue workspace
        working-directory: frontends
        run: npm ci
      - name: Run existing Vue tests with coverage
        working-directory: frontends
        run: npx vitest run --coverage
      - name: Summarize Vue coverage
        working-directory: frontends
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs'
          import { relative, resolve, sep } from 'node:path'
          const total = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8')).total
          const lcov = readFileSync('coverage/lcov.info', 'utf8').replace(/^SF:(.+)$/gm, (_, source) =>
            `SF:${relative(process.env.GITHUB_WORKSPACE, resolve(source)).split(sep).join('/')}`)
          writeFileSync('coverage/lcov.info', lcov)
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Vue workspace\n\nLines: ${total.lines.covered}/${total.lines.total} (${total.lines.pct}%). Diagnostic coverage; no numeric gate.\n`)
          JS
      - name: Upload Vue coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-lcov-vue
          path: frontends/coverage/
          if-no-files-found: error
          retention-days: 7

  python-coverage:
    name: Python coverage — notification-bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification-bot
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            services/notification-bot/requirements.txt
            services/notification-bot/requirements-test.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run pytest with coverage
        id: pytest
        run: pytest tests/ -v

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-coverage-bot
          path: services/notification-bot/coverage.xml
          if-no-files-found: error
          retention-days: 7

  diff-cover:
    name: Diff coverage report
    runs-on: ubuntu-latest
    needs: [java-coverage, frontend-coverage, python-coverage]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install diff-cover
        run: pip install 'diff-cover>=9.0.0'
      - name: Download coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: .coverage-reports/
      - name: Generate diagnostic diff coverage
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          mapfile -t java_reports < <(find .coverage-reports/jacoco-* -name jacocoTestReport.xml)
          mapfile -t java_sources < <(find services -type d -path '*/src/main/java')
          mapfile -t vue_reports < <(find .coverage-reports/vitest-lcov-* -name lcov.info)
          test "${#java_reports[@]}" -gt 0
          test "${#java_sources[@]}" -gt 0
          test "${#vue_reports[@]}" -gt 0
          diff-cover "${java_reports[@]}" --src-roots "${java_sources[@]}" --compare-branch="origin/$BASE_REF" --format=markdown:diff-cover-java.md
          diff-cover "${vue_reports[@]}" --compare-branch="origin/$BASE_REF" --format=markdown:diff-cover-vue.md
          diff-cover .coverage-reports/pytest-coverage-bot/coverage.xml --compare-branch="origin/$BASE_REF" --format=markdown:diff-cover-python.md
          cat diff-cover-java.md diff-cover-vue.md diff-cover-python.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diff coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diff-coverage
          path: diff-cover-*.md
          if-no-files-found: error
          retention-days: 7
