[pytest]
asyncio_mode = auto
markers =
    security_contract: M08 G8 security contract tests (startup validation, auth, CSRF)
# Coverage is diagnostic; failed tests remain blocking.
# coverage.xml нужен для diff-cover; term — в CI-логе.
# Coverage excludes — в pyproject.toml [tool.coverage.run].
addopts = --cov=bot --cov-report=xml --cov-report=term
