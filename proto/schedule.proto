syntax = "proto3";

package rutcampustrack.schedule;

option java_multiple_files = true;
option java_package = "ru.rutcampustrack.schedule.grpc";

service ScheduleGrpcService {

  // Получить активную пару для группы в данный момент
  rpc GetActiveLesson (ActiveLessonRequest) returns (LessonResponse);

  // Получить пару по ID
  rpc GetLessonById (LessonByIdRequest) returns (LessonResponse);

  // Получить все пары группы за период
  rpc GetLessonsByGroup (LessonsByGroupRequest) returns (LessonsResponse);

  // Получить компактную информацию о парах по списку ID (для валидации в excuse-сервисе)
  rpc GetLessonsByIds (LessonsByIdsRequest) returns (LessonsByIdsResponse);

  // Phase 61 D-04: резолв пары по natural key (group_id, date, lesson_number).
  // Используется academic-service для проверки существования пары перед созданием ДЗ.
  // NOT_FOUND если на дату нет lesson в статусах planned/active/closed.
  rpc ResolveLesson (ResolveLessonRequest) returns (LessonResponse);

  // Подсчёт ссылок на subject в расписании для pre-check удаления Subject.
  // Используется academic-service в SubjectService.deleteSubject:
  // если non_planned_lessons_count > 0 → 409 Conflict с предупреждением.
  rpc CountSubjectReferences (CountSubjectReferencesRequest) returns (CountSubjectReferencesResponse);
}

message ActiveLessonRequest {
  int64 group_id = 1;
  string timestamp = 2;  // ISO-8601
}

message LessonByIdRequest {
  int64 lesson_id = 1;
}

// Phase 61 D-04: natural-key резолв пары.
message ResolveLessonRequest {
  int64 group_id = 1;
  string date = 2;          // ISO-8601 date, например "2026-05-01"
  int32 lesson_number = 3;  // 1..8
}

message LessonsByGroupRequest {
  int64 group_id = 1;
  int64 semester_id = 2;
  string date_from = 3;  // ISO date
  string date_to = 4;
}

message LessonResponse {
  int64 id = 1;
  int64 schedule_item_id = 2;
  int64 group_id = 3;
  int64 subject_id = 4;
  // D-16: teacher_id removed. Teacher access resolved via JOIN
  // ScheduleItem × TeacherSubjectGroup (teacher is not bound to a slot).
  reserved 5;
  reserved "teacher_id";
  string date = 6;
  int32 lesson_number = 7;
  string start_time = 8;
  string end_time = 9;
  string status = 10;       // planned, active, closed, cancelled
  bool is_geo_blocked = 11;
  string room = 12;
  bool is_blocked_by_headman = 13;
}

message LessonsResponse {
  repeated LessonResponse lessons = 1;
}

message LessonsByIdsRequest {
  repeated int64 lesson_ids = 1;
}

message LessonsByIdsResponse {
  repeated LessonInfo lessons = 1;
}

message LessonInfo {
  int64 lesson_id = 1;
  int64 group_id = 2;
  int64 subject_id = 3;
  string starts_at = 4;  // ISO datetime (date + "T" + start_time)
  // Phase v9 — обогащение excuse.requested: бот и веб показывают детали пары
  // без дополнительных round-trip'ов. Все поля обязательны к заполнению
  // в schedule-service LessonQueryGrpcService.
  int32 lesson_number = 5;  // 1..8
  string date = 6;          // ISO-8601 date (YYYY-MM-DD)
}

message CountSubjectReferencesRequest {
  int64 subject_id = 1;
}

message CountSubjectReferencesResponse {
  // Количество активных (is_active=true) schedule_items с этим subject_id.
  int64 schedule_items_count = 1;
  // Количество one-off уроков с этим subject_id (все, независимо от даты).
  int64 one_off_lessons_count = 2;
  // Количество lessons со статусом active/closed/cancelled (т.е. не planned)
  // по активным schedule_items. Если > 0 — возможна потеря посещаемости,
  // academic-service возвращает 409 без force=true.
  int64 non_planned_lessons_count = 3;
  // Количество всех lessons (любой статус) по активным schedule_items +
  // используется фронтом для информирования старосты.
  int64 total_lessons_count = 4;
}
