server:
  port: 9092

spring:
  application:
    name: schedule-service

  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 200

  datasource:
    url: jdbc:postgresql://postgres-schedule:5432/schedule_db
    username: rct_user
    password: ${POSTGRES_SCHEDULE_PASSWORD:rct_dev_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Europe/Moscow

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:rct_user}
    password: ${RABBITMQ_PASSWORD:rct_dev_pass}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

grpc:
  server:
    port: 19092
  client:
    academic-service:
      address: static://academic-service:19091
      negotiation-type: plaintext

logging:
  level:
    ru.rutcampustrack: DEBUG
