# Owned isolated edge only. Same certificates, trusted edge IP and forwarding semantics.
map $http_upgrade $rct_connection_upgrade { default upgrade; '' close; }
server { listen 8081; location = /edge-ready { return 200 "ready\n"; } }
server {
 listen 8443 ssl; server_name localhost;
 ssl_certificate /run/tls/server.crt; ssl_certificate_key /run/tls/server.key;
 client_max_body_size 16m;
 location / {
  proxy_pass http://api-gateway:8080;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $rct_connection_upgrade;
  proxy_buffering off; proxy_read_timeout 75s;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
 }
}
