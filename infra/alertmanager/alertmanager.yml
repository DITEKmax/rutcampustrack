global:
  resolve_timeout: 5m
time_intervals:
- name: quiet-hours-msk
  time_intervals:
  - times:
    - start_time: '19:00'
      end_time: '24:00'
    - start_time: 00:00
      end_time: 05:00
    location: UTC
route:
  receiver: notification-webhook
  group_by:
  - environment
  - alertname
  - service
  - job
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
  - matchers:
    - severity="critical"
    receiver: notification-webhook
    continue: false
  - matchers:
    - severity="warning"
    receiver: notification-webhook
    mute_time_intervals:
    - quiet-hours-msk
    continue: false
receivers:
- name: notification-webhook
  webhook_configs:
  - url: http://notification-web:9094/internal/alert
    send_resolved: true
    max_alerts: 100
    http_config:
      authorization:
        type: Bearer
        credentials_file: /run/secrets/alert-webhook-token
inhibit_rules:
- source_matchers:
  - alertname="ServiceDown"
  - service!=""
  target_matchers:
  - alertname="HealthCheckDown"
  - service!=""
  equal:
  - environment
  - service
- source_matchers:
  - alertname="HttpAvailabilityBudgetBurnFast"
  target_matchers:
  - alertname="HttpAvailabilityBudgetBurnSlow"
  equal:
  - environment
  - job
  - instance
  - method
  - uri
