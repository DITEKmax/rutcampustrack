name: OpenAPI Drift Guard

on:
  push:
    branches: ['**']
    paths:
      - 'docs/openapi/**'
      - 'frontends/mobile-core/src/api/generated/**'
      - 'frontends/mobile-core/scripts/generate-*.mjs'
      - 'frontends/package.json'
      - 'frontends/package-lock.json'
      - 'frontends/web-panel/src/app/api/generated/**'
      - 'frontends/web-panel/package.json'
      - 'frontends/web-panel/scripts/generate-types.mjs'
      - '.github/workflows/openapi-drift.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'docs/openapi/**'
      - 'frontends/mobile-core/src/api/generated/**'
      - 'frontends/mobile-core/scripts/generate-*.mjs'
      - 'frontends/package.json'
      - 'frontends/package-lock.json'
      - 'frontends/web-panel/src/app/api/generated/**'
      - 'frontends/web-panel/package.json'
      - 'frontends/web-panel/scripts/generate-types.mjs'
      - '.github/workflows/openapi-drift.yml'

jobs:
  drift-check:
    name: OpenAPI ↔ generated types drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Install mobile Vue workspace dependencies
        working-directory: frontends
        run: npm ci --no-audit --no-fund
      - name: Check canonical mobile snapshots (offline)
        working-directory: frontends
        run: |
          npm run generate:types:check
          npm run generate:auth-types:check
          npm run generate:academic-schedule-types:check
      - name: Install web-panel dependencies
        working-directory: frontends/web-panel
        run: npm ci --no-audit --no-fund
      - name: Regenerate web-panel types (offline)
        working-directory: frontends/web-panel
        run: npm run generate:types:offline
      - name: Fail if web-panel generated types drifted
        run: git diff --exit-code -- frontends/web-panel/src/app/api/generated
