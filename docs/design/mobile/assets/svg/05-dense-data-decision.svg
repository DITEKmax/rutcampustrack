<rect x="1026" y="226" width="230" height="38" rx="19.0" fill="url(#accent)" stroke="none" stroke-width="1" opacity="1" /><text x="1141.0" y="250.0" text-anchor="middle" fill="#F6F4FA" font-size="12" font-weight="600"><tspan x="1141.0" dy="0">Lesson rail + roster</tspan></text>
<text x="1026" y="296" text-anchor="start" fill="#9E7AFF" font-size="14" font-weight="650"><tspan x="1026" dy="0">112 · 122</tspan></text>
<text x="1026" y="334" text-anchor="start" fill="#C8C2D6" font-size="15" font-weight="450"><tspan x="1026" dy="0">Дата/пара закреплены; строка студента остаётся</tspan><tspan x="1026" dy="22">короткой.</tspan></text>
<text x="1026" y="424" text-anchor="start" fill="#8A8299" font-size="13" font-weight="500"><tspan x="1026" dy="0">Цена: нет обзора всего семестра</tspan></text>
