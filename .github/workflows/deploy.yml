name: Deploy

# M06 G7 (C0-8, 13 P0-2): deploy triggered ONLY after successful CI run.
# `workflow_run` fires after CI completes; `if: success()` filter ensures
# red CI doesn't release to prod. Red CI = no deploy, period.
# Fallback: manual `workflow_dispatch` для emergency releases (когда
# CI падает по flake'у и надо выкатить fix).
#
# IMPORTANT: в workflow_run-triggered job'е `github.sha` = SHA of default
# branch HEAD at workflow creation (может отставать), а `workflow_run.
# head_sha` = actual CI-commit. Используем DEPLOY_SHA env-переменную,
# резолвится через `|| github.sha` для workflow_dispatch fallback.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA для emergency deploy (обязателен, audit trail)'
        required: true
        type: string
      reason:
        description: 'Почему emergency deploy без CI'
        required: true
        type: string

# M06 G9 H2 (security-audit): serialize deploys — избегаем concurrent JWT-keys
# generation race (openssl genrsa между двумя SSH-сессиями одновременно
# уничтожает active sessions). `cancel-in-progress: false` — не отменяем
# уже идущий deploy, просто ждём.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event.inputs.commit_sha || github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-push:
    name: Build and Push to GHCR
    # M06 G9 H1 (security-audit): strict event/branch guards —
    # workflow_run fires on BOTH success + failure; event может быть
    # pull_request от fork'а (не наш main). Explicit check:
    #   1. event_name = 'workflow_dispatch' (manual, с required input commit_sha), ИЛИ
    #   2. workflow_run.conclusion = 'success' И head_branch = 'main' И event = 'push'
    # Fork-PR'ы и feature-branch'и НЕ дают deploy даже если CI green.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # M16 hotfix: actions/checkout@v4 с `ref: <SHA>` без fetch-depth=0
          # отправляет неправильный refspec `+refs/heads/<SHA>*:...` (treats
          # SHA как branch name). См. actions/checkout issue #1515. Workaround
          # — fetch-depth: 0 (full history). На workflow_run (auto-trigger
          # после CI) commit обычно HEAD main и shallow работал, но при
          # workflow_dispatch (manual emergency deploy через `gh workflow run`
          # commit_sha=<SHA>`) bag триггерится consistent. Cost: чуть больше
          # network I/O для fetch full history (~30 sec на repo нашего размера).
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push api-gateway
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/api-gateway/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/api-gateway:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/api-gateway:latest
          cache-from: type=gha,scope=api-gateway
          cache-to: type=gha,scope=api-gateway,mode=max

      - name: Build and push auth-service
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/auth-service/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/auth-service:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/auth-service:latest
          cache-from: type=gha,scope=auth-service
          cache-to: type=gha,scope=auth-service,mode=max

      - name: Build and push academic-service
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/academic-service/academic-app/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/academic-service:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/academic-service:latest
          cache-from: type=gha,scope=academic-service
          cache-to: type=gha,scope=academic-service,mode=max

      - name: Build and push schedule-service
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/schedule-service/schedule-app/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/schedule-service:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/schedule-service:latest
          cache-from: type=gha,scope=schedule-service
          cache-to: type=gha,scope=schedule-service,mode=max

      - name: Build and push attendance-service
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/attendance-service/attendance-app/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/attendance-service:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/attendance-service:latest
          cache-from: type=gha,scope=attendance-service
          cache-to: type=gha,scope=attendance-service,mode=max

      - name: Build and push notification-web
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/notification-service/notification-app/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/notification-web:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/notification-web:latest
          cache-from: type=gha,scope=notification-web
          cache-to: type=gha,scope=notification-web,mode=max

      - name: Build and push notification-bot
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: services/notification-bot
          file: services/notification-bot/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/notification-bot:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/notification-bot:latest
          cache-from: type=gha,scope=notification-bot
          cache-to: type=gha,scope=notification-bot,mode=max

      - name: Build and push pwa
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: frontends/pwa
          file: frontends/pwa/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/pwa-nginx:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/pwa-nginx:latest
          cache-from: type=gha,scope=pwa
          cache-to: type=gha,scope=pwa,mode=max

      - name: Build and push mini-app
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: frontends/mini-app
          file: frontends/mini-app/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/mini-app-nginx:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/mini-app-nginx:latest
          cache-from: type=gha,scope=mini-app
          cache-to: type=gha,scope=mini-app,mode=max

      - name: Build and push web-panel
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: frontends/web-panel
          file: frontends/web-panel/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/web-panel-nginx:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/web-panel-nginx:latest
          cache-from: type=gha,scope=web-panel
          cache-to: type=gha,scope=web-panel,mode=max

      - name: Build and push landing
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: frontends/landing
          file: frontends/landing/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/landing-nginx:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/landing-nginx:latest
          cache-from: type=gha,scope=landing
          cache-to: type=gha,scope=landing,mode=max

  # M08 G11 (M06 defer, OWNER-ANSWERS P2-8/G11) — SBOM generation + cosign
  # keyless signing для supply-chain attestation.
  #
  # Что получаем:
  # - SBOM (SPDX json) per image, прикреплён к GHCR manifest как OCI attachment.
  # - Cosign signature per image + per SBOM, keyless через Fulcio/Rekor (D4).
  # - Verify на VPS: cosign verify с certificate-identity-regexp.
  # - Дисплей в GHCR: Package → Digests → Attestations/Signatures.
  #
  # Actions pinned to SHA (latest stable releases 2026-04):
  # - anchore/sbom-action@v0.24.0 (e22c389)
  # - sigstore/cosign-installer@v4.1.1 (cad07c2)
  sbom-sign:
    name: SBOM + cosign sign
    needs: build-push
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # required for cosign keyless OIDC (Fulcio)
    strategy:
      fail-fast: false
      matrix:
        image:
          - api-gateway
          - auth-service
          - academic-service
          - schedule-service
          - attendance-service
          - notification-web
          - notification-bot
          - pwa-nginx
          - mini-app-nginx
          - web-panel-nginx
          - landing-nginx
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # SBOM — SPDX json формат, чтобы работать с Trivy/Grype/GitHub UI.
      # Attachment к image digest в GHCR (type: oci-dir).
      - name: Generate + attach SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/ditekmax/rutcampustrack/${{ matrix.image }}:${{ env.DEPLOY_SHA }}
          format: spdx-json
          upload-release-assets: false
          upload-artifact: true
          artifact-name: sbom-${{ matrix.image }}.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: 'v2.4.1'

      # Keyless sign (D4 — без COSIGN_PRIVATE_KEY secret).
      # OIDC token → Fulcio выдаёт short-lived cert (10мин TTL) →
      # подпись + запись в Rekor transparency log.
      - name: Cosign sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ghcr.io/ditekmax/rutcampustrack/${{ matrix.image }}:${{ env.DEPLOY_SHA }}

      # Подписать SBOM blob отдельно — signature attached к image через
      # cosign attach, после этого verify может проверить SBOM origin.
      - name: Cosign attest SBOM (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # attest использует тот же keyless-flow что и sign
          cosign attest --yes \
            --predicate <(find . -name 'sbom-${{ matrix.image }}.spdx.json' -print0 | head -1 | xargs -0 cat) \
            --type spdxjson \
            ghcr.io/ditekmax/rutcampustrack/${{ matrix.image }}:${{ env.DEPLOY_SHA }} || \
          echo "::warning::cosign attest failed for ${{ matrix.image }} — non-blocking, проверь SBOM artifact"

  deploy:
    name: Deploy to VPS
    # M08 G11 — deploy ждёт sbom-sign (нет подписи → не катим).
    # sbom-sign fails при compromised OIDC или временном outage Fulcio →
    # deploy блокируется. Manual rollback: workflow_dispatch с
    # `allow_unsigned_deploy` (добавится в M09 emergency-flow).
    needs: [build-push, sbom-sign]
    runs-on: ubuntu-latest
    steps:
      # M08 G11 — verify cosign signatures ДО SSH-deploy. Catches:
      # 1. OIDC compromise (identity mismatch),
      # 2. image tampering между push и deploy,
      # 3. Rekor log gaps.
      - name: Install cosign for verify
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: 'v2.4.1'

      - name: Log in to GHCR (for verify)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Verify signatures (11 images)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -e
          IMAGES=(api-gateway auth-service academic-service schedule-service attendance-service notification-web notification-bot pwa-nginx mini-app-nginx web-panel-nginx landing-nginx)
          for img in "${IMAGES[@]}"; do
            echo "--- Verifying ghcr.io/ditekmax/rutcampustrack/${img}:${{ env.DEPLOY_SHA }} ---"
            cosign verify \
              --certificate-identity-regexp="(?i)^https://github.com/ditekmax/rutcampustrack/.github/workflows/deploy\.yml@.*" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              "ghcr.io/ditekmax/rutcampustrack/${img}:${{ env.DEPLOY_SHA }}"
          done
          echo "✓ All 11 images verified via Fulcio/Rekor"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: GHCR_TOKEN,IMAGE_TAG
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ditekmax --password-stdin
            cd /opt/rutcampustrack
            git pull --ff-only
            [ -f /opt/rutcampustrack/nginx/dhparam.pem ] || openssl dhparam -out /opt/rutcampustrack/nginx/dhparam.pem 2048
            docker volume create rutcampustrack_jwt-keys >/dev/null 2>&1 || true
            # M14 G3 — JWT key generation на VPS, first-deploy pattern.
            # Idempotent через `[ -f ]` filesystem guard: ключи генерятся только
            # если их нет (первый deploy на чистом volume), на повторных deploy —
            # skip. Это предотвращает invalidate всех issued JWT при каждом
            # deploy. Если требуется rotation — операторе нужно вручную rm
            # ключи в volume (см. docs/runbooks/secret-rotation.md).
            #
            # CSO HIGH-05 fix: explicit PKCS#8 conversion. JwtService.loadPrivateKey
            # использует PKCS8EncodedKeySpec (auth/.../JwtService.java:21) — ждёт
            # `-----BEGIN PRIVATE KEY-----`. Поведение `openssl genrsa` зависит от
            # OpenSSL major version: 1.x → PKCS#1 (BEGIN RSA PRIVATE KEY → boot
            # exception), 3.x → PKCS#8. Alpine `latest` сейчас на 3.x но это
            # implicit dependency — explicit pipeline `pkcs8 -topk8 -nocrypt`
            # гарантирует PKCS#8 независимо от alpine/openssl версии.
            # Identical pipeline в auth-service/Dockerfile:69-79 (M13 G25.15).
            #
            # kid.txt: JwtService.init() сам сгенерит UUID если файла нет
            # (JwtService.java:88-91), но pre-generate его here для consistency
            # с auth-service Dockerfile build-time generation.
            docker run --rm -v rutcampustrack_jwt-keys:/keys alpine sh -c \
              "apk add --no-cache openssl >/dev/null 2>&1 && \
               if [ ! -f /keys/private.key ]; then \
                 openssl genrsa -out /tmp/private.key.pkcs1 3072 2>/dev/null && \
                 openssl pkcs8 -topk8 -nocrypt -in /tmp/private.key.pkcs1 -out /keys/private.key && \
                 openssl rsa -in /keys/private.key -pubout -out /keys/public.key 2>/dev/null && \
                 rm /tmp/private.key.pkcs1 && \
                 head -c 4 /dev/urandom | od -A n -t x1 | tr -d ' \n' > /keys/kid.txt; \
               fi && \
               chown -R 100:101 /keys && \
               chmod 600 /keys/private.key /keys/kid.txt && \
               chmod 644 /keys/public.key"
            # IMAGE_TAG=${{ env.DEPLOY_SHA }} pins commit-specific images (M06 QD1, 13 P1-1).
            # compose reads ${IMAGE_TAG:-latest} per service block. `latest` tag still
            # pushed for zero-downtime redeploy via `docker compose pull`, но конкретный
            # rollback возможен через `IMAGE_TAG=<sha> docker compose up -d`.
            export IMAGE_TAG
            echo ".deployed-sha=$IMAGE_TAG" > /opt/rutcampustrack/.deployed-sha
            docker compose --env-file /opt/rutcampustrack/.env.prod -f docker-compose.prod.yml pull
            docker compose --env-file /opt/rutcampustrack/.env.prod -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 120

            # --- Reload Grafana/Loki/Promtail when observability config changes ---
            # Grafana provisioning (datasources/dashboards) is loaded from
            # ./infra/grafana/provisioning at container start. `docker compose
            # up -d` does not restart containers whose image/env did not change,
            # so config-only changes (e.g. new dashboard JSON, datasource uid)
            # stay invisible until a manual restart. Same for Loki/Promtail yaml.
            # We look at the last git pull delta and restart only what's needed.
            echo "--- Checking observability config changes ---"
            CHANGED=$(git diff --name-only HEAD@{1} HEAD 2>/dev/null || true)
            echo "$CHANGED" | grep -qE '^infra/grafana/' && {
              echo "Grafana provisioning changed — restarting rct-grafana"
              docker compose --env-file /opt/rutcampustrack/.env.prod -f docker-compose.prod.yml restart grafana
            } || true
            echo "$CHANGED" | grep -qE '^infra/loki/' && {
              echo "Loki config changed — restarting rct-loki"
              docker compose --env-file /opt/rutcampustrack/.env.prod -f docker-compose.prod.yml restart loki
            } || true
            echo "$CHANGED" | grep -qE '^infra/promtail/' && {
              echo "Promtail config changed — restarting rct-promtail"
              docker compose --env-file /opt/rutcampustrack/.env.prod -f docker-compose.prod.yml restart promtail
            } || true
            echo "$CHANGED" | grep -qE '^infra/prometheus/' && {
              echo "Prometheus config changed — restarting rct-prometheus"
              docker compose --env-file /opt/rutcampustrack/.env.prod -f docker-compose.prod.yml restart prometheus
            } || true

            # --- Reload main nginx after git pull (Phase 50.1 fix) ---
            # rct-nginx bind-mounts ./nginx/conf.d as read-only volume. git pull
            # updates files on disk, but the nginx process keeps the old config
            # in memory until SIGHUP. Without this reload, config changes only
            # take effect after the 6-hour internal sleep loop in compose command.
            # See Phase 50 incident: catch-all `location /` was on disk but not in
            # memory, causing /login to return mini-app HTML instead of web-panel.
            echo "--- Reloading rct-nginx config ---"
            docker exec rct-nginx nginx -t
            docker exec rct-nginx nginx -s reload
            sleep 2

            # --- Smoke test: verify /login returns web-panel Angular HTML ---
            # Phase 50 invariant: /login MUST be served by web-panel-nginx
            # (Angular SPA, ~19KB) and NOT by mini-app/pwa/landing.
            # If Content-Length is suspiciously small (<5000 bytes), the catch-all
            # location / is misrouted — fail the deployment immediately.
            echo "--- Smoke test: GET /login ---"
            LOGIN_SIZE=$(curl -s -o /dev/null -w "%{size_download}" https://ruttrack.site/login)
            echo "GET /login returned $LOGIN_SIZE bytes"
            if [ "$LOGIN_SIZE" -lt 5000 ]; then
              echo "FATAL: /login returned $LOGIN_SIZE bytes — expected web-panel Angular HTML (~19KB)"
              echo "This usually means nginx routing is misconfigured or web-panel-nginx is unhealthy."
              exit 1
            fi
            echo "✓ Smoke test passed: /login is served by web-panel"

            docker logout ghcr.io