[server]
root_url = https://ruttrack.site/grafana/
serve_from_sub_path = true

[security]
admin_user = admin
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}

[auth.anonymous]
enabled = false

[unified_alerting]
enabled = true

[alerting.telegram]
enabled = true
bot_token = ${GF_ALERTING_TELEGRAM_BOT_TOKEN}
chat_id = 1171502265

[paths]
provisioning = /etc/grafana/provisioning
