# M16 G6 hotfix — disable Flyway transaction wrapper для V20.
#
# Flyway 9.1.2+ берёт `pg_advisory_lock` даже для non-transactional
# миграций (по умолчанию `flyway.postgresql.transactional.lock=true`).
# `CREATE INDEX CONCURRENTLY` несовместим с этим lock'ом → миграция
# вешается infinite. Это причина зависания academic-app:integrationTest
# в CI 2026-04-27 (run 25004211364, 13+ min hang).
#
# Источники: flyway/flyway issues #3508, #3854, #3961.
# Префикс комментария `-- ##` в .sql файле — historical artefact из
# CLAUDE.md (без real handler), оставлен для соответствия гайду.
# Реальный fix — этот .sql.conf файл.
#
# `executeInTransaction=false` отменяет advisory lock + transaction
# wrapper только для V20, остальные миграции защищены as-is.
executeInTransaction=false
