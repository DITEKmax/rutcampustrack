name: Deploy

# One exact source revision: quality gate → build digests → production apply.
# Owner decision 2026-11-03: Deploy scan/sign/SBOM temporarily removed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Exact source SHA with all four quality workflows successful'
        required: true
        type: string
      prepare_only:
        description: 'Build and push only; never use production inputs or SSH'
        required: false
        default: true
        type: boolean
      reason:
        description: 'Release audit reason (never bypasses quality checks)'
        required: true
        type: string

# M06 G9 H2 (security-audit): serialize deploys — избегаем concurrent JWT-keys
# generation race (openssl genrsa между двумя SSH-сессиями одновременно
# уничтожает active sessions). `cancel-in-progress: false` — не отменяем
# уже идущий deploy, просто ждём.
concurrency:
  # An ineligible event must not replace a pending eligible release.
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          (inputs.prepare_only || vars.PRODUCTION_DEPLOY_ENABLED == 'true')) ||
         (github.event_name == 'workflow_run' &&
          vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
          vars.PRODUCTION_AUTO_DEPLOY_ENABLED == 'true' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository)) &&
        'production-deploy' || format('production-deploy-ineligible-{0}', github.run_id) }}
  cancel-in-progress: false
  # CI can finish out of order. Keep pending runs so a stale SHA cannot replace one.
  queue: max

env:
  DEPLOY_SHA: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha ||
        github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}

jobs:
  release-gate:
    name: Require all same-SHA quality checks
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
       vars.PRODUCTION_AUTO_DEPLOY_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate source SHA and main workflow ref; reject disabled apply
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          PREPARE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_only && 'true' || 'false' }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          if [[ "$PREPARE_ONLY" != true && "$PRODUCTION_DEPLOY_ENABLED" != true ]]; then
            echo '::error::Production apply is disabled; choose prepare_only=true'
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Immutable workflow source from the guarded main ref, never candidate code.
          ref: ${{ github.workflow_sha }}
          path: release-control
          fetch-depth: 0
          persist-credentials: false
      - name: Bound same-SHA quality wait (never dispatches tests)
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          PREPARE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_only && 'true' || 'false' }}
        run: |
          args=()
          if [[ "$PREPARE_ONLY" != true ]]; then args+=(--apply); fi
          python3 -I release-control/scripts/release-quality-gate.py --sha "$DEPLOY_SHA" --repository "$GITHUB_REPOSITORY" --wait-seconds 3600 "${args[@]}"
      - name: Save safe quality receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-quality-${{ env.DEPLOY_SHA }}
          path: release-quality.json
          if-no-files-found: ignore

  build-push:
    name: Build and Push to GHCR
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      manifest: ${{ steps.manifest.outputs.json }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push api-gateway
        id: build_api_gateway
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/api-gateway/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/api-gateway:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/api-gateway:latest
          cache-from: type=gha,scope=api-gateway
          cache-to: type=gha,scope=api-gateway,mode=max

      - name: Build and push auth-service
        id: build_auth_service
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/auth-service/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/auth-service:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/auth-service:latest
          cache-from: type=gha,scope=auth-service
          cache-to: type=gha,scope=auth-service,mode=max

      - name: Build and push academic-service
        id: build_academic_service
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/academic-service/academic-app/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/academic-service:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/academic-service:latest
          cache-from: type=gha,scope=academic-service
          cache-to: type=gha,scope=academic-service,mode=max

      - name: Build and push schedule-service
        id: build_schedule_service
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/schedule-service/schedule-app/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/schedule-service:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/schedule-service:latest
          cache-from: type=gha,scope=schedule-service
          cache-to: type=gha,scope=schedule-service,mode=max

      - name: Build and push attendance-service
        id: build_attendance_service
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/attendance-service/attendance-app/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/attendance-service:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/attendance-service:latest
          cache-from: type=gha,scope=attendance-service
          cache-to: type=gha,scope=attendance-service,mode=max

      - name: Build and push mobile-bff
        id: build_mobile_bff
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/mobile-bff/mobile-bff-app/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/mobile-bff:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/mobile-bff:latest
          cache-from: type=gha,scope=mobile-bff
          cache-to: type=gha,scope=mobile-bff,mode=max

      - name: Build and push document-renderer-service
        id: build_document_renderer_service
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/document-renderer-service/document-renderer-app/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/document-renderer-service:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/document-renderer-service:latest
          cache-from: type=gha,scope=document-renderer-service
          cache-to: type=gha,scope=document-renderer-service,mode=max

      - name: Build and push notification-web
        id: build_notification_web
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/notification-service/notification-app/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/notification-web:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/notification-web:latest
          cache-from: type=gha,scope=notification-web
          cache-to: type=gha,scope=notification-web,mode=max

      - name: Build and push notification-bot
        id: build_notification_bot
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: services/notification-bot
          file: services/notification-bot/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/notification-bot:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/notification-bot:latest
          cache-from: type=gha,scope=notification-bot
          cache-to: type=gha,scope=notification-bot,mode=max

      - name: Build and push pwa
        id: build_pwa_nginx
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: frontends
          file: frontends/pwa-vue/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/pwa-nginx:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/pwa-nginx:latest
          build-args: |
            VITE_PUBLIC_BASE=/app/
            VITE_APP_VERSION=1-${{ env.DEPLOY_SHA }}
            VITE_MIN_SUPPORTED_VERSION=1-${{ env.DEPLOY_SHA }}
            VITE_FORCE_UPDATE=true
            VITE_MOBILE_FIXTURE_MODE=false
          cache-from: type=gha,scope=pwa
          cache-to: type=gha,scope=pwa,mode=max

      - name: Build and push mini-app
        id: build_mini_app_nginx
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: frontends
          file: frontends/tma-vue/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/mini-app-nginx:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/mini-app-nginx:latest
          build-args: |
            VITE_PUBLIC_BASE=/mini-app/
            VITE_MOBILE_FIXTURE_MODE=false
          cache-from: type=gha,scope=mini-app
          cache-to: type=gha,scope=mini-app,mode=max

      - name: Build and push web-panel
        id: build_web_panel_nginx
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: frontends
          file: frontends/web-vue/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/web-panel-nginx:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/web-panel-nginx:latest
          cache-from: type=gha,scope=web-panel
          cache-to: type=gha,scope=web-panel,mode=max

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'

      - name: Read landing page dates from release checkout
        id: landing_lastmod
        run: |
          if [[ -f frontends/landing/scripts/sitemap-lastmod.ts ]]; then
            dates=$(node frontends/landing/scripts/sitemap-lastmod.ts --build-arg)
            echo "build_arg=LANDING_SITEMAP_LASTMOD=$dates" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push landing
        id: build_landing_nginx
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: frontends
          file: frontends/landing/Dockerfile
          push: true
          tags: ghcr.io/ditekmax/rutcampustrack/landing-nginx:${{ env.DEPLOY_SHA }},ghcr.io/ditekmax/rutcampustrack/landing-nginx:latest
          build-args: ${{ steps.landing_lastmod.outputs.build_arg }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,scope=landing,mode=max

      - name: Record exact build digests
        id: manifest
        env:
          DIGEST_API_GATEWAY: ${{ steps.build_api_gateway.outputs.digest }}
          DIGEST_AUTH_SERVICE: ${{ steps.build_auth_service.outputs.digest }}
          DIGEST_ACADEMIC_SERVICE: ${{ steps.build_academic_service.outputs.digest }}
          DIGEST_SCHEDULE_SERVICE: ${{ steps.build_schedule_service.outputs.digest }}
          DIGEST_ATTENDANCE_SERVICE: ${{ steps.build_attendance_service.outputs.digest }}
          DIGEST_MOBILE_BFF: ${{ steps.build_mobile_bff.outputs.digest }}
          DIGEST_DOCUMENT_RENDERER_SERVICE: ${{ steps.build_document_renderer_service.outputs.digest }}
          DIGEST_NOTIFICATION_WEB: ${{ steps.build_notification_web.outputs.digest }}
          DIGEST_NOTIFICATION_BOT: ${{ steps.build_notification_bot.outputs.digest }}
          DIGEST_PWA_NGINX: ${{ steps.build_pwa_nginx.outputs.digest }}
          DIGEST_MINI_APP_NGINX: ${{ steps.build_mini_app_nginx.outputs.digest }}
          DIGEST_WEB_PANEL_NGINX: ${{ steps.build_web_panel_nginx.outputs.digest }}
          DIGEST_LANDING_NGINX: ${{ steps.build_landing_nginx.outputs.digest }}
        run: |
          python3 - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('release_images', 'scripts/release-images.py')
          images = importlib.util.module_from_spec(spec); spec.loader.exec_module(images)
          manifest = {'source_sha': os.environ['DEPLOY_SHA'], 'images': {
              name: images.PREFIX + name + '@' + os.environ['DIGEST_' + name.replace('-', '_').upper()]
              for name in images.IMAGES}}
          images.validate(manifest, os.environ['DEPLOY_SHA'])
          value = json.dumps(manifest, separators=(',', ':'))
          Path('release-images.json').write_text(value + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output: output.write('json=' + value + '\n')
          PY
      - name: Save safe release image manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-images-${{ env.DEPLOY_SHA }}
          path: release-images.json
          if-no-files-found: error

  deploy:
    name: Deploy to VPS
    needs: [release-gate, build-push]
    if: >-
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && inputs.prepare_only == false) ||
       (github.event_name == 'workflow_run' && vars.PRODUCTION_AUTO_DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize safe exact build manifest
        env:
          RELEASE_MANIFEST: ${{ needs.build-push.outputs.manifest }}
        run: |
          printf '%s\n' "$RELEASE_MANIFEST" > release-images.json
          python3 -I release-control/scripts/release-images.py release-images.json "$DEPLOY_SHA"
      - name: Recheck current main and same-SHA checks immediately before apply
        id: apply-inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          RAW_BOOTSTRAP_INITIAL_ADMIN: ${{ github.event_name == 'workflow_dispatch' && vars.PRODUCTION_BOOTSTRAP_INITIAL_ADMIN || 'false' }}
        run: |
          python3 -I release-control/scripts/release-quality-gate.py --sha "$DEPLOY_SHA" --repository "$GITHUB_REPOSITORY" --apply --wait-seconds 0
          bootstrap=false
          if [[ "$RAW_BOOTSTRAP_INITIAL_ADMIN" == true ]]; then bootstrap=true; fi
          printf 'bootstrap_initial_admin=%s\n' "$bootstrap" >> "$GITHUB_OUTPUT"
      - name: Deliver exact revision and private inputs through pinned SSH
        working-directory: candidate
        env:
          RELEASE_IMAGE_MANIFEST: ../release-images.json
          BOOTSTRAP_INITIAL_ADMIN: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_only == false && steps.apply-inputs.outputs.bootstrap_initial_admin == 'true' && 'true' || 'false' }}
          INITIAL_ADMIN_REQUEST: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_only == false && steps.apply-inputs.outputs.bootstrap_initial_admin == 'true' && secrets.INITIAL_ADMIN_REQUEST || '' }}
          PROD_ENV: ${{ secrets.PROD_ENV }}
          PROD_SECRET_FILES_B64: ${{ secrets.PROD_SECRET_FILES_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          export -n INITIAL_ADMIN_REQUEST
          if [[ "$BOOTSTRAP_INITIAL_ADMIN" == true ]]; then
            grep -qx '# RCT_INITIAL_ADMIN_DELIVERY_V1' scripts/deliver-release.sh || exit 2
          fi
          INITIAL_ADMIN_REQUEST="${INITIAL_ADMIN_REQUEST:-}" bash scripts/deliver-release.sh
