name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '.planning/**'
      - '*.md'
      - 'SECURITY.md'
      - 'renovate.json'
      - '.pre-commit-config.yaml'
  pull_request:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '.planning/**'
      - '*.md'
      - 'SECURITY.md'
      - 'renovate.json'
      - '.pre-commit-config.yaml'

jobs:
  java-build-test:
    name: Java — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            path: ':services:api-gateway'
          - name: auth-service
            path: ':services:auth-service'
          - name: academic-service
            path: ':services:academic-service:academic-app'
          - name: schedule-service
            path: ':services:schedule-service:schedule-app'
          - name: attendance-service
            path: ':services:attendance-service:attendance-app'
          - name: notification-service
            path: ':services:notification-service:notification-app'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and test ${{ matrix.service.name }}
        run: ./gradlew ${{ matrix.service.path }}:check --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service.name }}
          path: |
            services/**/build/reports/tests/
            services/**/build/test-results/
          retention-days: 7

  python-lint-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            services/notification-bot/requirements.txt
            services/notification-bot/requirements-test.txt

      - name: Install dependencies
        run: |
          pip install ruff
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest tests/ -v

  frontend-build-test:
    name: Frontend — ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [pwa, mini-app, web-panel]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontends/${{ matrix.app }}/package-lock.json

      - name: Install, test, build
        working-directory: frontends/${{ matrix.app }}
        run: npm ci && npm test && npm run build
