name: Security

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.planning/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.planning/**'
      - '*.md'
  schedule:
    # Weekly Monday 03:00 UTC — свежие CVE могут появиться после build'а.
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write # for uploading SARIF results to GitHub Security tab

# Owner 2026-10-11: web-panel is deferred from the current release scope.
# Scan the accepted backend, PWA/TMA and bot; web-panel security debt remains
# and must be resolved before returning that client to the release gates.

jobs:
  trivy-repo:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Trivy fs scan (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0 — M08 G11 SHA-pin
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
          skip-dirs: 'docs,.planning,.github,frontends/web-panel,frontends/**/node_modules,**/build,**/dist'

      - name: Trivy fs scan (SARIF for GitHub Security)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0 — M08 G11 SHA-pin
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          skip-dirs: 'docs,.planning,.github,frontends/web-panel,frontends/**/node_modules,**/build,**/dist'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-config:
    name: Trivy (config — Dockerfile + compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0 — M08 G11 SHA-pin
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          skip-dirs: 'docs,.planning,frontends/web-panel'
          # M15 — structured ignore keeps the nginx exception path-specific.
          # YAML ignores require an explicit input; plain CVE ignores remain
          # auto-discovered by the filesystem scan.
          trivyignores: .trivyignore.yaml

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # complete event history, without the PR commits API's first-page limit

      - name: Run Gitleaks
        id: gitleaks
        shell: bash
        run: |
          set -euo pipefail
          test ! -e results.sarif
          log_opts="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          def refuse():
              raise SystemExit("Gitleaks source admission failed")

          def git(*args):
              result = subprocess.run(["git", *args], capture_output=True, text=True)
              if result.returncode:
                  refuse()
              return result.stdout.strip()

          def ref(value):
              if not isinstance(value, str) or re.fullmatch(r"[0-9a-f]{40}", value) is None:
                  refuse()
              if git("rev-parse", "--verify", value + "^{commit}") != value:
                  refuse()
              return value

          def ancestor(before, after):
              git("merge-base", "--is-ancestor", before, after)

          if git("rev-parse", "--is-shallow-repository") != "false":
              refuse()
          current = ref(os.environ["GITHUB_SHA"])
          if git("rev-parse", "HEAD") != current:
              refuse()
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          event_name = os.environ["GITHUB_EVENT_NAME"]
          revision = current
          if event_name == "pull_request":
              base = ref(event["pull_request"]["base"]["sha"])
              head = ref(event["pull_request"]["head"]["sha"])
              ancestor(base, current)
              ancestor(head, current)
              if base != current:
                  revision = base + ".." + current
          elif event_name == "push":
              if ref(event["after"]) != current:
                  refuse()
              before = event["before"]
              if before != "0" * 40:
                  before = ref(before)
                  ancestor(before, current)
                  if before != current:
                      revision = before + ".." + current
          elif event_name not in ("schedule", "workflow_dispatch"):
              refuse()
          if git("rev-list", "--max-count=1", revision) != current:
              refuse()
          # Walk every parent; first-parent applies only to how merge diffs are shown.
          print("--full-history --diff-merges=first-parent " + revision)
          PY
          )"
          test "$(uname -m)" = x86_64
          tool_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks-8.24.3.XXXXXX")"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$tool_dir/archive.tar.gz"
          printf '%s  %s\n' \
            9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c \
            "$tool_dir/archive.tar.gz" | sha256sum --check --status
          tar -xzf "$tool_dir/archive.tar.gz" -C "$tool_dir" gitleaks
          scan_status=0
          "$tool_dir/gitleaks" detect --source . --redact=100 --exit-code=2 \
            --report-format=sarif --report-path=results.sarif \
            --gitleaks-ignore-path=.gitleaksignore --log-opts="$log_opts" || scan_status=$?
          if [[ "$scan_status" -eq 0 || "$scan_status" -eq 2 ]]; then
            if [[ -s results.sarif ]]; then
              echo 'has_report=true' >> "$GITHUB_OUTPUT"
            elif [[ "$scan_status" -eq 0 ]]; then
              exit 1
            fi
          fi
          exit "$scan_status"

      - name: Retain redacted Gitleaks SARIF
        if: ${{ always() && steps.gitleaks.outputs.has_report == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-results.sarif
          path: results.sarif
          if-no-files-found: error

  trivy-images:
    name: Trivy (built images)
    runs-on: ubuntu-latest
    # Только на schedule — weekly deep scan GHCR-образов. На push/PR
    # используется Trivy fs (быстрее, не требует pull всех 11 образов).
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        image:
          - auth-service
          - academic-service
          - schedule-service
          - attendance-service
          - document-renderer-service
          - notification-web
          - notification-bot
          - api-gateway
          - pwa-nginx
          - mini-app-nginx
          - landing-nginx
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy image scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0 — M08 G11 SHA-pin
        with:
          image-ref: ghcr.io/ditekmax/rutcampustrack/${{ matrix.image }}:latest
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
