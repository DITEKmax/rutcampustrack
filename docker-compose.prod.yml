  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/api-gateway:${IMAGE_TAG:-latest}
    container_name: rct-api-gateway
    logging: *bounded-logs
    environment:
      MANAGEMENT_TRACING_BAGGAGE_REMOTE_FIELDS: requestId
      MANAGEMENT_TRACING_BAGGAGE_CORRELATION_FIELDS: requestId
      MANAGEMENT_TRACING_BAGGAGE_TAG_FIELDS: requestId
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_MAX_QUEUE_SIZE: "1024"
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_MAX_BATCH_SIZE: "128"
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_TIMEOUT: 1s
      MANAGEMENT_TRACING_OPENTELEMETRY_EXPORT_SCHEDULE_DELAY: 5s
      MANAGEMENT_OTLP_TRACING_TIMEOUT: 1s
      MANAGEMENT_OTLP_TRACING_CONNECT_TIMEOUT: 1s
      SPRING_REACTOR_CONTEXT_PROPAGATION: auto
      SPRING_PROFILES_ACTIVE: prod
      DEPLOYMENT_ENVIRONMENT: production
      SERVICE_VERSION: ${IMAGE_TAG:-unknown}
      MANAGEMENT_METRICS_TAGS_ENVIRONMENT: production
      MANAGEMENT_METRICS_TAGS_VERSION: ${IMAGE_TAG:-unknown}
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      # M04 QA2 — distributed tracing OTLP exporter (HTTP/protobuf, M16 G1: 4317→4318).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      AUTH_SERVICE_URL: http://auth-service:9090
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      # M03a Group 9: Redis-backed rate-limiter (shared Redis с auth-service)
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # M03a: Gateway → auth-service token-exchange shared secret
      INTERNAL_ISSUER_SECRET: ${INTERNAL_ISSUER_SECRET}
      # Must equal the static address assigned to the sole Nginx edge below.
      GATEWAY_TRUSTED_PROXY_ADDRESSES: ${GATEWAY_NGINX_IPV4:?GATEWAY_NGINX_IPV4 must be set}
      # PWA hard-update fallback: old clients that still call API get 426.
      PWA_VERSION_POLICY_ENABLED: 'true'
      PWA_VERSION_POLICY_LATEST: 1-${IMAGE_TAG:-0.0.0}
      PWA_VERSION_POLICY_FORCE: 'true'
      # M09 G7 (NEW-157).
      JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp'
    expose:
      - '8080'
    networks:
      - private_net
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
      attendance-service:
        condition: service_healthy
      mobile-bff:
        condition: service_healthy
      notification-web:
        condition: service_healthy
    # M09 G7 (NEW-157). M15 hotfix: 256m → 384m. Spring Cloud Gateway boot
    # peak: Reactor Netty + Redis + RSA pub key fetch + OTel SDK + Spring
    # Security + WebFlux. После warmup ~150m steady-state, но cold start
    # пробивает 256m mem_limit → exit 137 → restart loop.
    mem_limit: 384m
    mem_reservation: 256m
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/actuator/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # MONITORING
  # ============================================================

  postgres-academic-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0@sha256:6999a7657e2f2fb0ca6ebf417213eebf6dc7d21b30708c622f6fcb11183a2bb0
    container_name: rct-postgres-academic-exporter
    environment:
      DATA_SOURCE_URI: postgres-academic:5432/academic_db?sslmode=disable
      DATA_SOURCE_USER: rct_monitor
      DATA_SOURCE_PASS_FILE: /run/secrets/pg-academic-monitor-password
    command:
    - --no-collector.stat_statements
    - --collector.long_running_transactions
    secrets:
    - pg-academic-monitor-password
    expose:
    - '9187'
    networks:
    - private_net
    mem_limit: 64m
    mem_reservation: 16m
    cpus: 0.25
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    read_only: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  postgres-schedule-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0@sha256:6999a7657e2f2fb0ca6ebf417213eebf6dc7d21b30708c622f6fcb11183a2bb0
    container_name: rct-postgres-schedule-exporter
    environment:
      DATA_SOURCE_URI: postgres-schedule:5432/schedule_db?sslmode=disable
      DATA_SOURCE_USER: rct_monitor
      DATA_SOURCE_PASS_FILE: /run/secrets/pg-schedule-monitor-password
    command:
    - --no-collector.stat_statements
    - --collector.long_running_transactions
    secrets:
    - pg-schedule-monitor-password
    expose:
    - '9187'
    networks:
    - private_net
    mem_limit: 64m
    mem_reservation: 16m
    cpus: 0.25
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    read_only: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  mongodb-exporter:
    image: percona/mongodb_exporter:0.41.2@sha256:78b90894cef4bbbec6fe6d3f5694bd3149cec4ef888a24db43e14a09c702756d
    container_name: rct-mongodb-exporter
    environment:
      MONGODB_USER: rct_monitor
    env_file:
    - ${MONGO_MONITOR_ENV_FILE:?MONGO_MONITOR_ENV_FILE must be set}
    command:
    - --mongodb.uri=mongodb://mongo-attendance:27017/admin?authSource=admin
    - --collector.diagnosticdata
    - --collector.replicasetstatus
    - --collector.dbstats
    - --collector.collstats-limit=100
    - --mongodb.connect-timeout-ms=3000
    - --log.level=error
    expose:
    - '9216'
    networks:
    - private_net
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.25
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    read_only: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0@sha256:120f7ec77293459ccfdad66bb1db75ab72e8bfeab99f58b1cc2564cadcd7a9e7
    container_name: rct-redis-exporter
    command:
    - --redis.addr=redis://redis:6379
    - --redis.user=rct_monitor
    - --redis.password-file=/run/secrets/redis-monitor-password-map
    - --config-command=-
    - --disable-exporting-key-values
    - --exclude-latency-histogram-metrics
    - --log-format=json
    secrets:
    - redis-monitor-password-map
    expose:
    - '9121'
    networks:
    - private_net
    mem_limit: 64m
    mem_reservation: 16m
    cpus: 0.25
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    read_only: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  redis-cache-exporter:
    image: oliver006/redis_exporter:v1.67.0@sha256:120f7ec77293459ccfdad66bb1db75ab72e8bfeab99f58b1cc2564cadcd7a9e7
    container_name: rct-redis-cache-exporter
    command:
    - --redis.addr=redis://redis-cache:6379
    - --redis.user=rct_monitor
    - --redis.password-file=/run/secrets/redis-cache-monitor-password-map
    - --config-command=-
    - --disable-exporting-key-values
    - --exclude-latency-histogram-metrics
    - --log-format=json
    secrets:
    - redis-cache-monitor-password-map
    expose:
    - '9121'
    networks:
    - private_net
    mem_limit: 32m
    environment:
      GOMEMLIMIT: 24MiB
      GOMAXPROCS: '1'
    mem_reservation: 16m
    cpus: 0.25
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    read_only: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  node-exporter:
    # M08 G11 — digest-pin (было semver-only M06 P2-9/2). Update:
    #   docker buildx imagetools inspect prom/node-exporter:v1.8.2
    image: prom/node-exporter:v1.8.2@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    container_name: rct-node-exporter
    logging: *bounded-logs
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.processes'
      - '--collector.interrupts'
      - '--collector.tcpstat'
      - '--collector.systemd'
    volumes:
      - /:/host:ro,rslave
      # Optional host signals used by Node Exporter Full: systemd unit/socket
      # state, process/thread counts, IRQ detail and TCP socket queues.
      # Hardware sensors still depend on physical host support.
      - /var/run/dbus:/var/run/dbus:ro,rslave
    expose:
      - '9100'
    networks:
      - private_net
    # M16 G8a — drop NET_RAW (default Docker capability). Без него
    # потенциально compromised peer не может sniff'ать plaintext-трафик
    # в private_net (например, Bearer token Alertmanager → notification-web).
    # Defense-in-depth: node-exporter не нуждается в raw-sockets для
    # /proc/net чтения, оно идёт через standard kernel API.
    cap_drop:
      - NET_RAW
    # systemd collector uses the host DBus socket; Ubuntu/AppArmor blocks
    # even read-only DBus method calls under Docker's default profile.
    security_opt:
      - apparmor:unconfined
    # M13 G11 (NEW-154/155/157) — bound aux container memory.
    # node-exporter — резидентный footprint ~15-25m, 128m даёт запас
    # под /proc reading peaks без OOM на 8GB VPS.
    mem_limit: 128m
    mem_reservation: 32m
    restart: unless-stopped

  cadvisor:
    # M06 D2: digest-пин обязателен — mounts /:/rootfs + /sys = host filesystem read.
    # Supply-chain compromise по-прежнему высокий impact (read-only host fs),
    # но M16 G9 убрал `privileged: true` — больше нет full root host access
    # на write/exec через /proc, /dev manipulation, kernel capabilities.
    # Bump digest через Renovate (QD6).
    # Version: v0.49.1. Update: `docker buildx imagetools inspect gcr.io/cadvisor/cadvisor:<ver>`
    image: gcr.io/cadvisor/cadvisor:v0.49.1@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388
    container_name: rct-cadvisor
    logging: *bounded-logs
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    # M16 G9 — `--device=/dev/kmsg` per cadvisor docs (running.md): kernel
    # log access без `privileged: true`. Без этого OOM-event метрики
    # (`container_oom_events_total`) теряются.
    devices:
      - /dev/kmsg:/dev/kmsg
    expose:
      - '8080'
    networks:
      - private_net
    # M16 G8a — drop NET_RAW (sniffing capability) для defense-in-depth.
    # cadvisor читает /proc + /sys для metric collection, raw sockets не
    # нужны. Если контейнер скомпрометирован — не сможет перехватывать
    # plaintext-трафик в private_net.
    cap_drop:
      - NET_RAW
    # M13 G11 — cadvisor scrape'ает все containers, ~50-150m residual
    # под нагрузкой. 256m с запасом.
    mem_limit: 256m
    mem_reservation: 64m
    restart: unless-stopped
    # M16 G9 — privileged: true УБРАН. Default Docker capabilities + read-only
    # mounts + /dev/kmsg device = full functionality cadvisor (per upstream
    # running.md + cadvisor issue #3051: «running without privileged but as root
    # was necessary to access all required metrics»). Container metrics
    # `container_*` остаются available, OOM tracking через /dev/kmsg работает.
    # Verify VPS: `up{job="cadvisor"} == 1` + `count by (name) (container_memory_usage_bytes)` > 0.

  # M13 G20 — blackbox-exporter probe'ит публичный URL https://ruttrack.site,
  # экспортирует метрики probe_success, probe_ssl_earliest_cert_expiry,
  # probe_http_status_code. Используется для alert'а SslCertExpiresSoon
  # (cert < 30d) — без этого Prometheus не имеет visibility на TLS-cert
  # expiry (внутренние сервисы scrape'ят /actuator/prometheus, certificate
  # info там не экспортируется).
  # Update: docker buildx imagetools inspect prom/blackbox-exporter:v0.25.0
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0@sha256:67847e8aaec3c4852a2c7d84d5344e7931521962988c48df00cd980cd1b490a2
    container_name: rct-blackbox-exporter
    logging: *bounded-logs
    volumes:
      - ./infra/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    expose:
      - '9115'
    networks:
      - private_net
    # M16 G8a — drop NET_RAW. Blackbox-exporter probe'ит публичные URL
    # (https://ruttrack.site) через HTTP-клиент, raw sockets не нужны.
    # ICMP-probe модуль НЕ используется (мы probe'им только http_2xx) —
    # без NET_RAW потеряется только icmp probing capability, что irrelevant.
    cap_drop:
      - NET_RAW
    # Lightweight: probe overhead minimal, scrape interval 60s. 64m headroom.
    mem_limit: 64m
    mem_reservation: 16m
    restart: unless-stopped

  prometheus:
    # M08 G11 — digest-pin (было semver-only M06 P2-9/2). Update:
    #   docker buildx imagetools inspect prom/prometheus:v2.55.1
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    container_name: rct-prometheus
    logging: *bounded-logs
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # M04 Группа 10 — retention 14d (QA5). 30d было дефолт после
      # первичной инсталляции, но для наших 6 сервисов 14d достаточно
      # (incident analysis + weekly review). NEW-66: review по
      # накоплению disk usage.
      - '--storage.tsdb.retention.time=35d'
      - '--storage.tsdb.retention.size=4GB'
      - '--query.max-concurrency=4'
      - '--query.max-samples=500000'
      - '--query.timeout=30s'
      # M13 G14 — UI за nginx reverse-proxy под /prometheus/ с basic-auth.
      # --web.external-url ставит base URL для absolute links в UI; без
      # него Graph/Targets/Alerts пишут absolute "/graph" без prefix'а и
      # ломаются через proxy. --web.route-prefix нужен чтобы prometheus
      # сам отвечал на /prometheus/* (иначе upstream отдаёт 404).
      - '--web.external-url=https://ruttrack.site/prometheus/'
      - '--web.route-prefix=/'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # M04 Группа 9 — rule files подключаются через prometheus.yml
      # (rule_files: /etc/prometheus/rules/*.yml).
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    expose:
      - '9090'
    networks:
      - private_net
    depends_on:
      - node-exporter
      - cadvisor
      - alertmanager
    # M09 G7 (NEW-157).
    mem_limit: 192m
    mem_reservation: 128m
    restart: unless-stopped

  # M04 Группа 9 — Alertmanager. Принимает fired alerts от prometheus
  # (alertmanager:9093), через routing отсылает webhook в
  # notification-web:9094/internal/alert. Silence 22:00-08:00 MSK
  # для warning (critical — всегда).
  alertmanager:
    # M08 G11 — digest-pin. Update: docker buildx imagetools inspect prom/alertmanager:v0.27.0
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    container_name: rct-alertmanager
    logging: *bounded-logs
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://ruttrack.site/alertmanager/'
      - '--web.route-prefix=/'
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets:
      - alert-webhook-token
    expose:
      - '9093'
    networks:
      - private_net
    # M16 G8a — drop NET_RAW. Alertmanager шлёт webhook'и через HTTP-клиент,
    # raw-sockets не нужны. Symmetric defense: даже если Alertmanager
    # скомпрометирован, он не сможет sniff'ать прочий трафик в private_net.
    cap_drop:
      - NET_RAW
    # M09 G7 (NEW-157).
    mem_limit: 64m
    mem_reservation: 32m
    restart: unless-stopped

  # M04 QA2 — Grafana Tempo, distributed tracing storage. Retention 14d (QA5).
  # OTLP gRPC :4317 принимает spans от 6 backend-сервисов (NEW-59).
  # HTTP :3200 — Tempo HTTP API для Grafana datasource.
  tempo:
    # M08 G11 — digest-pin. Update: docker buildx imagetools inspect grafana/tempo:2.3.1
    image: grafana/tempo:2.3.1@sha256:1c6fb7c74831474f82c9bde218c84b61e5269b676e6505e7dc3c1862dae9b5cc
    container_name: rct-tempo
    logging: *bounded-logs
    command: ['-config.file=/etc/tempo/tempo.yml']
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    expose:
      - '3200' # HTTP — Grafana datasource
      - '4317' # OTLP gRPC — приёмник spans
      - '4318' # OTLP HTTP (на будущее)
    networks:
      - private_net
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3200/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    # M18: Tempo compaction + WAL replay need more headroom than 128m.
    # App services still do not depend on Tempo health.
    mem_limit: 256m
    mem_reservation: 192m
    restart: unless-stopped

  grafana:
    # M08 G11 — digest-pin (было semver-only M06 P2-9/2). Update:
    #   docker buildx imagetools inspect grafana/grafana:11.3.1
    image: grafana/grafana:11.3.1@sha256:fa801ab6e1ae035135309580891e09f7eb94d1abdbd2106bdc288030b028158c
    container_name: rct-grafana
    logging: *bounded-logs
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./infra/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    expose:
      - '3000'
    networks:
      - private_net
    depends_on:
      - prometheus
      - tempo
    # M09 G7 (NEW-157).
    mem_limit: 256m
    mem_reservation: 128m
    restart: unless-stopped

  loki:
    # M08 G11 — digest-pin (было semver-only M06 P2-9/2). Major upgrade — MANUAL
    # через Renovate (см. docs/runbooks/loki-major-upgrade.md, NEW-151).
    # Update: docker buildx imagetools inspect grafana/loki:3.2.1
    image: grafana/loki:3.2.1@sha256:09a53b4a4ff81ffcd8f13886df19d33fac7a8d3aaf952e3c7e66cbade5b2fc31
    container_name: rct-loki
    logging: *bounded-logs
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    expose:
      - '3100'
    networks:
      - private_net
    # M09 G7 (NEW-157).
    mem_limit: 192m
    mem_reservation: 128m
    # M16 G4 — healthcheck для гарантии что Alloy не начнёт push'и
    # до того как ingester готов (root cause `InstancesCount <= 0`).
    # /ready возвращает 200 только после min_ready_duration (15s).
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3100/ready || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  alloy:
    # Docker socket remains daemon control even when mounted read-only.
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    container_name: rct-alloy
    logging: *bounded-logs
    command:
      - run
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --server.http.enable-pprof=false
      - --server.http.disable-support-bundle
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:?Compose project identity required}
      DEPLOYMENT_ENVIRONMENT: production
      GOMEMLIMIT: 192MiB
      GOMAXPROCS: '1'
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - '12345'
    networks:
      - private_net
    depends_on:
      loki:
        condition: service_healthy
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    restart: unless-stopped

  # ============================================================
  # REVERSE PROXY
  # ============================================================

  nginx:
    # M08 G11 — digest-pin. Update: docker buildx imagetools inspect nginx:1.27-alpine
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: rct-nginx
    logging: *bounded-logs
    ports:
      - '80:80'
      - '443:443'
    environment:
      # M11 G4 (NEW-125): bcrypt htpasswd line «swagger:$2y$05$...» из
      # `.env.prod`. На старте контейнера записывается в
      # `/etc/nginx/.htpasswd` (см. command ниже). См. runbook
      # docs/runbooks/swagger-prod-access.md.
      SWAGGER_HTPASSWD: ${SWAGGER_HTPASSWD:?SWAGGER_HTPASSWD must be set — see docs/runbooks/swagger-prod-access.md}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/dhparam.pem:/etc/nginx/dhparam.pem:ro
      # M13 G14 — fail-fast entrypoint: validate SWAGGER_HTPASSWD format
      # перед стартом nginx. Без этого пустой .htpasswd → silent security
      # regression (любой пароль проходит).
      - ./nginx/scripts/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      private_net:
        ipv4_address: ${GATEWAY_NGINX_IPV4:?GATEWAY_NGINX_IPV4 must be set}
    depends_on:
      api-gateway:
        condition: service_healthy
    # M13 G11 — reverse proxy + SSL termination + WebSocket fan-out.
    # nginx alpine ~5m residual, 256m под высокий keepalive load + buffers.
    mem_limit: 256m
    mem_reservation: 32m
    restart: unless-stopped
    # M13 G14 — fail-fast entrypoint:
    # 1. Validate SWAGGER_HTPASSWD env var (defined + non-empty + правильный
    #    format `login:$apr1$...` либо `login:$2y$...`). Без этих проверок
    #    /swagger-ui / /prometheus/ / /alertmanager/ basic-auth могла бы
    #    silently accept'ить любой password при пустом .htpasswd.
    # 2. Materialize .htpasswd from env (preserves M11 G4 behaviour).
    # 3. Background loop reloads nginx every 5 min (safety-net для cases
    #    когда deploy.yml's explicit `nginx -s reload` step skipped/failed).
    #    Primary reload path: GitHub Actions deploy.yml.
    # 4. Foreground nginx daemon.
    entrypoint: ['/bin/sh', '/usr/local/bin/entrypoint.sh']

  certbot:
    # M08 G11 — digest-pin + explicit tag (было implicit :latest, supply-chain риск).
    # Update: docker buildx imagetools inspect certbot/certbot:latest
    image: certbot/certbot:latest@sha256:78a7eaa40af657301e25731297b6e73646c695370d17e9bb03189fa82966d65c
    container_name: rct-certbot
    logging: *bounded-logs
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - private_net
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h; done'"
    # M13 G11 — certbot Python runtime + ACME client. Sleeps большинство
    # времени, peak только во время renew (~30-50m). 128m с запасом.
    mem_limit: 128m
    mem_reservation: 32m
    restart: unless-stopped

  # ============================================================
  # FRONTEND CONTAINERS
  # ============================================================

  # M13 G11 (extended scope) — все 4 frontend-nginx контейнеров отдают
  # только статику (Angular/React build artefacts + Tailwind CSS).
  # Resident footprint ~5-10m, 64m mem_limit достаточен с большим запасом
  # на keepalive connections + sendfile buffers. Симметрично с reverse-proxy
  # nginx, чтобы не оставлять unbounded контейнеры в prod.
  pwa-nginx:
    build:
      context: ./frontends
      dockerfile: pwa-vue/Dockerfile
      args:
        VITE_PUBLIC_BASE: /app/
        VITE_APP_VERSION: 1-${IMAGE_TAG:-0.0.0}
        VITE_MIN_SUPPORTED_VERSION: ${PWA_MIN_SUPPORTED_VERSION:-}
        VITE_FORCE_UPDATE: ${PWA_FORCE_UPDATE:-true}
        VITE_MOBILE_FIXTURE_MODE: 'false'
    image: ghcr.io/ditekmax/rutcampustrack/pwa-nginx:${IMAGE_TAG:-latest}
    container_name: rct-pwa-nginx
    logging: *bounded-logs
    expose:
      - '80'
    networks:
      - private_net
    mem_limit: 64m
    mem_reservation: 16m
    restart: unless-stopped

  mini-app-nginx:
    build:
      context: ./frontends
      dockerfile: tma-vue/Dockerfile
      args:
        VITE_PUBLIC_BASE: /mini-app/
        VITE_MOBILE_FIXTURE_MODE: 'false'
    image: ghcr.io/ditekmax/rutcampustrack/mini-app-nginx:${IMAGE_TAG:-latest}
    container_name: rct-mini-app-nginx
    logging: *bounded-logs
    expose:
      - '80'
    networks:
      - private_net
    mem_limit: 64m
    mem_reservation: 16m
    restart: unless-stopped

  web-panel-nginx:
    build:
      context: ./frontends/web-panel
      dockerfile: Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/web-panel-nginx:${IMAGE_TAG:-latest}
    container_name: rct-web-panel-nginx
    logging: *bounded-logs
    expose:
      - '80'
    networks:
      - private_net
    mem_limit: 64m
    mem_reservation: 16m
    restart: unless-stopped

  landing-nginx:
    build:
      context: ./frontends/landing
      dockerfile: Dockerfile
    image: ghcr.io/ditekmax/rutcampustrack/landing-nginx:${IMAGE_TAG:-latest}
    container_name: rct-landing-nginx
    logging: *bounded-logs
    expose:
      - '80'
    networks:
      - private_net
    mem_limit: 64m
    mem_reservation: 16m
    restart: unless-stopped

networks:
  private_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${GATEWAY_PRIVATE_SUBNET:?GATEWAY_PRIVATE_SUBNET must be set}
          gateway: ${GATEWAY_NETWORK_GATEWAY:?GATEWAY_NETWORK_GATEWAY must be set}
          ip_range: ${GATEWAY_DYNAMIC_IP_RANGE:?GATEWAY_DYNAMIC_IP_RANGE must be set}

volumes:
  pg-academic-data:
  pg-schedule-data:
  mongo-data:
  redis-data:
  rabbitmq-data:
  jwt-keys:
  certbot-conf:
  certbot-www:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  alertmanager-data:
  alloy-data:

# Keep ALERT_WEBHOOK_SECRET in deployment secret injection; never commit its value.
secrets:
  bot-to-auth-service-token:
    file: ${BOT_TO_AUTH_SERVICE_TOKEN_FILE:?BOT_TO_AUTH_SERVICE_TOKEN_FILE must be set}
  alert-webhook-token:
    environment: ALERT_WEBHOOK_SECRET
  pg-academic-monitor-password:
    file: ${PG_ACADEMIC_MONITOR_PASSWORD_FILE:?PG_ACADEMIC_MONITOR_PASSWORD_FILE must be set}
  pg-schedule-monitor-password:
    file: ${PG_SCHEDULE_MONITOR_PASSWORD_FILE:?PG_SCHEDULE_MONITOR_PASSWORD_FILE must be set}
  redis-monitor-password-map:
    file: ${REDIS_MONITOR_PASSWORD_MAP_FILE:?REDIS_MONITOR_PASSWORD_MAP_FILE must be set}
  pg-academic-bootstrap-password:
    file: ${PG_ACADEMIC_BOOTSTRAP_PASSWORD_FILE:?PG_ACADEMIC_BOOTSTRAP_PASSWORD_FILE must be set}
  pg-academic-runtime-password:
    file: ${PG_ACADEMIC_RUNTIME_PASSWORD_FILE:?PG_ACADEMIC_RUNTIME_PASSWORD_FILE must be set}
  pg-auth-runtime-password:
    file: ${PG_AUTH_RUNTIME_PASSWORD_FILE:?PG_AUTH_RUNTIME_PASSWORD_FILE must be set}
  pg-academic-service-runtime-password:
    file: ${PG_ACADEMIC_SERVICE_RUNTIME_PASSWORD_FILE:?PG_ACADEMIC_SERVICE_RUNTIME_PASSWORD_FILE must be set}
  pg-academic-migration-password:
    file: ${PG_ACADEMIC_MIGRATION_PASSWORD_FILE:?PG_ACADEMIC_MIGRATION_PASSWORD_FILE must be set}
  pg-schedule-bootstrap-password:
    file: ${PG_SCHEDULE_BOOTSTRAP_PASSWORD_FILE:?PG_SCHEDULE_BOOTSTRAP_PASSWORD_FILE must be set}
  pg-schedule-runtime-password:
    file: ${PG_SCHEDULE_RUNTIME_PASSWORD_FILE:?PG_SCHEDULE_RUNTIME_PASSWORD_FILE must be set}
  pg-schedule-migration-password:
    file: ${PG_SCHEDULE_MIGRATION_PASSWORD_FILE:?PG_SCHEDULE_MIGRATION_PASSWORD_FILE must be set}
  redis-users-acl:
    file: ${REDIS_SERVER_ACL_FILE:?REDIS_SERVER_ACL_FILE must be set}
  redis-cache-users-acl:
    file: ${REDIS_CACHE_SERVER_ACL_FILE:?REDIS_CACHE_SERVER_ACL_FILE must be set}
  redis-cache-runtime-password:
    file: ${REDIS_CACHE_RUNTIME_PASSWORD_FILE:?REDIS_CACHE_RUNTIME_PASSWORD_FILE must be set}
  redis-cache-monitor-password-map:
    file: ${REDIS_CACHE_MONITOR_PASSWORD_MAP_FILE:?REDIS_CACHE_MONITOR_PASSWORD_MAP_FILE must be set}
  mongo-monitor-env:
    file: ${MONGO_MONITOR_ENV_FILE:?MONGO_MONITOR_ENV_FILE must be set}
