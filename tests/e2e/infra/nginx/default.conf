# M13 G25.3 — e2e reverse-proxy (HTTP→HTTPS + self-signed TLS).
#
# Mirrors nginx/conf.d/default.conf без observability/swagger/grafana/
# certbot блоков. SSL termination через self-signed cert, генерируется
# при первом старте (см. infra/scripts/generate-test-certs.sh).
#
# Root serves Vue WEB, /app/ and /mini-app/ keep their scoped mobile clients;
# /api/ uses the real gateway.

server {
    listen 80;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 5m;
    add_header Cache-Control $student_requests_cache_control always;

    # WebSocket / STOMP — heartbeat 10s/10s, idle до 1h в e2e.
    location /api/ws/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location = /api/v1/student/requests/excuse {
        client_max_body_size 24m;
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "";
    }

    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "";
    }

    location /app/ {
        proxy_pass http://pwa-nginx:80/;
        proxy_set_header Host $host;
    }

    location /mini-app/ {
        proxy_pass http://mini-app-nginx:80/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web-nginx:80;
        proxy_set_header Host $host;
    }
}
