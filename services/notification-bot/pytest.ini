[pytest]
asyncio_mode = auto
markers =
    security_contract: M08 G8 security contract tests (startup validation, auth, CSRF)
# M08 Группа 10 (OWNER-ANSWERS QD2) — 50% line gate для notification-bot.
# coverage.xml нужен для diff-cover; term — в CI-логе.
# Selective 70% gate для bot/handlers/ — в M09 Группа 2 через отдельный
# CI step (`pytest --cov=bot/handlers --cov-fail-under=70`), pytest не
# поддерживает per-package fail-under в одном прогоне.
# Coverage excludes — в pyproject.toml [tool.coverage.run].
addopts = --cov=bot --cov-report=xml --cov-report=term --cov-fail-under=50
