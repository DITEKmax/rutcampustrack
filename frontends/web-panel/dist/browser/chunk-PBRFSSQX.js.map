<div class="page-stack" [@routeFade]>
  <!-- Page header -->
  <header class="page-header">
    <p class="page-header__eyebrow">Студент</p>
    <h1 class="page-header__title">Домашние задания</h1>
  </header>

  <!-- Mode switcher -->
  <div class="hw-toolbar">
    <app-segmented-control
      [options]="modeOptions"
      [value]="mode()"
      (valueChange)="onModeChange($event)">
    </app-segmented-control>

    <label class="hw-filter-toggle">
      <mat-slide-toggle
        [checked]="filterUncompleted()"
        (change)="onFilterChange($event.checked)"
        aria-label="Показать только невыполненные">
      </mat-slide-toggle>
      <span class="hw-filter-toggle__label">Только невыполненные</span>
    </label>
  </div>

  <!-- Loading skeleton -->
  @if (loading()) {
    <div class="homework-skeleton-list" role="list" aria-busy="true">
      @for (_ of [1,2,3]; track $index) {
        <div class="homework-skeleton" role="listitem"></div>
      }
    </div>
  }

  <!-- Error state -->
  @if (!loading() && error()) {
    <div class="page-error" role="alert">
      <i class="ph ph-warning-circle" aria-hidden="true"></i>
      <span>{{ error() }}</span>
    </div>
  }

  <!-- Sub-views -->
  @if (!loading() && !error()) {
    @switch (mode()) {
      @case ('day') {
        <app-student-homework-day-view
          [date]="selectedDate()"
          [items]="filteredHomeworks()"
          (dateChanged)="onDayDateChanged($event)"
          (completeToggled)="onCompleteToggled($event)">
        </app-student-homework-day-view>
      }
      @case ('week') {
        <app-student-homework-week-view
          [monday]="weekMonday()"
          [items]="filteredHomeworks()"
          (mondayChanged)="onWeekMondayChanged($event)"
          (completeToggled)="onCompleteToggled($event)">
        </app-student-homework-week-view>
      }
      @case ('month') {
        <app-student-homework-month-view
          [month]="currentMonth()"
          [items]="filteredHomeworks()"
          (dateSelected)="onDateSelected($event)"
          (monthChanged)="onMonthChanged($event)">
        </app-student-homework-month-view>
      }
    }
  }
</div>
