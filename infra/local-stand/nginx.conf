worker_processes auto;
error_log /var/log/nginx/error.log warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Keep capability URLs, tokens and query strings out of access logs.
    access_log off;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 443 ssl;
        server_name localhost 127.0.0.1;
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 24m;
        add_header Referrer-Policy no-referrer always;
        location /api/ {
            set $gateway api-gateway:8080;
            proxy_pass http://$gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 18514;
            proxy_set_header Forwarded "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
        location = /mini-app { return 302 /mini-app/; }
        location /mini-app/ {
            alias /usr/share/nginx/tma/;
            try_files $uri $uri/ /mini-app/index.html;
        }
        location = / { return 302 /app/; }
        location = /app { return 302 /app/; }
        location /app/ {
            alias /usr/share/nginx/pwa/;
            try_files $uri $uri/ /app/index.html;
        }
        location = /app/sw.js {
            alias /usr/share/nginx/pwa/sw.js;
            add_header Cache-Control no-cache;
        }
        location = /app/version.json {
            alias /usr/share/nginx/pwa/version.json;
            add_header Cache-Control no-store;
        }
    }
}
