<rect x="576" y="226" width="230" height="38" rx="19.0" fill="url(#accent)" stroke="none" stroke-width="1" opacity="1" /><text x="691.0" y="250.0" text-anchor="middle" fill="#F6F4FA" font-size="12" font-weight="600"><tspan x="691.0" dy="0">Metric lens + компактные полосы</tspan></text>
<text x="576" y="296" text-anchor="start" fill="#9E7AFF" font-size="14" font-weight="650"><tspan x="576" dy="0">113 · 123</tspan></text>
<text x="576" y="334" text-anchor="start" fill="#C8C2D6" font-size="15" font-weight="450"><tspan x="576" dy="0">Одна выбранная метрика на все строки; тап → 4</tspan><tspan x="576" dy="22">метрики.</tspan></text>
<text x="576" y="424" text-anchor="start" fill="#8A8299" font-size="13" font-weight="500"><tspan x="576" dy="0">Цена: переключение метрики</tspan></text>
<rect x="1000" y="160" width="470" height="300" rx="26" fill="#292531" stroke="#565061" stroke-width="1" opacity="1" />
