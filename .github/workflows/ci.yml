                                                        or all(type(readiness[key]) is bool for key in flags)))):
                          raise ValueError('Invalid closed reconciliation archive readiness status')
              if value['schema'] == 'semester-reconciliation.v11':
                  academic_health = value['academicRecoveryHealthLastRead']
                  if academic_health is not None and (
                          value['phase'] not in {'STRANDED', 'PENDING_ARCHIVE', 'EXACT_REPLAY', 'DUPLICATE'}
                          or type(academic_health) is not dict
                          or set(academic_health) != {'channelState', 'fresh'}
                          or type(academic_health['channelState']) is not str
                          or academic_health['channelState'] not in {'READY', 'IDLE', 'CONNECTING', 'TRANSIENT_FAILURE', 'SHUTDOWN', 'UNKNOWN'}
                          or type(academic_health['fresh']) is not bool):
                      raise ValueError('Invalid closed reconciliation Academic recovery health')
              if value['schema'] in ('semester-reconciliation.v9', 'semester-reconciliation.v10', 'semester-reconciliation.v11'):
