  java-verification:
    name: Java verification (verifyNoDebugInProd + verifyLogbackJsonInAllServices)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve published Flyway migration history
        run: python3 scripts/check-published-migrations.py --fetch-published

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Lightweight verification tasks (не зависит от тестов).
      - name: Warm Gradle wrapper
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then
              exit 0
            fi
            echo "Gradle wrapper download failed, retrying in $((attempt * 10))s ($attempt/3)"
            sleep $((attempt * 10))
          done
          ./gradlew --version --no-daemon

      - name: Run verification tasks
        run: ./gradlew verifyNoDebugInProd verifyLogbackJsonInAllServices --no-daemon

  python-lint-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            services/notification-bot/requirements.txt
            services/notification-bot/requirements-test.txt

      - name: Install dependencies
        run: |
          pip install ruff==0.17.0
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest tests/ -v

  mobile-vue-build-test:
    name: Mobile Vue workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'npm'
          cache-dependency-path: frontends/package-lock.json
      - name: Install, contract checks, type checks, worker checks, build
        working-directory: frontends
        run: |
          npm ci
          npm run generate:types:check
          npm run generate:auth-types:check
          npm run generate:academic-schedule-types:check
          npm run test:contract
          npm run typecheck:foundation
          npm run typecheck
          node --test pwa-vue/tests/*.test.mjs
          node ../tests/load/scenario-controls.cjs
          npm run build
  # M13 G15 — ShellCheck lint для всех bash-скриптов.
  # Gate на ошибки уровня `error` и `warning`; `info`/`style` не блочат.
  shellcheck:
    name: ShellCheck scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts/*.sh
        run: shellcheck --severity=warning scripts/*.sh
      - name: Parse local-stand PowerShell source
        shell: pwsh
        run: |
          $localStandTokens = $null
          $localStandParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/local-stand.ps1'), [ref]$localStandTokens, [ref]$localStandParseErrors) | Out-Null
          if ($localStandParseErrors.Count -gt 0) { throw 'Tracked local-stand PowerShell syntax validation failed' }

  # M13 G17 — структурная валидация Grafana dashboard JSON-файлов.
  # Catch'ит broken JSON / missing uid|title / 0 panels до VPS deploy.
  # Live smoke (non-zero данные) deferred в G23 VPS dry-run.
  grafana-dashboards:
    name: Grafana dashboards structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dashboards
        run: bash scripts/validate-grafana-dashboards.sh

  # Current PWA/TMA Vue auth against the isolated backend stack.
  recovery-files:
    name: Synthetic database and file recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RCT_FILES_RECOVERY_PROJECT: rct-recovery-files-${{ github.run_id }}-${{ github.run_attempt }}
      RCT_RECOVERY_PG_IMAGE: postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
      RCT_RECOVERY_MONGO_IMAGE: mongo@sha256:1f995ad6fdb93244a1addab1b58f934a0bc2f5643c38e02f5e9d7f0c7d227a7b
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
      - name: Set the disposable recovery working path
        timeout-minutes: 1
        run: printf 'RCT_FILES_RECOVERY_DIR=%s\n' "$RUNNER_TEMP/rct-files-recovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        timeout-minutes: 1
        with:
          python-version: '3.12'
      - name: Fetch the explicit recovery images
        timeout-minutes: 3
        run: |
          docker pull "$RCT_RECOVERY_PG_IMAGE"
          docker pull "$RCT_RECOVERY_MONGO_IMAGE"
      - name: Exercise the existing files-mode recovery drill
        timeout-minutes: 8
        run: |
          umask 077
          python3 scripts/test-recovery.py --work-dir "$RCT_FILES_RECOVERY_DIR" \
            --project-base "$RCT_FILES_RECOVERY_PROJECT" \
            --pg-image "$RCT_RECOVERY_PG_IMAGE" --mongo-image "$RCT_RECOVERY_MONGO_IMAGE"
      - name: Record closed resource diagnostics after failure
        timeout-minutes: 1
        if: failure()
        run: |
          python3 - <<'PY_RECOVERY_RESOURCE'
          import json, os, subprocess
          services = {'postgres-academic', 'postgres-schedule', 'mongo-attendance'}
          try:
              for suffix in ('-src', '-dst'):
                  project = os.environ['RCT_FILES_RECOVERY_PROJECT'] + suffix
                  ids = subprocess.check_output(['docker', 'ps', '-aq', '--filter',
                                                 'label=com.docker.compose.project=' + project], stderr=subprocess.PIPE, timeout=5).decode().split()
                  if len(ids) > 3:
                      raise SystemExit('Unexpected disposable recovery resource count')
                  for cid in ids:
                      info = json.loads(subprocess.check_output(['docker', 'inspect', cid], stderr=subprocess.PIPE, timeout=5))[0]
                      labels, state = info['Config']['Labels'], info['State']
                      service = labels.get('com.docker.compose.service')
                      if (labels.get('com.docker.compose.project') != project
                              or labels.get('io.rutcampustrack.recovery') != 'disposable' or service not in services):
                          raise SystemExit('Disposable recovery resource ownership mismatch')
                      print(json.dumps({'service': service, 'target': suffix == '-dst',
                                        'running': bool(state['Running']), 'oomKilled': bool(state['OOMKilled']),
                                        'exitCode': int(state['ExitCode']),
                                        'memoryLimit': int(info['HostConfig']['Memory'])}))
          except (subprocess.SubprocessError, OSError, ValueError, KeyError, TypeError):
              print('Closed recovery resource diagnostic unavailable; original failure retained')
          PY_RECOVERY_RESOURCE
      - name: Upload the existing closed recovery receipt
        timeout-minutes: 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: files-recovery-safe-${{ github.run_attempt }}
          path: ${{ env.RCT_FILES_RECOVERY_DIR }}/PASS.json
          if-no-files-found: warn
          retention-days: 7
      - name: Stop only the marked disposable recovery projects
        if: always()
        timeout-minutes: 3
        run: |
          if [ -f "$RCT_FILES_RECOVERY_DIR/owned-projects.json" ]; then
            python3 scripts/test-recovery.py --work-dir "$RCT_FILES_RECOVERY_DIR" \
              --project-base "$RCT_FILES_RECOVERY_PROJECT" --cleanup
          fi

  e2e-auth:
    name: Playwright E2E auth flow (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [client, lifecycle]
    steps:
      - uses: actions/checkout@v4
      - name: Record the actual PR checkout revision
        env:
          RCT_CHECKOUT_PRODUCER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          umask 077
          python3 - <<'PY_CHECKOUT'
          import json, os, re, subprocess
          from pathlib import Path

          checkout = subprocess.check_output(['git', 'rev-parse', 'HEAD'], timeout=10).decode().strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], timeout=10).decode().strip()
          producer = os.environ['RCT_CHECKOUT_PRODUCER']
          if not all(re.fullmatch('[0-9a-f]{40}', value) for value in (checkout, tree, producer)):
              raise SystemExit('Invalid checkout revision metadata')
          path = Path(os.environ['RUNNER_TEMP']) / 'rct-checkout.safe.json'
          with path.open('x') as stream:
              json.dump({'checkout_sha': checkout, 'tree_sha': tree, 'producer_head_sha': producer}, stream)
              stream.write('\n')
          PY_CHECKOUT
      - name: Upload the closed checkout revision
        uses: actions/upload-artifact@v4
        with:
          name: checkout-safe-${{ matrix.group }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rct-checkout.safe.json
          if-no-files-found: error
          retention-days: 7

      - name: Validate ordinary MARK diagnostic sources and privacy before runtime startup
        if: ${{ matrix.group == 'lifecycle' }}
        timeout-minutes: 1
        run: python3 -B tests/e2e/fixtures/http500-diagnostic-contract.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare disposable FIRST3 clock and private artifacts
        env:
          RCT_E2E_TEACHING_CLOCK_DIR: ${{ runner.temp }}/rct-first3-clock-${{ github.run_id }}-${{ github.run_attempt }}
          RCT_FOCUS3_RUN: ${{ runner.temp }}/rct-first3-${{ github.run_id }}-${{ github.run_attempt }}
          RCT_FOCUS3_OBSERVATIONS: ${{ runner.temp }}/rct-first3-${{ github.run_id }}-${{ github.run_attempt }}/supervision/observations.safe.json
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_SYNTHETIC_SEED: 'true'
        run: |
          umask 077
          python3 - <<'PY_ATTENDANCE_SERVICE_TOKEN'
          import os, secrets, stat

          tokens = {name: secrets.token_urlsafe(32) for name in (
              'ACADEMIC_TO_ATTENDANCE_SERVICE_TOKEN',
              'SCHEDULE_TO_ACADEMIC_SERVICE_TOKEN',
              'ATTENDANCE_TO_ACADEMIC_SERVICE_TOKEN',
          )}
          if len(set(tokens.values())) != len(tokens):
              raise SystemExit('Synthetic directed service tokens must be distinct')
          for token in tokens.values():
              print('::add-mask::' + token)
          # Sanitized owned Compose children use this same dotenv, without inheriting tokens.
          fds, temporary, temporary_identity = [], None, None
          try:
              try:
                  if (os.environ.get('GITHUB_ACTIONS') != 'true'
                          or os.environ.get('RUNNER_ENVIRONMENT') != 'github-hosted'
                          or os.environ.get('RCT_E2E_SYNTHETIC_SEED') != 'true'):
                      raise ValueError('Disposable CI required')
                  workspace = os.environ['GITHUB_WORKSPACE']
                  if not os.path.isabs(workspace):
                      raise ValueError('Owned workspace required')
                  flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
                  fds.append(os.open('.', flags))
                  root = os.fstat(fds[-1])
                  expected = os.stat(workspace, follow_symlinks=False)
                  if (root.st_dev, root.st_ino) != (expected.st_dev, expected.st_ino):
                      raise ValueError('Workspace identity changed')
                  for component in (None, 'tests', 'e2e'):
                      if component is not None:
                          fds.append(os.open(component, flags, dir_fd=fds[-1]))
                      directory = os.fstat(fds[-1])
                      if (not stat.S_ISDIR(directory.st_mode) or directory.st_uid != os.getuid()
                              or stat.S_IMODE(directory.st_mode) & 0o022):
                          raise ValueError('Unsafe owned directory')
                  directory_fd = fds[-1]
                  fds.append(os.open('.env.ci', os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK,
                                     dir_fd=directory_fd))
                  source = os.fstat(fds[-1])
                  if (not stat.S_ISREG(source.st_mode) or source.st_uid != os.getuid()
                          or source.st_nlink != 1 or stat.S_IMODE(source.st_mode) & 0o022
                          or not 0 < source.st_size <= 65536):
                      raise ValueError('Unsafe synthetic dotenv')
                  identity = lambda value: (value.st_dev, value.st_ino, value.st_uid, value.st_nlink,
                                            value.st_mode, value.st_size, value.st_mtime_ns, value.st_ctime_ns)
                  raw = os.read(fds[-1], 65537)
                  if len(raw) != source.st_size or identity(os.fstat(fds[-1])) != identity(source):
                      raise ValueError('Synthetic dotenv changed')
                  encoded = {name.encode(): token.encode() for name, token in tokens.items()}
                  seen, lines = set(), []
                  for line in raw.splitlines(keepends=True):
                      content = line.rstrip(b'\r\n')
                      active = content.lstrip()
                      if active and not active.startswith(b'#') and b'=' in active:
                          value = active.split(b'=', 1)[1].lstrip()
                          if value[:1] in (b"'", b'"'):
                              escaped = closed = False
                              for symbol in value[1:]:
                                  if symbol == value[0] and not escaped:
                                      closed = True
                                      break
                                  escaped = symbol == 92 and not escaped
                              if not closed:
                                  raise ValueError('Synthetic dotenv requires closed single-line values')
                      mentioned = [] if active.startswith(b'#') else [key for key in encoded if key in content]
                      if not mentioned:
                          lines.append(line)
                          continue
                      if (len(mentioned) != 1 or not content.startswith(mentioned[0] + b'=')
                              or mentioned[0] in seen):
                          raise ValueError('Malformed directed-token assignment')
                      key = mentioned[0]
                      seen.add(key)
                      lines.append(key + b'=' + encoded[key] + line[len(content):])
                  updated = b''.join(lines)
                  missing = [key for key in encoded if key not in seen]
                  if missing and updated and not updated.endswith(b'\n'):
                      updated += b'\n'
                  updated += b''.join(key + b'=' + encoded[key] + b'\n' for key in missing)
                  if len(updated) > 65536:
                      raise ValueError('Synthetic dotenv exceeds its bound')
                  temporary = '.env.ci.' + secrets.token_hex(16) + '.tmp'
                  temp_fd = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                                    0o600, dir_fd=directory_fd)
                  temporary_identity = os.fstat(temp_fd)
                  with os.fdopen(temp_fd, 'wb') as output:
                      output.write(updated)
                      output.flush()
                      os.fsync(output.fileno())
                  for parent_fd, name, held_fd in ((None, workspace, fds[0]),
                                                        (fds[0], 'tests', fds[1]),
                                                        (fds[1], 'e2e', fds[2])):
                      linked = os.stat(name, dir_fd=parent_fd, follow_symlinks=False)
                      held = os.fstat(held_fd)
                      if (linked.st_dev, linked.st_ino) != (held.st_dev, held.st_ino):
                          raise ValueError('Owned directory identity changed before commit')
                  current = os.stat('.env.ci', dir_fd=directory_fd, follow_symlinks=False)
                  temp_current = os.stat(temporary, dir_fd=directory_fd, follow_symlinks=False)
                  if (identity(current) != identity(source)
                          or (temp_current.st_dev, temp_current.st_ino) !=
                             (temporary_identity.st_dev, temporary_identity.st_ino)
                          or not stat.S_ISREG(temp_current.st_mode) or temp_current.st_nlink != 1
                          or temp_current.st_uid != os.getuid() or stat.S_IMODE(temp_current.st_mode) != 0o600
                          or temp_current.st_size != len(updated)):
                      raise ValueError('Synthetic dotenv identity changed before commit')
                  os.replace(temporary, '.env.ci', src_dir_fd=directory_fd, dst_dir_fd=directory_fd)
                  temporary = None
                  os.fsync(directory_fd)
              finally:
                  try:
                      if temporary is not None and temporary_identity is not None:
                          remaining = os.stat(temporary, dir_fd=directory_fd, follow_symlinks=False)
                          if (remaining.st_dev, remaining.st_ino) != (temporary_identity.st_dev, temporary_identity.st_ino):
                              raise ValueError('Temporary dotenv ownership changed')
                          os.unlink(temporary, dir_fd=directory_fd)
                  finally:
                      for fd in reversed(fds):
                          os.close(fd)
          except Exception:
              raise SystemExit('Owned synthetic Compose environment preparation failed') from None
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(''.join(name + '=' + token + '\n' for name, token in tokens.items()))
          PY_ATTENDANCE_SERVICE_TOKEN
          {
            printf 'RCT_E2E_TEACHING_CLOCK_DIR=%s\n' "$RCT_E2E_TEACHING_CLOCK_DIR"
            printf 'RCT_FOCUS3_RUN=%s\n' "$RCT_FOCUS3_RUN"
            printf 'RCT_FOCUS3_OBSERVATIONS=%s\n' "$RCT_FOCUS3_OBSERVATIONS"
          } >> "$GITHUB_ENV"
          mkdir -m 700 -- "$RCT_FOCUS3_RUN"
          mkdir -m 700 -- "$RCT_FOCUS3_RUN/artifacts" "$RCT_FOCUS3_RUN/supervision"
          chmod +x gradlew
          ./gradlew e2eClockFixtureJar e2eClockFixtureControl --no-daemon --max-workers=1
          python3 tests/e2e/fixtures/semester-effect-diagnostic.control.py
          (
            umask 022
            node tests/e2e/backend-clock/prepare-clock.mjs "$RCT_E2E_TEACHING_CLOCK_DIR" "$PWD/build/e2e-clock/clock-fixture.jar"
          )

      # M13 G25.3 — buildx нужен для BuildKit cache mount
      # (`--mount=type=cache,target=/root/.gradle` в backend Dockerfile'ах).
      # Default docker driver игнорирует cache mounts → каждый build
      # повторно скачивает Gradle dependencies (+5-10 мин на CI).
      # Frontend bundles — Docker multi-stage сам делает npm ci/build,
      # ничего pre-build не нужно.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # M13 G25.3 — self-signed TLS cert для reverse-proxy nginx.
      # AuthCookies.java выставляет `Secure` flag → на чистом HTTP browser
      # cookie отбрасывает → T1 spec падает. TLS termination на e2e nginx
      # обходит проблему без изменения production code.
      - name: Generate self-signed TLS cert
        run: bash tests/e2e/infra/scripts/generate-test-certs.sh

      - name: Boot isolated Vue auth stack
        id: bootstrap-images
        env:
          RCT_E2E_SYNTHETIC_BASELINE: browser-v2-split-20261018-v1
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          identity=()
          if [ '${{ matrix.group }}' = client ]; then
            identity=(-f tests/e2e/infra/docker-compose.monitoring-identity.yml)
          fi
          docker compose --env-file tests/e2e/.env.ci -p rct-e2e -f docker-compose.e2e.yml -f tests/e2e/infra/docker-compose.clock-fixture.yml -f tests/e2e/infra/docker-compose.synthetic-baseline.yml "${identity[@]}" config --quiet
          docker compose --env-file tests/e2e/.env.ci -p rct-e2e -f docker-compose.e2e.yml -f tests/e2e/infra/docker-compose.clock-fixture.yml -f tests/e2e/infra/docker-compose.synthetic-baseline.yml "${identity[@]}" up -d --build --wait --wait-timeout 480
          docker compose --env-file tests/e2e/.env.ci -p rct-e2e -f docker-compose.e2e.yml exec -T notification-web \
            sh -c 'test ! -e /keys/private.key && test ! -L /keys/private.key'
          printf '%s\n' 'PASS disposable Notification consumer has no signing private-key file'

      - name: Link synthetic Telegram teacher in the ephemeral database
        run: |
          docker compose --env-file tests/e2e/.env.ci -p rct-e2e -f docker-compose.e2e.yml exec -T postgres-academic \
            psql -U rct_user -d auth_db -v ON_ERROR_STOP=1 \
            < tests/e2e/infra/seed-telegram.sql

      - name: Install Playwright + browsers
        working-directory: tests/e2e
        run: |
          npm ci
          node check-admission-retry.mjs
          npx playwright install --with-deps chromium webkit

      - name: Validate the existing safe artifact privacy contract for client scenarios
        id: artifact-privacy-controls
        if: ${{ matrix.group == 'client' }}
        working-directory: tests/e2e
        env:
          RCT_E2E_CONTROL_RECEIPT_PATH: ${{ runner.temp }}/rct-artifact-privacy-client-${{ github.run_id }}-${{ github.run_attempt }}.safe.json
        run: |
          umask 077
          test ! -e "$RCT_E2E_CONTROL_RECEIPT_PATH" && test ! -L "$RCT_E2E_CONTROL_RECEIPT_PATH"
          if npm run test:artifact-privacy; then privacy_status=0; else privacy_status=$?; fi
          python3 - "$privacy_status" <<'PY_PRIVACY_RECEIPT'
          import json, os, re, stat, sys
          from pathlib import Path

          def receipt_pairs(items):
              value = {}
              for key, item in items:
                  if key in value:
                      raise ValueError('Duplicate receipt field')
                  value[key] = item
              return value

          def closed_privacy_receipt(value):
              def flags(item, keys):
                  return (type(item) is dict and set(item) == set(keys)
                          and all(type(item[key]) is bool for key in keys))
              def boundary(item):
                  keys = {'stage', 'markerAbsent', 'failureRetained', 'attachmentNotYetCreated', 'interrupted'}
                  return (item is None or (type(item) is dict and set(item) == keys
                          and item['stage'] == 'AUTOMATIC_CONTEXT_BEFORE_ATTACHMENT'
                          and flags({key: item[key] for key in keys - {'stage'}}, keys - {'stage'})))
              if type(value) is not dict or value.get('browser') != 'NOT_STARTED':
                  return False
              if value.get('state') == 'CONTROL_EXECUTION_ERROR':
                  return set(value) == {'state', 'rawErrorSuppressed', 'browser'} and value['rawErrorSuppressed'] is True
              boolean_keys = {'markerAbsent', 'originalMetadataLeakReproduced', 'expectedFailureRetained',
                              'successRetained', 'interruptionPassed', 'missingGuardRejectedBeforeOperation'}
              keys = boolean_keys | {'state', 'normalChildStatus', 'producerBoundary', 'interruptedChildStatus',
                                     'interruptedChildSignal', 'interruptionBoundary', 'browser'}
              if (set(value) not in (keys, keys | {'guardControl'})
                      or value['state'] not in {'PRIVACY_BOUNDARIES_PASSED', 'PRIVACY_CONTROL_FAILED'}
                      or not all(type(value[key]) is bool for key in boolean_keys)
                      or not boundary(value['producerBoundary']) or not boundary(value['interruptionBoundary'])
                      or value['interruptedChildSignal'] not in {None, 'SIGTERM', 'SIGKILL', 'SIGINT', 'SIGABRT', 'SIGSEGV'}
                      or any(value[key] is not None and (type(value[key]) is not int or not 0 <= value[key] <= 255)
                             for key in ('normalChildStatus', 'interruptedChildStatus'))):
                  return False
              guard_keys = {'canonicalReporterAccepted', 'sameBasenameAlternateRejected', 'extraReporterRejected',
                            'traceRejected', 'videoRejected', 'screenshotRejected', 'missingSnapshotGuardRejected',
                            'wrongSnapshotGuardRejected'}
              return 'guardControl' not in value or flags(value['guardControl'], guard_keys)

          run, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
          assert re.fullmatch('[1-9][0-9]{0,19}', run) and re.fullmatch('[1-9][0-9]{0,5}', attempt)
          path = Path(os.environ['RCT_E2E_CONTROL_RECEIPT_PATH'])
          assert path == Path(os.environ['RUNNER_TEMP']) / ('rct-artifact-privacy-client-' + run + '-' + attempt + '.safe.json')
          with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW), 'rb') as receipt:
              info = os.fstat(receipt.fileno())
              assert (stat.S_ISREG(info.st_mode) and stat.S_IMODE(info.st_mode) == 0o600
                      and info.st_uid == os.getuid() and 0 < info.st_size <= 4096)
              payload = receipt.read(4097)
              assert len(payload) == info.st_size and closed_privacy_receipt(json.loads(payload, object_pairs_hook=receipt_pairs))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('safe_receipt=true\n')
          raise SystemExit(int(sys.argv[1]))
          PY_PRIVACY_RECEIPT

      - name: Upload only the closed existing privacy control receipt
        if: ${{ always() && steps.artifact-privacy-controls.outcome != 'skipped' && steps.artifact-privacy-controls.outputs.safe_receipt == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: artifact-privacy-safe-client-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rct-artifact-privacy-client-${{ github.run_id }}-${{ github.run_attempt }}.safe.json
          if-no-files-found: error
          retention-days: 7

      # Worker script validation needs actual certificate trust, independently of page error handling.
      - name: Trust the disposable localhost certificate for Chromium workers
        id: e2e-ready
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libnss3-tools
          python3 - <<'PY_TRUST'
          import hashlib, os, re, ssl, stat, subprocess
          from pathlib import Path
          if os.environ.get('RUNNER_ENVIRONMENT') != 'github-hosted':
              raise SystemExit('Test certificate trust requires a disposable GitHub-hosted runner')
          cert = Path('tests/e2e/infra/certs/server.crt')
          info = cert.lstat()
          if not stat.S_ISREG(info.st_mode) or cert.is_symlink() or info.st_size > 16384:
              raise SystemExit('Expected bounded generated public test certificate')
          # Chromium M146+ uses this path, retaining an existing legacy database if present.
          legacy = Path.home() / '.pki/nssdb'
          database = legacy if legacy.exists() else Path.home() / '.local/share/pki/nssdb'
          if database.is_symlink():
              raise SystemExit('Test certificate database must not be a link')
          database.mkdir(parents=True, exist_ok=True, mode=0o700)
          nickname = 'rct-e2e-localhost-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          db_args = ['certutil', '-d', 'sql:' + str(database)]
          def run(args):
              result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=30)
              if result.returncode:
                  raise SystemExit('Disposable test certificate trust operation failed')
              return result.stdout
          if not (database / 'cert9.db').exists():
              run([*db_args, '-N', '--empty-password'])
          # Trust this self-signed server as a peer, not as a CA for other servers.
          run([*db_args, '-A', '-t', 'P,,', '-n', nickname, '-i', str(cert)])
          exported = run([*db_args, '-L', '-n', nickname, '-a']).decode('ascii')
          pem = re.search(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----', exported, re.S)
          if not pem or hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem[0])).digest() != hashlib.sha256(ssl.PEM_cert_to_DER_cert(cert.read_text())).digest():
              raise SystemExit('Disposable trusted certificate identity mismatch')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RCT_E2E_NSS_DB=' + str(database) + '\nRCT_E2E_NSS_NICKNAME=' + nickname + '\n')
          print('PASS exact disposable localhost peer certificate trusted; TLS validation retained')
          PY_TRUST

