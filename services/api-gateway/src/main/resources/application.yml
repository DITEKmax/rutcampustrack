server:
  port: 8080

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 12MB

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:rct_dev_pass}
      timeout: 1s
      connect-timeout: 1s

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "${CORS_ALLOWED_ORIGIN:http://localhost:5173}"
              - "http://localhost:5173"
              - "http://localhost:80"
              - "http://localhost:5174"
              - "http://localhost:3000"
              - "http://localhost:4200"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        - id: auth-service
          uri: http://auth-service:9090
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: academic-service
          uri: http://academic-service:9091
          predicates:
            - Path=/api/academic/**
          filters:
            - StripPrefix=1

        - id: schedule-service
          uri: http://schedule-service:9092
          predicates:
            - Path=/api/schedule/**
          filters:
            - StripPrefix=1

        - id: attendance-service
          uri: http://attendance-service:9093
          predicates:
            - Path=/api/attendance/**
          filters:
            - StripPrefix=1

        - id: notification-web
          uri: http://notification-web:9094
          predicates:
            - Path=/api/ws/**
          filters:
            - StripPrefix=1

        - id: notification-push
          uri: http://notification-web:9094
          predicates:
            - Path=/api/push/**
          filters:
            - StripPrefix=1

        - id: auth-service-openapi
          uri: http://auth-service:9090
          predicates:
            - Path=/openapi/auth-service
          filters:
            - RewritePath=/openapi/auth-service, /api-docs

        - id: academic-service-openapi
          uri: http://academic-service:9091
          predicates:
            - Path=/openapi/academic-service
          filters:
            - RewritePath=/openapi/academic-service, /api-docs

        - id: schedule-service-openapi
          uri: http://schedule-service:9092
          predicates:
            - Path=/openapi/schedule-service
          filters:
            - RewritePath=/openapi/schedule-service, /api-docs

        - id: attendance-service-openapi
          uri: http://attendance-service:9093
          predicates:
            - Path=/openapi/attendance-service
          filters:
            - RewritePath=/openapi/attendance-service, /api-docs

springdoc:
  enable-native-support: true
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /openapi/auth-service
        name: Auth Service
      - url: /openapi/academic-service
        name: Academic Service
      - url: /openapi/schedule-service
        name: Schedule Service
      - url: /openapi/attendance-service
        name: Attendance Service

gateway:
  auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:9090}

rutcampustrack:
  security:
    internal-issuer-client:
      # M03a token-exchange — must match auth-service INTERNAL_ISSUER_SECRET
      auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:9090}
      secret: ${INTERNAL_ISSUER_SECRET:dev-internal-issuer-secret-32-bytes-for-local-testing-only}
      cache-ttl-seconds: 240     # Gateway cache < auth-service TTL (300) with safety margin
      cache-max-size: 10000
      timeout-millis: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    ru.rutcampustrack: DEBUG
