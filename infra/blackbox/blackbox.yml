modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_http_versions:
      - HTTP/1.1
      - HTTP/2.0
      valid_status_codes: []
      method: GET
      follow_redirects: true
      fail_if_ssl: false
      fail_if_not_ssl: true
      tls_config:
        insecure_skip_verify: false
  actuator_readiness:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      method: GET
      valid_status_codes:
      - 200
      follow_redirects: false
      fail_if_body_not_matches_regexp:
      - '"status"\s*:\s*"UP"'
