server:
  port: 9090

spring:
  application:
    name: auth-service

  data:
    redis:
      host: redis
      port: 6379

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  access-token-expiration: 900        # 15 минут
  refresh-token-expiration: 604800    # 7 дней

logging:
  level:
    ru.rutcampustrack: DEBUG
