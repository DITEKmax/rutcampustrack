# Pre-commit hooks. Install once:
#   pwsh -NoProfile -File scripts/Install-CommitHooks.ps1
# Triggers on every `git commit`. Matches server-side Gitleaks (security.yml)
# as local-first defense — ловим секреты до push'а, не после.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      - id: gitleaks
        name: Gitleaks secret detection
        description: Detect hardcoded secrets before commit

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: ['--allow-multiple-documents']
        exclude: '(^|/)(helm|k8s)/.*\.ya?ml$' # helm templates render invalid YAML
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: end-of-file-fixer
        exclude: '(^|/)(node_modules|build|dist|\.gradle|\.planning)/.*$|^docs/archive/agent-instructions/2026-09-05/(?:frontends/|services/|tests/)?AGENTS\.md\.inactive$|^docs/archive/database-overview/2026-10-11/DATABASES_OVERVIEW\.md$'
      - id: trailing-whitespace
        exclude: '(^|/)(node_modules|build|dist|\.gradle|\.planning)/.*$|^docs/archive/agent-instructions/2026-09-05/(?:frontends/|services/|tests/)?AGENTS\.md\.inactive$|^docs/archive/database-overview/2026-10-11/DATABASES_OVERVIEW\.md$'
