server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets (JS/CSS/fonts/images with content hash in filename) — cache forever.
    # MUST be evaluated BEFORE location / so the no-store header from the SPA
    # fallback doesn't leak into hashed bundles.
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff|woff2|eot|ttf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Explicit /index.html — never cache.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
    }

    # SPA fallback — every unknown route returns index.html.
    # Headers here ALSO apply when nginx serves index.html via try_files
    # for routes like /headman/schedule (otherwise location = /index.html
    # never matches and the browser heuristic-caches the HTML — exactly the
    # bug we hit on stale chunks).
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
        try_files $uri $uri/ /index.html;
    }
}
