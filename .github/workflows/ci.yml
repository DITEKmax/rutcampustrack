          mkdir -m 700 -- "$RCT_REMAINING5_RUN"
          mkdir -m 700 -- "$RCT_REMAINING5_RUN/artifacts"
          npx playwright test --config playwright.real-mobile.config.ts --project=webkit

      - name: Upload closed WebKit outcomes
        if: always() && steps.webkit-subset.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: webkit-safe-${{ github.run_attempt }}
          path: ${{ env.RCT_WEBKIT_RUN }}/artifacts/safe-results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Run the real production worker update and install logic
        id: worker-lifecycle
        timeout-minutes: 5
        if: ${{ matrix.group == 'client' && !cancelled() && steps.e2e-ready.outcome == 'success' }}
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: https://localhost:8443
          RCT_E2E_SYNTHETIC_SEED: 'true'
          RCT_E2E_REMAINING5: 'true'
