spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

grpc:
  server:
    port: -1
  client:
    schedule-service:
      address: static://localhost:19092
      negotiation-type: plaintext
    academic-service:
      address: static://localhost:19091
      negotiation-type: plaintext

rutcampustrack:
  security:
    internal-jwt:
      auth-service-url: http://localhost:9999
      public-key-refresh-minutes: 60
      clock-skew-seconds: 30
      legacy-headers-enabled: true
