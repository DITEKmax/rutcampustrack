                          http = re.fullmatch(r'HTTP_[1-5][0-9]{2}', status) is not None
                          if not ((stage == 'AUTH_HTTP' and http and status != 'HTTP_200')
                                  or (stage == 'AUTH_RESPONSE' and status == 'HTTP_200')
                                  or (stage == 'CURRENT_CONTEXT' and rpc)
                                  or (stage in {'SCHEDULE_PREVIEW', 'ATTENDANCE_PREVIEW'} and (rpc or status == 'NONE'))
                                  or (stage in {'REQUEST_BUILD', 'AUTH_TRANSPORT', 'EXPECTATIONS',
                                                'FORWARDED_IDENTITY', 'ECHO_FENCE', 'ACADEMIC_DIGEST',
                                                'SCHEDULE_DIGEST', 'ATTENDANCE_DIGEST', 'COUNTS'} and status == 'NONE')):
