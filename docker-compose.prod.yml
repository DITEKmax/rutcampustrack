        condition: service_healthy
    # M09 G7 (NEW-157).
    mem_limit: 512m
    mem_reservation: 384m
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9092/actuator/health || exit 1']
