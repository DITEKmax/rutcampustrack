name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '.planning/**'
      - '*.md'
      - 'SECURITY.md'
      - 'renovate.json'
      - '.pre-commit-config.yaml'
  pull_request:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '.planning/**'
      - '*.md'
      - 'SECURITY.md'
      - 'renovate.json'
      - '.pre-commit-config.yaml'

jobs:
  java-unit-test:
    name: Java unit — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            path: ':services:api-gateway'
          - name: auth-service
            path: ':services:auth-service:auth-app'
          - name: academic-service
            path: ':services:academic-service:academic-app'
          - name: schedule-service
            path: ':services:schedule-service:schedule-app'
          - name: attendance-service
            path: ':services:attendance-service:attendance-app'
          - name: notification-service
            path: ':services:notification-service:notification-app'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # M08 Группа 1 (P2-8/1) — только unit (*Test), БЕЗ *IT.
      # Быстрая jobs, блокирующая PR при базовых регрессиях.
      - name: Warm Gradle wrapper
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then
              exit 0
            fi
            echo "Gradle wrapper download failed, retrying in $((attempt * 10))s ($attempt/3)"
            sleep $((attempt * 10))
          done
          ./gradlew --version --no-daemon

      - name: Unit tests ${{ matrix.service.name }}
        id: java-tests
        run: ./gradlew ${{ matrix.service.path }}:test --no-daemon

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ matrix.service.name }}
          path: |
            services/**/build/reports/tests/test/
            services/**/build/test-results/test/
          retention-days: 7

      - name: Collect safe unit outcomes
        if: always()
        env:
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RCT_CI_EVENT_NAME: ${{ github.event_name }}
          RCT_CI_RUN_ID: ${{ github.run_id }}
          RCT_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          RCT_CI_JOB_ID: ${{ github.job }}
          RCT_CI_TEST_OUTCOME: ${{ steps.java-tests.outcome }}
        run: python3 scripts/collect-ci-test-outcomes.py --service '${{ matrix.service.name }}' --task test

      - name: Upload safe unit outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-unit-outcomes-${{ matrix.service.name }}-${{ github.run_attempt }}
          path: build/ci-test-outcomes/${{ matrix.service.name }}/test/safe-outcomes.json
          if-no-files-found: error
          retention-days: 7

  java-integration-test:
    name: Java IT — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    # Integration tests независимы от unit job'ов (separate pipelines,
    # fail-fast на уровне jobs). Параллельный запуск ускоряет wall-time.
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            path: ':services:api-gateway'
          - name: auth-service
            path: ':services:auth-service:auth-app'
          - name: academic-service
            path: ':services:academic-service:academic-app'
          - name: schedule-service
            path: ':services:schedule-service:schedule-app'
          - name: attendance-service
            path: ':services:attendance-service:attendance-app'
          - name: notification-service
            path: ':services:notification-service:notification-app'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # M08 Группа 1 (P2-8/1) — только *IT (Spring context + Testcontainers).
      # Gradle filter в root build.gradle.kts.
      - name: Warm Gradle wrapper
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then
              exit 0
            fi
            echo "Gradle wrapper download failed, retrying in $((attempt * 10))s ($attempt/3)"
            sleep $((attempt * 10))
          done
          ./gradlew --version --no-daemon

      - name: Setup Python for Academic credential bridge
        if: matrix.service.name == 'academic-service'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            services/notification-bot/requirements.txt
            services/notification-bot/requirements-test.txt

      - name: Install isolated Academic credential bridge dependencies
        if: matrix.service.name == 'academic-service'
        run: |
          python -m venv "$RUNNER_TEMP/np01-python"
          "$RUNNER_TEMP/np01-python/bin/python" -m pip install -r services/notification-bot/requirements.txt -r services/notification-bot/requirements-test.txt
          echo "NP01_PYTHON_EXECUTABLE=$RUNNER_TEMP/np01-python/bin/python" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"

      - name: Integration tests ${{ matrix.service.name }}
        id: java-tests
        run: ./gradlew ${{ matrix.service.path }}:integrationTest --no-daemon

      - name: Upload integration test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports-${{ matrix.service.name }}
          path: |
            services/**/build/reports/integrationTest/
            services/**/build/test-results/integrationTest/
          retention-days: 7

      - name: Collect safe integration outcomes
        if: always()
        env:
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RCT_CI_EVENT_NAME: ${{ github.event_name }}
          RCT_CI_RUN_ID: ${{ github.run_id }}
          RCT_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          RCT_CI_JOB_ID: ${{ github.job }}
          RCT_CI_TEST_OUTCOME: ${{ steps.java-tests.outcome }}
        run: python3 scripts/collect-ci-test-outcomes.py --service '${{ matrix.service.name }}' --task integrationTest

      - name: Upload safe integration outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-integration-outcomes-${{ matrix.service.name }}-${{ github.run_attempt }}
          path: build/ci-test-outcomes/${{ matrix.service.name }}/integrationTest/safe-outcomes.json
          if-no-files-found: error
          retention-days: 7

  java-verification:
    name: Java verification (verifyNoDebugInProd + verifyLogbackJsonInAllServices)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Lightweight verification tasks (не зависит от тестов).
      - name: Warm Gradle wrapper
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then
              exit 0
            fi
            echo "Gradle wrapper download failed, retrying in $((attempt * 10))s ($attempt/3)"
            sleep $((attempt * 10))
          done
          ./gradlew --version --no-daemon

      - name: Run verification tasks
        run: ./gradlew verifyNoDebugInProd verifyLogbackJsonInAllServices --no-daemon

  python-lint-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            services/notification-bot/requirements.txt
            services/notification-bot/requirements-test.txt

      - name: Install dependencies
        run: |
          pip install ruff==0.17.0
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest tests/ -v

  mobile-vue-build-test:
    name: Mobile Vue workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'npm'
          cache-dependency-path: frontends/package-lock.json
      - name: Install, contract checks, type checks, worker checks, build
        working-directory: frontends
        run: |
          npm ci
          npm run generate:types:check
          npm run generate:auth-types:check
          npm run generate:academic-schedule-types:check
          npm run test:contract
          npm run typecheck:foundation
          npm run typecheck
          node --test pwa-vue/tests/*.test.mjs
          npm run build
  # M13 G15 — ShellCheck lint для всех bash-скриптов.
  # Gate на ошибки уровня `error` и `warning`; `info`/`style` не блочат.
  shellcheck:
    name: ShellCheck scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts/*.sh
        run: shellcheck --severity=warning scripts/*.sh

  # M13 G17 — структурная валидация Grafana dashboard JSON-файлов.
  # Catch'ит broken JSON / missing uid|title / 0 panels до VPS deploy.
  # Live smoke (non-zero данные) deferred в G23 VPS dry-run.
  grafana-dashboards:
    name: Grafana dashboards structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dashboards
        run: bash scripts/validate-grafana-dashboards.sh

  # Current PWA/TMA Vue auth against the isolated backend stack.
  e2e-auth:
    name: Playwright E2E auth flow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      # M13 G25.3 — buildx нужен для BuildKit cache mount
      # (`--mount=type=cache,target=/root/.gradle` в backend Dockerfile'ах).
      # Default docker driver игнорирует cache mounts → каждый build
      # повторно скачивает Gradle dependencies (+5-10 мин на CI).
      # Frontend bundles — Docker multi-stage сам делает npm ci/build,
      # ничего pre-build не нужно.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # M13 G25.3 — self-signed TLS cert для reverse-proxy nginx.
      # AuthCookies.java выставляет `Secure` flag → на чистом HTTP browser
      # cookie отбрасывает → T1 spec падает. TLS termination на e2e nginx
      # обходит проблему без изменения production code.
      - name: Generate self-signed TLS cert
        run: bash tests/e2e/infra/scripts/generate-test-certs.sh

      - name: Boot isolated Vue auth stack
        run: |
          docker compose --env-file tests/e2e/.env.ci -p rct-e2e -f docker-compose.e2e.yml config --quiet
          docker compose --env-file tests/e2e/.env.ci -p rct-e2e -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 480

      - name: Link synthetic Telegram teacher in the ephemeral database
        run: |
          docker compose --env-file tests/e2e/.env.ci -p rct-e2e -f docker-compose.e2e.yml exec -T postgres-academic \
            psql -U rct_user -d academic_db -v ON_ERROR_STOP=1 \
            < tests/e2e/infra/seed-telegram.sql

      - name: Install Playwright + browsers
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run auth-flow @smoke specs (chromium only)
        working-directory: tests/e2e
        env:
          # M13 G25.3 — HTTPS через self-signed cert на reverse-proxy
          # nginx. ignoreHTTPSErrors=true в playwright.config.ts.
          E2E_BASE_URL: https://localhost:8443
          CI: 'true'
        run: npx playwright test specs/auth-token-lifecycle.spec.ts specs/mini-app.spec.ts --project=chromium --grep @smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Dump docker logs on failure
        if: failure()
        run: |
          mkdir -p docker-logs
          # `ps --services` без флагов выводит только running сервисы — exited
          # контейнеры (Mongo crash на старте) пропадают. `config --services`
          # возвращает все сервисы из compose-файла, гарантирует полный snapshot.
          for c in $(docker compose --env-file tests/e2e/.env.ci -p rct-e2e -f docker-compose.e2e.yml config --services); do
            docker compose --env-file tests/e2e/.env.ci -p rct-e2e -f docker-compose.e2e.yml logs --no-color "$c" > "docker-logs/$c.log" 2>&1 || true
          done
          # Дополнительно — `docker compose ps -a` для exit codes / health.
          docker compose --env-file tests/e2e/.env.ci -p rct-e2e -f docker-compose.e2e.yml ps -a > docker-logs/_compose-ps.txt 2>&1 || true

      - name: Upload docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-logs/
          retention-days: 7

      - name: Stop isolated e2e containers
        if: always()
        run: docker compose --env-file tests/e2e/.env.ci -p rct-e2e -f docker-compose.e2e.yml down
