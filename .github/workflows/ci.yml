                                          or (failure['unknownReason'] in {'LOG_READ', 'LOG_BYTE_LIMIT', 'LOG_RECORD_SHAPE', 'NO_MATCHING_WARN', 'TARGET_TEMPLATE', 'TARGET_CORRELATION', 'MATCH_COUNT_LIMIT', 'NO_REQUEST', 'LOG_FORMAT', 'LOG_TAIL_LIMIT'}
                                              and failure['matchedCount'] == 0))):
                              raise ValueError('Invalid closed reconciliation readiness refusal')
                      elif failure['state'] == 'REPORTED':
                          last = failure['last']
                          sources = {'GATEWAY_ISSUER_CLIENT': {'REQUEST_BUILD', 'AUTH_HTTP', 'AUTH_RESPONSE', 'AUTH_TRANSPORT'}, 'GATEWAY_ISSUER_FILTER': {'FORWARDED_IDENTITY', 'EXPECTATIONS'}, 'ACADEMIC_CONTEXT': {'CURRENT_CONTEXT'}, 'SCHEDULE_CLIENT': {'SCHEDULE_PREVIEW'}, 'ACADEMIC_PREVIEW': {'ATTENDANCE_DIGEST', 'ATTENDANCE_PREVIEW', 'ECHO_FENCE', 'ACADEMIC_DIGEST', 'COUNTS', 'SCHEDULE_DIGEST'}}
                          if value['schema'] in ('semester-reconciliation.v10', 'semester-reconciliation.v11'):
                              if (type(last) is not dict or set(last) != {
                                      'source', 'stage', 'status', 'cause', 'scheduleTransport'}):
                                  raise ValueError('Invalid closed reconciliation schedule transport shape')
                              observed = last['scheduleTransport']
                              caught_schedule = (last['source'] == 'SCHEDULE_CLIENT'
                                  and last['stage'] == 'SCHEDULE_PREVIEW'
                                  and not (last['status'] == 'NONE' and last['cause'] == 'INVALID_ARGUMENT'))
                              if caught_schedule:
                                  if (type(observed) is not dict or set(observed) != {
