management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # M04 QA6: prod не переопределяет — default уже always.
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# The Schedule binding contract is admitted only over TLS. The trust bundle
# and authority are explicit deployment inputs; no prod plaintext fallback.
grpc:
  server:
    security:
      enabled: true
      certificate-chain: ${ACADEMIC_GRPC_CERTIFICATE_CHAIN}
      private-key: ${ACADEMIC_GRPC_PRIVATE_KEY}
  client:
    schedule-service:
      negotiation-type: TLS
      security:
        trust-cert-collection: ${SCHEDULE_GRPC_TRUST_CERT_COLLECTION}
        authority-override: ${SCHEDULE_GRPC_TLS_AUTHORITY:schedule-service}
