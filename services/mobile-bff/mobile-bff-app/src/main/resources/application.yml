server:
  tomcat:
    mbeanregistry:
      enabled: true
  port: ${MOBILE_BFF_PORT:9080}

spring:
  application:
    name: mobile-bff
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 24MB

grpc:
  server:
    # Opt-in private listener. Directed credentials are never accepted without TLS.
    port: ${MOBILE_BFF_BOT_GRPC_PORT:-1}
    address: ${MOBILE_BFF_BOT_GRPC_BIND_ADDRESS:127.0.0.1}
    reflection-service-enabled: false
    security:
      enabled: true
      certificate-chain: ${MOBILE_BFF_BOT_GRPC_CERTIFICATE_CHAIN:}
      private-key: ${MOBILE_BFF_BOT_GRPC_PRIVATE_KEY:}
  service-identity:
    bot-to-mobile-bff-token: ${BOT_TO_READ_SERVICE_TOKEN:}
    mobile-bff-to-auth-token: ${MOBILE_BFF_TO_AUTH_SERVICE_TOKEN:}
    mobile-bff-to-academic-token: ${MOBILE_BFF_TO_ACADEMIC_SERVICE_TOKEN:}
    mobile-bff-to-attendance-token: ${MOBILE_BFF_TO_ATTENDANCE_SERVICE_TOKEN:}
    mobile-bff-to-schedule-token: ${MOBILE_BFF_TO_SCHEDULE_SERVICE_TOKEN:}
  auth:
    secret: ${GRPC_SECRET:}
  client:
    bot-read-auth:
      address: ${BOT_READ_AUTH_GRPC_ADDRESS:dns:///auth-service:19090}
      negotiation-type: TLS
      security:
        authority-override: ${BOT_READ_AUTH_GRPC_AUTHORITY:auth-service}
        trust-cert-collection: ${BOT_READ_AUTH_GRPC_CA_PATH:}
    bot-read-academic:
      address: ${BOT_READ_ACADEMIC_GRPC_ADDRESS:dns:///academic-service:19091}
      negotiation-type: TLS
      security:
        authority-override: ${BOT_READ_ACADEMIC_GRPC_AUTHORITY:academic-service}
        trust-cert-collection: ${BOT_READ_ACADEMIC_GRPC_CA_PATH:}
    bot-read-attendance:
      address: ${BOT_READ_ATTENDANCE_GRPC_ADDRESS:dns:///attendance-service:19093}
      negotiation-type: TLS
      security:
        authority-override: ${BOT_READ_ATTENDANCE_GRPC_AUTHORITY:attendance-service}
        trust-cert-collection: ${BOT_READ_ATTENDANCE_GRPC_CA_PATH:}
    bot-read-schedule:
      address: ${BOT_READ_SCHEDULE_GRPC_ADDRESS:dns:///schedule-service:19092}
      negotiation-type: TLS
      security:
        authority-override: ${BOT_READ_SCHEDULE_GRPC_AUTHORITY:schedule-service}
        trust-cert-collection: ${BOT_READ_SCHEDULE_GRPC_CA_PATH:}
    attendance-service:
      address: ${ATTENDANCE_GRPC_ADDRESS:dns:///attendance-service:19093}
      negotiation-type: plaintext
      max-inbound-message-size: 25165824
    schedule-service:
      address: ${SCHEDULE_GRPC_ADDRESS:dns:///schedule-service:19092}
      negotiation-type: plaintext
    academic-service:
      address: ${ACADEMIC_GRPC_ADDRESS:dns:///academic-service:19091}
      negotiation-type: plaintext

rutcampustrack:
  security:
    internal-jwt:
      auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:9090}
      public-key-refresh-minutes: 60
      clock-skew-seconds: 30
      legacy-headers-enabled: false
      expected-issuer: rutcampustrack-auth
      expected-audience: rutcampustrack-internal
      header-name: X-Internal-Token

springdoc:
  api-docs:
    path: /api-docs
    version: OPENAPI_3_0

management:
  tracing:
    sampling:
      probability: 1.0
    baggage:
      remote-fields: requestId
      tag-fields: requestId
      correlation:
        fields: requestId
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 2s,3s,30s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
