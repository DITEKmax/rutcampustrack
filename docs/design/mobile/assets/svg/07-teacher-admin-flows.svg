<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">

    <defs>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#9E7AFF"/>
        <stop offset="1" stop-color="#6D28D9"/>
      </linearGradient>
      <linearGradient id="accentSoft" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#6D28D9" stop-opacity=".72"/>
        <stop offset="1" stop-color="#9E7AFF" stop-opacity=".16"/>
      </linearGradient>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.5" fill="#9E7AFF" opacity=".18"/>
      </pattern>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".42"/>
      </filter>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="24" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#9E7AFF"/>
      </marker>
      <style>
        text { font-family: Onest, 'DejaVu Sans', Arial, sans-serif; }
      </style>
    </defs>
    
<rect width="1600" height="1000" fill="#0B0B0C"/>
<circle cx="1500" cy="40" r="250" fill="#6D28D9" opacity=".06"/>
<rect x="0" y="0" width="1600" height="1000" fill="url(#dots)" opacity=".45"/>
<text x="64" y="76" fill="#F6F4FA" font-size="32" font-weight="650">Преподаватель и администратор: разные мобильные обещания</text>
<text x="64" y="112" fill="#C8C2D6" font-size="17">Преподаватель читает контекст; администратор мониторит и делает точечные изменения</text>
<rect x="60" y="150" width="710" height="730" rx="32" fill="#1C1922" stroke="#565061" stroke-width="1" opacity="1" />
<text x="92" y="198" text-anchor="start" fill="#F6F4FA" font-size="24" font-weight="700"><tspan x="92" dy="0">Преподаватель · между парами</tspan></text>
<rect x="100" y="270" width="180" height="120" rx="22" fill="url(#accentSoft)" stroke="#9E7AFF" stroke-width="1.4" opacity="1" filter="url(#shadow)"/>
<text x="124" y="306" text-anchor="start" fill="#F6F4FA" font-size="19" font-weight="650"><tspan x="124" dy="0">Сегодня</tspan></text>
<text x="124" y="338" text-anchor="start" fill="#C8C2D6" font-size="15" font-weight="420"><tspan x="124" dy="0">Текущая/следующая</tspan><tspan x="124" dy="21">пара</tspan></text>
<rect x="320" y="270" width="180" height="120" rx="22" fill="#1C1922" stroke="#565061" stroke-width="1.4" opacity="1" />
<text x="344" y="306" text-anchor="start" fill="#F6F4FA" font-size="19" font-weight="650"><tspan x="344" dy="0">Пара</tspan></text>
<text x="344" y="338" text-anchor="start" fill="#C8C2D6" font-size="15" font-weight="420"><tspan x="344" dy="0">Ростер read-only</tspan></text>
<rect x="540" y="270" width="180" height="120" rx="22" fill="#1C1922" stroke="#565061" stroke-width="1.4" opacity="1" />
<text x="564" y="306" text-anchor="start" fill="#F6F4FA" font-size="19" font-weight="650"><tspan x="564" dy="0">Студент</tspan></text>
<text x="564" y="338" text-anchor="start" fill="#C8C2D6" font-size="15" font-weight="420"><tspan x="564" dy="0">Факты и причина</tspan><tspan x="564" dy="21">“у”</tspan></text>
<polyline points="280,330 320,330" fill="none" stroke="#9E7AFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="500,330 540,330" fill="none" stroke="#9E7AFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="100" y="480" width="240" height="140" rx="22" fill="#1C1922" stroke="#565061" stroke-width="1.4" opacity="1" />
<text x="124" y="516" text-anchor="start" fill="#F6F4FA" font-size="19" font-weight="650"><tspan x="124" dy="0">Учёт</tspan></text>
<text x="124" y="548" text-anchor="start" fill="#C8C2D6" font-size="15" font-weight="420"><tspan x="124" dy="0">Группа + предмет</tspan><tspan x="124" dy="21">compact student list</tspan></text>
<rect x="410" y="480" width="300" height="140" rx="22" fill="url(#accentSoft)" stroke="#9E7AFF" stroke-width="1.4" opacity="1" filter="url(#shadow)"/>
<text x="434" y="516" text-anchor="start" fill="#F6F4FA" font-size="19" font-weight="650"><tspan x="434" dy="0">Статистика</tspan></text>
<text x="434" y="548" text-anchor="start" fill="#C8C2D6" font-size="15" font-weight="420"><tspan x="434" dy="0">Люди / группы</tspan><tspan x="434" dy="21">четыре метрики + абсолюты</tspan></text>
<polyline points="340,550 410,550" fill="none" stroke="#9E7AFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="100" y="690" text-anchor="start" fill="#C8C2D6" font-size="15" font-weight="450"><tspan x="100" dy="0">MainButton обычно не нужен: у роли почти нет commit-действий.</tspan><tspan x="100" dy="22">Фильтры применяются сразу, отчёт запускается inline.</tspan></text>
<rect x="100" y="790" width="610" height="38" rx="19.0" fill="#292531" stroke="#E24A4A" stroke-width="1" opacity="1" /><text x="405.0" y="814.0" text-anchor="middle" fill="#E24A4A" font-size="14" font-weight="600"><tspan x="405.0" dy="0">Никогда не показывать преподавателю</tspan><tspan x="405.0" dy="18">контрол отметки</tspan></text>
<rect x="830" y="150" width="710" height="730" rx="32" fill="#1C1922" stroke="#565061" stroke-width="1" opacity="1" />
<text x="862" y="198" text-anchor="start" fill="#F6F4FA" font-size="24" font-weight="700"><tspan x="862" dy="0">Администратор · triage на телефоне</tspan></text>
<rect x="870" y="270" width="180" height="120" rx="22" fill="url(#accentSoft)" stroke="#9E7AFF" stroke-width="1.4" opacity="1" filter="url(#shadow)"/>
<text x="894" y="306" text-anchor="start" fill="#F6F4FA" font-size="19" font-weight="650"><tspan x="894" dy="0">Обзор</tspan></text>
<text x="894" y="338" text-anchor="start" fill="#C8C2D6" font-size="15" font-weight="420"><tspan x="894" dy="0">Счётчики +</tspan><tspan x="894" dy="21">исключения</tspan></text>
<rect x="1090" y="270" width="180" height="120" rx="22" fill="#1C1922" stroke="#565061" stroke-width="1.4" opacity="1" />
<text x="1114" y="306" text-anchor="start" fill="#F6F4FA" font-size="19" font-weight="650"><tspan x="1114" dy="0">Люди</tspan></text>
<text x="1114" y="338" text-anchor="start" fill="#C8C2D6" font-size="15" font-weight="420"><tspan x="1114" dy="0">Поиск + карточка</tspan></text>
<rect x="1310" y="270" width="180" height="120" rx="22" fill="#1C1922" stroke="#565061" stroke-width="1.4" opacity="1" />
<text x="1334" y="306" text-anchor="start" fill="#F6F4FA" font-size="19" font-weight="650"><tspan x="1334" dy="0">Действие</tspan></text>
<text x="1334" y="338" text-anchor="start" fill="#C8C2D6" font-size="15" font-weight="420"><tspan x="1334" dy="0">Точечное и online</tspan></text>
<polyline points="1050,330 1090,330" fill="none" stroke="#9E7AFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1270,330 1310,330" fill="none" stroke="#9E7AFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="870" y="480" width="620" height="165" rx="24" fill="#292531" stroke="#565061" stroke-width="1" opacity="1" />
<text x="898" y="520" text-anchor="start" fill="#F6F4FA" font-size="18" font-weight="650"><tspan x="898" dy="0">Поверхности</tspan></text>
<text x="898" y="558" text-anchor="start" fill="#C8C2D6" font-size="14" font-weight="450"><tspan x="898" dy="0">PWA: поиск, создание по одному, назначение старосты.</tspan><tspan x="898" dy="21">TMA: обзор и безопасные точечные действия; тяжёлый каскад →</tspan><tspan x="898" dy="21">PWA/desktop.</tspan></text>
<rect x="870" y="690" width="620" height="150" rx="24" fill="#21151A" stroke="#E24A4A" stroke-width="1" opacity="1" />
<text x="898" y="730" text-anchor="start" fill="#E24A4A" font-size="18" font-weight="700"><tspan x="898" dy="0">Не переносить как “полную админку”</tspan></text>
<text x="898" y="764" text-anchor="start" fill="#C8C2D6" font-size="14" font-weight="450"><tspan x="898" dy="0">Массовые реестры, SVG upload/preview, удаление семестра и промоушен требуют</tspan><tspan x="898" dy="21">большого контекста и свежей проверки прав.</tspan></text>
</svg>