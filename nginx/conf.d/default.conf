# Production config — HTTPS termination + reverse proxy
# Requires SSL certificate at /etc/letsencrypt/live/ruttrack.site/

# HTTP -> HTTPS redirect (NET-05)
server {
    listen 80;
    server_name _;

    # ACME challenge MUST come before redirect (Pitfall 3)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server (NET-01, NET-02)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/ruttrack.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruttrack.site/privkey.pem;
    ssl_dhparam         /etc/nginx/dhparam.pem;

    # TLS hardening — TLSv1.2 + TLSv1.3 only (no TLSv1.0/1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # M07 G12 HIGH-1: inline scripts вынесены в assets/js/ — script-src 'self' достаточно.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; font-src 'self';" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # --- Block sensitive file/path access (return 404, not 403 to avoid info leak) ---
    location ~* ^/(\.env|\.git|docker-compose|\.htaccess|\.htpasswd|Dockerfile|\.dockerignore|\.npmrc|\.yarnrc|\.npmignore|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|Makefile|Vagrantfile|\.travis\.yml|\.circleci|\.github|\.gitlab-ci\.yml|\.well-known/(?!acme-challenge)) {
        return 404;
    }

    # --- WebSocket / STOMP (SockJS) for notification-web ---
    location /api/ws/ {
        proxy_pass http://rct-api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # --- Excuse file upload: per-location 25m (M07 G11, P2-9/3) ---
    # Prefix-match выше generic /api/ даёт точечный лимит только для
    # multipart endpoint'а; остальные /api/* наследуют global 2m (nginx.conf).
    # Backend enforce'ит 20MB (Spring Boot), 25m здесь = +5m запас для
    # multipart boundary overhead.
    location /api/attendance/excuses/with-file {
        client_max_body_size 25m;
        proxy_pass http://rct-api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API Gateway: all /api/* traffic (NET-01) ---
    location /api/ {
        proxy_pass http://rct-api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Landing page at /presentation/ (LAND-v9-01, INFRA-v9-02) ---
    location /presentation/ {
        proxy_pass http://rct-landing-nginx:80/;
        proxy_set_header Host $host;
    }

    # --- React PWA at /app/ (INFRA-v9-03) ---
    location /app/ {
        proxy_pass http://rct-pwa-nginx:80/;
        proxy_set_header Host $host;
    }

    # --- Telegram Mini App (NET-02) ---
    location /mini-app/ {
        proxy_pass http://rct-mini-app-nginx:80/;
        proxy_set_header Host $host;
    }

    # --- Swagger UI (Phase 47 — DOC-01) — behind basic auth (IMP-05) ---
    location /swagger-ui.html {
        auth_basic "Dev Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://rct-api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/ {
        auth_basic "Dev Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://rct-api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        auth_basic "Dev Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://rct-api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi/ {
        auth_basic "Dev Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://rct-api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Grafana — behind basic auth ---
    location /grafana/ {
        auth_basic "Dev Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://rct-grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Security-Policy "" always;
    }

    # --- Root redirects to unified /login entry point (INFRA-v9-01) ---
    # /login is resolved by the web-panel Angular SPA (baseHref: /) via the
    # catch-all location / block below. Exact match = / wins over prefix /.
    location = / {
        return 301 /login;
    }

    # --- Web Panel SPA — catch-all (INFRA-v9-04, Phase 50) ---
    # MUST be the last prefix block; more specific prefixes (/api/, /app/,
    # /presentation/, /mini-app/, /swagger-ui*, /v3/api-docs, /openapi/)
    # above win by nginx prefix-match precedence. Exact-match `= /` above
    # still 301-redirects root to /login. This block serves the web-panel
    # SPA for /login, /admin/*, /teacher/*, /student/*, /headman/*.
    #
    # Cache policy: forward Cache-Control set by the inner web-panel nginx
    # (no-store for HTML, immutable for hashed bundles). proxy_pass already
    # passes through upstream headers; we only need to make sure no
    # `add_header` here clobbers them — proxy_hide_header is intentionally
    # NOT used so the SPA stays fully controlled by the inner config.
    location / {
        proxy_pass http://rct-web-panel-nginx:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
