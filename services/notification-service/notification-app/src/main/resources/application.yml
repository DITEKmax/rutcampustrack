server:
  port: 9094
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  application:
    name: notification-web

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:rct_user}
    password: ${RABBITMQ_PASSWORD:rct_dev_pass}

  data:
    mongodb:
      # M10 G1 D3: default БД для local dev = notification_db
      # (notification-web пишет history сюда; prod URI задаётся compose env).
      # M13 G7: ?replicaSet=rs0 для MongoTransactionManager multi-doc transactions
      # (bitnami/mongodb single-node RS).
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/notification_db?replicaSet=rs0}
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:rct_dev_pass}
      timeout: 1s
      connect-timeout: 1s
    web:
      pageable:
        # M10 G9 H2 hot-patch: default 20 оставлен локально; M13 G3 перевёл
        # max-page-size=100 в shared-web PageableDefaultsPostProcessor (общий
        # потолок для всех сервисов).
        default-page-size: 20

notification:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:/keys/public.key}
  # M10 G3 D4 — retention для notification_history (TTL index).
  history:
    ttl-days: ${NOTIFICATION_HISTORY_TTL_DAYS:30}

rutcampustrack:
  security:
    # M14 G4 v2 (CSO HIGH-06): см. shared-web/RequiredSecretsValidator.java.
    # SPRING_DATA_MONGODB_URI содержит password в URI.
    required-env-vars: SPRING_DATA_MONGODB_URI,RABBITMQ_PASSWORD,INTERNAL_ISSUER_SECRET,ALERT_WEBHOOK_SECRET,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY
    internal-jwt:
      # M03a: pull RSA public key from auth-service /auth/public-key.
      auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:9090}
      public-key-refresh-minutes: 60
      clock-skew-seconds: 30
      # M14 G1 (CSO CRIT-01): strict by default — см. academic-app/application.yml.
      legacy-headers-enabled: ${RUTCAMPUSTRACK_SECURITY_LEGACY_HEADERS_ENABLED:false}
  notification:
    ws-ticket:
      # M03b Группа 4: consume WebSocket ticket через auth-service internal API.
      auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:9090}
      internal-issuer-secret: ${INTERNAL_ISSUER_SECRET:dev-internal-issuer-secret-32-bytes-for-local-testing-only}
  alert:
    # M04 Группа 9: shared secret между Alertmanager webhook и /internal/alert.
    # Alertmanager заливает его в /etc/alertmanager/secret (см. docker-compose
    # entrypoint). M06 заменит на mTLS — тогда этот property можно удалить.
    webhook-secret: ${ALERT_WEBHOOK_SECRET:dev_alert_secret}

vapid:
  public-key: ${VAPID_PUBLIC_KEY:}
  private-key: ${VAPID_PRIVATE_KEY:}
  subject: ${VAPID_SUBJECT:mailto:noreply@rut.ru}

# M05 G7 (NEW-148) — retention stale push-subscriptions.
rutcampustrack.push.cleanup:
  retention-days: 90
  # Воскресенье 03:00 UTC. @SchedulerLock защищает от параллельных запусков.
  cron: "0 0 3 * * SUN"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # M04 QA6: always — partial degradation видна (DB/Rabbit/Redis/Mongo down).
      # /actuator/health не public, детали утекают только аутентифицированным.
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  info:
    git:
      enabled: true
      mode: full
    build:
      enabled: true
  # M04 QA2 (NEW-58/59) — distributed tracing OTel → Tempo.
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

# M04 QA1: INFO-default для secure-by-default. DEBUG включается через
# application-dev.yml (SPRING_PROFILES_ACTIVE=dev) или env-override.
logging:
  level:
    ru.rutcampustrack: INFO
