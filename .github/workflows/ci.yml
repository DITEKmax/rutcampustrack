          def closed_d002_reconnect_observation(value):
              # Same closed JSON projection as the source-bound SafeReporter; no arbitrary strings.
              try:
                  if len(json.dumps(value, separators=(',', ':'), allow_nan=False).encode()) > 2048:
                      return False
              except (TypeError, ValueError, RecursionError, UnicodeError):
                  return False
              def exact(item, keys):
                  return type(item) is dict and set(item) == set(keys)
              def flags(item, keys):
                  return exact(item, keys) and all(type(item[key]) is bool for key in keys)
              endpoints, epochs = ('refresh', 'current'), ('preOnline', 'postOnline')
              top_flags = ('offlineSeen', 'onlineSeen', 'online', 'observationUnknown')
              if (not exact(value, (*top_flags, 'native', 'pageHttp', 'priorPending', 'refreshHttpStatus'))
                      or any(type(value[key]) is not bool for key in top_flags)
                      or not exact(value['native'], epochs) or not exact(value['pageHttp'], endpoints)
                      or not flags(value['priorPending'], endpoints)):
                  return False
              for epoch in epochs:
                  states = value['native'][epoch]
                  if not exact(states, endpoints):
                      return False
                  for endpoint in endpoints:
                      state = states[endpoint]
                      if (not exact(state, ('phase', 'multiple')) or type(state['phase']) is not str
                              or state['phase'] not in {'NOT_CALLED', 'PENDING', 'FULFILLED', 'REJECTED'}
                              or type(state['multiple']) is not bool):
                          return False
              if any(not flags(value['pageHttp'][endpoint], ('requested', 'responded', 'failed'))
                     for endpoint in endpoints):
                  return False
              status = value['refreshHttpStatus']
              return ((type(status) is str and status in {'UNOBSERVED', 'OTHER'})
                      or (type(status) is int and status in {200, 401, 403, 429, 503}))

          def is_homework_failure(value):
              keys = {'file', 'line', 'project', 'status', 'expectedStatus', 'durationMs', 'errorCount', 'diagnostics', 'errorLocations'}
              for row in value['results']:
                  if type(row) is dict and 'd002ReconnectObservation' in row:
                      if (set(row) != keys | {'d002ReconnectObservation'}
                              or row.get('file') != 'mobile-real-server.spec.ts'
                              or type(row.get('line')) is not int or row['line'] != 3959
                              or row.get('project') != 'chromium' or row.get('expectedStatus') != 'passed'
                              or row.get('status') != 'failed' or type(row.get('errorCount')) is not int
                              or row['errorCount'] <= 0
                              or not closed_d002_reconnect_observation(row['d002ReconnectObservation'])):
                          return False
                      row = {key: row[key] for key in keys}
                  if (type(row) is not dict or set(row) != keys or row['file'] != 'mobile-real-server.spec.ts'
                          or row['project'] != 'chromium' or row['expectedStatus'] != 'passed'
                          or row['status'] not in {'passed', 'failed', 'timedOut', 'skipped', 'interrupted'}
                          or type(row['line']) is not int or not 0 < row['line'] < 1000000
                          or type(row['errorCount']) is not int or not 0 <= row['errorCount'] <= 8
                          or type(row['durationMs']) not in (int, float) or not 0 <= row['durationMs'] <= 1800000
                          or type(row['errorLocations']) is not list or len(row['errorLocations']) > 8
                          or not all(type(f) is dict and set(f) == {'file', 'line'} and type(f['file']) is str and f['file'] in {'mobile-real-server.spec.ts', 'mobile-dataset.ts'} and type(f['line']) is int and 0 < f['line'] < 1000000 for f in row['errorLocations'])
                          or type(row['diagnostics']) is not list or len(row['diagnostics']) > 8
                          or not all(type(d) is dict and set(d) == {'stage', 'cause', 'httpStatus'} and type(d['stage']) is str and re.fullmatch(r'[A-Z_]{1,64}', d['stage']) and type(d['cause']) is str and re.fullmatch(r'[A-Z_]{1,64}', d['cause']) and type(d['httpStatus']) is int and 0 <= d['httpStatus'] <= 599 for d in row['diagnostics'])):
                      return False
              return any(row['status'] == 'failed' and {'stage': 'DATASET_HTTP', 'cause': 'DATASET_HOMEWORK_CREATE_HTTP', 'httpStatus': 503} in row['diagnostics'] for row in value['results'])

          def verify_homework_sources():
              verify_d002_reconnect_sources()
              base = Path('services/academic-service/academic-app/src/main/java/ru/rutcampustrack/academic')
              handler = (base / 'exception/GlobalExceptionHandler.java').read_text()
              client = (base / 'grpc/ScheduleGrpcClient.java').read_text()
              if ('log.warn("schedule-service недоступен: {}", ex.getMessage());' not in handler
                      or any(text not in client for text in ('Нельзя вызвать binding API без подписанного аутентифицированного пользователя', 'Нельзя вызвать binding API без directed Academic service identity', '" в schedule-service: " + error.getStatus()'))):
                  raise ValueError('Homework warning source changed')
              advice = Path('services/schedule-service/schedule-app/src/main/java/ru/rutcampustrack/schedule/grpc/GrpcExceptionAdvice.java').read_text()
              if 'log.error("gRPC internal error", e);' not in advice:
