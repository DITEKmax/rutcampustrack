name: CI

# Temporary owner-authorized pause for codex/web-vue-redesign.
# Restore automatic triggers before merge after explicit owner GO.
# See docs/plans/web-vue-pr3/CI-DEVELOPMENT-POLICY.md.
on:
  workflow_dispatch:
    inputs:
      omit_academic:
        description: 'Explicitly omit Academic tests and dependent operator CLI acceptance'
        required: false
        type: boolean
        default: false

jobs:
  java-unit-test:
    name: Java unit — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            path: ':services:api-gateway'
          - name: auth-service
            path: ':services:auth-service:auth-app'
          - name: academic-service
            path: ':services:academic-service:academic-app'
          - name: schedule-service
            path: ':services:schedule-service:schedule-app'
          - name: attendance-service
            path: ':services:attendance-service:attendance-app'
          - name: notification-service
            path: ':services:notification-service:notification-app'
          - name: mobile-bff
            path: ':services:mobile-bff:mobile-bff-app'
        exclude: ${{ fromJSON(inputs.omit_academic && '[{"service":{"name":"academic-service","path":":services:academic-service:academic-app"}}]' || '[]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # M08 Группа 1 (P2-8/1) — только unit (*Test), БЕЗ *IT.
      # Быстрая jobs, блокирующая PR при базовых регрессиях.
      - name: Warm Gradle wrapper
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then
              exit 0
            fi
            echo "Gradle wrapper download failed, retrying in $((attempt * 10))s ($attempt/3)"
            sleep $((attempt * 10))
          done
          ./gradlew --version --no-daemon

      - name: Verify the admitted reason wire mapping rejects one valid counterexample
        if: matrix.service.name == 'attendance-service'
        timeout-minutes: 8
        env:
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash scripts/local-release/reason-enum.sh
      - name: Upload the closed reason wire mapping sensitivity proof
        if: always() && matrix.service.name == 'attendance-service'
        uses: actions/upload-artifact@v4
        with:
          name: reason-enum-regression-safe-${{ github.run_attempt }}
          path: build/ci-test-outcomes/attendance-service/reason-enum-regression-safe.json
          if-no-files-found: error
          retention-days: 7

      - name: Unit tests ${{ matrix.service.name }}
        id: java-tests
        if: ${{ !cancelled() }}
        run: |
          git -c core.fileMode=false diff --exit-code -- services proto event-schemas
          ./gradlew ${{ matrix.service.path }}:test --no-daemon ${{ matrix.service.name == 'schedule-service' && '--no-build-cache' || '' }}

      # Raw JUnit XML/HTML can contain credentials in failure messages and captured output.
      # Publish source-linked identities and outcomes through the existing safe collector.
      - name: Collect safe unit outcomes
        if: always()
        env:
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RCT_CI_EVENT_NAME: ${{ github.event_name }}
          RCT_CI_RUN_ID: ${{ github.run_id }}
          RCT_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          RCT_CI_JOB_ID: ${{ github.job }}
          RCT_CI_TEST_OUTCOME: ${{ steps.java-tests.outcome }}
        run: python3 scripts/collect-ci-test-outcomes.py --service '${{ matrix.service.name }}' --task test

      - name: Upload safe unit outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-unit-outcomes-${{ matrix.service.name }}-${{ github.run_attempt }}
          path: build/ci-test-outcomes/${{ matrix.service.name }}/test/safe-outcomes.json
          if-no-files-found: error
          retention-days: 7

  java-integration-test:
    name: Java IT — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    # Integration tests независимы от unit job'ов (separate pipelines,
    # fail-fast на уровне jobs). Параллельный запуск ускоряет wall-time.
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            path: ':services:api-gateway'
          - name: auth-service
            path: ':services:auth-service:auth-app'
          - name: academic-service
            path: ':services:academic-service:academic-app'
          - name: schedule-service
            path: ':services:schedule-service:schedule-app'
          - name: attendance-service
            path: ':services:attendance-service:attendance-app'
          - name: notification-service
            path: ':services:notification-service:notification-app'
          - name: mobile-bff
            path: ':services:mobile-bff:mobile-bff-app'
        exclude: ${{ fromJSON(inputs.omit_academic && '[{"service":{"name":"academic-service","path":":services:academic-service:academic-app"}}]' || '[]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # M08 Группа 1 (P2-8/1) — только *IT (Spring context + Testcontainers).
      # Gradle filter в root build.gradle.kts.
      - name: Warm Gradle wrapper
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then
              exit 0
            fi
            echo "Gradle wrapper download failed, retrying in $((attempt * 10))s ($attempt/3)"
            sleep $((attempt * 10))
          done
          ./gradlew --version --no-daemon

      - name: Setup Python for Academic credential bridge
        if: matrix.service.name == 'academic-service'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            services/notification-bot/requirements.txt
            services/notification-bot/requirements-test.txt

      - name: Install isolated Academic credential bridge dependencies
        if: matrix.service.name == 'academic-service'
        run: |
          python -m venv "$RUNNER_TEMP/np01-python"
          "$RUNNER_TEMP/np01-python/bin/python" -m pip install -r services/notification-bot/requirements.txt -r services/notification-bot/requirements-test.txt
          echo "NP01_PYTHON_EXECUTABLE=$RUNNER_TEMP/np01-python/bin/python" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"

      - name: Verify one-off replacement regression rejects the previous implementation
        if: matrix.service.name == 'schedule-service'
        timeout-minutes: 8
        env:
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash scripts/local-release/oneoff.sh
      - name: Upload safe one-off regression proof
        if: always() && matrix.service.name == 'schedule-service'
        uses: actions/upload-artifact@v4
        with:
          name: oneoff-regression-safe-${{ github.run_attempt }}
          path: build/ci-test-outcomes/schedule-service/oneoff-regression-safe.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify changed data regressions reject their counterexamples
        if: matrix.service.name == 'schedule-service' || matrix.service.name == 'attendance-service' || matrix.service.name == 'academic-service' || matrix.service.name == 'notification-service' || matrix.service.name == 'auth-service'
        timeout-minutes: 8
        env:
          RCT_CI_SERVICE: ${{ matrix.service.name }}
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash scripts/local-release/changed-domain.sh
      - name: Upload safe changed-domain regression proof
        if: always() && (matrix.service.name == 'schedule-service' || matrix.service.name == 'attendance-service' || matrix.service.name == 'academic-service' || matrix.service.name == 'notification-service' || matrix.service.name == 'auth-service')
        uses: actions/upload-artifact@v4
        with:
          name: changed-domain-regression-safe-${{ matrix.service.name }}-${{ github.run_attempt }}
          path: build/ci-test-outcomes/${{ matrix.service.name }}/changed-domain-regression-safe.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify persisted attendance enum HTTP refusal rejects the previous reader
        if: matrix.service.name == 'attendance-service'
        timeout-minutes: 8
        env:
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash scripts/local-release/stored-status.sh
      - name: Upload safe persisted attendance enum regression proof
        if: always() && matrix.service.name == 'attendance-service'
        uses: actions/upload-artifact@v4
        with:
          name: attendance-enum-regression-safe-${{ github.run_attempt }}
          path: build/ci-test-outcomes/attendance-service/attendance-enum-regression-safe.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify cache commit regression against exact old semantics and restored source
        if: ${{ !cancelled() && matrix.service.name == 'academic-service' }}
        timeout-minutes: 15
        run: |
          bash scripts/local-release/cache-commit.sh
      - name: Upload safe cache commit regression proof
        if: always() && matrix.service.name == 'academic-service'
        uses: actions/upload-artifact@v4
        with:
          name: cache-commit-safe-${{ github.run_attempt }}
          path: build/ci-test-outcomes/academic-service/cache-commit-safe.json
          if-no-files-found: error
          retention-days: 7

      - name: Integration tests ${{ matrix.service.name }}
        id: java-tests
        if: ${{ !cancelled() }}
        # Auth failed before tests while resolving compileProtoPath dependencies.
        # Refresh resolution metadata for this lane; keep the same task and gates.
        run: |
          git -c core.fileMode=false diff --exit-code -- services proto event-schemas
          ./gradlew ${{ matrix.service.path }}:integrationTest --no-daemon ${{ matrix.service.name == 'auth-service' && '--refresh-dependencies' || '' }} ${{ matrix.service.name == 'schedule-service' && '--no-build-cache' || '' }}

      # Keep failure diagnosis in the safe outcome artifact; never upload raw XML/HTML.
      - name: Collect safe integration outcomes
        if: always()
        env:
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RCT_CI_EVENT_NAME: ${{ github.event_name }}
          RCT_CI_RUN_ID: ${{ github.run_id }}
          RCT_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          RCT_CI_JOB_ID: ${{ github.job }}
          RCT_CI_TEST_OUTCOME: ${{ steps.java-tests.outcome }}
        run: |
          python3 scripts/collect-ci-test-outcomes.py --service '${{ matrix.service.name }}' --task integrationTest --verify-ordinary-integration

      - name: Upload safe integration outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-integration-outcomes-${{ matrix.service.name }}-${{ github.run_attempt }}
          path: build/ci-test-outcomes/${{ matrix.service.name }}/integrationTest/safe-outcomes.json
          if-no-files-found: error
          retention-days: 7

      - name: Generate the official Academic OpenAPI candidate after an exact snapshot drift
        id: academic-openapi-candidate
        if: ${{ !cancelled() && matrix.service.name == 'academic-service' && steps.java-tests.outcome == 'failure' }}
        timeout-minutes: 8
        env:
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          umask 077
          python3 - <<'PY_ACADEMIC_OPENAPI'
          import hashlib, json, os, pathlib, re, shutil, subprocess
          import xml.etree.ElementTree as ET

          def decode(raw):
              def pairs(items):
                  value = {}
                  for key, item in items:
                      assert key not in value
                      value[key] = item
                  return value
              return json.loads(raw, object_pairs_hook=pairs,
                                parse_constant=lambda _: (_ for _ in ()).throw(ValueError('Nonfinite JSON')))

          package = 'ru.rutcampustrack.academic.integration.OpenApiSnapshotIT'
          method = 'apiDocsMatchesSnapshot'
          app = pathlib.Path('services/academic-service/academic-app')
          test_source = app / 'src/test/java/ru/rutcampustrack/academic/integration/OpenApiSnapshotIT.java'
          test_sha = '3d862567c6fb0b44e5bc0003515070e56ac7fa77a2654a13c5f9f81cf71c99bc'
          source = test_source.read_bytes()
          assert hashlib.sha256(source).hexdigest() == test_sha
          assert source == subprocess.check_output(['git', 'show', 'HEAD:' + test_source.as_posix()])
          lines = source.decode().splitlines()
          target = '                .isEqualTo(mapper.readTree(expected));'
          assert lines.count(target) == 1
          expected_line = lines.index(target) + 1
          report = pathlib.Path('build/ci-test-outcomes/academic-service/integrationTest/safe-outcomes.json')
          if not report.is_file() or not 0 < report.stat().st_size <= 33554432:
              raise SystemExit(0)
          value = decode(report.read_bytes())
          if value.get('collection') != 'RESULTS':
              raise SystemExit(0)
          meta = value['metadata']
          checkout = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert (meta['checkoutSha'] == checkout
                  and meta['prHeadSha'] == os.environ['RCT_CI_PR_HEAD_SHA']
                  and meta['service'] == 'academic-service' and meta['task'] == 'integrationTest'
                  and meta['job'] == 'java-integration-test' and meta['testStepOutcome'] == 'failure'
                  and meta['runId'] == os.environ['GITHUB_RUN_ID']
                  and meta['runAttempt'] == os.environ['GITHUB_RUN_ATTEMPT'])
          selected = [case for case in value['cases']
                      if case.get('classname') == package and case.get('method') == method]
          if not selected:
              raise SystemExit(0)
          assert len(selected) == 1
          case = selected[0]
          assert (case['identity'] == 'SOURCE_METHOD' and case['source'] == test_source.as_posix()
                  and case['sourceSha256'] == test_sha)
          if case['status'] != 'FAILED':
              raise SystemExit(0)
          result = app / ('build/test-results/integrationTest/TEST-' + package + '.xml')
          assert result.is_file() and not result.is_symlink() and 0 < result.stat().st_size <= 33554432
          raw = result.read_bytes()
          assert b'<!DOCTYPE' not in raw.upper() and b'<!ENTITY' not in raw.upper()
          suite = ET.fromstring(raw)
          cases = suite.findall('testcase')
          if (suite.tag != 'testsuite' or suite.get('name') != package or len(cases) != 1
                  or cases[0].get('classname') != package or cases[0].get('name') != method + '()'
                  or {key: suite.get(key) for key in ('tests', 'failures', 'errors', 'skipped')}
                  != {'tests': '1', 'failures': '1', 'errors': '0', 'skipped': '0'}):
              raise SystemExit(0)
          native_case = cases[0]
          if native_case.findall('error') or native_case.findall('skipped') or len(native_case.findall('failure')) != 1:
              raise SystemExit(0)
          failure = native_case.find('failure')
          if failure.get('type') not in {'org.opentest4j.AssertionFailedError', 'java.lang.AssertionError'}:
              raise SystemExit(0)
          named_lines = re.findall(
              r'(?m)^[ \t]*at[ \t]+(?:[^ \t\r\n()]{1,256}/)?'
              + re.escape(package + '.' + method)
              + r'\(OpenApiSnapshotIT\.java:([1-9][0-9]{0,5})\)[ \t]*$', failure.text or '')
          if named_lines != [str(expected_line)]:
              raise SystemExit(0)
          wrapper = pathlib.Path('gradlew')
          assert subprocess.check_output(['git', 'ls-tree', '--format=%(objectmode)', 'HEAD', '--', 'gradlew']) == b'100644\n'
          wrapper_head = subprocess.check_output(['git', 'show', 'HEAD:gradlew'])
          wrapper_sha = hashlib.sha256(wrapper_head).hexdigest()
          assert wrapper_sha == 'c07475b363508dbe7cf7d1ded1b31f6d44bb97d98d069a455ab862b1fb9b25f0'
          wrapper_mode = wrapper.stat().st_mode & 0o7777
          assert wrapper_mode in {0o644, 0o755}

          def verify_wrapper():
              assert wrapper.is_file() and not wrapper.is_symlink()
              assert wrapper.stat().st_mode & 0o7777 == wrapper_mode
              assert 0 < wrapper.stat().st_size <= 1048576
              assert hashlib.sha256(wrapper.read_bytes()).hexdigest() == wrapper_sha

          verify_wrapper()
          assert subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']) == b''
          baseline = {path for path in subprocess.check_output(
              ['git', 'diff', 'HEAD', '--name-only', '-z']).split(b'\0') if path}
          assert baseline in (set(), {b'gradlew'})
          if baseline:
              assert wrapper_mode == 0o755
          subprocess.run(
              ['./gradlew', ':services:academic-service:academic-app:integrationTest', '--no-daemon',
               '--tests', package + '.' + method, '-Popenapi.snapshot.update=true'],
              stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT, timeout=360, check=True)
          snapshot = pathlib.Path('docs/openapi/academic.json')
          assert not snapshot.is_symlink() and snapshot.is_file() and 0 < snapshot.stat().st_size <= 2097152
          payload = snapshot.read_bytes()
          generated = decode(payload)
          assert (type(generated) is dict and set(generated) == {'openapi', 'info', 'tags', 'paths', 'components'}
                  and generated['openapi'] == '3.1.0' and type(generated['info']) is dict
                  and all(type(generated['info'].get(key)) is str for key in ('title', 'version'))
                  and type(generated['tags']) is list and all(type(tag) is dict for tag in generated['tags'])
                  and type(generated['paths']) is dict and generated['paths']
                  and all(path.startswith('/') and type(item) is dict for path, item in generated['paths'].items())
                  and type(generated['components']) is dict and type(generated['components'].get('schemas')) is dict)
          changed = subprocess.check_output(['git', 'diff', 'HEAD', '--name-only', '-z']).split(b'\0')
          assert {path for path in changed if path} == baseline | {b'docs/openapi/academic.json'}
          assert subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']) == b''
          verify_wrapper()
          assert subprocess.check_output(['git', 'ls-tree', '--format=%(objectmode)', 'HEAD', '--', snapshot.as_posix()]) == b'100644\n'
          assert snapshot.stat().st_mode & 0o7777 == 0o644
          assert payload != subprocess.check_output(['git', 'show', 'HEAD:' + snapshot.as_posix()])
          output = pathlib.Path('build/ci-test-outcomes/academic-service/openapi-generated')
          output.mkdir(mode=0o700, parents=True, exist_ok=False)
          shutil.copyfile(snapshot, output / 'academic.json')
          proof = {'schemaVersion': 1, 'state': 'OFFICIAL_ACADEMIC_OPENAPI_GENERATED',
                   'producerHeadSha': os.environ['RCT_CI_PR_HEAD_SHA'], 'checkoutSha': checkout,
                   'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                   'testMethod': package + '.' + method, 'testSourceSha256': test_sha,
                   'originalDriftFrameLine': expected_line, 'originalIntegrationOutcome': 'failure',
                   'generatedSnapshotSha256': hashlib.sha256(payload).hexdigest(), 'generatedSnapshotBytes': len(payload),
                   'trackedChanges': sorted(path.decode('ascii') for path in changed if path),
                   'preexistingWrapperModeChange': baseline == {b'gradlew'}, 'wrapperSourceSha256': wrapper_sha,
                   'ordinaryFailurePreserved': True}
          (output / 'generation.safe.json').write_text(json.dumps(proof, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as target_output:
              target_output.write('generated=true\n')
          PY_ACADEMIC_OPENAPI

      - name: Upload the official Academic OpenAPI candidate
        if: ${{ !cancelled() && steps.academic-openapi-candidate.outputs.generated == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: academic-openapi-generated-${{ github.run_attempt }}
          path: |
            build/ci-test-outcomes/academic-service/openapi-generated/academic.json
            build/ci-test-outcomes/academic-service/openapi-generated/generation.safe.json
          if-no-files-found: error
          retention-days: 7

      - name: Generate the official mobile BFF OpenAPI candidate after an exact snapshot drift
        id: mobile-bff-openapi-candidate
        if: ${{ !cancelled() && matrix.service.name == 'mobile-bff' && steps.java-tests.outcome == 'failure' }}
        timeout-minutes: 8
        env:
          RCT_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          umask 077
          python3 - <<'PY_MOBILE_BFF_OPENAPI'
          import hashlib, json, os, pathlib, re, shutil, subprocess
          import xml.etree.ElementTree as ET

          def decode(raw):
              def pairs(items):
                  value = {}
                  for key, item in items:
                      assert key not in value
                      value[key] = item
                  return value
              return json.loads(raw, object_pairs_hook=pairs,
                                parse_constant=lambda _: (_ for _ in ()).throw(ValueError('Nonfinite JSON')))

          package = 'ru.rutcampustrack.mobilebff.contractexport.OpenApiSnapshotIT'
          method = 'apiDocsMatchCanonicalSnapshot'
          app = pathlib.Path('services/mobile-bff/mobile-bff-app')
          test_source = app / 'src/test/java/ru/rutcampustrack/mobilebff/contractexport/OpenApiSnapshotIT.java'
          test_sha = '70887932a75569486459de8017d553de18da5339d2c632247a7e4aefdb80a963'
          source = test_source.read_bytes()
          assert hashlib.sha256(source).hexdigest() == test_sha
          assert source == subprocess.check_output(['git', 'show', 'HEAD:' + test_source.as_posix()])
          lines = source.decode().splitlines()
          target = '                .isEqualTo('
          assert lines.count(target) == 1
          expected_line = lines.index(target) + 1
          report = pathlib.Path('build/ci-test-outcomes/mobile-bff/integrationTest/safe-outcomes.json')
          if not report.is_file() or not 0 < report.stat().st_size <= 33554432:
              raise SystemExit(0)
          value = decode(report.read_bytes())
          if value.get('collection') != 'RESULTS':
              raise SystemExit(0)
          meta = value['metadata']
          checkout = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert (meta['checkoutSha'] == checkout
                  and meta['prHeadSha'] == os.environ['RCT_CI_PR_HEAD_SHA']
                  and meta['service'] == 'mobile-bff' and meta['task'] == 'integrationTest'
                  and meta['job'] == 'java-integration-test' and meta['testStepOutcome'] == 'failure'
                  and meta['runId'] == os.environ['GITHUB_RUN_ID']
                  and meta['runAttempt'] == os.environ['GITHUB_RUN_ATTEMPT'])
          selected = [case for case in value['cases']
                      if case.get('classname') == package and case.get('method') == method]
          if not selected:
              raise SystemExit(0)
          assert len(selected) == 1
          case = selected[0]
          assert (case['identity'] == 'SOURCE_METHOD' and case['source'] == test_source.as_posix()
                  and case['sourceSha256'] == test_sha)
          if case['status'] != 'FAILED':
              raise SystemExit(0)
          result = app / ('build/test-results/integrationTest/TEST-' + package + '.xml')
          assert result.is_file() and not result.is_symlink() and 0 < result.stat().st_size <= 33554432
          raw = result.read_bytes()
          assert b'<!DOCTYPE' not in raw.upper() and b'<!ENTITY' not in raw.upper()
          suite = ET.fromstring(raw)
          cases = suite.findall('testcase')
          expected_names = {name + '()' for name in (
              method, 'bothValidGeoKindsReachTheContractSeam',
              'missingOrNullCoordinateIsRejectedBeforeTheSeam', 'clientInputFailuresUseTypedProblemDetails')}
          if (suite.tag != 'testsuite' or suite.get('name') != package or len(cases) != 4
                  or any(case.get('classname') != package for case in cases)
                  or {case.get('name') for case in cases} != expected_names
                  or {key: suite.get(key) for key in ('tests', 'failures', 'errors', 'skipped')}
                  != {'tests': '4', 'failures': '1', 'errors': '0', 'skipped': '0'}):
              raise SystemExit(0)
          native_case = next(case for case in cases if case.get('name') == method + '()')
          if (native_case.findall('error') or native_case.findall('skipped')
                  or len(native_case.findall('failure')) != 1
