apiVersion: 1
datasources:
- name: Tempo
  type: tempo
  uid: tempo
  access: proxy
  url: http://tempo:3200
  isDefault: false
  version: 1
  editable: false
  jsonData:
    tracesToLogsV2:
      datasourceUid: loki
      spanStartTimeShift: -1m
      spanEndTimeShift: 1m
      filterByTraceID: false
      tags:
      - key: service.name
        value: service
      customQuery: true
      query: '{service="$${__span.tags["service.name"]}"} | json | traceId="$${__trace.traceId}"'
    nodeGraph:
      enabled: true
