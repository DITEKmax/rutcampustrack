# M13 G20 — SSL certificate expiry alerts (от blackbox-exporter probe).
#
# Источник: blackbox-https scrape job в prometheus.yml. Метрика
# probe_ssl_earliest_cert_expiry — Unix timestamp expiration (секунды).
# `time()` Prometheus function — current timestamp. Разница в секундах,
# делим на 86400 в alert description'ах для UX.

groups:
  - name: ssl-expiry
    rules:
      # WARNING — cert истекает через < 30 дней. Дает достаточно времени
      # отреагировать (Let's Encrypt renewal runs каждые 12h, должно
      # автоматически restart'ить, но если что-то сломалось — 30d
      # окно для manual renew).
      - alert: SslCertExpiresSoon
        expr: |
          (probe_ssl_earliest_cert_expiry - time()) / 86400 < 30
          and probe_success{job="blackbox-https"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'TLS-сертификат {{ $labels.instance }} истекает через {{ $value | printf "%.1f" }} дн.'
          description: 'Сертификат для {{ $labels.instance }} истекает через {{ $value | printf "%.1f" }} дн. Certbot проверяет обновление Let''s Encrypt каждые 12 ч, nginx автоматически подхватывает новый сертификат при перезагрузке конфигурации каждые 5 мин. Если сертификат не обновляется, см. docs/operations/runbooks/cert-renewal.md.'

      # CRITICAL — < 7 дней. Если auto-renew всё ещё не сработал, надо
      # руками разбираться. ACME challenge может быть сломан (DNS,
      # firewall на :80), rate-limit Let's Encrypt (5/week per domain).
      - alert: SslCertExpiresUrgently
        expr: |
          (probe_ssl_earliest_cert_expiry - time()) / 86400 < 7
          and probe_success{job="blackbox-https"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Срочно — TLS-сертификат {{ $labels.instance }} истекает через {{ $value | printf "%.1f" }} дн.'
          description: 'Автоматическое обновление не сработало за 23 дня или дольше. Срочно обновите сертификат вручную командой `docker exec rct-certbot certbot renew --force-renewal`. Если проверка ACME не проходит, проверьте путь nginx /.well-known/acme-challenge/ и правила файрвола для порта :80.'

      # Probe failure — не можем dotter cert info вообще. Cert может быть
      # уже expired либо HTTPS endpoint down.
      - alert: SslProbeFailed
        expr: probe_success{job="blackbox-https"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Blackbox Exporter не может проверить HTTPS на {{ $labels.instance }}"
          description: "Проверка HTTPS для {{ $labels.instance }} завершается ошибкой 10 мин. Возможные причины — nginx недоступен (см. ServiceDown), ошибка согласования TLS (сертификат истёк или отозван) или сбой DNS."
