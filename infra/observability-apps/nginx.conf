user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
    limit_req_zone $binary_remote_addr zone=rct_browser_errors:1m rate=2r/s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 5s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    resolver 127.0.0.11 valid=10s;
    server {
        listen 8080;
        server_name _;
        auth_basic "RutTrack operator";
        auth_basic_user_file /tmp/observer.htpasswd;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        # The operator's password must never reach any application.
        proxy_set_header Authorization "";
    # RCT_BROWSER_ERROR_INGEST_BEGIN
    # Project 1 is the dedicated Vue project in this new, isolated GlitchTip database.
    # DSN: https://<public-key>@<business-origin>/telemetry/errors/1
    location = /telemetry/errors/api/1/envelope/ {
        auth_basic off;
        if ($request_method != POST) { return 405; }
        if ($arg_sentry_key !~ "^[a-f0-9]{32}$") { return 400; }
        client_max_body_size 64k;
        client_body_timeout 3s;
        limit_req zone=rct_browser_errors burst=4 nodelay;
        limit_req_status 429;
        access_log off;
        # Do not log a malicious caller's raw query on reject/outage either.
        error_log /dev/null crit;
        proxy_connect_timeout 1s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
        proxy_set_header Host glitchtip;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_set_header Origin "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Sentry-Auth "";
        set $rct_error_backend glitchtip:8000;
        # Reconstruct the query from the public key only; no arbitrary caller args.
        proxy_pass http://$rct_error_backend/api/1/envelope/?sentry_key=$arg_sentry_key&sentry_version=7&sentry_client=rct-vue;
    }
    location ^~ /telemetry/errors/ { return 404; }
    # RCT_BROWSER_ERROR_INGEST_END
        location = /glitchtip { return 302 /glitchtip/; }
        location /glitchtip/ {
            set $glitchtip glitchtip:8000;
            rewrite ^/glitchtip/(.*)$ /$1 break;
            proxy_pass http://$glitchtip;
        }
        # Human query endpoints only. Ingestion stays on the private network.
        location ~ ^/pyroscope/(ingest|push\.|api/v1/push|v1development|metrics|debug|admin) { return 404; }
        location = /pyroscope { return 302 /pyroscope/; }
        location ~ ^/pyroscope/querier\.v1\.QuerierService/(LabelNames|LabelValues|ProfileTypes|Series|SelectSeries|SelectMergeStacktraces|SelectMergeProfile|Diff|SelectHeatmap)$ {
            limit_except POST { deny all; }
            rewrite ^/pyroscope/(.*)$ /$1 break;
            set $pyroscope pyroscope:4040;
            proxy_pass http://$pyroscope;
        }
        location /pyroscope/ {
            limit_except GET HEAD { deny all; }
            set $pyroscope pyroscope:4040;
            rewrite ^/pyroscope/(.*)$ /$1 break;
            proxy_pass http://$pyroscope;
        }
        location / {
            set $homepage homepage:3000;
            proxy_pass http://$homepage;
        }
    }
}
