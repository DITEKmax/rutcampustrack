groups:
- name: resource-limits
  rules:
  - alert: ContainerMemoryHigh
    expr: (container_memory_working_set_bytes{name=~"rct-.*"} / container_spec_memory_limit_bytes{name=~"rct-.*"} > 0.9) and
      container_spec_memory_limit_bytes{name=~"rct-.*"} > 0
    for: 5m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: "Контейнер {{ $labels.name }} использует больше 90% лимита памяти"
      description: "{{ $labels.name }} использует больше 90% лимита памяти (mem_limit) уже 5 минут.\n\
        Возможны утечка памяти, рост кэша или слишком низкий лимит.\n\
        См. docs/operations/deploy/resource-limits.md.\n\
        Текущее использование — {{ $value | humanizePercentage }}.\n"
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/deploy/resource-limits.md
  - alert: ContainerWithoutMemoryLimit
    expr: 'container_spec_memory_limit_bytes{name=~"rct-.*"} == 0

      '
    for: 10m
    labels:
      severity: warning
      owner: platform
    annotations:
      summary: "Контейнер {{ $labels.name }} запущен без лимита памяти"
      description: "{{ $labels.name }} запущен без лимита памяти (mem_limit) и при утечке может занять всю
        оперативную память VPS.\n\
        Добавьте лимит в docker-compose.prod.yml (см. docs/operations/deploy/resource-limits.md).\n"
      runbook_url: https://github.com/DITEKmax/rutcampustrack/blob/main/docs/operations/deploy/resource-limits.md
