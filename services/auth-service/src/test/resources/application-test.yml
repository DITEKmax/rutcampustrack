spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  key-dir: ${java.io.tmpdir}/rct-test-keys
  access-token-expiration: 900
  refresh-token-expiration: 604800

otp:
  code-length: 6
  ttl-seconds: 120
  max-attempts: 3
  attempts-window-seconds: 300
  resend-cooldown-seconds: 60

logging:
  level:
    ru.rutcampustrack: DEBUG
    org.testcontainers: INFO
